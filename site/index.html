// ---------- TAB: EPA / EFFICIENCY ----------
// Powered by data/nfl_2026_team_epa.csv, generated by 09_epa_efficiency.py
// from nflverse's real play-by-play data. EPA (Expected Points Added per
// play) and success rate are much better indicators of true team quality
// than raw yards/points, since they account for down/distance/field
// position on every play instead of just game totals.
function renderEpa(){
  return `
  <div class="panel">
    <div class="panel-title">EPA / Efficiency</div>
    <div class="panel-note">
      Expected Points Added per play and success rate, from real play-by-play data --
      not a formula to add together and predict a score, just a read on how efficient
      each side has actually been. <b>Early-season numbers are noisy</b> -- treat anything
      under ~4 games played with real caution. Click a team to see pass/rush splits and
      recent (last 3 games) form. Mint = strong, coral = weak.
      ${!DATA.epa || !DATA.epa.length ? '<br><br><b>No EPA data yet</b> -- run the pipeline (09_epa_efficiency.py) to populate this.' : ''}
    </div>
    <div class="controls">
      <input type="text" id="epa-search" placeholder="Search team...">
    </div>
    <div id="epa-table"></div>
  </div>`;
}

function mountEpa(){
  const container = $('#epa-table');
  const raw = DATA.epa || [];
  if(!raw.length){
    container.innerHTML = '<div class="empty">No EPA data yet. Run 09_epa_efficiency.py.</div>';
    return;
  }

  // Combine the Offense and Defense rows nflverse-side produces per team
  // into one row per team, offense and defense side by side.
  const byTeam = {};
  raw.forEach(r=>{
    if(!byTeam[r.Team]) byTeam[r.Team] = {Team: r.Team};
    const side = r.Side === 'Offense' ? 'off' : 'def';
    byTeam[r.Team][`${side}EpaPlay`] = num(r['EPA/Play']);
    byTeam[r.Team][`${side}Success`] = num(r['Success Rate']);
    byTeam[r.Team][`${side}PassEpa`] = num(r['Pass EPA/Play']);
    byTeam[r.Team][`${side}RushEpa`] = num(r['Rush EPA/Play']);
    byTeam[r.Team][`${side}Last3Epa`] = num(r['Last3 EPA/Play']);
    byTeam[r.Team][`${side}Last3Success`] = num(r['Last3 Success Rate']);
    byTeam[r.Team].gamesPlayed = num(r['Games Played']);
  });
  const teams = Object.values(byTeam);

  const maxOffEpa = Math.max(...teams.map(t=>Math.abs(t.offEpaPlay || 0)), 0.01);
  const maxDefEpa = Math.max(...teams.map(t=>Math.abs(t.defEpaPlay || 0)), 0.01);

  function epaColor(val, maxAbs, higherIsBetter){
    const pct = Math.max(-1, Math.min(1, val / maxAbs));
    const scaled = higherIsBetter ? (pct + 1) / 2 : (1 - pct) / 2;
    return meterColorGlobal(scaled);
  }
  // Shared mint-to-coral scale, matching the rest of the app.
  function meterColorGlobal(pct){
    const good = [51,214,166], bad = [255,92,108];
    const r = Math.round(bad[0] + (good[0]-bad[0])*pct);
    const g = Math.round(bad[1] + (good[1]-bad[1])*pct);
    const b = Math.round(bad[2] + (good[2]-bad[2])*pct);
    return `rgb(${r},${g},${b})`;
  }

  const expanded = new Set();

  function apply(){
    const q = $('#epa-search').value.trim().toLowerCase();
    const filtered = teams
      .filter(t=> !q || t.Team.toLowerCase().includes(q) || teamName(t.Team).toLowerCase().includes(q))
      .sort((a,b)=> (b.offEpaPlay||0) - (a.offEpaPlay||0));

    const headHtml = `<tr>
      <th></th><th>Team</th><th>GP</th>
      <th>Off EPA/Play</th><th>Off Success%</th>
      <th>Def EPA/Play Allowed</th><th>Def Success% Allowed</th>
    </tr>`;

    const bodyHtml = filtered.map(t=>{
      const isOpen = expanded.has(t.Team);
      const smallSample = t.gamesPlayed < 4;
      const rowHtml = `
        <tr class="epa-row" data-team="${t.Team}" style="cursor:pointer;">
          <td class="num" style="color:var(--chalk-dim);">${isOpen ? '&#9662;' : '&#9656;'}</td>
          <td>${teamChip(t.Team)}${smallSample ? '<span class="context-chip" style="margin-left:6px;">small sample</span>' : ''}</td>
          <td class="num">${t.gamesPlayed}</td>
          <td class="num"><span class="heat" style="background:${epaColor(t.offEpaPlay,maxOffEpa,true)}30;border:1px solid ${epaColor(t.offEpaPlay,maxOffEpa,true)};">${fmt(t.offEpaPlay,3)}</span></td>
          <td class="num">${fmt((t.offSuccess||0)*100,1)}%</td>
          <td class="num"><span class="heat" style="background:${epaColor(t.defEpaPlay,maxDefEpa,false)}30;border:1px solid ${epaColor(t.defEpaPlay,maxDefEpa,false)};">${fmt(t.defEpaPlay,3)}</span></td>
          <td class="num">${fmt((t.defSuccess||0)*100,1)}%</td>
        </tr>`;

      const detailHtml = isOpen ? `
        <tr class="def-detail-row">
          <td colspan="7" style="background:var(--field-deep);padding:10px 16px;">
            <div style="display:flex;gap:24px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;">
              <div>
                <div style="color:var(--chalk-dim);margin-bottom:4px;">OFFENSE SPLITS</div>
                <div>Pass EPA/play: <b style="color:var(--chalk);">${fmt(t.offPassEpa,3)}</b></div>
                <div>Rush EPA/play: <b style="color:var(--chalk);">${fmt(t.offRushEpa,3)}</b></div>
                <div>Last 3 games EPA/play: <b style="color:var(--chalk);">${fmt(t.offLast3Epa,3)}</b> (${fmt((t.offLast3Success||0)*100,1)}% success)</div>
              </div>
              <div>
                <div style="color:var(--chalk-dim);margin-bottom:4px;">DEFENSE SPLITS (allowed)</div>
                <div>Pass EPA/play: <b style="color:var(--chalk);">${fmt(t.defPassEpa,3)}</b></div>
                <div>Rush EPA/play: <b style="color:var(--chalk);">${fmt(t.defRushEpa,3)}</b></div>
                <div>Last 3 games EPA/play: <b style="color:var(--chalk);">${fmt(t.defLast3Epa,3)}</b> (${fmt((t.defLast3Success||0)*100,1)}% success)</div>
              </div>
            </div>
          </td>
        </tr>` : '';

      return rowHtml + detailHtml;
    }).join('');

    container.innerHTML = `<div class="table-scroll"><table><thead>${headHtml}</thead><tbody>${bodyHtml}</tbody></table></div>`;

    $$('.epa-row', container).forEach(tr=>{
      tr.addEventListener('click', ()=>{
        const team = tr.dataset.team;
        if(expanded.has(team)) expanded.delete(team);
        else expanded.add(team);
        apply();
      });
    });
  }

  $('#epa-search').addEventListener('input', apply);
  apply();
}

// ---------- TAB: BEST PICKS ----------
// Ranked matchup edges for this week's games. Combines: how a player's own
// season production compares to what the opposing defense allows at their
// position (the core signal), whether both are trending the right way over
// the last 3 games (a modest boost, not a separate score), and any
// milestone they're closing in on (called out, also a small boost so it
// helps break ties toward more newsworthy picks). Out/Doubtful players are
// excluded entirely -- a great matchup on paper means nothing if they
// don't play.
// Each position can be evaluated on more than one stat -- a pick isn't
// forced into one fixed category (RB always "Rush Yards", etc.). Every
// applicable stat for a player is scored, and whichever gives the
// strongest combined signal (their own quality x this defense's weakness
// at that specific stat) becomes their pick, shown with which stat it was.
const PICKS_STAT_OPTIONS = {
  QB: [
    {key:'Pass Yards', label:'Pass Yards', defenseKey:'Pass Yards Allowed Per Game'},
    {key:'Pass TD', label:'Pass TD', defenseKey:'Pass TD Allowed Per Game'},
  ],
  RB: [
    {key:'Rush Yards', label:'Rush Yards', defenseKey:'Rush Yards Allowed Per Game'},
    {key:'Receiving Yards', label:'Receiving Yards', defenseKey:'Receiving Yards Allowed Per Game'},
    {key:'Receptions', label:'Receptions', defenseKey:'Receptions Allowed Per Game'},
  ],
  WR: [
    {key:'Receiving Yards', label:'Receiving Yards', defenseKey:'Receiving Yards Allowed Per Game'},
    {key:'Receptions', label:'Receptions', defenseKey:'Receptions Allowed Per Game'},
    {key:'Receiving TD', label:'Receiving TD', defenseKey:'Receiving TD Allowed Per Game'},
  ],
  TE: [
    {key:'Receiving Yards', label:'Receiving Yards', defenseKey:'Receiving Yards Allowed Per Game'},
    {key:'Receptions', label:'Receptions', defenseKey:'Receptions Allowed Per Game'},
  ],
};
const PICKS_POSITIONS = ['QB','RB','WR','TE'];

function getPlayerSeasonAndLast3(playerName, position, statKey){
  const games = (DATA.playerGame || []).filter(r=>r.Player===playerName && r.Position===position)
    .sort((a,b)=>num(a.Week)-num(b.Week));
  if(!games.length) return null;
  const seasonAvg = games.reduce((s,g)=>s+num(g[statKey]),0) / games.length;
  const last3 = games.slice(-3);
  const last3Avg = last3.reduce((s,g)=>s+num(g[statKey]),0) / last3.length;
  return {seasonAvg, last3Avg, gamesPlayed: games.length};
}

function getDefenseSeasonAndLast3(defense, position, statOption){
  const row = (DATA.defVsPos || []).find(r=>r.Defense===defense && r.Position===position);
  if(!row) return null;
  const seasonAllowed = num(row[statOption.defenseKey]);
  const totalKey = statOption.defenseKey.replace(' Per Game', '');
  const rawKey = DEFENSE_STAT_RAW_MAP[totalKey] || statOption.key;
  const log = getDefenseWeeklyLog(defense, position);
  const last3 = log.slice(-3);
  const last3Allowed = last3.length ? last3.reduce((s,w)=>s+num(w[rawKey]),0)/last3.length : seasonAllowed;
  return {seasonAllowed, last3Allowed};
}

function getClosestMilestoneGlobal(player){
  const entries = (DATA.milestones || []).filter(m=>m.Player===player);
  const close = entries.filter(m => num(m.Remaining) <= (MILESTONE_STEP_JS[m.Stat] || 50) * MILESTONE_CLOSE_FRACTION);
  if(!close.length) return null;
  return close.reduce((c,m)=>(!c || num(m.Remaining) < num(c.Remaining)) ? m : c, null);
}

function isPlayerOut(player){
  return (DATA.injuries || []).some(r=>r.Player===player && /out|doubtful/i.test(r.Status || ''));
}

// ---------- BEST PICKS (starter-based) ----------
// For each game, every offensive starter (QB1, RB1, WR1-3, TE1) is matched
// against what the opposing defense has actually given up to STARTERS at that
// position -- not to the whole position group, where backups and one-off
// players drag the numbers around. A pick only appears when both sides agree
// on a floor: the player cleared it in most of his own games AND starters
// cleared it in most of their games against this defense. The line shown is
// the HIGHEST such floor, which is the genuine overlap, not an easy number.
// Touchdown stats are left to the Anytime TD tab; this page is yardage and
// receptions. Switch "Starters only" off to compare against every player.
const BP_FLOORS = {
  'Pass Yards': [150,175,200,225,250,275,300],
  'Pass + Rush Yards': [200,225,250,275,300,325,350,375,400],
  'Rush Yards': [20,30,40,50,60,70,80,90,100],
  'Receiving Yards': [15,20,25,30,40,50,60,70,80,90,100],
  'Receptions': [2,3,4,5,6,7,8],
};
const BP_STATS = {
  QB: ['Pass Yards','Pass + Rush Yards'], RB: ['Rush Yards','Receiving Yards','Receptions'],
  WR: ['Receiving Yards','Receptions'], TE: ['Receiving Yards','Receptions'],
};
const BP_PLAYER_MIN_RATE = 0.75, BP_DEF_MIN_RATE = 0.60, BP_MIN_PLAYER_GAMES = 2, BP_MIN_DEF_SAMPLES = 3;
const BP_STARTERS_KEY = 'nfl_dashboard_bestpicks_starters';
function bpStartersOn(){ try { return localStorage.getItem(BP_STARTERS_KEY) !== '0'; } catch(e){ return true; } }
function bpSetStarters(on){ try { localStorage.setItem(BP_STARTERS_KEY, on ? '1' : '0'); } catch(e){} }
// Which players count, for both the offense being picked and the defense's samples:
//   starters = QB1, RB1, WR1-3, TE1 per team;  top5 = each team's five most-used players at every position;
//   all = everyone. (Older code passes true/false: true = starters, false = all.)
const BP_MODE_KEY = 'nfl_dashboard_bestpicks_mode';
function bpNorm(m){ return m === true ? 'starters' : (m === false || m === undefined || m === null) ? 'all' : m; }
function bpMode(){
  try {
    const m = localStorage.getItem(BP_MODE_KEY);
    if(m === 'starters' || m === 'top5' || m === 'all') return m;
    return localStorage.getItem(BP_STARTERS_KEY) === '0' ? 'all' : 'starters';
  } catch(e){ return 'starters'; }
}
function bpSetMode(m){ try { localStorage.setItem(BP_MODE_KEY, m); } catch(e){} }
const BP_MODE_LABEL = {starters:'starters', top5:'the league top 5 at each position', all:'every player'};
// League-wide: the five busiest players in the whole league at each position, by usage per game
// (pass attempts / rush attempts + targets / targets), at least 2 games played.
let _top5Cache = {src:null, set:null, rank:null};
function getTop5Rank(){
  if(_top5Cache.src === DATA.playerGame) return _top5Cache.rank;
  const agg = {};
  (DATA.playerGame || []).forEach(r => {
    if(!STARTER_SLOTS[r.Position]) return;
    const k = r.Team + '|' + r.Position + '|' + r.Player;
    const o = agg[k] = agg[k] || {team:r.Team, pos:r.Position, player:r.Player, u:0, g:0};
    o.u += r.Position === 'QB' ? num(r['Pass Attempts']) : r.Position === 'RB' ? num(r['Rush Attempts']) + num(r.Targets) : num(r.Targets);
    o.g++;
  });
  const byPos = {};
  Object.values(agg).filter(o => o.g >= 2).forEach(o => (byPos[o.pos] = byPos[o.pos] || []).push(o));
  const set = new Set(), rank = new Map();
  Object.entries(byPos).forEach(([pos, list]) => {
    list.sort((a, b) => b.u / b.g - a.u / a.g).slice(0, 5).forEach((o, i) => { set.add(o.team + '|' + o.player); rank.set(o.team + '|' + o.player, i + 1); });
  });
  _top5Cache = {src: DATA.playerGame, set, rank};
  return rank;
}
function getTop5Set(){ getTop5Rank(); return _top5Cache.set; }
// The defense side of "Top 5" is what the defense gives up to starters: a defense rarely faces more than
// one or two of the league's five busiest players at a position, which is too few games to judge.
function bpDefMode(m){ m = bpNorm(m); return m === 'top5' ? 'starters' : m; }
function bpInMode(r, mode){
  return mode === 'all' || (mode === 'top5' ? getTop5Set().has(r.Team + '|' + r.Player) : isStarter(r));
}

// Rows of players who faced `defense` at `position`: starters only, or everyone.
// The offense's own team is left out: a past game between these two teams is already in the player's own log.
function bpDefenseSamples(defense, position, startersOnly, offense){
  return (DATA.playerGame || []).filter(r => r.Opponent === defense && r.Position === position && r.Team !== offense && bpInMode(r, bpDefMode(startersOnly)));
}
let _bpLeague = {src:null, startersOnly:null, val:null};
function bpLeagueAvg(position, stat, startersOnly){
  const mode = bpDefMode(startersOnly);
  if(_bpLeague.src !== DATA.playerGame || _bpLeague.startersOnly !== mode) _bpLeague = {src: DATA.playerGame, startersOnly: mode, val:{}};
  const key = position + '|' + stat;
  if(!(key in _bpLeague.val)){
    const rows = (DATA.playerGame || []).filter(r => r.Position === position && bpInMode(r, mode));
    _bpLeague.val[key] = rows.length ? rows.reduce((a, r) => a + getStatValue(r, stat), 0) / rows.length : 0;
  }
  return _bpLeague.val[key];
}

// Offensive players for a team: starters (next man up if a starter is Out) or everyone with history.
function bpTeamPlayers(team, startersOnly){
  const byPlayer = {};
  (DATA.playerGame || []).filter(r => r.Team === team && BP_STATS[r.Position]).forEach(r => {
    (byPlayer[r.Player] = byPlayer[r.Player] || {Player:r.Player, Position:r.Position, games:[]}).games.push(r);
  });
  const list = Object.values(byPlayer);
  const mode = bpNorm(startersOnly);
  if(mode === 'all') return list.filter(p => !isPlayerOut(p.Player)).map(p => ({...p, slot:p.Position}));
  if(mode === 'top5'){
    const rank = getTop5Rank();
    return list.filter(p => rank.has(team + '|' + p.Player) && !isPlayerOut(p.Player)).map(p => ({...p, slot: p.Position + ' #' + rank.get(team + '|' + p.Player)}));
  }
  const usage = p => p.games.reduce((a, r) => a + (p.Position === 'QB' ? num(r['Pass Attempts']) : p.Position === 'RB' ? num(r['Rush Attempts']) + num(r.Targets) : num(r.Targets)), 0);
  const out = [];
  Object.keys(STARTER_SLOTS).forEach(pos => {
    const healthy = list.filter(p => p.Position === pos && !isPlayerOut(p.Player)).sort((a, b) => usage(b) - usage(a));
    const n = STARTER_SLOTS[pos];
    healthy.slice(0, n).forEach((p, i) => out.push({...p, slot: n > 1 ? pos + (i + 1) : pos + '1'}));
  });
  return out;
}

// Spread for the offense's team from a row like "DAL +2.5": negative = favored.
function bpSpreadFor(offense, spreadText){
  const m = String(spreadText || '').match(/([A-Z]{2,3})\s*([+-]?\d+(?:\.\d+)?)/);
  if(!m) return 0;
  const v = parseFloat(m[2]);
  return m[1] === offense ? v : -v;
}
// Game script: favorites run more, underdogs throw more. Small, capped nudges
// (about 1% of rushing yards per point favored, 0.6% of passing-game stats per
// point underdog) -- the market prices this in, so it belongs in a Vegas-style number.
function bpScriptFactor(stat, spread){
  if(stat === 'Rush Yards') return 1 + Math.max(-0.08, Math.min(0.08, -spread * 0.01));
  return 1 + Math.max(-0.05, Math.min(0.05, spread * 0.006));
}
function bpStdev(vals){
  if(vals.length < 2) return 0;
  const m = vals.reduce((a, v) => a + v, 0) / vals.length;
  return Math.sqrt(vals.reduce((a, v) => a + (v - m) * (v - m), 0) / (vals.length - 1));
}
// Projection: blend of season and last-3 average, times how this defense treats starters at the
// position versus the league (capped and shrunk toward neutral until the defense has 6 games --
// the same safeguards as the Predictions tab), times a small game-script nudge.
function bpProject(vals, l3avg, allowed, league, defGames, stat, spread){
  const avg = vals.reduce((a, v) => a + v, 0) / vals.length;
  const baseline = avg * 0.6 + l3avg * 0.4;
  let raw = league > 0 ? allowed / league : 1;
  raw = Math.max(0.6, Math.min(1.6, raw));
  const matchup = 1 + (raw - 1) * Math.min(1, defGames / 6);
  const script = bpScriptFactor(stat, spread);
  const proj = baseline * matchup * script;
  const sd = Math.max(bpStdev(vals), 0.30 * proj);
  return {proj, matchup, script, lo: Math.max(0, proj - 0.67 * sd), hi: proj + 0.67 * sd, line: Math.round(proj * 2) / 2};
}

function bpPicksForGame(offense, defense, startersOnly, spread){
  const picks = [];
  let noLine = 0;
  bpTeamPlayers(offense, startersOnly).forEach(p => {
    if(p.games.length < BP_MIN_PLAYER_GAMES) return;
    const defRows = bpDefenseSamples(defense, p.Position, startersOnly, offense);
    if(defRows.length < BP_MIN_DEF_SAMPLES) return;
    let best = null;
    BP_STATS[p.Position].forEach(stat => {
      const vals = p.games.map(g => getStatValue(g, stat));
      const avg = vals.reduce((a, v) => a + v, 0) / vals.length;
      if(avg <= 0) return;
      let found = null;
      BP_FLOORS[stat].forEach(f => {
        const ph = vals.filter(v => v >= f).length, pr = ph / vals.length;
        const dh = defRows.filter(r => getStatValue(r, stat) >= f).length, dr = dh / defRows.length;
        if(pr >= BP_PLAYER_MIN_RATE && dr >= BP_DEF_MIN_RATE) found = {floor:f, ph, pt:vals.length, dh, dt:defRows.length, pr, dr};
      });
      if(!found) return;
      const l3 = p.games.slice().sort((a, b) => num(a.Week) - num(b.Week)).slice(-3).map(g => getStatValue(g, stat));
      const allowed = defRows.reduce((a, r) => a + getStatValue(r, stat), 0) / defRows.length;
      const league = bpLeagueAvg(p.Position, stat, startersOnly);
      const defGames = new Set((DATA.playerGame || []).filter(r => r.Opponent === defense).map(r => r.Week)).size;
      const pj = bpProject(vals, l3.reduce((a, v) => a + v, 0) / l3.length, allowed, league, defGames, stat, spread || 0);
      const entry = {player:p.Player, position:p.Position, slot:p.slot, team:offense, opponent:defense, stat, ...found, pj,
        score:(found.pr + found.dr) / 2, avg, l3avg:l3.reduce((a, v) => a + v, 0) / l3.length, allowed, league,
        edge: league > 0 ? allowed / league - 1 : 0};
      if(!best || entry.score > best.score || (entry.score === best.score && entry.floor > best.floor && entry.stat !== 'Pass + Rush Yards')) best = entry;
    });
    if(best) picks.push(best); else noLine++;
  });
  picks.sort((a, b) => b.score - a.score || b.edge - a.edge);
  return {picks, noLine};
}

// ---- Best Picks live grading + history ----
// Every pick the page shows is also saved (once, before kickoff) so it can be graded later:
// live from ESPN while the games are on, then from the final box score. That is what keeps
// the previous weeks' picks, and their results, after the page moves on to the next slate.
const BP_HISTORY_KEY = 'nfl_dashboard_bestpicks_history';
const BP_STAT_SHORT = {'Pass Yards':'pass yds', 'Rush Yards':'rush yds', 'Receiving Yards':'rec yds', 'Receptions':'rec', 'Pass + Rush Yards':'pass+rush yds'};
let _bpHC = {raw:null, val:{}};
function bpHistGet(){ try { const raw = localStorage.getItem(BP_HISTORY_KEY) || '{}'; if(raw === _bpHC.raw) return _bpHC.val; const v = JSON.parse(raw); _bpHC = {raw, val:v}; return v; } catch(e){ return {}; } }
function bpHistSave(h){ try { localStorage.setItem(BP_HISTORY_KEY, JSON.stringify(h)); } catch(e){} _bpHC = {raw:null, val:{}}; if(window.syncSchedule) syncSchedule(); }
function bpPickKey(p, week){ return `${week}|${p.team}|${p.player}|${p.stat}|${p.floor}`; }
// Week of the slate on the page: book lines in the prop file belong to these games.
function bpCurWeek(){ const r = (DATA.week2 || [])[0]; return r ? String(r.Week) : ''; }
// What a pick is graded against. The book's own line when there is one (a pick HITS when the player goes over it), saved with the
// pick so it stays put once the game starts; otherwise the floor, as before.
function bpLine(p, week){
  const e = bpHistGet()[bpPickKey(p, week)];
  if(e && typeof e.bookThr === 'number') return {thr:e.bookThr, line:e.bookLine, book:true, over: typeof e.bookOver === 'number' ? {dec:e.bookOver, book:e.bookBook} : null};
  if(String(week) === bpCurWeek()){
    const m = propMainFor(p.player, p.stat);
    if(m) return {thr:m.thr, line:m.line, book:true, over: m.bo ? {dec:m.bo.dec, book:m.bo.book} : null};
  }
  return {thr:p.floor, line:null, book:false, over:null};
}
function bpLineLabel(p, week){ const L = bpLine(p, week); return L.book ? 'o' + L.line : p.floor + '+'; }
function bpGrade(p, week){
  return gradeMyPick({player:p.player, team:p.team, stat:p.stat, week, threshold:bpLine(p, week).thr, finalStat:p.finalStat, finalActual:p.finalActual});
}
// Save this week's picks the first time they are seen; graded results are written back too.
function bpSnapshot(allPicks){
  const h = bpHistGet();
  let changed = false;
  allPicks.forEach(p => {
    const k = bpPickKey(p, p.week);
    if(h[k]) return;
    h[k] = {week:String(p.week), player:p.player, position:p.position, slot:p.slot, team:p.team, opponent:p.opponent,
      stat:p.stat, floor:p.floor, proj:Math.round(p.pj.proj * 10) / 10, line:p.pj.line, lo:Math.round(p.pj.lo), hi:Math.round(p.pj.hi),
      ph:p.ph, pt:p.pt, dh:p.dh, dt:p.dt};
    changed = true;
  });
  Object.keys(h).forEach(k => {
    const e = h[k];
    if(typeof e.finalActual === 'number') return;
    const g = bpGrade(e, e.week);
    // Save the book's line with the pick: it follows the book until kickoff, then stays fixed.
    const m = String(e.week) === bpCurWeek() ? propMainFor(e.player, e.stat) : null;
    if(m && (typeof e.bookThr !== 'number' || (g && g.status === 'PENDING' && m.thr !== e.bookThr))){
      e.bookThr = m.thr; e.bookLine = m.line;
      if(m.bo){ e.bookOver = m.bo.dec; e.bookBook = m.bo.book; } else { delete e.bookOver; delete e.bookBook; }
      changed = true;
    }
    const g2 = bpGrade(e, e.week);
    if(g2 && g2.final && g2.persist && typeof g2.actual === 'number'){ e.finalActual = g2.actual; e.finalStat = e.stat; changed = true; }
  });
  if(changed) bpHistSave(h);
  return h;
}
function bpResultHtml(g, label){
  if(!g || g.status === 'PENDING') return '<span style="color:var(--chalk-dim);">Not started</span>';
  if(g.status === 'LIVE') return `<span class="live-chip live-in">LIVE</span> <b>${fmt(g.actual)}</b><span style="color:var(--chalk-dim);"> / ${label}${g.detail ? ' &middot; ' + g.detail : ''}</span>`;
  const color = g.status === 'HIT' ? 'var(--mint)' : 'var(--red)';
  const tag = g.live ? ' <span style="color:var(--chalk-dim);">live</span>' : (g.fromLive && !g.persist ? ' <span style="color:var(--chalk-dim);" title="ESPN lists only players who recorded a stat, so this is counted as 0 until the daily data confirms it">not in box</span>' : '');
  return `<span style="color:${color};font-weight:700;">${g.status}</span> <b>${fmt(g.actual)}</b> <span style="color:var(--chalk-dim);">vs ${label}</span>${tag}`;
}

// Kickoff window for Best Picks: converts the UTC kickoff to US Eastern and buckets it.
function bpWindow(dateStr){
  const d = new Date(dateStr);
  if(isNaN(d)) return {key:'tbd', label:'Time to be set', order:9e15, time:''};
  const parts = new Intl.DateTimeFormat('en-US', {timeZone:'America/New_York', weekday:'long', hour:'numeric', minute:'2-digit', hour12:false}).formatToParts(d);
  const get = t => (parts.find(p => p.type === t) || {}).value;
  const day = get('weekday');
  const hr = parseInt(get('hour'), 10) % 24, mn = parseInt(get('minute'), 10);
  const hh = hr + mn / 60;
  const time = new Intl.DateTimeFormat('en-US', {timeZone:'America/New_York', hour:'numeric', minute:'2-digit'}).format(d) + ' ET';
  let key, label;
  if(day === 'Sunday'){
    if(hh < 12){ key = 'sun-am'; label = 'Sunday Morning (international)'; }
    else if(hh < 14.5){ key = 'sun-early'; label = 'Sunday Early Afternoon'; }
    else if(hh < 19){ key = 'sun-late'; label = 'Sunday Late Afternoon'; }
    else { key = 'sun-night'; label = 'Sunday Night'; }
  } else if(day === 'Thursday' || day === 'Monday'){
    const night = hh >= 17;
    key = day.slice(0, 3).toLowerCase() + (night ? '-night' : '-day');
    label = day + (night ? ' Night' : ' (daytime)');
  } else { key = day.slice(0, 3).toLowerCase(); label = day; }
  return {key, label, order:d.getTime(), time, day};
}

// Book line for a Best Picks row: the line the book sets for this player and stat, with the best over price. The pick is graded
// against it (Over 54.5 hits at 55 or more). Grey "no line" = nothing posted yet, so the floor is used.
function bpPriceCell(p, week){
  if(!propHasData()) return '<span style="color:var(--chalk-dim);">--</span>';
  const L = bpLine(p, week);
  if(!L.book) return `<span style="color:var(--chalk-dim);" title="No book line posted for this player yet. Graded against the floor (${p.floor}+).">no line</span>`;
  const o = L.over, bk = o ? (PROP_BOOK_SHORT[o.book] || o.book) : '';
  const tip = `The book's line for this stat is ${L.line}. This pick is graded as Over ${L.line} (${L.thr}+)${L.thr === p.floor ? ', the same as the floor' : ', the floor is ' + p.floor + '+'}.${o ? ' Best over price ' + propAmerican(o.dec) + ' at ' + bk + '.' : ''}`;
  return `<b title="${tip}">o${L.line}</b>${o ? ` <span style="color:var(--chalk-dim);">${propAmerican(o.dec)} ${bk}</span>` : ''}`;
}

      ${Math.round(BP_DEF_MIN_RATE * 100)}% of their games against this defense. The line shown is the highest floor that
      passes both, so it's the real overlap, not an easy number. Next to it is a <b>projection</b>, how many the
      player should get: his season and last-3 average, scaled by how this defense treats starters compared with the league
      (shrunk toward neutral until the defense has 6 games, and capped), plus a small game-script nudge from the spread
      (favorites run more, underdogs throw more). The likely range is the middle half of outcomes. Hover a projection to see the factors.

      (an at-least line that has already cleared shows HIT), and from the final box score after. Past weeks stay here with their

function playerGameLogHtml(player, position){
  const games = (DATA.playerGame || []).filter(r=>r.Player===player && r.Position===position)
    .sort((a,b)=>num(a.Week)-num(b.Week));
  if(!games.length) return '<div class="empty" style="padding:8px 0;">No game log available.</div>';

  const cols = MATCHUP_COLS[position] || [];
  return `
    <table>
      <thead><tr><th>Wk</th><th>Opp</th>${cols.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>
      <tbody>
        ${games.map(g=>`
          <tr>
            <td class="num">${g.Week}</td>
            <td>${teamChip(g.Opponent)}</td>
            ${cols.map(c=>`<td class="num">${fmt(num(g[c.key]))}</td>`).join('')}
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function mountPicks(){
  const container = $('#picks-list'), topEl = $('#picks-top');
  const expandedPicks = new Set();   // keyed by "player|team", persists across re-renders
  let posFilter = '';

  const games = new Map();
  (DATA.week2 || []).forEach(r => {
    const gid = r['Game ID'];
    if(!gid) return;
    if(!games.has(gid)) games.set(gid, {date: r.Date, sides: {}});
    games.get(gid).sides[r['Home/Away'] === 'Home' ? 'home' : 'away'] = r;
  });
  const gameList = [...games.values()].filter(g => g.sides.home && g.sides.away).sort((a, b) => new Date(a.date) - new Date(b.date));
  if(!gameList.length){ container.innerHTML = '<div class="empty">No upcoming matchups loaded yet.</div>'; return; }

  const pct = v => Math.round(v * 100) + '%';
  function rowHtml(p, week){
    const key = `${p.player}|${p.team}|${p.stat}`;
    const open = expandedPicks.has(key);
    const saved = isPickSaved({source:'Best Picks', player:p.player, stat:p.stat, week, threshold:p.floor});
    const edge = Math.round(p.edge * 100);
    const scoreColor = p.score >= 0.8 ? 'var(--mint)' : 'var(--gold)';
    const row = `<tr class="pick-row" data-pick-key="${key}" style="cursor:pointer;">
        <td class="num" style="color:var(--chalk-dim);">${open ? '&#9662;' : '&#9656;'}</td>
        <td style="white-space:nowrap;"><span class="player-preview-pos">${p.slot}</span> ${p.player}</td>
        <td style="white-space:nowrap;" title="${teamName(p.team)} vs ${teamName(p.opponent)}"><b>${p.team}</b> <span style="color:var(--chalk-dim);">vs</span> ${p.opponent}</td>
        <td style="font-weight:700;color:var(--gold);white-space:nowrap;" title="${p.floor}+ ${p.stat}">${p.floor}+ ${BP_STAT_SHORT[p.stat] || p.stat}</td>
        <td style="white-space:nowrap;">${bpPriceCell(p, week)}</td>
        <td class="num" style="white-space:nowrap;" title="Season/last-3 blend x opponent factor ${fmt(p.pj.matchup, 2)}x x game script ${fmt(p.pj.script, 2)}x. Cushion over the floor: ${fmt(p.pj.proj - p.floor)}"><b>${fmt(p.pj.proj)}</b> <span style="color:var(--chalk-dim);">(${Math.round(p.pj.lo)}-${Math.round(p.pj.hi)})</span></td>
        <td class="num" style="white-space:nowrap;" title="Games cleared: his own ${p.ph}/${p.pt} (${pct(p.pr)}), then starters against ${p.opponent} ${p.dh}/${p.dt} (${pct(p.dr)})">${p.ph}/${p.pt} <span style="color:var(--chalk-dim);">&middot;</span> ${p.dh}/${p.dt}</td>
        <td class="num" style="font-weight:700;color:${scoreColor};">${pct(p.score)}</td>
        <td style="white-space:nowrap;">${bpResultHtml(bpGrade(p, week), bpLineLabel(p, week))}</td>
        <td><button class="save-pick-btn" ${saved ? 'disabled' : ''} data-player="${p.player}" data-position="${p.position}" data-team="${p.team}" data-opponent="${p.opponent}" data-stat="${p.stat}" data-week="${week}" data-floor="${p.floor}" data-summary="${p.floor}+ ${p.stat} vs ${p.opponent} (Wk ${week}) - cleared ${p.ph}/${p.pt} own games, ${p.dh}/${p.dt} starter games vs ${p.opponent}; projected ${fmt(p.pj.proj)}">${saved ? '&#10003; Saved' : '+ Add'}</button></td>
      </tr>`;
    const detail = open ? `<tr class="def-detail-row"><td colspan="10" style="background:var(--field-deep);padding:10px 16px;">
        <div style="font-family:var(--mono);font-size:11px;color:var(--chalk-dim);margin-bottom:6px;">Own avg <b>${fmt(p.avg)}</b> (last 3 ${fmt(p.l3avg)}) &middot; ${p.opponent} gives starters <b>${fmt(p.allowed)}</b> (<span style="color:${edge >= 0 ? 'var(--mint)' : 'var(--red)'};">${edge >= 0 ? '+' : ''}${edge}% vs league</span>) &middot; cleared ${p.floor}+ in ${p.ph}/${p.pt} own games (${pct(p.pr)}) and ${p.dh}/${p.dt} starter games vs ${p.opponent} (${pct(p.dr)})</div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--chalk-dim);margin-bottom:6px;">${p.player} -- ${p.position} game log:</div>
        ${playerGameLogHtml(p.player, p.position)}</td></tr>` : '';
    return row + detail;
  }
  const head = `<thead><tr><th></th><th>Player</th><th>Matchup</th><th title="The floor both the player and the defense agree on">Floor</th><th title="The line the book sets, with the best over price. The pick is graded against this line. Grey = no line posted yet, graded against the floor.">Book line</th><th>Projection (range)</th><th title="Games cleared: the player's own, then starters against this defense">Cleared</th><th>Score</th><th>Result vs line</th><th></th></tr></thead>`;

  let histWeek = null;
  function renderRecord(allShown){
    const recEl = $('#bp-record');
    if(!recEl) return;
    // Snapshot from the unfiltered starters-only slate, not whatever position filter is showing.
    if(bpMode() === 'starters'){
      const full = [];
      gameList.forEach(g => {
        const away = g.sides.away.Team, home = g.sides.home.Team, week = g.sides.away.Week;
        const sp = g.sides.away.Spread || g.sides.home.Spread || '';
        [...bpPicksForGame(away, home, true, bpSpreadFor(away, sp)).picks, ...bpPicksForGame(home, away, true, bpSpreadFor(home, sp)).picks]
          .forEach(p => full.push({...p, week}));
      });
      bpSnapshot(full);
    }
    const h = bpHistGet();
    const rows = Object.values(h).map(e => ({e, g: bpGrade(e, e.week)}));
    if(!rows.length){ recEl.innerHTML = '<div class="empty">No picks saved yet. They are saved the first time they show above (with Starters selected).</div>'; return; }
    const weeks = [...new Set(rows.map(r => parseInt(r.e.week, 10) || 0))].sort((a, b) => b - a);
    const stat = {};
    rows.forEach(({e, g}) => {
      const w = parseInt(e.week, 10) || 0;
      const o = stat[w] = stat[w] || {hit:0, miss:0, open:0, err:0, errN:0};
      if(g && g.status === 'HIT') o.hit++; else if(g && g.status === 'MISS') o.miss++; else o.open++;
      if(g && g.final && typeof g.actual === 'number'){ o.err += Math.abs(g.actual - e.proj); o.errN++; }
    });
    // Totals, overall and by stat (all weeks).
    const byStat = {}, tot = {hit:0, miss:0, open:0, err:0, errN:0};
    rows.forEach(({e, g}) => {
      const o = byStat[e.stat] = byStat[e.stat] || {hit:0, miss:0, open:0, err:0, errN:0};
      [o, tot].forEach(t => {
        if(g && g.status === 'HIT') t.hit++; else if(g && g.status === 'MISS') t.miss++; else t.open++;
        if(g && g.final && typeof g.actual === 'number'){ t.err += Math.abs(g.actual - e.proj); t.errN++; }
      });
    });
    const recRow = (label, o, bold) => {
      const dec = o.hit + o.miss;
      return `<tr${bold ? ' style="font-weight:700;"' : ''}><td>${label}</td><td class="num">${o.hit + o.miss + o.open}</td><td class="num" style="color:var(--mint);">${o.hit}</td><td class="num" style="color:var(--red);">${o.miss}</td><td class="num">${o.open}</td><td class="num">${dec ? Math.round(o.hit / dec * 100) + '%' : '--'}</td><td class="num">${o.errN ? fmt(o.err / o.errN) : '--'}</td></tr>`;
    };
    const statOrder = ['Pass Yards', 'Pass + Rush Yards', 'Rush Yards', 'Receiving Yards', 'Receptions'];
    const statRows = Object.keys(byStat).sort((a, b) => (statOrder.indexOf(a) + 99) % 99 - (statOrder.indexOf(b) + 99) % 99).map(k => recRow(k, byStat[k], false)).join('');
    const totalHtml = `<div class="log-pos-group" style="margin-bottom:14px;"><div class="log-pos-label" style="font-size:14px;">Total record${tot.hit + tot.miss ? ` -- ${tot.hit} of ${tot.hit + tot.miss} graded picks beat their line (${Math.round(tot.hit / (tot.hit + tot.miss) * 100)}%)` : ''}</div>
      <div class="table-scroll"><table><thead><tr><th>Stat</th><th class="num">Picks</th><th class="num">Hit</th><th class="num">Missed</th><th class="num">Open</th><th class="num">Hit rate</th><th class="num" title="Average distance between the projection and the actual result, graded picks only">Avg projection miss</th></tr></thead><tbody>${recRow('All stats', tot, true)}${statRows}</tbody></table></div>
      <div class="line-note">Hit rate counts graded picks only (open = not played yet). A projection miss is in the stat's own unit (yards or catches).</div></div>`;
    let H = 0, M = 0;
    const sumRows = weeks.map(w => {
      const o = stat[w]; H += o.hit; M += o.miss;
      return `<tr><td class="num">${w || '--'}</td><td class="num" style="color:var(--mint);">${o.hit}</td><td class="num" style="color:var(--red);">${o.miss}</td><td class="num">${o.open}</td><td class="num">${o.hit + o.miss ? Math.round(o.hit / (o.hit + o.miss) * 100) + '%' : '--'}</td><td class="num">${o.errN ? fmt(o.err / o.errN) : '--'}</td></tr>`;
    }).join('');
    const sel = (histWeek !== null && weeks.includes(histWeek)) ? histWeek : weeks[0];
    const detail = rows.filter(r => (parseInt(r.e.week, 10) || 0) === sel)
      .sort((a, b) => (a.g && a.g.status === 'HIT' ? 0 : 1) - (b.g && b.g.status === 'HIT' ? 0 : 1) || a.e.player.localeCompare(b.e.player));
    recEl.innerHTML = totalHtml + `
      <div class="log-pos-group" style="margin-bottom:14px;"><div class="log-pos-label" style="font-size:14px;">Record by week${H + M ? ` -- ${H} of ${H + M} picks beat their line (${Math.round(H / (H + M) * 100)}%)` : ''}</div>
        <div class="table-scroll"><table><thead><tr><th class="num">Week</th><th class="num">Hit</th><th class="num">Missed</th><th class="num">Open</th><th class="num">Hit rate</th><th class="num" title="Average distance between the projection and the actual result, graded picks only">Avg projection miss</th></tr></thead><tbody>${sumRows}</tbody></table></div></div>
      <div class="controls"><div class="pill-group" id="bp-hist-pills">${weeks.map(w => `<span class="pill ${w === sel ? 'active' : ''}" data-w="${w}">Week ${w || '--'}</span>`).join('')}</div></div>
      <div class="table-scroll"><table><thead><tr><th>Player</th><th>Team</th><th>Opp</th><th>Floor pick</th><th>Projection (range)</th><th>Result</th></tr></thead><tbody>${detail.map(({e, g}) => `<tr>
        <td><span class="player-preview-pos">${e.slot}</span> ${e.player}</td><td>${teamChip(e.team)}</td><td>${teamChip(e.opponent)}</td>
        <td style="font-weight:700;color:var(--gold);">${e.floor}+ ${e.stat}</td>
        <td class="num"><b>${fmt(e.proj)}</b> <span style="color:var(--chalk-dim);">(${e.lo}-${e.hi})</span></td>
        <td style="white-space:nowrap;">${bpResultHtml(g, bpLineLabel(e, e.week))}</td></tr>`).join('')}</tbody></table></div>`;
    $$('#bp-hist-pills .pill').forEach(pl => pl.addEventListener('click', () => { histWeek = parseInt(pl.dataset.w, 10); renderRecord(allShown); }));
  }

  // Windows, in kickoff order. Each game is tagged with its window.
  const winMap = new Map();
  gameList.forEach(g => {
    g.win = bpWindow(g.date);
    if(!winMap.has(g.win.key)) winMap.set(g.win.key, {key:g.win.key, label:g.win.label, order:g.win.order, time:g.win.time, games:[]});
    const w = winMap.get(g.win.key);
    w.order = Math.min(w.order, g.win.order);
    w.games.push(g);
  });
  const windows = [...winMap.values()].sort((x, y) => x.order - y.order);
  let winFilter = '';
  const winPills = $('#bp-win-pills');
  if(winPills){
    winPills.innerHTML = `<span class="pill active" data-win="">All windows</span>` + windows.map(w => `<span class="pill" data-win="${w.key}">${w.label} <span style="opacity:.6;">(${w.games.length})</span></span>`).join('');
    $$('#bp-win-pills .pill').forEach(pl => pl.addEventListener('click', () => {
      $$('#bp-win-pills .pill').forEach(x => x.classList.remove('active'));
      pl.classList.add('active'); winFilter = pl.dataset.win; apply();
    }));
  }

  function apply(){
    const startersOnly = bpMode();
    const all = [];
    const winHtml = [];
    windows.forEach(w => {
      const wAll = [];
      const sections = w.games.map(g => {
        const away = g.sides.away.Team, home = g.sides.home.Team, week = g.sides.away.Week;
        const spreadText = g.sides.away.Spread || g.sides.home.Spread || '';
        const a = bpPicksForGame(away, home, startersOnly, bpSpreadFor(away, spreadText)), h = bpPicksForGame(home, away, startersOnly, bpSpreadFor(home, spreadText));
        const picks = [...a.picks, ...h.picks].filter(p => !posFilter || p.position === posFilter).sort((x, y) => y.score - x.score || y.edge - x.edge);
        picks.forEach(p => { if(!winFilter || w.key === winFilter) all.push({...p, week}); wAll.push({...p, week}); });
        const spread = g.sides.away.Spread || g.sides.home.Spread || '';
        const none = a.noLine + h.noLine;
        return `<div class="log-pos-group" style="margin-bottom:20px;">
        <div class="log-pos-label" style="font-size:14px;">${teamName(away)} <span class="at">@</span> ${teamName(home)}${spread ? ` <span style="color:var(--chalk-dim);font-weight:400;">&middot; ${spread}</span>` : ''} <span style="color:var(--chalk-dim);font-weight:400;">&middot; ${g.win.day.slice(0, 3)} ${g.win.time}</span></div>
        ${picks.length ? `<div class="table-scroll"><table class="bp-t">${head}<tbody>${picks.map(p => rowHtml(p, week)).join('')}</tbody></table></div>`
          : '<div class="empty" style="padding:8px 0;">No line where both sides agree for this game yet.</div>'}
        ${none && !posFilter ? `<div class="line-note">${none} starter${none === 1 ? '' : 's'} had no floor that both they and the defense clear.</div>` : ''}
      </div>`;
      });
      if(winFilter && w.key !== winFilter) return;
      wAll.sort((x, y) => y.score - x.score || y.edge - x.edge);
      const times = [...new Set(w.games.map(g => g.win.time))].join(' / ');
      winHtml.push(`<div class="bp-window" style="margin-bottom:34px;">
        <div class="panel-title" style="margin:0 0 4px;padding:8px 12px;border-left:4px solid var(--gold);background:var(--field-deep);">${w.label} <span style="font-family:var(--mono);font-size:11px;color:var(--chalk-dim);font-weight:400;">&middot; ${times} &middot; ${w.games.length} game${w.games.length === 1 ? '' : 's'} &middot; ${wAll.length} pick${wAll.length === 1 ? '' : 's'}</span></div>
        ${wAll.length ? `<div class="log-pos-group" style="margin:10px 0 18px;"><div class="log-pos-label" style="font-size:13px;">Best in this window</div>
          <div class="table-scroll"><table class="bp-t">${head}<tbody>${wAll.slice(0, 3).map(p => rowHtml(p, p.week)).join('')}</tbody></table></div></div>` : ''}
        ${sections.join('')}
      </div>`);
    });
    all.sort((x, y) => y.score - x.score || y.edge - x.edge);
    renderRecord(all);
    topEl.innerHTML = all.length ? `<div class="log-pos-group" style="margin-bottom:24px;"><div class="log-pos-label" style="font-size:14px;">Top picks across ${winFilter ? 'this window' : 'the slate'}</div>
        <div class="table-scroll"><table class="bp-t">${head}<tbody>${all.slice(0, 10).map(p => rowHtml(p, p.week)).join('')}</tbody></table></div></div>` : '';
    container.innerHTML = winHtml.join('') || '<div class="empty">No picks yet.</div>';
    if(!all.length) topEl.innerHTML = '<div class="empty">No pick clears both bars yet this week. That is normal early in the season: wait for more games, or widen the group with Everyone.</div>';

    $$('.save-pick-btn', $('#content')).forEach(btn => {
      if(btn.dataset.floor === undefined) return;
      btn.addEventListener('click', e => {
        e.stopPropagation();
        addToMyPicks({source:'Best Picks', player:btn.dataset.player, position:btn.dataset.position, team:btn.dataset.team,
          opponent:btn.dataset.opponent, stat:btn.dataset.stat, week:btn.dataset.week, threshold:parseFloat(btn.dataset.floor), summary:btn.dataset.summary});
        apply();
      });
    });
    $$('.pick-row', $('#content')).forEach(tr => tr.addEventListener('click', () => {

// ---------- TAB: POWER RANKINGS ----------
// Combines three things already computed elsewhere into one ranked list:
// net EPA/play (offense minus defense allowed -- the single best predictor
// of true team quality), real win-loss record (from actual final scores in
// gameTeamStats, not a touchdown-count proxy), and strength of schedule.
// Each is converted to a league-wide percentile and blended transparently
// (50% EPA, 30% record, 20% SOS) so the ranking is explainable, not a black
// box -- every component is shown in the table, not just the final score.
function computePowerRankings(){
  const teams = [...new Set((DATA.teamSummary || []).map(r=>r.Team))];

  const records = {};
  (DATA.gameTeamStats || []).forEach(r=>{
    if(!records[r.Team]) records[r.Team] = {wins:0, losses:0, ties:0};
    const diff = num(r['Final Score']) - num(r['Opponent Score']);
    if(diff > 0) records[r.Team].wins++;
    else if(diff < 0) records[r.Team].losses++;
    else records[r.Team].ties++;
  });

  const epaByTeam = {};
  (DATA.epa || []).forEach(r=>{
    if(!epaByTeam[r.Team]) epaByTeam[r.Team] = {};
    epaByTeam[r.Team][r.Side] = num(r['EPA/Play']);
  });

  const sosByTeam = {};
  (DATA.sos || []).forEach(r=>{ sosByTeam[r.Team] = num(r['Played SOS']); });

  const rows = teams.map(team=>{
    const off = epaByTeam[team]?.Offense ?? 0;
    const def = epaByTeam[team]?.Defense ?? 0;
    const rec = records[team] || {wins:0, losses:0, ties:0};
    const gp = rec.wins + rec.losses + rec.ties;
    return {
      team, off, def, netEpa: off - def,
      wins: rec.wins, losses: rec.losses, ties: rec.ties, gp,
      winPct: gp > 0 ? (rec.wins + rec.ties*0.5) / gp : null,
      sos: sosByTeam[team] ?? null,
    };
  });

  function addPercentile(items, valueFn, outKey, fallback){
    const withValue = items.filter(r => valueFn(r) !== null);
    const sorted = [...withValue].sort((a,b)=> valueFn(b) - valueFn(a));
    const n = sorted.length;
    sorted.forEach((r,i)=>{ r[outKey] = n>1 ? 1 - i/(n-1) : 1; });
    items.forEach(r=>{ if(valueFn(r) === null) r[outKey] = fallback; });
  }

  addPercentile(rows, r=>r.netEpa, 'epaPct', 0.5);
  addPercentile(rows, r=>r.winPct, 'winPct_pct', 0.5);
  addPercentile(rows, r=>r.sos, 'sosPct', 0.5);

  rows.forEach(r=>{ r.powerScore = r.epaPct*0.5 + r.winPct_pct*0.3 + r.sosPct*0.2; });
  rows.sort((a,b)=> b.powerScore - a.powerScore);
  return rows;
}

// ---------- TAB: PREDICTIONS ----------
// A transparent, simplified model -- not a professional forecasting
// system. Every input and formula is shown inline rather than hidden
// behind a single output number, matching how the rest of this app treats
// "predictive"-feeling features (see Best Picks, EPA/Efficiency). Real
// outcomes involve injuries, weather, coaching decisions, and randomness
// this model doesn't fully capture -- treat this as an illustrative
// estimate built from your own season data, not a guarantee.
const HOME_FIELD_ADVANTAGE = 2.0;   // points -- a widely-cited long-run NFL average
const AVG_PLAYS_PER_GAME = 65;      // rough average plays/team/game, used only to translate an EPA/play gap into an approximate point margin
const MARGIN_SCALE = 14;            // spread-to-win-probability curve steepness, calibrated to typical NFL game-margin variance (~13-14 pt standard deviation)

function predictGameOutcome(awayTeam, homeTeam, powerByTeam){
  const away = powerByTeam[awayTeam];
  const home = powerByTeam[homeTeam];
  if(!away || !home) return null;

  const epaDiff = home.netEpa - away.netEpa;
  const predictedMargin = epaDiff * AVG_PLAYS_PER_GAME + HOME_FIELD_ADVANTAGE; // positive = home favored
  const homeWinProb = 1 / (1 + Math.pow(10, -predictedMargin / MARGIN_SCALE));

  return {
    predictedMargin, homeWinProb, awayWinProb: 1 - homeWinProb,
    homeNetEpa: home.netEpa, awayNetEpa: away.netEpa,
  };
}

// Matchup-adjusted stat projection: blend a player's season and recent-form
// average, then scale by how this specific opponent compares to the
// league average at that stat/position.
//
// Two safeguards against small-sample volatility (without them, an
// early-season defense that's had one shootout game can look 2-3x worse
// than league average from pure noise, and multiplying that into an
// already-elevated player average compounds into unrealistic numbers --
// e.g. projecting a 500-yard passing game):
//   1. The raw matchup factor is capped to [0.6, 1.6] -- a defense truly
//      being 60% better or worse than average is already extreme; beyond
//      that is far more likely noise than a real, stable tendency.
//   2. The factor is shrunk toward neutral (1.0) based on how many games
//      this defense has actually played, fully trusted only by 6 games in.
function projectPlayerStat(player, position, statOption, opponent){
  const playerTrend = getPlayerSeasonAndLast3(player, position, statOption.key);
  const defTrend = getDefenseSeasonAndLast3(opponent, position, statOption);
  if(!playerTrend || !defTrend || playerTrend.seasonAvg <= 0) return null;

  const allRows = (DATA.defVsPos || []).filter(r=>r.Position===position);
  if(!allRows.length) return null;
  const leagueAvgAllowed = allRows.reduce((s,r)=>s+num(r[statOption.defenseKey]),0) / allRows.length;

  const defRow = allRows.find(r=>r.Defense===opponent);
  const gamesPlayed = defRow ? num(defRow['Games Played']) : 0;

  let rawFactor = leagueAvgAllowed > 0 ? defTrend.seasonAllowed / leagueAvgAllowed : 1;
  rawFactor = Math.max(0.6, Math.min(1.6, rawFactor));
  const shrinkWeight = Math.min(1, gamesPlayed / 6);
  const matchupFactor = 1 + (rawFactor - 1) * shrinkWeight;

  const blendedAvg = playerTrend.seasonAvg * 0.6 + playerTrend.last3Avg * 0.4;
  const projected = blendedAvg * matchupFactor;

  return {projected, seasonAvg: playerTrend.seasonAvg, matchupFactor, gamesPlayed};
}

function pickProjectionPlayers(team){
  const byPlayer = {};
  (DATA.playerGame || []).filter(r=>r.Team===team && PICKS_POSITIONS.includes(r.Position)).forEach(r=>{
    if(!byPlayer[r.Player]) byPlayer[r.Player] = {player:r.Player, position:r.Position, games:[]};
    byPlayer[r.Player].games.push(r);
  });
  const primaryStatFor = pos => (PICKS_STAT_OPTIONS[pos] || [])[0];
  const withVolume = Object.values(byPlayer).map(p=>{
    const opt = primaryStatFor(p.position);
    const total = opt ? p.games.reduce((s,g)=>s+num(g[opt.key]),0) : 0;
    return {...p, volume: total};
  });
  const LINEUP_SLOTS = {QB:1, RB:2, WR:2, TE:1};
  const lineup = [];
  Object.entries(LINEUP_SLOTS).forEach(([pos, count])=>{
    lineup.push(...withVolume.filter(p=>p.position===pos).sort((a,b)=>b.volume-a.volume).slice(0, count));
  });
  return lineup;
}

// ---------- Betslip import: parse text (from OCR or pasted) into legs ----------
// Works on the text of a FanDuel / DraftKings slip: a title line per leg
// ("Makai Lemon 20+ Yards", "Will Shipley Under 33.5", "CeeDee Lamb Over 4.5
// Receptions", "Jalen Hurts Anytime Touchdown Scorer") followed by an ALL-CAPS
// market line ("MAKAI LEMON - ALT RECEIVING YDS") that says which stat it is.
function slipNorm(name){
  return String(name || '').toLowerCase().replace(/\b(jr|sr|ii|iii|iv|v)\b\.?/g, ' ').replace(/[^a-z]/g, '');
}
function slipEditDistance(a, b){
  if(Math.abs(a.length - b.length) > 3) return 99;
  const dp = Array.from({length: a.length + 1}, (_, i) => [i]);
  for(let j = 1; j <= b.length; j++) dp[0][j] = j;
  for(let i = 1; i <= a.length; i++) for(let j = 1; j <= b.length; j++)
    dp[i][j] = Math.min(dp[i-1][j] + 1, dp[i][j-1] + 1, dp[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return dp[a.length][b.length];
}
let _slipIdx = {src:null, val:null};
function slipPlayerIndex(){
  if(_slipIdx.src === DATA.playerGame) return _slipIdx.val;
  const byPlayer = new Map();
  (DATA.playerGame || []).forEach(r => {
    const k = r.Player + '|' + r.Team, cur = byPlayer.get(k);
    if(!cur || num(r.Week) >= num(cur.Week)) byPlayer.set(k, r);
  });
  const list = [...byPlayer.values()].map(r => ({Player:r.Player, Team:r.Team, Position:r.Position, norm:slipNorm(r.Player), Week:r.Week, Opponent:r.Opponent}));
  _slipIdx = {src: DATA.playerGame, val: list};
  return list;
}
function slipMatchPlayer(raw){
  const idx = slipPlayerIndex();
  const tokens = String(raw || '').replace(/[^A-Za-z.'\- ]/g, ' ').split(/\s+/).filter(Boolean);
  // OCR sometimes prefixes an icon fragment ("he Kenneth Gainwell"): try dropping up to two leading tokens.
  // Exact matches across every drop come first, then the looser last-name / typo matches.
  const cands = [];
  for(let drop = 0; drop <= 2 && tokens.length - drop >= 1; drop++){
    const cand = tokens.slice(drop).join(' ');
    if(slipNorm(cand).length < 4 && tokens.length - drop > 1) continue;
    cands.push(cand);
  }
  for(const cand of cands){
    const exact = idx.filter(p => p.norm === slipNorm(cand));
    if(exact.length) return {...exact.sort((a, b) => num(b.Week) - num(a.Week))[0], how:'exact'};
  }
  for(const cand of cands){
    const n = slipNorm(cand), parts = cand.split(/\s+/);
    const last = slipNorm(parts[parts.length - 1]);
    if(last.length >= 3){
      let pool = idx.filter(p => p.norm.endsWith(last));
      if(parts.length > 1) pool = pool.filter(p => p.norm[0] === slipNorm(parts[0])[0]);
      if(pool.length === 1) return {...pool[0], how:'fuzzy'};
    }
    let best = null, bestD = 3, tie = false;
    idx.forEach(p => { const d = slipEditDistance(n, p.norm); if(d < bestD){ best = p; bestD = d; tie = false; } else if(d === bestD && best && p.Player !== best.Player) tie = true; });
    if(best && !tie && bestD <= 2 && n.length >= 6) return {...best, how:'fuzzy'};
  }
  return null;
}
function slipStatFromText(text, position){
  const U = String(text || '').toUpperCase();
  if(/PASS/.test(U) && /RUSH/.test(U) && !/RECEIV|RECEP/.test(U) && !/\bTDS?\b|TOUCHDOWN/.test(U)) return {stat:'Pass + Rush Yards', guessed:false};
  if(/RUSH/.test(U) && /RECEIV|RECEP/.test(U)) return {stat:'Rush + Rec Yards', guessed:false};
  if(/RECEPTION/.test(U) && !/RECEIVING/.test(U)) return {stat:'Receptions', guessed:false};
  if(/RECEIV/.test(U)) return {stat:'Receiving Yards', guessed:false};
  if(/RUSH/.test(U)) return {stat:'Rush Yards', guessed:false};
  if(/PASS/.test(U) && /\bTDS?\b|TOUCHDOWN/.test(U)) return {stat:'Pass TD', guessed:false};
  if(/PASS/.test(U)) return {stat:'Pass Yards', guessed:false};
  const byPos = {QB:'Pass Yards', RB:'Rush Yards', WR:'Receiving Yards', TE:'Receiving Yards'};
  return {stat: byPos[position] || 'Receiving Yards', guessed:true};
}
function slipIsSubtitle(line){
  const letters = line.replace(/[^A-Za-z]/g, '');
  if(letters.length < 6) return false;
  const upper = letters.replace(/[^A-Z]/g, '').length;
  return upper / letters.length >= 0.7;
}
const SLIP_TD_PHRASE = String.raw`an[yv]\s?time\s+(?:touchdown|td)(?:\s+scorer)?`;
function slipLegQuality(l){ return (l.statGuessed ? 0 : 2) + (l.how === 'exact' ? 1 : 0) + (l.matched ? 4 : 0); }
function parseSlipText(text){
  const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const titleRe = /^(.{3,60}?)\s+(?:(\d+(?:\.\d+)?)\s?\+|(Over|Under)\s+(\d+(?:\.\d+)?))(?=\s|$)(.*)$/i;
  const tdRe = new RegExp('^(.{3,60}?)\\s+(?:to score a touchdown|' + SLIP_TD_PHRASE + ')', 'i');
  const tdSubRe = new RegExp('^\\W*' + SLIP_TD_PHRASE, 'i');
  const legs = [], seen = new Map();
  function add(leg){
    const key = (leg.matched ? leg.player : slipNorm(leg.rawName)) + '|' + leg.stat + '|' + leg.threshold + '|' + leg.direction;
    const old = seen.get(key);
    // The collapsed header repeats every leg (often garbled): keep the cleanest read of each one.
    if(old){ if(slipLegQuality(leg) > slipLegQuality(old.leg)) legs[old.i] = leg, old.leg = leg; return; }
    seen.set(key, {i: legs.length, leg}); legs.push(leg);
  }
  function build(rawName, threshold, direction, stat, guessedStat, match){
    return {rawName: rawName.trim(), player: match ? match.Player : rawName.trim(), matched: !!match, how: match ? match.how : null,
      team: match ? match.Team : '', position: match ? match.Position : '', stat, statGuessed: guessedStat, threshold, direction, include: true};
  }
  // A name taken from a run-on header ("Receptions Kyren Wiliams - Ak Receptions, Matthew Stafford"): keep only the last name-like tail.
  function tidyName(n){
    n = String(n || '');
    const cut = Math.max(n.lastIndexOf(','), n.lastIndexOf('.'), n.lastIndexOf(' - '));
    if(cut >= 0) n = n.slice(cut + (n.slice(cut, cut + 3) === ' - ' ? 3 : 1));
    return n.trim();
  }
  lines.forEach((line, i) => {
    // Any Time TD legs come first so "Davante Adams Any Time Touchdown Scorer, Kyren Williams 4+" is not read as one odd name.
    const t = line.match(tdRe);
    if(t){ const nm = tidyName(t[1]); const match = slipMatchPlayer(nm); add(build(nm, 1, '', 'Any TD', false, match)); return; }
    const m = line.match(titleRe);
    if(m){
      const rawName = tidyName(m[1]), rest = m[5] || '';
      if(!rawName || /touchdown|scorer/i.test(rawName)) return;

      if(m[2]){ threshold = parseFloat(m[2]); direction = ''; }
      else { threshold = parseFloat(m[4]); direction = m[3].toLowerCase(); }
      const match = slipMatchPlayer(rawName);
      let market = rest;
      const next = lines[i + 1];
      if(next && slipIsSubtitle(next) && !titleRe.test(next)) market += ' ' + next;
      const r = slipStatFromText(market, match && match.Position);
      let stat = r.stat, guessed = r.guessed;
      if(/\bReceptions?\b/i.test(rest) && !/RECEIVING/i.test(market)) { stat = 'Receptions'; guessed = false; }

    }

    const next = lines[i + 1];

      const match = slipMatchPlayer(line); add(build(line, 1, '', 'Any TD', false, match));

  const flat = lines.join(' ');
  const flatRe = new RegExp("([A-Z][A-Za-z.'\\-]+(?:\\s+[A-Z][A-Za-z.'\\-]+){1,2})\\s+" + SLIP_TD_PHRASE.replace('\\s+(?:touchdown|td)', '(?:\\s+\\S{1,2})?\\s+(?:touchdown|td)'), 'gi');
  for(const f of flat.matchAll(flatRe)){
    const nm = tidyName(f[1]); const match = slipMatchPlayer(nm);
    if(match || nm.split(/\s+/).length >= 2) add(build(nm, 1, '', 'Any TD', false, match));
  }
  return legs;
}
// A screenshot can hold more than one slip (the next bet in the list peeks in below the first).
function splitSlipText(text){
  const lines = String(text || '').split(/\r?\n/);
  const hdr = lines.map((l, i) => /(same game parlay|\bparlay\b|\bSGP\b)\W*\s+[+-]\d{3,5}\s*$/i.test(l.trim()) ? i : -1).filter(i => i >= 0);
  if(hdr.length < 2) return [String(text || '')];
  const out = [];
  hdr.forEach((h, k) => { const from = k === 0 ? 0 : h, to = k + 1 < hdr.length ? hdr[k + 1] : lines.length; out.push(lines.slice(from, to).join('\n')); });
  return out;
}
// A settled slip (DraftKings/FanDuel "My Bets" view) mentions things an open slip never does.
function slipLooksSettled(text){
  const t = String(text || '');
  // A game that is still on (LIVE badge, "4th - 0:46", "OT - 02:45") is this week's slate even if the bet itself already settled.
  if(/\bLIVE\b|\b(?:1st|2nd|3rd|4th|OT)\s*[-\u2013]\s*\d{1,2}:\d\d/i.test(t)) return false;
  return /\bRETURNED\b|TOTAL WAGER|\bFinished\b|\bSettled\b|\bPLACED:|\bFINAL\b|\bPAYOUT\b/i.test(t);
}
// Book, odds, wager and payout, when the slip shows them.
function parseSlipMeta(text){
  const t = String(text || '');
  const meta = {book:'', odds:'', stake:'', payout:'', bonus:false};
  if(/fan\s?duel/i.test(t)) meta.book = 'FanDuel';
  else if(/draft\s?kings|\bDK\b/i.test(t)) meta.book = 'DraftKings';
  const lines = t.split(/\r?\n/);
  const oddsRe = /(?:^|[^\w$.])([+-]\d{3,5})(?![\d.])/g;
  for(const line of lines){
    if(/parlay|sgp|same game|odds|total/i.test(line)){ const m = [...line.matchAll(oddsRe)]; if(m.length){ meta.odds = m[m.length - 1][1]; break; } }
  }
  if(!meta.odds){
    const parlayAt = lines.findIndex(l => /parlay|same game/i.test(l));
    if(parlayAt >= 0) for(let i = Math.max(0, parlayAt - 1); i <= Math.min(lines.length - 1, parlayAt + 2); i++){ const m = [...lines[i].matchAll(oddsRe)]; if(m.length){ meta.odds = m[m.length - 1][1]; break; } }
  }
  const money = '\\$\\s?(\\d{1,6}(?:\\.\\d{1,2})?)';
  let m = t.match(new RegExp('(?:total\\s+wager|wager|stake)\\s*[:\\-]?\\s*' + money, 'i')) || t.match(new RegExp(money + '\\s+(?:total\\s+)?wager', 'i'));
  if(m) meta.stake = m[1];
  m = t.match(new RegExp('(?:returned|total\\s+payout|payout|paid)\\s*[:\\-]?\\s*' + money, 'i')) || t.match(new RegExp(money + '\\s+(?:returned|payout)', 'i'));
  if(m) meta.payout = m[1];
  // Low-resolution shots: "$5.00 $6476" on one line with "TOTAL WAGER ... TOTAL PAYOUT" under it.
  if(!meta.stake || !meta.payout){
    for(let i = 0; i < lines.length - 1; i++){
      const two = [...lines[i].matchAll(/\$\s?(\d{1,6}(?:\.\d{1,2})?)/g)];
      if(two.length >= 2 && /WAG|STAKE/i.test(lines[i + 1]) && /PAY|RETURN/i.test(lines[i + 1])){
        if(!meta.stake) meta.stake = two[0][1];
        if(!meta.payout){
          let p = two[1][1];
          if(!/\./.test(p) && p.length >= 4){
            const st = parseFloat(meta.stake), o = parseFloat(meta.odds), prof = isFinite(st) && isFinite(o) && o ? (o > 0 ? st * o / 100 : st * 100 / Math.abs(o)) : null;
            const cand = parseFloat(p) / 100;
            if(prof === null || Math.abs(cand - prof) < Math.abs(cand - (st + prof)) * 4 || Math.abs(cand - (st + prof)) < 1) p = String(cand);
          }
          meta.payout = p;
        }
        break;
      }
    }
  }
  // Bonus bet: FanDuel shows a yellow "BONUS BET $x" badge under the odds. OCR often garbles the words, so a short
  // stray "$x.xx" line right under the header counts too. The stake is not returned on a win and costs nothing on a loss.
  if(/BONUS\s*BET|FREE\s*BET|\bSITE\s*CREDIT/i.test(t)) meta.bonus = true;
  else {
    const h = lines.findIndex(l => /(parlay|sgp|same game)/i.test(l) && /[+-]\d{3,5}\s*$/.test(l.trim()));
    if(h >= 0){ const nx = (lines[h + 1] || '').trim(); if(nx.length <= 16 && /\$\s?\d+(?:\.\d\d)?\s*$/.test(nx) && !/WAG|STAKE|PAY/i.test(nx)){ meta.bonus = true; if(!meta.stake){ const mm = nx.match(/\$\s?(\d+(?:\.\d\d)?)/); if(mm) meta.stake = mm[1]; } } }
  }
  return meta;
}
let SLIP_WEEK_MODE = 'upcoming';
function slipDefaultWeek(leg){
  const wk2 = SLIP_WEEK_MODE === 'upcoming' ? (DATA.week2 || []).find(r => r.Team === leg.team) : null;
  if(wk2) return {week: wk2.Week, opponent: wk2.Opponent};
  const mine = (DATA.playerGame || []).filter(r => r.Player === leg.player && r.Team === leg.team).sort((a, b) => num(b.Week) - num(a.Week))[0];
  return mine ? {week: mine.Week, opponent: mine.Opponent} : {week:'', opponent:''};
}
function slipLegToPick(leg){
  const direction = leg.direction === 'under' ? 'under' : (leg.direction === 'over' ? 'over' : undefined);
  const pick = {source:'Betslip Import', player:leg.player, position:leg.position, team:leg.team, opponent:leg.opponent || '',
    stat:leg.stat, week:String(leg.week || ''), threshold:num(leg.threshold)};
  if(direction) pick.direction = direction;
  pick.summary = `${pickLegLabel(pick)}${pick.opponent ? ' vs ' + pick.opponent : ''}${pick.week ? ` (Wk ${pick.week})` : ''}`;

// Reading the photo: Tesseract.js (OCR) runs in this browser tab -- the image is never uploaded anywhere.
let _tessPromise = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(_tessPromise) return _tessPromise;
  _tessPromise = new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    sc.onload = () => resolve(window.Tesseract);
    sc.onerror = () => { _tessPromise = null; reject(new Error('Could not load the text reader (needs an internet connection).')); };
    document.head.appendChild(sc);
  });
  return _tessPromise;
}
// Betslips are dark-mode: invert to dark-on-light and upscale, which is what OCR reads best.
function prepSlipImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const scale = Math.max(1, Math.min(2400, Math.max(1600, img.width * 2)) / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const d = ctx.getImageData(0, 0, c.width, c.height), px = d.data;
      let sum = 0, n = 0;
      for(let i = 0; i < px.length; i += 160){ sum += 0.299 * px[i] + 0.587 * px[i+1] + 0.114 * px[i+2]; n++; }
      const invert = sum / n < 128;
      for(let i = 0; i < px.length; i += 4){
        let g = 0.299 * px[i] + 0.587 * px[i+1] + 0.114 * px[i+2];
        if(invert) g = 255 - g;
        px[i] = px[i+1] = px[i+2] = g;
      }
      ctx.putImageData(d, 0, 0);
      URL.revokeObjectURL(url);
      resolve(c);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not open that image.')); };
    img.src = url;
  });
}
async function ocrSlipImage(file, onProgress){
  const T = await loadTesseract();
  const canvas = await prepSlipImage(file);
  const worker = await T.createWorker('eng', 1, {logger: m => { if(onProgress && m.status === 'recognizing text') onProgress(m.progress); }});
  try {
    await worker.setParameters({tessedit_pageseg_mode: '6'});
    const res = await worker.recognize(canvas);
    return res.data.text;
  } finally { try { await worker.terminate(); } catch(e){} }
}

        draw();
      }));
      ['book', 'odds', 'stake', 'payout'].forEach(k => $('#slip-' + k).addEventListener('change', e => { curMeta[k] = e.target.value.trim(); }));
      $('#slip-bonus').addEventListener('change', e => { curMeta.bonus = e.target.checked; });
      const next = () => { if(queue.length) load(queue.shift()); else { legs = []; reviewEl.innerHTML = ''; } };
      $('#slip-add-btn').addEventListener('click', () => {
        let ticket = $('#slip-ticket').value;
        if(ticket === '__auto') ticket = defName;
        if(ticket === '__new'){
          ticket = (prompt('Name for the new ticket:') || '').trim();
          if(!ticket) return;
        }
        addNewTicketName(ticket);
        const r = commit(legs, curMeta, ticket);
        lastBatch = r.added ? [{ticket, picks:r.picks, newTicket:true}] : [];
        statusEl.innerHTML = `Added ${r.added} leg${r.added === 1 ? '' : 's'} to ${ticket}${r.dupes ? ` (${r.dupes} already saved)` : ''}. ${r.added ? '<button class="save-pick-btn" id="slip-undo">Undo</button>' : ''}`;
        wireUndo();
        next();
        onChange();
      });
      const skip = $('#slip-skip-btn');
      if(skip) skip.addEventListener('click', () => { next(); });
    }
    function load(item){
      legs = item.legs; curMeta = item.meta; curMode = item.mode; SLIP_WEEK_MODE = curMode;
      draw();
    }
    function wireUndo(){
      const u = $('#slip-undo');
      if(!u) return;
      u.addEventListener('click', () => {
        lastBatch.forEach(b => {
          b.picks.forEach(pk => {
            const idx = getMyPicks().findIndex(x => x.player === pk.player && x.stat === pk.stat && x.source === pk.source && x.week === pk.week && (x.threshold ?? null) === (pk.threshold ?? null) && (x.direction || '') === (pk.direction || '') && x.ticket === pk.ticket);
            if(idx >= 0) removeFromMyPicks(idx);
          });
          const m = getTicketMeta(); if(m[b.ticket]){ delete m[b.ticket]; saveTicketMeta(m); }
        });
        statusEl.textContent = 'Undone. Nothing from that import is left.';
        lastBatch = [];
        onChange();
      });
    }
    // One image (or pasted text) -> a parsed slip.
    function parseMany(text){
      const whole = parseSlipMeta(text);
      return splitSlipText(text).map(seg => {
        const r = parseOne(seg);
        if(!r.meta.book && whole.book) r.meta.book = whole.book;
        return r;
      }).filter(r => r.legs.length);
    }
    function parseOne(text){
      const meta = parseSlipMeta(text);
      const mode = slipLooksSettled(text) ? 'played' : 'upcoming';
      SLIP_WEEK_MODE = mode;
      const parsed = parseSlipText(text);
      parsed.forEach(l => { l.week = ''; fillDefaults(l); });
      return {legs: parsed, meta, mode, text};
    }
    function handleParsed(results){
      lastBatch = []; queue = [];
      const auto = $('#slip-auto').checked;
      let addedSlips = 0, addedLegs = 0, empty = 0;
      const names = [];
      results.forEach(r => {
        if(!r.legs.length){ empty++; return; }
        if(auto && r.legs.every(isClean)){
          const ticket = uniqueTicketName(r.meta);
          addNewTicketName(ticket);
          const c = commit(r.legs, r.meta, ticket);
          if(c.added){ addedSlips++; addedLegs += c.added; names.push(ticket); lastBatch.push({ticket, picks:c.picks, newTicket:true}); }
        } else queue.push(r);
      });
      const parts = [];
      if(addedSlips) parts.push(`Added ${addedSlips} slip${addedSlips === 1 ? '' : 's'} (${addedLegs} leg${addedLegs === 1 ? '' : 's'}) to ${SHARE ? 'your shared tickets' : 'My Picks'}: ${names.join(', ')}. <button class="save-pick-btn" id="slip-undo">Undo</button>`);
      if(empty) parts.push(`${empty} image${empty === 1 ? '' : 's'} had no legs I could read: try a sharper screenshot of just the slip, or paste the text.`);
      if(queue.length) parts.push(`${queue.length} slip${queue.length === 1 ? ' needs' : 's need'} a look first.`);
      statusEl.innerHTML = parts.join(' ') || 'Nothing to add.';
      wireUndo();
      if(queue.length) load(queue.shift()); else { legs = []; reviewEl.innerHTML = ''; }
      onChange();
    }
    async function processFiles(files){
      files = [...files].filter(f => /^image\//.test(f.type));
      if(!files.length){ statusEl.textContent = 'Choose a screenshot first.'; return; }
      const results = [];
      for(let i = 0; i < files.length; i++){
        const tag = files.length > 1 ? ` (image ${i + 1} of ${files.length})` : '';
        statusEl.textContent = 'Loading the text reader...' + tag;
        try {
          const text = await ocrSlipImage(files[i], p => { statusEl.textContent = `Reading the slip... ${Math.round(p * 100)}%${tag}`; });
          if(i === 0) $('#slip-text').value = text;
          results.push(...parseMany(text));
        } catch(err){
          console.error(err);
          statusEl.textContent = `Couldn't read image ${i + 1} (${err.message}). You can paste the slip text instead.`;
          return;
        }
      }
      handleParsed(results);
    }
    window.__slipProcessFiles = processFiles;
    $('#slip-parse-btn').addEventListener('click', () => { const t = $('#slip-text').value; const rs = parseMany(t); handleParsed(rs.length ? rs : [parseOne(t)]); });
    $('#slip-read-btn').addEventListener('click', () => processFiles($('#slip-file').files || []));
    // Paste an image anywhere on this tab, or drag screenshots onto the box.
    if(window.__slipPaste) document.removeEventListener('paste', window.__slipPaste);
    window.__slipPaste = e => {
      if(!document.getElementById('slip-panel')) return;
      const items = [...((e.clipboardData && e.clipboardData.items) || [])].filter(it => it.kind === 'file' && /^image\//.test(it.type));
      if(!items.length) return;
      e.preventDefault();
      processFiles(items.map(it => it.getAsFile()).filter(Boolean));
    };
    document.addEventListener('paste', window.__slipPaste);
    const panel = $('#slip-panel');
    panel.addEventListener('dragover', e => { e.preventDefault(); panel.style.outline = '2px dashed var(--mint)'; });
    panel.addEventListener('dragleave', () => { panel.style.outline = ''; });
    panel.addEventListener('drop', e => { e.preventDefault(); panel.style.outline = ''; processFiles((e.dataTransfer && e.dataTransfer.files) || []); });
  }
}
