function mountPropPrices(){
  if(!propHasData()) return;
  const all = DATA.propOdds;
  const books = [...new Set(all.map(r => r.book))].filter(Boolean);
  const fetched = all.map(r => r.fetched).filter(Boolean).sort().pop() || '';
  const unmapped = [...new Set(all.filter(r => !r.stat).map(r => r.market))];
  $('#pp-note').innerHTML = `${all.length.toLocaleString()} prices from ${books.map(b => PROP_BOOK_SHORT[b] || b).join(', ')}${fetched ? `, fetched ${fetched.replace('T', ' ').replace('Z', ' UTC')}` : ''}.
    Gold = best price between the books. Turn on <b>show the app's read</b> to see this app's own estimate for the Over (or Yes), from the player's season hit rate and the opponent's history, and the gap to the book's no-margin
    price, pulled toward zero when only a few games sit behind it. <b>Read a gap as a question, not a signal:</b> books know about injuries, weather and game plans this app does not, so a big gap is more often the app being wrong than a bargain,
    and a handful of games behind an estimate is thin. ${unmapped.length ? `<span style="color:var(--chalk-dim);">${unmapped.length} market types are not mapped to a stat and are ignored: ${unmapped.slice(0, 8).join('; ')}${unmapped.length > 8 ? '...' : ''}.</span>` : ''}`;
  const groups = new Map();
  all.forEach(r => {
    if(!r.stat || !r.ou) return;
    if(String(r.active).toLowerCase() === 'false') return;
    const dec = parseFloat(r.decimal_odds); if(!(dec > 1)) return;
    const line = r.line === '' || r.line === undefined ? null : parseFloat(r.line);
    const k = [slipNorm(r.player), r.stat, line, r.game].join('|');
    if(!groups.has(k)) groups.set(k, {player: r.player, stat: r.stat, line, game: r.game, kickoff: r.kickoff, over: [], under: [], ob: {}, ub: {}});
    const g = groups.get(k);
    (r.ou === 'under' ? g.under : g.over).push({dec, book: r.book});
    const bm = r.ou === 'under' ? g.ub : g.ob;
    if(!bm[r.book] || dec > bm[r.book]) bm[r.book] = dec;
  });
  const lastRow = {};
  (DATA.playerGame || []).forEach(r => { const k = slipNorm(r.Player); if(!lastRow[k] || num(r.Week) >= num(lastRow[k].Week)) lastRow[k] = r; });
  const rows = [...groups.values()].map(g => {
    const best = a => a.length ? a.reduce((x, y) => y.dec > x.dec ? y : x) : null;
    const bo = best(g.over), bu = best(g.under);
    const lr = lastRow[slipNorm(g.player)];
    let est = null, n = null;
    if(lr && bo){
      const wk = (DATA.week2 || []).find(r => r.Team === lr.Team);
      const t = g.stat === 'Any TD' ? 1 : (g.line === null ? null : (Number.isInteger(g.line) ? g.line + 1 : g.line + 0.5));
      if(t !== null){
        const e = estimatePickProbability({player:lr.Player, position:lr.Position, team:lr.Team, opponent: wk ? wk.Opponent : '', stat:g.stat, threshold:t});
        if(e && e.playerRate.total >= 3){ est = e.probability; n = e.playerRate.total; }
      }
    }
    // Book price without its margin: only when both sides are posted at this line by the same book.
    let nv = null;
    if(bo && bu){ const bk = g.over.find(o => g.under.some(u => u.book === o.book)); if(bk){ const u = g.under.find(x => x.book === bk.book); nv = (1 / bk.dec) / (1 / bk.dec + 1 / u.dec); } }
    const implied = bo ? (nv !== null ? nv : 1 / bo.dec) : null;
    return {player:g.player, game:g.game, kickoff:g.kickoff, ob:g.ob, ub:g.ub, team: lr ? lr.Team : '', pos: lr ? lr.Position : '', stat:g.stat, lineNum: g.line === null ? -1 : g.line, line: g.line === null ? 'Yes' : g.line,
      over: bo ? bo.dec : '', overTxt: bo ? `${propAmerican(bo.dec)} ${PROP_BOOK_SHORT[bo.book] || bo.book}` : '--', under: bu ? bu.dec : '', underTxt: bu ? `${propAmerican(bu.dec)} ${PROP_BOOK_SHORT[bu.book] || bu.book}` : '--',
      implied: implied === null ? '' : implied, est: est === null ? '' : est, n: n === null ? '' : n,
      // Few games behind an estimate say little, so the gap is pulled toward the book's price: weight n against 4 games of the book's view.
      gap: est !== null && implied !== null ? (n * est + 4 * implied) / (n + 4) - implied : ''};
  });
  // Main line per player + stat: the line where the best over and best under are closest to even money (alternate lines
  // are lopsided). A line with both sides posted always beats a one-sided ladder rung. Alternates stay in the data, so slip matching still sees them.
  const byPS = new Map();
  rows.forEach(r => { const k = [slipNorm(r.player), r.stat].join('|'); if(!byPS.has(k)) byPS.set(k, []); byPS.get(k).push(r); });
  byPS.forEach(list => {
    if(list.length === 1){ list[0].main = true; return; }
    const score = r => (r.over !== '' && r.under !== '') ? Math.abs(1 / r.over - 1 / r.under) : 1 + Math.abs((r.over !== '' ? r.over : r.under) - 1.91);
    let best = list[0];
    list.forEach(r => { if(score(r) < score(best)) best = r; });
    list.forEach(r => { r.main = (r === best); });
  });
  const statOrder = ['Pass Yards', 'Pass + Rush Yards', 'Rush Yards', 'Receiving Yards', 'Receptions'];
  const statRank = s => { const i = statOrder.indexOf(s); return s === 'Any TD' ? 99 : (i < 0 ? 50 : i); };
  const stats = [...new Set(rows.map(r => r.stat))].sort((a, b) => statRank(a) - statRank(b) || a.localeCompare(b));
  const statLabel = s => ({'Pass Yards':'Passing Yds', 'Pass + Rush Yards':'Pass + Rush Yds', 'Rush Yards':'Rushing Yds', 'Receiving Yards':'Receiving Yds', 'Receptions':'Receptions', 'Any TD':'Anytime TD'})[s] || s;
  let curStat = stats[0] || '';
  const statPills = $('#pp-stat-pills'), gameSel = $('#pp-game');
  statPills.innerHTML = stats.map(s => `<span class="pill ${s === curStat ? 'active' : ''}" data-stat="${frEsc(s)}">${frEsc(statLabel(s))}</span>`).join('');
  $$('#pp-stat-pills .pill').forEach(pl => pl.addEventListener('click', () => {
    $$('#pp-stat-pills .pill').forEach(x => x.classList.remove('active'));
    pl.classList.add('active'); curStat = pl.dataset.stat; draw();
  }));
  [...new Set(rows.map(r => r.game))].sort().forEach(x => gameSel.insertAdjacentHTML('beforeend', `<option>${frEsc(x)}</option>`));
  // Book columns: FanDuel and DraftKings first, then anything else that appears.
  const bookOrder = ['fanduel', 'draftkings'];
  const bookCols = [...new Set([...bookOrder, ...books])].filter(b => books.includes(b) || bookOrder.includes(b));
  const bookTag = b => `<i class="${b === 'fanduel' ? 'fd' : b === 'draftkings' ? 'dk' : 'ot'}">${frEsc((PROP_BOOK_SHORT[b] || b).toUpperCase())}</i>`;
  const btn = (map, book, label, bestDec) => {
    const dec = map && map[book];
    if(!dec) return `<span class="pp-btn off">${bookTag(book)}<em>${label}</em><b>--</b></span>`;
    return `<span class="pp-btn ${dec === bestDec ? 'best' : ''}">${bookTag(book)}<em>${label}</em><b>${propAmerican(dec)}</b></span>`;
  };
  const side = (map, label) => {
    const px = bookCols.map(b => (map && map[b]) || 0).filter(Boolean);
    const best = px.length > 1 && Math.max(...px) > Math.min(...px) ? Math.max(...px) : 0;   // gold only when the books differ
    return `<div class="pp-btns">${bookCols.map(b => btn(map, b, label, best)).join('')}</div>`;
  };
  function draw(){
    const gm = gameSel.value, q = slipNorm($('#pp-player').value), alt = $('#pp-alt').checked, ana = $('#pp-ana').checked;
    const list = rows.filter(r => r.stat === curStat && (alt || r.main) && (!gm || r.game === gm) && (!q || slipNorm(r.player).includes(q)));
    const out = $('#pp-table'); out.innerHTML = '';
    if(!list.length){ out.innerHTML = '<div class="empty">No lines match.</div>'; return; }
    const byGame = new Map();
    list.forEach(r => { if(!byGame.has(r.game)) byGame.set(r.game, {game:r.game, kickoff:r.kickoff, rows:[]}); byGame.get(r.game).rows.push(r); });
    const games = [...byGame.values()].sort((a, b) => (new Date(a.kickoff).getTime() || 9e15) - (new Date(b.kickoff).getTime() || 9e15) || a.game.localeCompare(b.game));
    const isTD = curStat === 'Any TD';
    out.innerHTML = `<div class="pp-board">${games.map(g => {
      const w = bpWindow(g.kickoff);
      const when = w && w.day ? `${w.day.slice(0, 3)} ${w.time}` : '';
      g.rows.sort((a, b) => b.lineNum - a.lineNum || a.player.localeCompare(b.player) || (b.main ? 1 : 0) - (a.main ? 1 : 0));
      // With alternates on, keep each player's lines together (main line first), players ordered by their main line.
      if(alt){
        const mainLine = {}; g.rows.forEach(r => { if(r.main) mainLine[slipNorm(r.player)] = r.lineNum; });
        g.rows.sort((a, b) => (mainLine[slipNorm(b.player)] || 0) - (mainLine[slipNorm(a.player)] || 0) || a.player.localeCompare(b.player) || a.lineNum - b.lineNum);
      }
      return `<div class="pp-game"><div class="pp-game-head"><span class="pp-game-title">${frEsc(g.game)}</span><span class="pp-game-time">${frEsc(when)}</span></div>
        <div class="pp-cols"><span>Player</span><span>${isTD ? 'Yes' : 'Over'}</span><span>${isTD ? '' : 'Under'}</span></div>
        ${g.rows.map(r => {
          const lab = isTD ? 'YES' : 'O ' + r.line, labU = 'U ' + r.line;
          const anaHtml = ana ? `<div class="pp-ana">${r.implied !== '' ? `Book ${isTD ? 'yes' : 'over'} <b>${Math.round(r.implied * 100)}%</b>` : ''}${r.est !== '' ? ` &middot; Dashboard <b>${Math.round(r.est * 100)}%</b> (${r.n} games) &middot; gap <b>${r.gap >= 0 ? '+' : ''}${Math.round(r.gap * 100)} pts</b>` : ' &middot; no estimate'}</div>` : '';
          return `<div class="pp-row"><div class="pp-name">${frEsc(r.player)}${r.team ? ` <span class="pp-sub">${frEsc(r.pos)} &middot; ${frEsc(r.team)}</span>` : ''}${alt && !r.main && !isTD ? '<span class="pp-alt-tag">ALT</span>' : ''}</div>
            ${side(r.ob, lab)}${isTD ? '<div></div>' : side(r.ub, labU)}${anaHtml}</div>`;
        }).join('')}</div>`;
    }).join('')}</div>`;
  }
  [gameSel, $('#pp-alt'), $('#pp-ana')].forEach(el => el.addEventListener('change', draw));
  $('#pp-player').addEventListener('input', draw);
  draw();
}



// ---- Book Lines: start from the line the book actually sets, then compare ----
// Same price data as Prop Prices, but only each player's MAIN line (the one priced closest to even money), so you are looking at
// the number the book is really offering rather than a low-paying floor. For every main line it shows the best over and under
// prices, the book's no-margin chance of the over, this app's projection, and the app's own chance of the over. A "lean" appears
// only when the two disagree by a few points, and it is a question to check (injury? weather? game plan?), not a signal.
function blProjection(playerName, stat){
  if(!BP_FLOORS[stat]) return null;
  const key = slipNorm(playerName);
  const games = (DATA.playerGame || []).filter(r => slipNorm(r.Player) === key);
  if(games.length < BP_MIN_PLAYER_GAMES) return null;
  const last = games.reduce((a, b) => num(b.Week) >= num(a.Week) ? b : a);
  const team = last.Team, position = last.Position;
  const wk = (DATA.week2 || []).find(r => r.Team === team);
  if(!wk) return {team, position, opponent:'', vals: games.map(g => getStatValue(g, stat)), pj:null};
  const opp = wk.Opponent;
  const vals = games.map(g => getStatValue(g, stat));
  const l3 = games.slice().sort((a, b) => num(a.Week) - num(b.Week)).slice(-3).map(g => getStatValue(g, stat));
  const defRows = bpDefenseSamples(opp, position, bpMode(), team);
  let pj = null;
  if(defRows.length >= BP_MIN_DEF_SAMPLES){
    const allowed = defRows.reduce((a, r) => a + getStatValue(r, stat), 0) / defRows.length;
    const league = bpLeagueAvg(position, stat, bpMode());
    const defGames = new Set((DATA.playerGame || []).filter(r => r.Opponent === opp).map(r => r.Week)).size;
    const spreadText = (DATA.week2 || []).filter(r => r['Game ID'] === wk['Game ID']).map(r => r.Spread).find(Boolean) || '';
    pj = bpProject(vals, l3.reduce((a, v) => a + v, 0) / l3.length, allowed, league, defGames, stat, bpSpreadFor(team, spreadText) || 0);
  }
  return {team, position, opponent: opp, vals, pj};
}

function renderBookLines(){
  const head = `<div class="panel"><div class="panel-title">Book Lines</div>`;
  if(!propHasData()) return head + `<div class="panel-note">No prop prices loaded yet. They come from the Prop Prices pull, so once that has data this tab fills in too.</div>${propStatusHtml()}</div>`;
  return head + `
    <div class="panel-note" id="bl-note"></div>
    ${propStatusHtml()}
    <div class="controls">
      <label class="ctl-label">Stat <select id="bl-stat"><option value="">All</option></select></label>
      <label class="ctl-label">Game <select id="bl-game"><option value="">All</option></select></label>
      <label class="ctl-label">Player <input type="text" id="bl-player" placeholder="search" style="width:150px;"></label>
      <label class="ctl-label"><input type="checkbox" id="bl-fair" checked> hide short prices (worse than -150)</label>
      <label class="ctl-label"><input type="checkbox" id="bl-lean"> only lines with a lean</label>

function mountBookLines(){
  if(!propHasData()) return;
  const all = DATA.propOdds;
  const fetched = all.map(r => r.fetched).filter(Boolean).sort().pop() || '';
  $('#bl-note').innerHTML = `Only the line the book sets for each player and stat (the one priced closest to even money; alternate lines are left out).
    <b>Book over %</b> is the book's chance of the over with its margin removed. <b>Projection</b> is this app's estimate (season and last-3 form, scaled by how the opponent
    defends that position). <b>Dashboard over %</b> is the app's own chance of clearing the line from the player's and the defense's history, and <b>Gap</b> is that minus the book's
    number, pulled toward zero when only a few games sit behind it. <b>Lean</b> shows up only when the gap is 4 points or more, and <b>Lean price</b> is what the book pays on that side.
    <b>Treat a lean as a question, not a signal:</b> books price in injuries, weather and game plans that box scores do not show, and a few games is a thin sample.
    ${fetched ? `Prices fetched ${fetched.replace('T', ' ').replace('Z', ' UTC')}.` : ''}`;
  const groups = new Map();
  all.forEach(r => {
    if(!r.stat || !r.ou || r.stat === 'Any TD') return;
    if(String(r.active).toLowerCase() === 'false') return;
    const dec = parseFloat(r.decimal_odds); if(!(dec > 1)) return;
    const line = r.line === '' || r.line === undefined ? null : parseFloat(r.line);
    if(line === null || !isFinite(line)) return;
    const k = [slipNorm(r.player), r.stat, line].join('|');
    if(!groups.has(k)) groups.set(k, {player:r.player, stat:r.stat, line, game:r.game, over:[], under:[]});
    (r.ou === 'under' ? groups.get(k).under : groups.get(k).over).push({dec, book:r.book});
  });
  const best = a => a.length ? a.reduce((x, y) => y.dec > x.dec ? y : x) : null;
  const cand = [...groups.values()].map(g => ({g, bo:best(g.over), bu:best(g.under)}));
  // Main line per player + stat: both sides posted beats one-sided, then the over and under closest to even.
  const byPS = new Map();
  cand.forEach(c => { const k = slipNorm(c.g.player) + '|' + c.g.stat; if(!byPS.has(k)) byPS.set(k, []); byPS.get(k).push(c); });
  const mains = [];
  byPS.forEach(list => {
    const score = c => (c.bo && c.bu) ? Math.abs(1 / c.bo.dec - 1 / c.bu.dec) : 1 + Math.abs(((c.bo || c.bu).dec) - 1.91);
    mains.push(list.reduce((a, b) => score(b) < score(a) ? b : a));
  });
  const rows = mains.map(({g, bo, bu}) => {
    const pr = blProjection(g.player, g.stat);
    const t = Number.isInteger(g.line) ? g.line + 1 : g.line + 0.5;
    let est = null, n = null;
    if(pr && pr.opponent){
      const e = estimatePickProbability({player:g.player, position:pr.position, team:pr.team, opponent:pr.opponent, stat:g.stat, threshold:t});
      if(e && e.playerRate.total >= 3){ est = e.probability; n = e.playerRate.total; }
    }
    let nv = null;
    if(bo && bu){
      const bk = g.over.filter(o => g.under.some(u => u.book === o.book)).sort((a, b) => b.dec - a.dec)[0];
      if(bk){ const u = g.under.find(x => x.book === bk.book); nv = (1 / bk.dec) / (1 / bk.dec + 1 / u.dec); }
    }
    const implied = nv !== null ? nv : (bo ? 1 / bo.dec : null);
    const gap = (est !== null && implied !== null) ? (n * est + 4 * implied) / (n + 4) - implied : null;
    const lean = gap !== null && Math.abs(gap) >= 0.04 ? (gap > 0 ? 'Over' : 'Under') : '';
    const lp = lean === 'Over' ? bo : lean === 'Under' ? bu : null;
    const proj = pr && pr.pj ? pr.pj.proj : null;
    const hit = pr ? `${pr.vals.filter(v => v > g.line).length}/${pr.vals.length}` : '';
    const fmtP = p => p ? `${propAmerican(p.dec)} ${PROP_BOOK_SHORT[p.book] || p.book}` : '--';
    return {player:g.player, team: pr ? pr.team : '', opp: pr ? pr.opponent : '', stat:g.stat, line:g.line, game:g.game,
      over: bo ? bo.dec : '', overTxt: fmtP(bo), under: bu ? bu.dec : '', underTxt: fmtP(bu),
      implied: implied === null ? '' : implied, proj: proj === null ? '' : proj, diff: proj === null ? '' : proj - g.line,
      est: est === null ? '' : est, n: n === null ? '' : n, hit, gap: gap === null ? '' : gap, lean,
      leanDec: lp ? lp.dec : '', leanTxt: lean ? fmtP(lp) : '--'};
  });
  const statSel = $('#bl-stat'), gameSel = $('#bl-game');
  [...new Set(rows.map(r => r.stat))].sort().forEach(x => statSel.insertAdjacentHTML('beforeend', `<option>${frEsc(x)}</option>`));
  [...new Set(rows.map(r => r.game))].sort().forEach(x => gameSel.insertAdjacentHTML('beforeend', `<option>${frEsc(x)}</option>`));
  const cols = [
    {key:'player', label:'Player'}, {key:'team', label:'Team'}, {key:'opp', label:'Opp'}, {key:'stat', label:'Stat'},
    {key:'line', label:'Book line', numeric:true},
    {key:'over', label:'Over', numeric:true, render:(v, r) => r.overTxt}, {key:'under', label:'Under', numeric:true, render:(v, r) => r.underTxt},
    {key:'implied', label:'Book over %', numeric:true, render:v => v === '' ? '--' : Math.round(v * 100) + '%'},
    {key:'proj', label:'Projection', numeric:true, render:v => v === '' ? '--' : fmt(v)},
    {key:'diff', label:'Proj vs line', numeric:true, render:v => v === '' ? '--' : `<span style="color:${v >= 0 ? 'var(--mint)' : 'var(--red)'};">${v >= 0 ? '+' : ''}${fmt(v)}</span>`},
    {key:'est', label:'Dashboard over %', numeric:true, render:v => v === '' ? '--' : Math.round(v * 100) + '%'},
    {key:'hit', label:'Own games over', render:v => v || '--'},
    {key:'gap', label:'Gap', numeric:true, render:v => v === '' ? '--' : `<span style="color:var(--chalk-dim);">${v >= 0 ? '+' : ''}${Math.round(v * 100)} pts</span>`},
    {key:'lean', label:'Lean', render:v => v ? `<b style="color:var(--gold);">${v}</b>` : '<span style="color:var(--chalk-dim);">--</span>'},
    {key:'leanDec', label:'Lean price', numeric:true, render:(v, r) => r.leanTxt},
    {key:'game', label:'Game'},
  ];
  function draw(){
    const st = statSel.value, gm = gameSel.value, q = slipNorm($('#bl-player').value), fair = $('#bl-fair').checked, onlyLean = $('#bl-lean').checked;
    const list = rows.filter(r => (!st || r.stat === st) && (!gm || r.game === gm) && (!q || slipNorm(r.player).includes(q)) && (!onlyLean || r.lean)
      && (!fair || (r.lean ? r.leanDec >= 1.67 : ((r.over === '' || r.over >= 1.67) && (r.under === '' || r.under >= 1.67)))));
    $('#bl-table').innerHTML = '';
    if(!list.length){ $('#bl-table').innerHTML = '<div class="empty">No lines match.</div>'; return; }
    buildTable($('#bl-table'), cols, list, {defaultSort:'gap', defaultDir:'desc', limit:500});
  }
  [statSel, gameSel, $('#bl-fair'), $('#bl-lean')].forEach(el => el.addEventListener('change', draw));
  $('#bl-player').addEventListener('input', draw);
  draw();
}

// ---- Schedule Load: rest days and "3 games in X days" ----
// For every team-game: rest = days since the previous game; span3 = days from two games ago to this game (a normal
// run of three Sundays is 14; Sunday, Sunday, Thursday is 11). Dates come from the team-week file (played) and the
// upcoming-matchups file (not played yet); scores from game_team_stats when it exists.
let _restCache = {key:null, val:null};
function restDay(s){
  const str = String(s || '');
  if(!str) return null;
  const ts = str.length <= 10 ? Date.parse(str + 'T12:00:00Z') : Date.parse(str);
  if(isNaN(ts)) return null;
  // Kickoffs are stored in UTC; shift to US time so a Thursday night game stays a Thursday.
  const d = new Date(str.length <= 10 ? ts : ts - 5 * 3600 * 1000);
  return Math.floor(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) / 86400000);
}
function restModel(){
  const key = [DATA.teamWeek, DATA.week2, DATA.gameTeamStats];
  if(_restCache.key && _restCache.key.every((k, i) => k === key[i])) return _restCache.val;
  const scores = new Map();
  (DATA.gameTeamStats || []).forEach(r => { if(r['Final Score'] !== undefined && r['Final Score'] !== '') scores.set(r['Game ID'] + '|' + r.Team, {pf:num(r['Final Score']), pa:num(r['Opponent Score'])}); });
  const byTeam = {}, seen = new Set();
  const push = (r, done) => {
    const day = restDay(r.Date); if(day === null) return;
    const id = r['Game ID'] + '|' + r.Team; if(seen.has(id)) return; seen.add(id);
    const sc = done ? scores.get(id) : null;
    (byTeam[r.Team] = byTeam[r.Team] || []).push({id:r['Game ID'], team:r.Team, opp:r.Opponent, week:num(r.Week), day, done, pf:sc ? sc.pf : null, pa:sc ? sc.pa : null, ha:r['Home/Away'] || ''});
  };
  (DATA.teamWeek || []).forEach(r => push(r, true));
  (DATA.week2 || []).forEach(r => push(r, false));
  const games = [];
  Object.values(byTeam).forEach(list => {
    list.sort((a, b) => a.day - b.day || a.week - b.week);
    list.forEach((g, i) => {
      g.rest = i > 0 ? g.day - list[i - 1].day : null;
      g.span3 = i > 1 ? g.day - list[i - 2].day : null;
      g.afterBye = g.rest !== null && g.rest >= 13;
      g.thursday = new Date(g.day * 86400000).getUTCDay() === 4;
      games.push(g);
    });
  });
  // Record entering each game, from games with scores that were played earlier.
  const rec = (team, beforeDay) => {
    let w = 0, n = 0;
    (byTeam[team] || []).forEach(g => { if(g.done && g.pf !== null && g.day < beforeDay){ n++; w += g.pf > g.pa ? 1 : (g.pf === g.pa ? 0.5 : 0); } });
    return {w, n};
  };
  const lookup = {};
  games.forEach(g => { lookup[g.id + '|' + g.team] = g; });
  games.forEach(g => {
    const o = rec(g.opp, g.day); g.oppN = o.n; g.oppPct = o.n ? o.w / o.n : null;
    const og = lookup[g.id + '|' + g.opp]; g.oppRest = og ? og.rest : null; g.oppSpan3 = og ? og.span3 : null;
  });
  const val = {games, byTeam};
  _restCache = {key, val};
  return val;
}
function restTier(span3, thr){ return span3 === null ? '' : (span3 <= thr ? 'compressed' : 'normal'); }
function renderRest(){
  return `<div class="panel"><div class="panel-title">Schedule Load</div>
    <div class="panel-note">Tests the idea that a team playing <b>three games in about 12 days</b> (a Thursday game after two Sundays, or Monday, Sunday, Thursday) plays worse, especially against weak teams.
    For every team-game it counts the days from two games ago to this one: 14 is a normal run of three Sundays, 11 is Sunday, Sunday, Thursday. Part one shows who is compressed this week. Part two
    checks the idea on this season's finished games.</div>
    <div class="controls"><label class="ctl-label">Count as compressed when the last three games fit in
      <select id="rest-thr"><option value="11">11 days or fewer</option><option value="12" selected>12 days or fewer</option><option value="13">13 days or fewer</option></select></label></div>
  </div>
  <div class="panel" id="rest-upcoming"></div>
  <div class="panel" id="rest-test"></div>`;
}
function mountRest(){
  const thrEl = $('#rest-thr');
  function draw(){
    const thr = parseInt(thrEl.value, 10);
    const {games} = restModel();
    // ---- part 1: the upcoming slate ----
    const up = games.filter(g => !g.done);
    const wk = up.length ? Math.min(...up.map(g => g.week)) : null;
    const slate = up.filter(g => g.week === wk);
    const seenGame = new Set(), rows = [];
    slate.forEach(g => { if(seenGame.has(g.id)) return; seenGame.add(g.id); const o = slate.find(x => x.id === g.id && x.team === g.opp); rows.push([g, o]); });
    const cell = g => g ? `${g.rest === null ? '--' : g.rest + 'd rest'}${g.afterBye ? ' (bye)' : ''}${g.thursday ? ' &middot; Thu' : ''}<br><span style="color:var(--chalk-dim);">${g.span3 === null ? 'under 3 games' : '3 games in ' + g.span3 + 'd'}</span>` : '--';
    const flag = g => g && g.span3 !== null && g.span3 <= thr ? ' <b style="color:var(--gold);">compressed</b>' : '';
    $('#rest-upcoming').innerHTML = `<div class="panel-title">${wk ? 'Week ' + wk + ' slate' : 'Upcoming slate'}</div>` + (rows.length ? `<div class="table-scroll"><table><thead><tr><th>Game</th><th>Away</th><th>Home</th><th>Rest edge</th></tr></thead><tbody>${rows.map(([a, b]) => {
      const away = a.ha === 'Away' ? a : b, home = a.ha === 'Away' ? b : a;
      const edge = away && home && away.rest !== null && home.rest !== null ? home.rest - away.rest : null;
      return `<tr><td>${away ? teamChip(away.team) : ''} @ ${home ? teamChip(home.team) : ''}</td><td>${cell(away)}${flag(away)}</td><td>${cell(home)}${flag(home)}</td>
        <td>${edge === null ? '--' : edge === 0 ? 'even' : (edge > 0 ? teamName(home.team) : teamName(away.team)) + ' +' + Math.abs(edge) + 'd'}</td></tr>`; }).join('')}</tbody></table></div>` : '<div class="empty">No upcoming games loaded.</div>');
    // ---- part 2: this season's finished games ----
    const done = games.filter(g => g.done && g.pf !== null && g.span3 !== null && !g.afterBye);
    const BAD = 0.4;
    const bucket = (list) => {
      const n = list.length, w = list.filter(g => g.pf > g.pa).length, l = list.filter(g => g.pf < g.pa).length;
      const margin = n ? list.reduce((a, g) => a + (g.pf - g.pa), 0) / n : 0;
      const bad = list.filter(g => g.oppPct !== null && g.oppN >= 2 && g.oppPct <= BAD);
      const badLost = bad.filter(g => g.pf < g.pa).length;
      return {n, w, l, margin, bad: bad.length, badLost, winPct: n ? w / n : 0};
    };
    const comp = bucket(done.filter(g => restTier(g.span3, thr) === 'compressed')), norm = bucket(done.filter(g => restTier(g.span3, thr) === 'normal'));
    const pctTxt = (h, n) => { if(!n) return '--'; const [lo, hi] = btWilson(h, n); return `${Math.round(h / n * 100)}% <span style="color:var(--chalk-dim);">(${Math.round(lo * 100)}-${Math.round(hi * 100)}%)</span>`; };
    const row = (label, b) => `<tr><td>${label}</td><td class="num">${b.n}</td><td class="num">${b.w}-${b.l}</td><td class="num">${pctTxt(b.w, b.n)}</td><td class="num">${b.n ? (b.margin >= 0 ? '+' : '') + b.margin.toFixed(1) : '--'}</td>
      <td class="num">${b.bad}</td><td class="num">${b.bad ? b.badLost + ' (' + pctTxt(b.badLost, b.bad) + ')' : '--'}</td></tr>`;
    // Does the rest edge matter on its own? Short rest against an opponent with 3+ more days.
    const shortVs = done.filter(g => g.rest !== null && g.oppRest !== null && g.oppRest - g.rest >= 3), evenOrBetter = done.filter(g => g.rest !== null && g.oppRest !== null && g.oppRest - g.rest < 3);
    const sv = bucket(shortVs), eb = bucket(evenOrBetter);
    let verdict = '';
    if(comp.n < 15) verdict = `Only ${comp.n} compressed team-games have finished so far, which is far too few to say anything either way. Check back as the season goes on.`;
    else if(comp.n && norm.n){
      const [cl, ch] = btWilson(comp.w, comp.n), [nl, nh] = btWilson(norm.w, norm.n);
      const overlap = !(ch < nl || nh < cl);
      verdict = overlap ? `Compressed teams are ${comp.w}-${comp.l} and rested teams ${norm.w}-${norm.l}. The ranges overlap, so this season's results do not separate the two groups.`
        : `Compressed teams are ${comp.w}-${comp.l} against ${norm.w}-${norm.l} for rested teams, and the ranges do not overlap. That is worth watching, but one season is still a small sample.`;
    }
    $('#rest-test').innerHTML = `<div class="panel-title">Does it show up in this season's results?</div>
      <div class="panel-note">Finished games only, from each team's third game on, leaving out games right after a bye. "Weak opponent" means the other team's record coming into that game was ${Math.round(BAD * 100)}% or worse after at least two games.
      Ranges are 95% confidence ranges; wide ranges mean the sample is small.</div>
      <div class="player-preview-stats"><b>Read:</b> ${verdict || 'Not enough finished games with scores yet. Scores come from the game stats file.'}</div>
      <div class="table-scroll"><table><thead><tr><th>Group</th><th class="num">Games</th><th class="num">Record</th><th class="num">Win % (range)</th><th class="num">Avg margin</th><th class="num">Vs weak teams</th><th class="num">Lost to a weak team</th></tr></thead><tbody>
        ${row('Compressed (' + thr + ' days or fewer)', comp)}${row('Normal (more than ' + thr + ' days)', norm)}</tbody></table></div>
      <div class="table-scroll" style="margin-top:12px;"><table><thead><tr><th>Rest vs. opponent</th><th class="num">Games</th><th class="num">Record</th><th class="num">Win % (range)</th><th class="num">Avg margin</th><th class="num">Vs weak teams</th><th class="num">Lost to a weak team</th></tr></thead><tbody>
        ${row('3+ fewer rest days than the opponent', sv)}${row('Even, or less than 3 days behind', eb)}</tbody></table></div>
      <div class="line-note">Caveats: the teams that end up compressed are not a random sample (Thursday games go to particular teams), the same few games count twice (once for each side), and who the opponent is matters more than rest in most games. Treat this as a prompt to look, not a rule.</div>`;
  }
  thrEl.addEventListener('change', draw);
  draw();
}

// "Active" status entries in the injury feed aren't actually injury

const ESPN_SCOREBOARD_URL = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';
let liveScoreboardTimer = null;
let liveScoreboardWorked = false;

async function fetchLiveScoreboard(){
  const res = await fetch(ESPN_SCOREBOARD_URL);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  return (data.events || []).map(ev=>{
    const comp = (ev.competitions || [])[0] || {};
    const competitors = comp.competitors || [];
    const home = competitors.find(c=>c.homeAway==='home') || {};
    const away = competitors.find(c=>c.homeAway==='away') || {};
    const statusType = (ev.status || {}).type || {};
    return {
      date: ev.date,
      homeAbbr: (home.team || {}).abbreviation || '?',
      awayAbbr: (away.team || {}).abbreviation || '?',
      homeScore: home.score,
      awayScore: away.score,
      state: statusType.state,           // 'pre' | 'in' | 'post'
      detail: statusType.shortDetail,     // e.g. "Sun 1:00 PM", "Final", "Q3 4:15"
    };
  });
}

function renderTicker(){
  fetchLiveScoreboard().then(games=>{
    liveScoreboardWorked = true;
    renderTickerGames(games, {live:true});
    if(!liveScoreboardTimer){
      // Re-poll every 60s so in-progress games actually update while the page is open.
      liveScoreboardTimer = setInterval(()=>{
        fetchLiveScoreboard().then(g=>renderTickerGames(g, {live:true})).catch(()=>{});
      }, 60000);
    }
  }).catch(err=>{
    // Browser blocked the cross-origin call (or it's offline) -- fall back
    // to the static CSV matchups so the panel still shows something useful.
    console.warn('Live ESPN scoreboard unavailable, falling back to CSV data:', err);
    renderTickerFromCSV();
  });
}

function renderTickerFromCSV(){
  const track = $('#ticker-track');

    track.innerHTML = '<div class="ticker-empty">No upcoming matchups loaded yet.</div>';

// Jump to a game's details. If it's the week being previewed on Upcoming
// Matchups, reuse that tab's existing rich card (players, EPA, injuries,
// milestones, odds) instead of building a second view that could drift
// out of sync with it. Otherwise (this week's live/just-finished games,
// which Upcoming Matchups doesn't cover since it only previews the NEXT
// week), navigate to the dedicated Live Matchups tab instead.
// Live Matchups is one tab with two views: real-time games ("now") and the
// pipeline's completed-week recaps ("recap"). liveHubModePreset lets a ticker
// click open the right view; liveHubMode remembers the last one you used.
let liveHubMode = 'now';
let liveHubModePreset = null;
let pendingHighlightGame = null; // {away, home} -- consumed once by mountLive after navigating there

function goToGameDetails(away, home, state){
  if(!away || !home || away==='?' || home==='?') return;

  // A game that's underway (or just finished) but isn't in the daily
  // pipeline data yet only exists in ESPN's live feed -- send it to Live Now.
  const inPipeline = (DATA.teamWeek || []).some(r=>
    (r.Team===away && r.Opponent===home) || (r.Team===home && r.Opponent===away)
  );
  if((state === 'in' || state === 'post') && !inPipeline){
    pendingHighlightGame = {away, home};
    liveHubModePreset = 'now';
    showTab('live');
    return;
  }

  const week2Match = (DATA.week2 || []).some(r=>
    (r.Team===away && r.Opponent===home) || (r.Team===home && r.Opponent===away)
  );

  if(week2Match){
    showTab('week2');
    const card = document.querySelector(`.matchup-card[data-away="${away}"][data-home="${home}"]`);
    if(card){
      card.scrollIntoView({behavior:'smooth', block:'center'});
      card.classList.remove('card-highlight');
      void card.offsetWidth; // restart the CSS animation if clicked twice in a row
      card.classList.add('card-highlight');
    }
    return;
  }

  pendingHighlightGame = {away, home};
  liveHubModePreset = 'recap';
  showTab('live');
}

function singleGameStatLine(row){
  const parts = [];
  if(num(row['Pass Attempts']) > 0) parts.push(`${row['Pass Completions']}/${row['Pass Attempts']}, ${row['Pass Yards']} yds, ${row['Pass TD']} TD${num(row['Interceptions'])>0 ? `, ${row['Interceptions']} INT` : ''}`);
  if(num(row['Rush Attempts']) > 0) parts.push(`${row['Rush Attempts']} car, ${row['Rush Yards']} yds${num(row['Rush TD'])>0 ? `, ${row['Rush TD']} TD` : ''}`);
  if(num(row['Receptions']) > 0 || num(row['Receiving Yards']) > 0) parts.push(`${row['Receptions']} rec, ${row['Receiving Yards']} yds${num(row['Receiving TD'])>0 ? `, ${row['Receiving TD']} TD` : ''}`);
  return parts.join(' &middot; ') || 'No stats';
}

// Small, self-contained versions of the Upcoming Matchups tab's injury/
// milestone badges -- those live inside that tab's own closure, so this
// tab needs its own copies rather than reaching into another tab's internals.
function injuryBadgeSimple(team){
  const rows = (DATA.injuries || []).filter(r=>r.Team===team && isRelevantInjury(r));
  if(!rows.length) return '';
  const outCount = rows.filter(r=>/out|doubtful/i.test(r.Status || '')).length;
  const names = rows.map(r=>`${r.Player} (${r.Status})`).join(', ');
  return `<span class="context-chip" style="${outCount ? 'color:var(--red);' : ''}" title="${names}">${rows.length} injur${rows.length===1?'y':'ies'}${outCount ? ` &middot; ${outCount} OUT` : ''}</span>`;
}
function milestoneBadgeSimple(player){
  const entries = (DATA.milestones || []).filter(m=>m.Player===player);
  const close = entries.filter(m => num(m.Remaining) <= (MILESTONE_STEP_JS[m.Stat] || 50) * MILESTONE_CLOSE_FRACTION);
  if(!close.length) return '';
  const m = close.reduce((closest, e) => (!closest || num(e.Remaining) < num(closest.Remaining)) ? e : closest, null);
  return `<span class="milestone-badge">&#127919; ${num(m.Remaining)} ${m.Stat} from ${m.Milestone}</span>`;
}

  if(!weeks.length){
    $('#live-grid').innerHTML = '<div class="empty">No games logged yet.</div>';
    weekSelect.innerHTML = '';
    return;
  }

  const defaultWeek = pendingHighlightGame
    ? (() => {
        const row = (DATA.teamWeek || []).find(r =>
          (r.Team===pendingHighlightGame.away && r.Opponent===pendingHighlightGame.home) ||
          (r.Team===pendingHighlightGame.home && r.Opponent===pendingHighlightGame.away)
        );
        return row ? num(row.Week) : weeks[weeks.length-1];
      })()
    : weeks[weeks.length-1];

  weekSelect.innerHTML = weeks.map(w=>`<option value="${w}" ${w===defaultWeek?'selected':''}>Week ${w}</option>`).join('');

  // Simple fallback recap (box score list) -- used only when the detailed
  // per-game stats (10_game_stats.py, an optional extra data source)
  // haven't been generated yet for this game.
  function simpleSideRecap(team, oppTeam, week){
    const players = (DATA.playerGame || []).filter(r=>r.Team===team && num(r.Week)===week);
    const totalYds = p => num(p['Pass Yards']) + num(p['Rush Yards']) + num(p['Receiving Yards']);
    const sorted = [...players].sort((a,b)=> totalYds(b) - totalYds(a)).slice(0, 6);
    return `
      <div class="matchup-side-label"><b>${team}</b> box score vs <b>${oppTeam}</b></div>
      ${injuryBadgeSimple(team) ? `<div class="context-row">${injuryBadgeSimple(team)}</div>` : ''}
      ${sorted.length ? sorted.map(p=>`
        <div class="player-preview">
          <div class="player-preview-head">
            <span class="player-preview-name">${p.Player}</span>
            <span class="player-preview-pos">${p.Position}</span>
          </div>
          <div class="player-preview-stats">${singleGameStatLine(p)}</div>
          ${milestoneBadgeSimple(p.Player)}
        </div>`).join('') : '<div class="empty" style="padding:8px 0;">No stats logged for this game.</div>'}
    `;
  }

  // QB Performance mini-card -- text only, no headshots.
  function qbCard(team, week){
    const qbs = (DATA.gameQbStats || []).filter(r=>r.Team===team && num(r.Week)===week);
    if(!qbs.length) return '';
    const qb = qbs.reduce((best, r) => (!best || num(r.Attempts) > num(best.Attempts)) ? r : best, null);
    return `
      <div class="qb-card">
        <div class="qb-card-name">${qb.Player} <span class="player-preview-pos">${team}</span></div>
        <div class="qb-card-line">${qb.Completions}/${qb.Attempts}, ${qb['Pass Yards']} yds, ${qb['Pass TD']} TD, ${qb.Interceptions} INT</div>
        ${num(qb['Rush Attempts']) > 0 ? `<div class="qb-card-line">${qb['Rush Attempts']} car, ${qb['Rush Yards']} rush yds${num(qb['Rush TD'])>0 ? `, ${qb['Rush TD']} rush TD` : ''}</div>` : ''}
        <div class="qb-card-line">Rating: <b style="color:var(--chalk);">${qb['Passer Rating']}</b> &middot; EPA/play: <b style="color:var(--chalk);">${qb['EPA/Play']}</b></div>
      </div>`;
  }

  // Detailed team-stats comparison table -- one row per stat, one column
  // per team. Only shown when 10_game_stats.py has run for this game.
  function statsTable(awayStats, homeStats, awayTeam, homeTeam){
    const rows = [
      ['Total Yards', s=>s['Total Yards']],
      ['Total Plays', s=>s['Total Plays']],
      ['EPA/Play', s=>fmt(s['EPA/Play'],3)],
      ['Pass Yards', s=>s['Pass Yards']],
      ['Comp/Att', s=>`${s['Pass Completions']}/${s['Pass Attempts']}`],
      ['EPA/Pass', s=>fmt(s['EPA/Pass'],3)],
      ['Rush Yards', s=>s['Rush Yards']],
      ['Rush Attempts', s=>s['Rush Attempts']],
      ['EPA/Rush', s=>fmt(s['EPA/Rush'],3)],
      ['1st Downs', s=>s['First Downs']],
      ['3rd Down', s=>`${s['Third Down Conversions']}/${s['Third Down Attempts']}`],
      ['Turnovers', s=>num(s['Interceptions Thrown'])+num(s['Fumbles Lost'])],
      ['Sacks Taken', s=>`${s['Sacks Taken']} (${s['Sack Yards']} yds)`],
      ['Penalties', s=>`${s['Penalties']} (${s['Penalty Yards']} yds)`],
    ];
    return `
      <table class="game-stats-table">
        <thead><tr><th></th><th>${awayTeam}</th><th>${homeTeam}</th></tr></thead>
        <tbody>
          ${rows.map(([label, fn])=>`<tr><td>${label}</td><td>${fn(awayStats)}</td><td>${fn(homeStats)}</td></tr>`).join('')}
        </tbody>
      </table>`;
  }

  // Player log: one card per position group (QB, RB, WR, TE), each a
  // clean bounded box with its own heading and only the columns relevant
  // to that position -- no irrelevant zero columns, and each group reads
  // as a clear, contained section instead of floating text + table.
  const LOG_POSITIONS = ['QB','RB','WR','TE'];

  function teamPlayerLogShell(team, oppTeam, gid){
    return `
      <div class="matchup-side-label"><b>${team}</b> player log vs <b>${oppTeam}</b></div>
      ${injuryBadgeSimple(team) ? `<div class="context-row">${injuryBadgeSimple(team)}</div>` : ''}
      <div id="live-log-${gid}-${team}"></div>
    `;
  }

  function populatePlayerLog(containerId, team, week){
    const container = document.getElementById(containerId);
    if(!container) return;

    const players = (DATA.playerGame || []).filter(r=>
      r.Team===team && num(r.Week)===week && LOG_POSITIONS.includes(r.Position)
    );
    const groups = LOG_POSITIONS
      .map(pos=>({pos, rows: players.filter(p=>p.Position===pos)}))
      .filter(g=>g.rows.length);

    if(!groups.length){
      container.innerHTML = '<div class="empty" style="padding:8px 0;">No stats logged for this game.</div>';
      return;
    }

    container.innerHTML = groups.map(g=>`
      <div class="log-pos-group">
        <div class="log-pos-label">${g.pos}</div>
        <div id="${containerId}-${g.pos}"></div>
      </div>
    `).join('');

    groups.forEach(g=>{
      const cols = [{key:'Player', label:'Player'}, ...MATCHUP_COLS[g.pos]];
      buildTable(
        document.getElementById(`${containerId}-${g.pos}`),
        cols, g.rows,
        {defaultSort: MATCHUP_COLS[g.pos][0].key, defaultDir:'desc'}
      );
    });
  }

  function apply(){
    const week = num(weekSelect.value);

    // Pair team_week rows into games by Game ID -- each game has exactly
    // two team rows (one per side). This is the core, always-available
    // data source for "what games exist this week."
    const byGame = new Map();
    (DATA.teamWeek || []).filter(r=>num(r.Week)===week).forEach(r=>{
      const gid = r['Game ID'];
      if(!gid) return;
      if(!byGame.has(gid)) byGame.set(gid, []);
      byGame.get(gid).push(r);
    });

    const games = [...byGame.entries()]
      .filter(([, rows]) => rows.length === 2)
      .map(([gid, rows]) => ({gid, teamA: rows[0].Team, teamB: rows[1].Team}));

    $('#live-grid').innerHTML = games.length ? games.map(g=>{
      // Detailed stats use nflverse's own game IDs, a different format
      // from ESPN's -- match by Team + Week instead, which both share.
      const statsA = (DATA.gameTeamStats || []).find(r=>r.Team===g.teamA && num(r.Week)===week);
      const statsB = (DATA.gameTeamStats || []).find(r=>r.Team===g.teamB && num(r.Week)===week);
      const hasDetail = statsA && statsB;

      const scoreHtml = hasDetail
        ? `<div class="matchup-time">${statsA['Final Score']} &ndash; ${statsB['Final Score']}</div>`
        : `<div class="matchup-time">WEEK ${week}</div>`;

      return `
      <div class="matchup-card" data-away="${g.teamA}" data-home="${g.teamB}">
        <div class="matchup-head">
          <div class="matchup-teams">${teamName(g.teamA)}<span class="at">@</span>${teamName(g.teamB)}</div>
          ${scoreHtml}
        </div>
        ${hasDetail ? `
        <div class="live-card-columns">
          <div class="live-stats-col">
            <div class="qb-card-row">
              ${qbCard(g.teamA, week)}
              ${qbCard(g.teamB, week)}
            </div>
            <div class="table-scroll">${statsTable(statsA, statsB, g.teamA, g.teamB)}</div>
          </div>
          <div class="live-playerlog-col">
            <div class="matchup-body">
              <div class="matchup-side">${teamPlayerLogShell(g.teamA, g.teamB, g.gid)}</div>
              <div class="matchup-side">${teamPlayerLogShell(g.teamB, g.teamA, g.gid)}</div>
            </div>
          </div>
        </div>
        ` : `
        <div class="matchup-body">
          <div class="matchup-side">${simpleSideRecap(g.teamA, g.teamB, week)}</div>
          <div class="matchup-side">${simpleSideRecap(g.teamB, g.teamA, week)}</div>
        </div>`}
      </div>`;
    }).join('') : '<div class="empty">No games logged for this week yet.</div>';

    // Populate every game's player-log tables now that their placeholder
    // divs exist in the DOM (always shown now, no flip needed).
    games.forEach(g=>{
      const statsA = (DATA.gameTeamStats || []).find(r=>r.Team===g.teamA && num(r.Week)===week);
      const statsB = (DATA.gameTeamStats || []).find(r=>r.Team===g.teamB && num(r.Week)===week);
      if(!statsA || !statsB) return;
      populatePlayerLog(`live-log-${g.gid}-${g.teamA}`, g.teamA, week);
      populatePlayerLog(`live-log-${g.gid}-${g.teamB}`, g.teamB, week);
    });

    // Consume any pending highlight request from a ticker click -- match
    // either team order since team_week doesn't track true home/away.
    if(pendingHighlightGame){
      const {away, home} = pendingHighlightGame;
      const card = document.querySelector(
        `.matchup-card[data-away="${away}"][data-home="${home}"], .matchup-card[data-away="${home}"][data-home="${away}"]`
      );
      if(card){
        card.scrollIntoView({behavior:'smooth', block:'center'});
        card.classList.remove('card-highlight');
        void card.offsetWidth;
        card.classList.add('card-highlight');
      }
      pendingHighlightGame = null;
    }
  }

  weekSelect.addEventListener('change', apply);
  apply();
}

// ---------- helpers ----------
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function fmt(v, d=1){ const n = num(v); return Number.isInteger(n) ? n.toString() : n.toFixed(d); }
function teamChip(t){ return `<span class="team-chip">${teamName(t)}</span>`; }
function heatColor(rank, max){
  // rank 1 = best matchup (most points allowed) -> mint green, rank max = tough matchup -> coral
  const pct = 1 - ((rank-1)/(max-1||1));
  const good = [51,214,166];   // mint
  const bad  = [255,92,108];   // coral
  const r = Math.round(bad[0] + (good[0]-bad[0])*pct);
  const g = Math.round(bad[1] + (good[1]-bad[1])*pct);
  const b = Math.round(bad[2] + (good[2]-bad[2])*pct);
  return `background:rgba(${r},${g},${b},0.22);border:1px solid rgba(${r},${g},${b},0.6);color:var(--chalk);`;
}

let charts = {};
function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }

// generic sortable table builder
function buildTable(container, columns, rows, opts={}){
  const state = container._sortState || {key: opts.defaultSort || columns[0].key, dir: opts.defaultDir || 'desc'};
  container._sortState = state;
  let sorted = [...rows].sort((a,b)=>{
    let av = a[state.key], bv = b[state.key];
    const an = parseFloat(av), bn = parseFloat(bv);
    const isNum = !isNaN(an) && !isNaN(bn) && av !== '' && bv !== '';
    let cmp;
    if(isNum) cmp = an - bn; else cmp = String(av).localeCompare(String(bv));
    return state.dir === 'asc' ? cmp : -cmp;
  });
  if(opts.limit) sorted = sorted.slice(0, opts.limit);

  const thead = columns.map(c=>{
    let cls = '';
    if(c.key === state.key) cls = state.dir === 'asc' ? 'sorted-asc' : 'sorted';
    return `<th class="${cls}" data-key="${c.key}" style="${c.numeric?'text-align:right':''}">${c.label}</th>`;
  }).join('');

  let bandPrev, bandFlip = false;
  const tbody = sorted.map(row=>{
    let trCls = '';
    if(opts.bandBy){
      const v = row[opts.bandBy];
      if(bandPrev !== undefined && v !== bandPrev) bandFlip = !bandFlip;
      bandPrev = v;
      trCls = bandFlip ? 'wk-band-b' : 'wk-band-a';
    }
    return `<tr${trCls ? ` class="${trCls}"` : ''}>` + columns.map(c=>{
      const raw = row[c.key];
      const val = c.render ? c.render(raw, row) : raw;
      return `<td class="${c.numeric?'num':''}">${val}</td>`;
    }).join('') + '</tr>';
  }).join('');

  // Optional totals-style footer: opts.footer = {labelSpan, label, cells:[...]}.
  const tfoot = (opts.footer && sorted.length)
    ? `<tfoot><tr class="tfoot-row"><td colspan="${opts.footer.labelSpan}">${opts.footer.label}</td>${opts.footer.cells.map(c=>`<td class="num">${c}</td>`).join('')}</tr></tfoot>`
    : '';

  container.innerHTML = `<div class="table-scroll"><table><thead><tr>${thead}</tr></thead><tbody>${tbody || `<tr><td colspan="${columns.length}" class="empty">No rows match your filters.</td></tr>`}</tbody>${tfoot}</table></div>`;

  $$('th', container).forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.key;
      if(state.key === key){ state.dir = state.dir === 'asc' ? 'desc' : 'asc'; }
      else { state.key = key; state.dir = 'desc'; }
      buildTable(container, columns, rows, opts);
    });
  });

  // Sorting rebuilds this table's HTML, which discards any click handlers
  // attached to buttons/selects inside it. Callers that put controls in the
  // table pass onRender so they get re-wired after EVERY render, including
  // the ones triggered by clicking a column header.
  if(opts.onRender) opts.onRender(container);
}

// ---------- TAB: OVERVIEW ----------
function renderOverview(){
  const ts = DATA.teamSummary;
  const topOff = [...ts].sort((a,b)=>num(b['Offensive Yards Per Game'])-num(a['Offensive Yards Per Game']))[0];
  const topDef = [...ts].sort((a,b)=>num(a['Offensive Yards Allowed Per Game'])-num(b['Offensive Yards Allowed Per Game']))[0];
  const topPasser = [...DATA.playerGame].sort((a,b)=>num(b['Pass Yards'])-num(a['Pass Yards']))[0];
  const topRusher = [...DATA.playerGame].sort((a,b)=>num(b['Rush Yards'])-num(a['Rush Yards']))[0];

  return `
  <div class="stat-row">
    <div class="stat-card"><div class="label">Top Offense (Yds/G)</div><div class="value">${teamName(topOff.Team)} <span>${fmt(topOff['Offensive Yards Per Game'])}</span></div></div>
    <div class="stat-card"><div class="label">Stingiest Defense (Yds Allowed/G)</div><div class="value">${teamName(topDef.Team)} <span>${fmt(topDef['Offensive Yards Allowed Per Game'])}</span></div></div>
    <div class="stat-card"><div class="label">Most Pass Yds (Single Game)</div><div class="value">${topPasser.Player} <span class="player-preview-pos">${topPasser.Team}</span> <span>${fmt(topPasser['Pass Yards'])} yds</span></div></div>
    <div class="stat-card"><div class="label">Most Rush Yds (Single Game)</div><div class="value">${topRusher.Player} <span class="player-preview-pos">${topRusher.Team}</span> <span>${fmt(topRusher['Rush Yards'])} yds</span></div></div>
  </div>
  <div class="grid-2">
    <div class="panel">
      <div class="panel-title">Offense vs Defense — Yards Per Game</div>
      <div class="panel-note">Each dot is a team. Bottom-right = explosive offense facing a leaky defense.</div>
      <canvas id="chart-overview-scatter" height="260"></canvas>
    </div>
    <div class="panel">
      <div class="panel-title">Top 10 Single-Game Performances</div>
      <div class="panel-note" id="overview-top-note">Combined rush + receiving + passing yards, across all positions.</div>
      <div class="controls" style="margin-bottom:12px;">
        <div class="pill-group" id="overview-top-pos-pills">
          <span class="pill active" data-pos="">ALL</span>
          <span class="pill" data-pos="QB">QB</span>
          <span class="pill" data-pos="RB">RB</span>
          <span class="pill" data-pos="WR">WR</span>
          <span class="pill" data-pos="TE">TE</span>
        </div>
        <select id="overview-top-stat">
          <option value="total">Total Yards</option>
          <option value="Pass Yards">Pass Yards</option>
          <option value="Pass TD">Pass TD</option>
          <option value="Rush Yards">Rush Yards</option>
          <option value="Rush TD">Rush TD</option>
          <option value="Receiving Yards">Receiving Yards</option>
          <option value="Receiving TD">Receiving TD</option>
          <option value="Receptions">Receptions</option>
        </select>
      </div>
      <canvas id="chart-overview-top" height="260"></canvas>
    </div>
  </div>
  <div class="panel">
    <div class="panel-title">League Snapshot</div>
    <div class="panel-note">Click any column header to sort.</div>
    <div id="overview-table"></div>
  </div>
  `;
}
function mountOverview(){
  const ts = DATA.teamSummary;
  destroyChart('scatter'); destroyChart('top');
  const ctx1 = $('#chart-overview-scatter');
  charts.scatter = new Chart(ctx1, {
    type:'scatter',
    data:{ datasets:[{
      label:'Teams',
      data: ts.map(r=>({x:num(r['Offensive Yards Per Game']), y:num(r['Offensive Yards Allowed Per Game']), team:r.Team})),
      backgroundColor:'#4C8DFF',
      pointRadius:5,
    }]},
    options:{
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ label:(c)=> `${c.raw.team}: ${c.raw.x} off yds/g, ${c.raw.y} allowed yds/g` } } },
      scales:{
        x:{ title:{display:true,text:'Offensive Yards / Game', color:'#8B93AC'}, ticks:{color:'#8B93AC'}, grid:{color:'#1B2233'} },
        y:{ title:{display:true,text:'Yards Allowed / Game', color:'#8B93AC'}, ticks:{color:'#8B93AC'}, grid:{color:'#1B2233'} }
      }
    }
  });
  // "Total Yards" is pass+rush+receiving combined, one number that works
  // across every position; every other option is a single real stat column.
  const OVERVIEW_TOP_STAT_LABELS = {
    total: 'Total Yards', 'Pass Yards': 'Pass Yards', 'Pass TD': 'Pass TD',
    'Rush Yards': 'Rush Yards', 'Rush TD': 'Rush TD', 'Receiving Yards': 'Receiving Yards',
    'Receiving TD': 'Receiving TD', 'Receptions': 'Receptions',
  };
  function overviewTopValue(row, statKey){
    return statKey === 'total'
      ? num(row['Pass Yards']) + num(row['Rush Yards']) + num(row['Receiving Yards'])
      : num(row[statKey]);
  }
  function applyOverviewTopChart(){
    const pos = ($('#overview-top-pos-pills .pill.active') || {}).dataset ? $('#overview-top-pos-pills .pill.active').dataset.pos : '';
    const statKey = $('#overview-top-stat').value;
    const statLabel = OVERVIEW_TOP_STAT_LABELS[statKey];

    const rows = (DATA.playerGame || []).filter(r => !pos || r.Position === pos);
    const top10 = rows
      .map(r => ({...r, _val: overviewTopValue(r, statKey)}))
      .sort((a,b) => b._val - a._val)
      .slice(0, 10);

    $('#overview-top-note').textContent = statKey === 'total'
      ? `Combined rush + receiving + passing yards${pos ? `, ${pos} only` : ', across all positions'}.`
      : `${statLabel}${pos ? ` -- ${pos} only` : ', across all positions'}.`;

    destroyChart('top');
    charts.top = new Chart($('#chart-overview-top'), {
      type:'bar',
      data:{ labels: top10.map(r=>`${r.Player} (${r.Team})`), datasets:[{ label: statLabel, data: top10.map(r=>r._val), backgroundColor:'#FFB020' }]},
      options:{ indexAxis:'y',
        plugins:{legend:{display:false}},
        scales:{ x:{ ticks:{color:'#8B93AC'}, grid:{color:'#1B2233'} }, y:{ ticks:{color:'#EDEFF7', font:{size:11}}, grid:{display:false} } }
      }
    });
  }
  $$('#overview-top-pos-pills .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      $$('#overview-top-pos-pills .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      applyOverviewTopChart();
    });
  });
  $('#overview-top-stat').addEventListener('change', applyOverviewTopChart);
  applyOverviewTopChart();
  buildTable($('#overview-table'), [
    {key:'Team', label:'Team', render:teamChip},
    {key:'Offensive Yards Per Game', label:'Off Yds/G', numeric:true, render:v=>fmt(v)},
    {key:'Total TD Made Per Game', label:'TD/G', numeric:true, render:v=>fmt(v)},
    {key:'Offensive Yards Allowed Per Game', label:'Def Yds Allowed/G', numeric:true, render:v=>fmt(v)},
    {key:'Total TD Allowed Per Game', label:'TD Allowed/G', numeric:true, render:v=>fmt(v)},
  ], ts, {defaultSort:'Offensive Yards Per Game'});
}

function mountTeamWeek(){
  const cols = [
    {key:'Week', label:'Wk', numeric:true},
    {key:'Team', label:'Team', render:teamChip},

// Position-specific columns for Defense vs Position -- what a defense
// allows is only meaningful for the stats that position actually produces.
// Each column shows the season TOTAL with the per-game rate alongside it
// (e.g. "875 (125.0/g)").
function totalPerGameCol(totalKey, perGameKey, label){
  return {key: perGameKey, totalKey, label};
}

// Primary stat used to rank each position (also drives the color scale and
// the "Last 3" recent-form column).
const DEFENSE_RANK_STAT = {
  QB: 'Pass Yards Allowed Per Game',
  RB: 'Rush Yards Allowed Per Game',
  WR: 'Receiving Yards Allowed Per Game',
  TE: 'Receiving Yards Allowed Per Game',
};

const DEFENSE_COLS_BY_POS = {
  QB: [
    totalPerGameCol('Pass Yards Allowed', 'Pass Yards Allowed Per Game', 'Pass Yds Allowed'),
    totalPerGameCol('Pass TD Allowed', 'Pass TD Allowed Per Game', 'Pass TD Allowed'),
    totalPerGameCol('Interceptions Forced', 'Interceptions Forced Per Game', 'INT Forced'),
    totalPerGameCol('Rush Yards Allowed', 'Rush Yards Allowed Per Game', 'QB Rush Yds Allowed'),
    totalPerGameCol('Rush TD Allowed', 'Rush TD Allowed Per Game', 'QB Rush TD Allowed'),
  ],
  RB: [
    totalPerGameCol('Rush Attempts Allowed', 'Rush Attempts Allowed Per Game', 'Rush Att Allowed'),
    totalPerGameCol('Rush Yards Allowed', 'Rush Yards Allowed Per Game', 'Rush Yds Allowed'),
    totalPerGameCol('Rush TD Allowed', 'Rush TD Allowed Per Game', 'Rush TD Allowed'),
    totalPerGameCol('Receptions Allowed', 'Receptions Allowed Per Game', 'Rec Allowed'),
    totalPerGameCol('Receiving Yards Allowed', 'Receiving Yards Allowed Per Game', 'Rec Yds Allowed'),
    totalPerGameCol('Receiving TD Allowed', 'Receiving TD Allowed Per Game', 'Rec TD Allowed'),
  ],
  WR: [
    totalPerGameCol('Targets Allowed', 'Targets Allowed Per Game', 'Targets Allowed'),
    totalPerGameCol('Receptions Allowed', 'Receptions Allowed Per Game', 'Rec Allowed'),
    totalPerGameCol('Receiving Yards Allowed', 'Receiving Yards Allowed Per Game', 'Rec Yds Allowed'),
    totalPerGameCol('Receiving TD Allowed', 'Receiving TD Allowed Per Game', 'Rec TD Allowed'),
  ],
  TE: [
    totalPerGameCol('Targets Allowed', 'Targets Allowed Per Game', 'Targets Allowed'),
    totalPerGameCol('Receptions Allowed', 'Receptions Allowed Per Game', 'Rec Allowed'),
    totalPerGameCol('Receiving Yards Allowed', 'Receiving Yards Allowed Per Game', 'Rec Yds Allowed'),
    totalPerGameCol('Receiving TD Allowed', 'Receiving TD Allowed Per Game', 'Rec TD Allowed'),
  ],
};

// Maps a defense-vs-position stat name (as used above) to the raw column
// name on individual player-game rows, so a per-week breakdown can be
// rebuilt by summing every opposing player's game that week.
const DEFENSE_STAT_RAW_MAP = {
  'Pass Yards Allowed': 'Pass Yards', 'Pass TD Allowed': 'Pass TD', 'Interceptions Forced': 'Interceptions',
  'Rush Attempts Allowed': 'Rush Attempts', 'Rush Yards Allowed': 'Rush Yards', 'Rush TD Allowed': 'Rush TD',
  'Receptions Allowed': 'Receptions', 'Receiving Yards Allowed': 'Receiving Yards', 'Receiving TD Allowed': 'Receiving TD',
  'Targets Allowed': 'Targets',
};

function getDefenseWeeklyLog(defense, position){
  const rows = (DATA.playerGame || []).filter(r=>r.Opponent===defense && r.Position===position);
  const byWeek = {};
  rows.forEach(r=>{
    const wk = num(r.Week);
    if(!byWeek[wk]){
      byWeek[wk] = {Week: wk};
      Object.values(DEFENSE_STAT_RAW_MAP).forEach(raw=>{ byWeek[wk][raw] = 0; });
    }
    Object.values(DEFENSE_STAT_RAW_MAP).forEach(raw=>{ byWeek[wk][raw] += num(r[raw]); });
  });
  return Object.values(byWeek).sort((a,b)=>a.Week - b.Week);
}

function mountDefense(){
  let pos = 'QB';
  const expanded = new Set();

  function apply(){
    const container = $('#def-table');
    const rows = DATA.defVsPos.filter(r=>r.Position===pos);
    const rankStat = DEFENSE_RANK_STAT[pos];
    const rankTotalKey = rankStat.replace(' Per Game', '');
    const rankRawKey = DEFENSE_STAT_RAW_MAP[rankTotalKey];
    const posCols = DEFENSE_COLS_BY_POS[pos] || [];

    // Rank teams by the primary allowed stat -- highest (weakest defense) =
    // rank 1 = best matchup, same convention used everywhere else.
    const sorted = [...rows].sort((a,b)=> num(b[rankStat]) - num(a[rankStat]));
    const maxRank = sorted.length;

    const headCells = ['', '#', 'Defense', 'Last 3', ...posCols.map(c=>c.label)];
    const theadHtml = `<tr>${headCells.map(h=>`<th>${h}</th>`).join('')}</tr>`;

    const bodyHtml = sorted.map((row, i)=>{
      const rank = i + 1;
      const defense = row.Defense;
      const log = getDefenseWeeklyLog(defense, pos);
      const last3 = log.slice(-3);
      const last3Avg = last3.length ? last3.reduce((s,w)=>s + num(w[rankRawKey]), 0) / last3.length : null;
      const seasonAvg = num(row[rankStat]);
      const trend = last3Avg === null ? '' :
        last3Avg > seasonAvg * 1.15 ? '<span style="color:var(--mint);">&#9650;</span>' :
        last3Avg < seasonAvg * 0.85 ? '<span style="color:var(--red);">&#9660;</span>' : '';
      const isOpen = expanded.has(defense);

      const rowHtml = `
        <tr class="def-row" data-defense="${defense}" style="cursor:pointer;">
          <td class="num" style="color:var(--chalk-dim);">${isOpen ? '&#9662;' : '&#9656;'}</td>
          <td class="num"><span class="heat" style="${heatColor(rank, maxRank)}">#${rank}</span></td>
          <td>${teamChip(defense)}</td>
          <td class="num">${last3Avg === null ? '&mdash;' : fmt(last3Avg) + '/g'} ${trend}</td>
          ${posCols.map(c=>`<td class="num">${Math.round(num(row[c.totalKey])).toLocaleString()} <span style="color:var(--chalk-dim);">(${fmt(num(row[c.key]))}/g)</span></td>`).join('')}
        </tr>`;

      const detailHtml = isOpen ? `
        <tr class="def-detail-row">
          <td colspan="${headCells.length}" style="background:var(--field-deep);padding:10px 16px;">
            ${log.length ? `
            <div style="font-family:var(--mono);font-size:11px;color:var(--chalk-dim);margin-bottom:6px;">Week-by-week vs ${pos} (${DEFENSE_STAT_RAW_MAP[rankTotalKey]}):</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              ${log.map(w=>`<span class="odds-chip">Wk ${w.Week}: ${fmt(num(w[rankRawKey]))}</span>`).join('')}
            </div>` : `<div class="empty" style="padding:0;">No games logged yet.</div>`}
          </td>
        </tr>` : '';

      return rowHtml + detailHtml;
    }).join('');

    container.innerHTML = `<div class="table-scroll"><table><thead>${theadHtml}</thead><tbody>${bodyHtml}</tbody></table></div>`;

    $$('.def-row', container).forEach(tr=>{
      tr.addEventListener('click', ()=>{
        const defense = tr.dataset.defense;
        if(expanded.has(defense)) expanded.delete(defense);
        else expanded.add(defense);
        apply();
      });
    });
  }

  $$('#def-pos-pills .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      $$('#def-pos-pills .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      pos = p.dataset.pos;
      expanded.clear();
      apply();
    });
  });
  apply();
}

function renderWeek2(){
  const wk = DATA.week2 && DATA.week2.length ? DATA.week2[0].Week : null;
  return `
  <div class="panel">
    <div class="wk2-sticky-header">

      <div class="controls">
        <input type="text" id="wk2-search" placeholder="Filter team (e.g. Bills or BUF)">
      </div>
    </div>
    <div class="panel-note">Each team's top producers this season with their real stat line (including targets), red zone usage and share of their team's red zone looks, how the opposing defense has performed against that position, rest days since their last game, INT margin so far (interceptions only), and any career milestone they're closing in on. DIV badge marks divisional matchups.</div>
    <div class="matchup-grid single-col" id="wk2-days"></div>
  </div>`;
