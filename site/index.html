<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gridiron Ledger — NFL 2026 Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="config.js"></script>
<style>
  :root{
    --field:#0B0F19;
    --field-deep:#070A12;
    --chalk:#EDEFF7;
    --chalk-dim:#8B93AC;
    --hash:#2A3348;
    --hash-line:#1B2233;
    --gold:#4C8DFF;
    --gold-deep:#3568CC;
    --red:#FF5C6C;
    --mint:#33D6A6;
    --panel:#121826;
    --panel-border:#232B3E;
    --mono:'IBM Plex Mono', monospace;
    --cond:'Barlow Condensed', sans-serif;
    --display:'Archivo Black', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--field);
    color:var(--chalk);
    font-family:var(--cond);
    min-height:100vh;
  }
  a{color:inherit;}
  .wrap{max-width:100%;margin:0 auto;padding:0 32px 60px;}

  /* ---- Header ---- */
  header.hero{
    border-bottom:3px solid var(--gold);
    background:linear-gradient(180deg, var(--field-deep), var(--field) 80%);
    padding:34px 0 22px;
    margin-bottom:26px;
  }
  .hero-inner{max-width:100%;margin:0 auto;padding:0 32px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;}
  .hero-title{
    font-family:var(--display);
    font-size:clamp(28px, 4vw, 46px);
    letter-spacing:0.5px;
    line-height:1;
    margin:0;
    color:var(--chalk);
  }
  .hero-title span{color:var(--gold);}
  .hero-sub{
    font-family:var(--mono);
    color:var(--chalk-dim);
    font-size:13px;
    margin-top:10px;
    letter-spacing:0.3px;
  }
  .hero-meta{
    font-family:var(--mono);
    font-size:12px;
    color:var(--gold);
    text-align:right;
    line-height:1.6;
  }
  .hero-meta b{color:var(--chalk);font-family:var(--cond);font-weight:600;}

  /* ---- Ticker (horizontal bar, always visible regardless of screen width) ---- */
  .ticker-side{
    display:flex;align-items:stretch;
    background:var(--field-deep);
    border-bottom:1px solid var(--panel-border);
    position:sticky;top:0;z-index:50;
  }
  .ticker-label{
    flex:0 0 auto;
    display:flex;align-items:center;gap:6px;
    padding:0 16px;
    font-family:var(--cond);font-weight:700;font-size:13px;
    color:var(--gold);
    background:var(--panel);
    border-right:1px solid var(--panel-border);
    white-space:nowrap;
  }
  .ticker-track{
    flex:1 1 auto;
    display:flex;
    overflow-x:auto;
    scrollbar-width:thin;
  }
  .ticker-item{
    flex:0 0 auto;
    display:flex;flex-direction:column;justify-content:center;gap:3px;
    padding:8px 18px;
    border-right:1px solid var(--panel-border);
    min-width:120px;
    cursor:pointer;
    transition:background .15s;
  }
  .ticker-item:hover{background:rgba(76,141,255,0.1);}
  @keyframes card-highlight-flash{
    0%{box-shadow:0 0 0 2px var(--gold);}
    100%{box-shadow:0 0 0 2px transparent;}
  }
  .card-highlight{animation:card-highlight-flash 1.8s ease-out;}
  .ticker-time{
    font-family:var(--mono);font-size:10px;color:var(--chalk-dim);
    text-transform:uppercase;letter-spacing:0.4px;
  }
  .ticker-teams{
    display:flex;align-items:baseline;gap:5px;
    font-family:var(--cond);font-weight:700;font-size:14px;
    color:var(--chalk);
  }
  .ticker-at{color:var(--chalk-dim);font-weight:500;font-size:11px;}
  .ticker-score{color:var(--gold);font-family:var(--mono);}
  .ticker-empty{padding:10px 16px;font-family:var(--mono);font-size:12px;color:var(--chalk-dim);}


  /* ---- Tabs (left sidebar on wide screens) ---- */
  .main-layout{display:flex;gap:28px;align-items:flex-start;}
  nav.tabs{
    display:flex;
    flex-direction:column;
    gap:2px;
    flex:0 0 200px;
    position:sticky;
    top:70px;
    border-right:1px solid var(--panel-border);
    padding-right:4px;
    /* With grouped headers the list can outgrow a short window -- scroll inside the nav instead of clipping the bottom tabs. */
    max-height:calc(100vh - 90px);
    overflow-y:auto;
    scrollbar-width:thin;
  }
  nav.tabs button{
    background:transparent;
    border:none;
    border-left:3px solid transparent;
    color:var(--chalk-dim);
    font-family:var(--cond);
    font-weight:600;
    font-size:15px;
    text-align:left;
    padding:9px 14px;
    cursor:pointer;
    white-space:nowrap;
    transition:color .15s, border-color .15s, background .15s;
  }
  nav.tabs button:hover{color:var(--chalk);background:rgba(76,141,255,0.06);}
  nav.tabs button.active{color:var(--gold);border-left-color:var(--gold);background:rgba(227,169,59,0.08);}
  .tab-group-label{
    font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--gold);opacity:.8;
    padding:16px 14px 6px;margin-top:8px;border-top:1px solid var(--panel-border);
  }
  tfoot td{
    padding:9px 10px;font-weight:700;color:var(--gold);white-space:nowrap;
    border-top:2px solid var(--hash);background:var(--field-deep);
  }
  #content{flex:1;min-width:0;}

  /* Below this width a fixed sidebar eats too much of the screen --
     revert to the original horizontal top-nav layout instead. */
  @media (max-width:900px){
    .main-layout{display:block;}
    nav.tabs{
      flex-direction:row;
      overflow-x:auto;
      position:static;
      max-height:none;
      border-right:none;
      border-bottom:1px solid var(--panel-border);
      margin-bottom:22px;
      padding-right:0;
    }
    nav.tabs button{
      border-left:none;
      border-bottom:3px solid transparent;
      text-align:center;
    }
    nav.tabs button.active{border-left-color:transparent;border-bottom-color:var(--gold);}
    .tab-group-label{display:none;}
  }

  .layout-switch{display:block;margin:10px 14px 4px;padding:7px 10px;font-size:12px;font-family:var(--mono);color:var(--gold);border:1px dashed var(--gold);border-radius:4px;text-decoration:none;text-align:center;}
  .layout-switch:hover{background:rgba(227,169,59,0.08);}
  @media (max-width:900px){.layout-switch{margin:4px 8px;white-space:nowrap;}}

  /* ---- Panels ---- */
  .panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:4px;
    padding:20px;
    margin-bottom:20px;
  }
  .wk2-sticky-header{
    position:sticky;top:50px;z-index:20;
    background:var(--panel);
    margin:-20px -20px 0;
    padding:20px 20px 10px;
  }
  .panel-title{
    font-family:var(--cond);
    font-weight:700;
    font-size:19px;
    margin:0 0 4px;
    color:var(--chalk);
  }
  .panel-note{
    font-family:var(--mono);
    font-size:12px;
    color:var(--chalk-dim);
    margin:0 0 16px;
  }
  .grid-2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;}
  @media (max-width:900px){.grid-2{grid-template-columns:1fr;}}
  .mu-grid{display:grid;grid-template-columns:1fr;gap:24px;}
  .mu-layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start;}
  .mu-main{min-width:0;}
  .mu-schedule{position:sticky;top:70px;max-height:calc(100vh - 90px);overflow-y:auto;scrollbar-width:thin;}
  .mu-schedule .panel-title{font-size:16px;}
  .rank-badge{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--chalk-dim);cursor:help;}
  .rank-badge.top{color:var(--gold);}
  .mu-faced{border:1px solid var(--hash);border-radius:6px;padding:10px 12px;margin:0 0 14px;background:var(--field-deep);}
  .mu-faced-title{font-family:var(--cond);font-weight:700;font-size:13px;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;}
  .mu-faced-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .mu-faced-ctl{display:flex;align-items:center;gap:8px;}
  .mu-faced-by{font-family:var(--mono);font-size:11px;color:var(--chalk-dim);}
  .mu-faced-row{font-family:var(--mono);font-size:12px;color:var(--chalk-dim);padding:2px 0;line-height:1.5;}
  .mu-faced-row b{color:var(--chalk);}
  .mu-faced-sum{margin-top:6px;padding-top:6px;border-top:1px solid var(--hash-line);font-family:var(--mono);font-size:12px;color:var(--chalk);line-height:1.5;}
  .mu-game{cursor:pointer;padding:10px 12px;margin-bottom:8px;border:1px solid var(--hash);border-radius:6px;background:var(--field-deep);transition:border-color .15s, background .15s;}
  .mu-game:hover{border-color:var(--gold-deep);}
  .mu-game:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .mu-game.active{border-color:var(--gold);background:rgba(227,169,59,0.10);}
  .mu-game-teams{font-family:var(--cond);font-weight:700;font-size:17px;color:var(--chalk);display:flex;align-items:center;gap:8px;}
  .mu-game-team{padding:1px 6px;border-radius:3px;}
  .mu-game-team:hover{background:rgba(255,255,255,0.10);}
  .mu-game-team.offense{color:var(--gold);box-shadow:inset 0 -2px 0 var(--gold);}
  .mu-game-at{color:var(--chalk-dim);font-size:12px;font-weight:400;}
  .mu-game-meta{font-family:var(--mono);font-size:11px;color:var(--chalk-dim);margin-top:4px;}
  @media (max-width:1100px){
    .mu-layout{grid-template-columns:1fr;}
    .mu-schedule{position:static;max-height:none;order:-1;}
  }
  .line-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start;}
  .line-grid table{width:auto;min-width:0;}
  .line-grid th, .line-grid td{padding-right:16px;}
  .line-grid th:last-child, .line-grid td:last-child{padding-right:8px;}
  @media (max-width:1100px){ .line-grid{grid-template-columns:1fr;} }
  .line-chip{font-family:var(--mono);font-size:10px;font-weight:700;padding:2px 8px;border-radius:9px;border:1px solid var(--hash);color:var(--chalk-dim);white-space:nowrap;}
  .line-chip.ok{color:var(--mint);border-color:var(--mint);}
  .line-chip.out{color:var(--red);border-color:var(--red);}
  .line-chip.risk{color:var(--gold);border-color:var(--gold);}
  .line-metric{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:12px;color:var(--chalk-dim);padding:4px 0;border-bottom:1px solid var(--hash-line);}
  .line-sub-title{font-family:var(--cond);font-weight:700;font-size:12px;color:var(--gold);margin:14px 0 6px;letter-spacing:.5px;text-transform:uppercase;}
  .line-player{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--hash-line);}
  .line-player-name{font-family:var(--cond);font-weight:700;font-size:14px;color:var(--chalk);}
  .line-player-meta{font-family:var(--mono);font-size:11px;color:var(--chalk-dim);margin-left:auto;text-align:right;}
  .line-banner{font-family:var(--mono);font-size:12px;padding:8px 10px;border-radius:4px;margin:8px 0;border:1px solid var(--hash);}
  .line-banner.ok{color:var(--mint);border-color:var(--mint);}
  .line-banner.out{color:var(--red);border-color:var(--red);}
  .line-banner.risk{color:var(--gold);border-color:var(--gold);}
  .line-note{font-family:var(--mono);font-size:11px;color:var(--chalk-dim);margin-top:8px;line-height:1.5;}
  .mu-grid table{width:auto;min-width:0;}
  .mu-grid th, .mu-grid td{padding-right:22px;}
  .mu-grid th:last-child, .mu-grid td:last-child{padding-right:10px;}

  /* ---- Controls ---- */
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  select, input[type="text"]{
    background:var(--field-deep);
    border:1px solid var(--hash);
    color:var(--chalk);
    font-family:var(--mono);
    font-size:13px;
    padding:8px 10px;
    border-radius:3px;
  }
  select:focus, input:focus{outline:1px solid var(--gold);}
  .pill-group{display:flex;gap:6px;flex-wrap:wrap;}
  .pill{
    background:var(--field-deep);
    border:1px solid var(--hash);
    color:var(--chalk-dim);
    font-family:var(--mono);
    font-size:12px;
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
    transition:all .12s;
  }
  .pill.active{background:var(--gold);border-color:var(--gold);color:var(--field-deep);font-weight:600;}
  .pill:hover:not(.active){border-color:var(--gold);color:var(--chalk);}

  /* ---- Table ---- */
  .table-scroll{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px;}
  thead th{
    text-align:left;
    padding:8px 10px;
    color:var(--gold);
    border-bottom:2px solid var(--hash);
    white-space:nowrap;
    cursor:pointer;
    user-select:none;
    background:var(--panel);
  }
  thead th:hover{color:var(--chalk);}
  .tbl-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 6px;font-family:var(--mono);font-size:11.5px;color:var(--chalk-dim);}
  .tbl-bar input,.tbl-bar select{background:var(--panel);color:var(--chalk);border:1px solid var(--hash);border-radius:4px;padding:4px 7px;font-family:var(--mono);font-size:11.5px;}
  .tbl-bar input{width:190px;max-width:100%;}
  .tbl-bar button{background:transparent;color:var(--chalk-dim);border:1px solid var(--hash);border-radius:4px;padding:3px 8px;font-family:var(--mono);font-size:11px;cursor:pointer;}
  .tbl-bar .tbl-count{margin-left:auto;}
  thead th.sorted::after{content:' ▾';font-size:10px;}
  thead th.sorted-asc::after{content:' ▴';font-size:10px;}
  tbody td{padding:7px 10px;border-bottom:1px solid var(--hash-line);white-space:nowrap;color:var(--chalk);}
  tbody tr:hover{background:rgba(227,169,59,0.06);}
  tbody tr:nth-child(even){background:rgba(255,255,255,0.015);}
  tbody tr.wk-band-a{background:transparent;}
  tbody tr.wk-band-b{background:rgba(227,169,59,0.10);}
  tbody tr.wk-band-a:hover,tbody tr.wk-band-b:hover{background:rgba(227,169,59,0.18);}

  .df-wrap{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;align-items:start;}
  @media(max-width:1350px){.df-wrap{grid-template-columns:1fr;}}
  .df-field{width:100%;height:auto;border-radius:14px;border:1px solid rgba(255,255,255,0.08);display:block;background:radial-gradient(ellipse at 50% 40%,#16372a 0%,#0d2119 70%,#0a1812 100%);box-shadow:0 10px 30px rgba(0,0,0,.35) inset;}
  .df-node{cursor:pointer;}
  .df-node .body{transition:transform .15s,filter .15s;transform-box:fill-box;transform-origin:center;}
  .df-node:hover .body{transform:scale(1.12);}
  .df-node.sel .body{filter:drop-shadow(0 0 8px #e3a93b);transform:scale(1.15);}
  .df-node.sel .ring{stroke:#e3a93b!important;}
  .df-pos{font:700 10px sans-serif;fill:#fff;text-anchor:middle;letter-spacing:.04em;pointer-events:none;}
  .df-name{font:600 11px sans-serif;fill:#f3f6f4;text-anchor:middle;pointer-events:none;}
  .df-sub{font:500 9.5px sans-serif;fill:rgba(223,233,226,.62);text-anchor:middle;pointer-events:none;}
  .df-side{font:700 11px sans-serif;fill:rgba(255,255,255,.4);letter-spacing:.18em;}
  .df-badge{font:700 9px sans-serif;fill:#1b1405;text-anchor:middle;pointer-events:none;}
  .df-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--chalk-dim,#9aa);margin:8px 2px 0;}
  .df-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .df-star{color:#e3a93b;font-weight:700;}
  .pl-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:1350px){.pl-grid{grid-template-columns:1fr;}}
  .pl-svg{width:100%;height:auto;display:block;border-radius:12px;background:#0d2119;border:1px solid rgba(255,255,255,.08);}
  .pl-cell-pct{font:700 20px sans-serif;fill:#fff;text-anchor:middle;}
  .pl-cell-sub{font:500 10px sans-serif;fill:rgba(255,255,255,.7);text-anchor:middle;}
  .pl-axis{font:700 10px sans-serif;fill:rgba(255,255,255,.45);letter-spacing:.12em;text-anchor:middle;}
  .pl-read{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px;}
  .pl-read span{background:rgba(255,255,255,.06);border-radius:6px;padding:4px 9px;font-size:12px;}
  .pl-up{color:#e3a93b;font-weight:700;} .pl-down{color:#6aa5ff;font-weight:700;}
  .df-detail h4{margin:0 0 4px;font-size:16px;}
  .df-detail .df-kv{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .df-detail .df-kv span{background:rgba(255,255,255,0.06);border-radius:6px;padding:3px 8px;font-size:12px;}
  .df-detail table{width:100%;font-size:12px;border-collapse:collapse;margin-top:6px;}
  .df-detail th{text-align:left;color:var(--chalk-dim,#9aa);font-weight:600;padding:3px 6px;}
  .df-detail td{padding:3px 6px;border-top:1px solid var(--hash-line);}
  .df-good{color:#33d6a6;} .df-bad{color:#ff5c6c;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .rank-badge{
    display:inline-block;min-width:22px;text-align:center;
    background:var(--field-deep);border:1px solid var(--hash);
    border-radius:3px;padding:2px 5px;color:var(--gold);font-size:11px;
  }
  .team-chip{
    font-family:var(--cond);font-weight:700;letter-spacing:0.5px;
    background:var(--field-deep);border:1px solid var(--gold-deep);
    color:var(--gold);padding:2px 8px;border-radius:3px;font-size:12px;
  }
  .heat{border-radius:2px;padding:3px 8px;display:inline-block;min-width:48px;text-align:center;font-weight:600;}

  /* ---- Upcoming Matchups ---- */
  .day-group{margin-bottom:28px;}
  .day-group:last-child{margin-bottom:0;}
  .day-header{
    font-family:var(--cond);font-weight:700;font-size:14px;
    color:var(--gold);text-transform:uppercase;letter-spacing:0.8px;
    margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--panel-border);
  }
  .matchup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:20px;}
  .matchup-grid.single-col{grid-template-columns:1fr;}
  .matchup-card{
    background:var(--field-deep);border:1px solid var(--panel-border);
    border-radius:6px;overflow:hidden;
  }
  .matchup-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 20px;background:var(--panel);border-bottom:1px solid var(--panel-border);
  }
  .matchup-teams{
    font-family:var(--cond);font-weight:700;font-size:19px;color:var(--chalk);
    display:flex;align-items:baseline;gap:9px;
  }
  .matchup-teams .at{color:var(--chalk-dim);font-weight:500;font-size:13px;}
  .ml-badge{font-family:var(--mono);font-size:10px;color:var(--mint);font-weight:600;margin:0 2px;}
  .div-badge{
    font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:0.5px;
    color:var(--gold);border:1px solid var(--gold-deep);border-radius:3px;
    padding:1px 5px;margin-left:6px;vertical-align:middle;
  }
  .save-pick-btn{
    font-family:var(--mono);font-size:10px;color:var(--gold);
    background:var(--field-deep);border:1px solid var(--gold-deep);
    border-radius:3px;padding:4px 9px;cursor:pointer;white-space:nowrap;
    transition:background .15s;
  }
  .save-pick-btn:hover{background:rgba(227,169,59,0.12);}
  .save-pick-btn:disabled{color:var(--mint);border-color:var(--mint);cursor:default;background:rgba(51,214,166,0.1);}
  .context-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .context-chip{
    font-family:var(--mono);font-size:10.5px;color:var(--chalk-dim);
    background:var(--field-deep);border:1px solid var(--hash);
    border-radius:10px;padding:3px 9px;
  }
  .rest-short{color:var(--red);}
  .rest-bye{color:var(--mint);}
  .matchup-time{
    font-family:var(--mono);font-size:11px;color:var(--chalk-dim);
    text-align:right;line-height:1.5;
  }
  .live-card-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);}
  .live-stats-col{padding:18px 20px;border-right:1px solid var(--panel-border);}
  .live-playerlog-col{min-width:0;}
  .live-chip{font-family:var(--mono);font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px;border:1px solid var(--hash);color:var(--chalk-dim);white-space:nowrap;}
  .live-chip.live-in{color:var(--red);border-color:var(--red);animation:live-pulse 1.6s infinite;}
  .live-chip.live-post{color:var(--mint);border-color:var(--mint);}
  @keyframes live-pulse{0%,100%{opacity:1}50%{opacity:.45}}
  @media (max-width:1100px){
    .live-card-columns{grid-template-columns:1fr;}
    .live-stats-col{border-right:none;border-bottom:1px solid var(--panel-border);}
  }
  .wk2-four-col{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.3fr);
  }
  .wk2-four-col > div{padding:18px 20px;min-width:0;}
  .wk2-four-col > div + div{border-left:1px solid var(--panel-border);}
  @media (max-width:1400px){
    .wk2-four-col{grid-template-columns:1fr 1fr;}
    .wk2-four-col > div:nth-child(3), .wk2-four-col > div:nth-child(4){border-left:none;border-top:1px solid var(--panel-border);}
  }
  @media (max-width:800px){
    .wk2-four-col{grid-template-columns:1fr;}
    .wk2-four-col > div{border-left:none !important;border-top:1px solid var(--panel-border);}
    .wk2-four-col > div:first-child{border-top:none;}
  }
  .odds-strip{
    display:flex;gap:8px;padding:8px 16px;
    background:var(--field-deep);border-bottom:1px solid var(--panel-border);
  }
  .odds-chip{
    font-family:var(--mono);font-size:11px;color:var(--chalk);
    background:var(--panel);border:1px solid var(--panel-border);
    border-radius:3px;padding:3px 9px;
  }
  .matchup-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
  .matchup-body.stacked{grid-template-columns:1fr;}
  .matchup-body.stacked .matchup-side + .matchup-side{border-left:none;border-top:1px solid var(--panel-border);}
  .qb-card-row{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--panel-border);}
  .qb-card{background:var(--field-deep);padding:12px 14px;}
  .qb-card-name{font-family:var(--cond);font-weight:700;font-size:13px;color:var(--chalk);margin-bottom:5px;}
  .qb-card-line{font-family:var(--mono);font-size:11px;color:var(--chalk-dim);margin-bottom:3px;}
  .game-stats-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;}
  .game-stats-table th{
    text-align:right;padding:8px 14px;color:var(--gold);
    border-bottom:1px solid var(--panel-border);font-weight:700;
  }
  .game-stats-table th:first-child{text-align:left;}
  .game-stats-table td{padding:6px 14px;text-align:right;border-bottom:1px solid var(--hash-line);color:var(--chalk);}
  .game-stats-table td:first-child{text-align:left;color:var(--chalk-dim);}
  .matchup-side{padding:18px 20px;}
  .matchup-side + .matchup-side{border-left:1px solid var(--panel-border);}
  .matchup-side-label{
    font-family:var(--mono);font-size:12px;color:var(--chalk-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:14px;
  }
  .matchup-side-label b{color:var(--gold);font-weight:700;}
  .log-pos-group{
    background:var(--panel);border:1px solid var(--panel-border);border-radius:6px;
    padding:10px 14px 12px;margin-bottom:12px;
  }
  .log-pos-group:last-child{margin-bottom:0;}
  .log-pos-label{
    font-family:var(--cond);font-weight:700;font-size:12px;letter-spacing:0.8px;
    color:var(--gold);text-transform:uppercase;
    margin-bottom:0;padding-bottom:6px;
    border-bottom:1px solid var(--hash-line);
  }
  .log-pos-group table{width:auto;min-width:0;}
  .log-pos-group th, .log-pos-group td{padding-right:22px;}
  .log-pos-group th:last-child, .log-pos-group td:last-child{padding-right:10px;}
  .player-preview{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--hash-line);}
  .player-preview:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
  .player-preview-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .player-preview-name{font-family:var(--cond);font-weight:700;font-size:14.5px;color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .player-preview-pos{font-family:var(--mono);font-size:10.5px;color:var(--gold);flex:0 0 auto;}
  .player-preview-stats{font-family:var(--mono);font-size:12px;color:var(--chalk-dim);margin-top:4px;line-height:1.5;}
  .player-preview-matchup{display:block;font-family:var(--mono);font-size:11.5px;margin-top:6px;font-weight:600;}
  .milestone-badge{display:block;font-family:var(--mono);font-size:11.5px;margin-top:6px;font-weight:600;color:var(--gold);}

  /* ---- Stat cards ---- */
  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
  .stat-card{
    flex:1;min-width:150px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-left:3px solid var(--gold);
    padding:14px 16px;border-radius:4px;
  }
  .stat-card .label{font-family:var(--mono);font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:0.5px;}
  .stat-card .value{font-family:var(--display);font-size:24px;color:var(--chalk);margin-top:6px;}
  .stat-card .value span{color:var(--gold);font-size:14px;font-family:var(--cond);}

  canvas{max-width:100%;}
  .empty{color:var(--chalk-dim);font-family:var(--mono);font-size:13px;padding:20px;text-align:center;}
  footer{text-align:center;padding:30px 0 10px;font-family:var(--mono);font-size:11px;color:var(--hash);}
  .bp-t th, .bp-t td{padding:5px 8px;font-size:12.5px;}
  .bp-t th{white-space:nowrap;}
  /* Prop Prices: sportsbook-style board */
  .pp-board{display:flex;flex-direction:column;gap:16px;}
  .pp-game{border:1px solid var(--panel-border);border-radius:8px;overflow:hidden;background:var(--panel);}
  .pp-game-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 14px;background:var(--field-deep);border-bottom:1px solid var(--panel-border);}
  .pp-game-title{font-weight:700;font-size:15px;color:var(--chalk);}
  .pp-game-time{font-family:var(--mono);font-size:11px;color:var(--chalk-dim);}
  .pp-cols{display:grid;grid-template-columns:minmax(140px,1.3fr) 1fr 1fr;gap:10px;padding:6px 14px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--chalk-dim);border-bottom:1px solid var(--panel-border);}
  .pp-row{display:grid;grid-template-columns:minmax(140px,1.3fr) 1fr 1fr;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--panel-border);}
  .pp-cols + .pp-row{border-top:none;}
  .pp-name{font-weight:700;font-size:14px;color:var(--chalk);line-height:1.25;}
  .pp-sub{font-size:11px;color:var(--chalk-dim);font-weight:400;}
  .pp-alt-tag{font-size:10px;color:var(--chalk-dim);border:1px solid var(--panel-border);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:middle;}
  .pp-btns{display:flex;gap:6px;}
  .pp-btn{flex:1;min-width:64px;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 6px 6px;background:var(--field-deep);border:1px solid var(--panel-border);border-radius:6px;line-height:1.15;}
  .pp-btn i{font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.8px;}
  .pp-btn i.fd{color:#4aa8ff;} .pp-btn i.dk{color:#53d337;} .pp-btn i.ot{color:var(--chalk-dim);}
  .pp-btn em{font-style:normal;font-size:11px;color:var(--chalk-dim);}
  .pp-btn b{font-size:15px;color:var(--chalk);font-variant-numeric:tabular-nums;}
  .pp-btn.best{border-color:var(--gold);background:rgba(227,169,59,0.10);}
  .pp-btn.best b{color:var(--gold);}
  .pp-btn.off{opacity:.35;}
  .pp-ana{grid-column:1 / -1;font-family:var(--mono);font-size:11px;color:var(--chalk-dim);padding-top:2px;}
  .pp-ana b{color:var(--chalk);}
  @media (max-width:700px){
    .pp-cols{display:none;}
    .pp-row{grid-template-columns:1fr 1fr;}
    .pp-name{grid-column:1 / -1;}
  }
  /* ===================== Tonight layout: new look (dark + light) ===================== */
  .layout-pick{display:inline-flex;align-items:center;gap:8px;align-self:center;}
  .layout-pick .lp{display:inline-flex;border:1px solid var(--panel-border);border-radius:999px;overflow:hidden;padding:3px;gap:2px;background:var(--panel);}
  .layout-pick .lp button{background:transparent;border:none;color:var(--chalk-dim);font-family:var(--mono);font-size:12px;padding:6px 14px;cursor:pointer;border-radius:999px;}
  .layout-pick .lp button.on{background:var(--gold);color:var(--field);font-weight:700;}
  .theme-btn{display:none;width:34px;height:34px;border-radius:50%;border:1px solid var(--panel-border);background:var(--panel);color:var(--chalk);cursor:pointer;font-size:15px;line-height:1;}
  body.layout-tonight .theme-btn{display:inline-flex;align-items:center;justify-content:center;}

  body.layout-tonight{
    --t-bg:radial-gradient(1100px 560px at 85% -8%,rgba(255,46,136,.16),transparent 60%),radial-gradient(1000px 600px at -12% 22%,rgba(255,122,47,.12),transparent 60%),#07080F;
    --t-text:#F2F4FA; --t-dim:rgba(242,244,250,.56); --t-faint:rgba(255,255,255,.07); --t-line:rgba(255,255,255,.11);
    --t-card:rgba(255,255,255,.045); --t-card2:rgba(255,255,255,.075); --t-shadow:0 10px 36px rgba(0,0,0,.35); --t-blur:blur(18px);
    --t-over:#2EE6A0; --t-under:#FF4D6D; --t-pass:rgba(242,244,250,.42); --t-nol:rgba(242,244,250,.0);
    --t-accent:linear-gradient(90deg,#FF7A2F,#FF2E88); --t-accent-1:#FF6A3D; --t-on-accent:#fff;
    --t-court:rgba(255,255,255,.022); --t-rim:#FF7A2F; --t-me:#F2F4FA;
    --t-font:'Inter',system-ui,sans-serif; --t-num:'Space Grotesk','Inter',sans-serif;
    /* the classic screens opened from this layout pick up the same skin through the shared variables */
    --field:#07080F; --field-deep:rgba(0,0,0,.28); --panel:var(--t-card); --panel-border:var(--t-faint); --chalk:var(--t-text); --chalk-dim:var(--t-dim);
    --hash:var(--t-line); --hash-line:var(--t-faint); --gold:var(--t-accent-1); --gold-deep:#E5482F; --mint:var(--t-over); --red:var(--t-under);
    --mono:var(--t-font); --cond:var(--t-font); --display:var(--t-num);
    --cv-floor:var(--t-court); --cv-line:var(--t-line); --cv-paint:rgba(255,122,47,.05);
    background:var(--t-bg) fixed; color:var(--t-text); font-family:var(--t-font); -webkit-font-smoothing:antialiased;
  }
  body.layout-tonight[data-theme="light"]{
    --t-bg:radial-gradient(1100px 560px at 85% -8%,rgba(255,46,136,.08),transparent 60%),radial-gradient(1000px 600px at -12% 22%,rgba(255,122,47,.07),transparent 60%),#F3F4F7;
    --t-text:#0D0F14; --t-dim:#6B7280; --t-faint:#ECEEF2; --t-line:#E1E4EA;
    --t-card:#FFFFFF; --t-card2:#FFFFFF; --t-shadow:0 1px 2px rgba(16,24,40,.05),0 8px 24px rgba(16,24,40,.07); --t-blur:none;
    --t-over:#0EA868; --t-under:#E3294F; --t-pass:#9CA3AF; --t-court:#FAFAFB; --t-me:#0D0F14;
    --field:#F3F4F7; --field-deep:#F7F8FA;
  }
  body.layout-tonight header.hero{background:transparent;border-bottom:none;padding:22px 0 10px;margin-bottom:6px;}
  body.layout-tonight .hero-title{font-family:var(--t-font);font-weight:800;letter-spacing:-.5px;font-size:24px;}
  body.layout-tonight .hero-title span{background:var(--t-accent);-webkit-background-clip:text;background-clip:text;color:transparent;}
  body.layout-tonight .hero-sub{font-family:var(--t-font);font-size:12px;margin-top:4px;}
  body.layout-tonight .hero-meta,body.layout-tonight .ticker-side{display:none;}
  body.layout-tonight .hero-inner{align-items:center;}
  body.layout-tonight .layout-pick .lp{background:var(--t-card);border-color:var(--t-faint);box-shadow:var(--t-shadow);}
  body.layout-tonight .layout-pick .lp button{font-family:var(--t-font);font-weight:600;}
  body.layout-tonight .layout-pick .lp button.on{background:var(--t-accent);color:var(--t-on-accent);}
  body.layout-tonight .theme-btn{background:var(--t-card);border-color:var(--t-faint);box-shadow:var(--t-shadow);color:var(--t-text);}
  body.layout-tonight .main-layout{display:block;}
  body.layout-tonight nav.tabs{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;position:static;max-height:none;border:none;padding:4px;margin:0 0 22px;gap:2px;
    background:var(--t-card);border-radius:999px;box-shadow:var(--t-shadow);backdrop-filter:var(--t-blur);width:max-content;max-width:100%;}
  body.layout-tonight nav.tabs > button{border:none;border-radius:999px;padding:8px 16px;font-family:var(--t-font);font-size:14px;font-weight:600;color:var(--t-dim);}
  body.layout-tonight nav.tabs > button.active{background:var(--t-accent);color:var(--t-on-accent);border:none;}
  body.layout-tonight nav.tabs > button:hover:not(.active){color:var(--t-text);background:transparent;}
  body.layout-tonight .panel{border:none;border-radius:18px;box-shadow:var(--t-shadow);backdrop-filter:var(--t-blur);}
  body.layout-tonight .subtab{border:none;border-radius:999px;background:var(--t-card);color:var(--t-dim);font-family:var(--t-font);font-size:13px;box-shadow:var(--t-shadow);}
  body.layout-tonight .subtab.active{background:var(--t-accent);color:var(--t-on-accent);}
  body.layout-tonight footer{color:var(--t-dim);border:none;}
  body.layout-tonight select,body.layout-tonight input{background:var(--t-card2);color:var(--t-text);border:1px solid var(--t-faint);border-radius:10px;font-family:var(--t-font);}

  /* ---- Tonight screen ---- */
  .tn-wrap{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;align-items:start;font-family:var(--t-font);color:var(--t-text);}
  .tn-side{position:sticky;top:16px;display:flex;flex-direction:column;gap:4px;}
  .tn-day{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--t-dim);margin:8px 6px 4px;}
  .tn-day:first-child{margin-top:0;}
  .tn-all{background:none;border:none;color:var(--t-dim);font-family:var(--t-font);font-size:11px;font-weight:600;cursor:pointer;padding:0;}
  .tn-all:hover{color:var(--t-text);}
  .tn-g{display:flex;justify-content:space-between;align-items:center;width:100%;background:transparent;border:none;border-radius:12px;padding:10px 12px;
    font-family:var(--t-font);font-size:14px;font-weight:600;color:var(--t-dim);cursor:pointer;text-align:left;}
  .tn-g i{font-style:normal;opacity:.6;font-weight:500;} .tn-g small{font-size:11px;font-weight:500;}
  .tn-g:hover{color:var(--t-text);}
  .tn-g.on{background:var(--t-card);color:var(--t-text);box-shadow:var(--t-shadow);backdrop-filter:var(--t-blur);}
  .tn-opts{display:flex;flex-direction:column;gap:2px;margin-top:14px;padding-top:12px;border-top:1px solid var(--t-faint);}
  .tn-sw{display:flex;align-items:center;gap:10px;background:none;border:none;color:var(--t-dim);font-family:var(--t-font);font-size:13px;font-weight:500;padding:7px 6px;cursor:pointer;text-align:left;}
  .tn-sw .knob{position:relative;width:30px;height:18px;border-radius:999px;background:var(--t-faint);flex:none;transition:background .15s;}
  .tn-sw .knob::after{content:'';position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--t-dim);transition:all .15s;}
  .tn-sw.on{color:var(--t-text);} .tn-sw.on .knob{background:var(--t-accent);} .tn-sw.on .knob::after{left:14px;background:#fff;}
  .tn-main{min-width:0;container-type:inline-size;}
  .tn-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px;}
  .tn-title{font-family:var(--t-font) !important;font-size:30px !important;font-weight:800 !important;letter-spacing:-.6px;margin:0 !important;color:var(--t-text) !important;}
  .tn-sub{font-size:14px;color:var(--t-dim);margin-top:4px;}
  .tn-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;}
  .tn-sort{margin-left:auto;}
  .tn-seg{display:inline-flex;gap:2px;background:var(--t-faint);padding:3px;border-radius:999px;}
  .tn-seg button{background:none;border:none;border-radius:999px;padding:6px 12px;font-family:var(--t-font);font-size:13px;font-weight:600;color:var(--t-dim);cursor:pointer;}
  .tn-seg button:hover{color:var(--t-text);}
  .tn-seg button.on{background:var(--t-card2);color:var(--t-text);box-shadow:var(--t-shadow);}
  .tn-card{background:var(--t-card);border-radius:18px;margin-bottom:10px;box-shadow:var(--t-shadow);backdrop-filter:var(--t-blur);transition:background .15s;}
  .tn-card:hover,.tn-card.open{background:var(--t-card2);}
  .tn-row{display:grid;grid-template-columns:minmax(150px,190px) minmax(0,1fr) 112px 100px;gap:20px;align-items:center;padding:16px 20px;cursor:pointer;}
  .tn-who{display:flex;gap:12px;align-items:center;min-width:0;}
  .tn-pos{width:36px;height:36px;border-radius:50%;background:var(--t-faint);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--t-dim);flex:none;}
  .tn-nm{font-size:16px;font-weight:700;letter-spacing:-.2px;line-height:1.15;}
  .tn-mt{font-size:12px;color:var(--t-dim);margin-top:2px;}
  .tn-inj{color:var(--t-accent-1);font-weight:600;}
  .tn-pair{display:flex;align-items:flex-end;gap:16px;margin-bottom:10px;}
  .tn-pair .big{display:block;font-family:var(--t-num);font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1;font-variant-numeric:tabular-nums;}
  .tn-main .lab{display:block;font-size:11px;color:var(--t-dim);margin-top:4px;font-weight:500;}
  .tn-diff{font-family:var(--t-num);font-size:13px;font-weight:700;padding-bottom:17px;min-width:34px;}
  .tn-track{position:relative;height:4px;border-radius:2px;background:var(--t-faint);}
  .tn-track .fill{position:absolute;top:0;height:4px;border-radius:2px;opacity:.5;}
  .tn-track .d{position:absolute;top:-4px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);}
  .tn-track .d.me{background:var(--t-me);}
  .tn-track .d.dv{box-shadow:0 0 12px currentColor;}
  .tn-track .ln{position:absolute;top:-7px;width:2px;height:18px;border-radius:1px;background:var(--t-rim);transform:translateX(-50%);}
  .tn-dots{display:flex;gap:4px;} .tn-dots i{width:13px;height:13px;border-radius:50%;}
  .tn-call{text-align:right;} .tn-call .cl{font-size:12px;font-weight:800;letter-spacing:.7px;color:var(--c);}
  .tn-call .cv{font-family:var(--t-num);font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.05;}
  .tn-call.none .cl{color:var(--t-dim);font-size:10px;} .tn-call.none .cv{color:var(--t-dim);}
  .tn-more{padding:0 20px 18px;}
  .tn-bk{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;padding-top:14px;border-top:1px solid var(--t-faint);}
  .tn-bk:not(.wide){grid-template-columns:minmax(0,1fr);gap:14px;border-top:none;padding-top:4px;}
  .tn-bk > div{min-width:0;} .tn-drawer{min-width:0;overflow:hidden;}
  .tn-h{font-size:12px;font-weight:600;color:var(--t-dim);margin-bottom:8px;}
  .tn-bars{position:relative;display:flex;gap:6px;align-items:flex-end;height:104px;}
  .tn-bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;}

<script>
let DATA = { teamSummary:[], teamWeek:[], playerGame:[], defVsPos:[], sos:[], week2:[] };

// ---------- MY PICKS (localStorage, per-browser -- not synced across devices) ----------
const MY_PICKS_KEY = 'nfl_dashboard_my_picks';

function getMyPicks(){
  try {
    const list = JSON.parse(localStorage.getItem(MY_PICKS_KEY) || '[]');
    // Backward-compatible: picks saved before tickets existed default to "Ticket A".
    return list.map(p => ({...p, ticket: p.ticket || 'Ticket A'}));
  } catch(e) {
    console.warn('Could not read saved picks:', e);
    return [];
  }
}
function saveMyPicksList(list){
  try {
    localStorage.setItem(MY_PICKS_KEY, JSON.stringify(list));
  } catch(e) {
    console.warn('Could not save picks (storage may be full or disabled):', e);
  }
  if(window.syncSchedule) syncSchedule();
}
function isPickSaved(pick){
  return getMyPicks().some(p =>
    p.player===pick.player && p.stat===pick.stat && p.source===pick.source && p.week===pick.week &&
    (p.threshold ?? null) === (pick.threshold ?? null) &&
    (p.direction || '') === (pick.direction || '')
  );
}

// A pick is gradeable once it carries an explicit threshold (right now:
// only Custom Matchup Checker adds save one) -- Best Picks/Predictions/etc.
// don't have a single numeric line to compare against, so they're left as
// informational entries rather than shown as an incorrect PENDING forever.
// One place to format a leg's display label ("50+ Rush Yards" or, for the
// binary "Any TD" case, just "Any TD") -- every spot that shows a pick's
// line (the per-leg rows, the "without the weakest leg" summary, and the
// "consider removing" callout) calls this instead of repeating the ternary,
// so a special case like Any TD only has to be handled once.
function pickLegLabel(pick){
  if(pick.stat === 'Any TD') return 'Any TD';
  if(pick.direction === 'under') return `Under ${pick.threshold} ${pick.stat}`;
  if(pick.direction === 'over') return `Over ${pick.threshold} ${pick.stat}`;
  return `${pick.threshold}+ ${pick.stat}`;
}
// ---- Live grading ----
// The daily pipeline only records a week once EVERY game in it is finished, so on a
// Thursday, Sunday or Monday night the box score isn't in playerGame yet. For the
// current week the picks are graded straight from ESPN's live box scores instead
// (the same feed the Live Now tab uses). Once the pipeline has the week, its numbers
// win. A final result is also saved on the pick itself, so past weeks stay graded.
const LIVE_PICKS = {week:null, players:new Map(), teams:new Map(), games:new Map(), updated:null, error:null};
function livePickNorm(n){
  return String(n || '').toLowerCase().replace(/[.'`,-]/g, '').replace(/\b(jr|sr|ii|iii|iv|v)\b/g, '').replace(/\s+/g, ' ').trim();
}
function livePickTeam(a){ a = String(a || '').toUpperCase(); return ({WAS:'WSH', LA:'LAR'})[a] || a; }
function liveParseSummary(summary, state, detail){
  const box = (summary || {}).boxscore || {};
  (box.players || []).forEach(tb => {
    const team = livePickTeam((tb.team || {}).abbreviation);
    (tb.statistics || []).forEach(cat => {
      const nm = String(cat.name || '').toLowerCase();
      const labels = cat.labels || [];
      (cat.athletes || []).forEach(a => {
        const name = (a.athlete || {}).displayName;
        if(!name) return;
        const key = livePickNorm(name) + '|' + team;
        const rec = LIVE_PICKS.players.get(key) || {name, team, v:{passYds:0, passTD:0, ints:0, passAtt:0, rushYds:0, rushTD:0, rushAtt:0, rec:0, recYds:0, recTD:0, tgts:0}};
        const get = l => { const i = labels.indexOf(l); return i < 0 ? 0 : (parseFloat(String((a.stats || [])[i]).split('/')[0]) || 0); };
        if(nm === 'passing'){ rec.v.passYds = get('YDS'); rec.v.passTD = get('TD'); rec.v.ints = get('INT'); const ca = String((a.stats || [])[labels.indexOf('C/ATT')] || '').split('/'); rec.v.passAtt = parseFloat(ca[1]) || 0; }
        else if(nm === 'rushing'){ rec.v.rushYds = get('YDS'); rec.v.rushTD = get('TD'); rec.v.rushAtt = get('CAR'); }
        else if(nm === 'receiving'){ rec.v.rec = get('REC'); rec.v.recYds = get('YDS'); rec.v.recTD = get('TD'); rec.v.tgts = get('TGTS'); }
        LIVE_PICKS.players.set(key, rec);
      });
    });
  });
}
function liveValue(v, stat){
  switch(stat){
    case 'Pass Yards': return v.passYds; case 'Pass TD': return v.passTD; case 'Interceptions': return v.ints;
    case 'Rush Yards': return v.rushYds; case 'Rush TD': return v.rushTD;
    case 'Receiving Yards': return v.recYds; case 'Receptions': return v.rec; case 'Receiving TD': return v.recTD;
    case 'Rush + Rec Yards': return v.rushYds + v.recYds;
    case 'Pass + Rush Yards': return v.passYds + v.rushYds;
    case 'Any TD': return v.rushTD + v.recTD;
  }
  return null;
}
async function refreshLivePicks(){
  try {
    const get = async url => { const r = await fetch(url); if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); };
    const sb = await get(ESPN_SCOREBOARD_URL);
    const events = sb.events || [];
    const players = new Map(), teams = new Map(), games = new Map();
    LIVE_PICKS.players = players;
    const week = (sb.week || {}).number || ((events[0] || {}).week || {}).number || null;
    await Promise.all(events.map(async ev => {
      const st = (ev.status || {}).type || {};
      const state = st.state || 'pre';
      ((ev.competitions || [])[0] || {}).competitors && ev.competitions[0].competitors.forEach(c => {
        teams.set(livePickTeam((c.team || {}).abbreviation), {state, detail: st.shortDetail || '', id: ev.id});
      });
      const cs = (((ev.competitions || [])[0]) || {}).competitors || [];
      const hc = cs.find(c => c.homeAway === 'home'), ac = cs.find(c => c.homeAway === 'away');
      if(hc && ac){
        const H = livePickTeam((hc.team || {}).abbreviation), A = livePickTeam((ac.team || {}).abbreviation);
        const base = {state, detail: st.shortDetail || '', id: ev.id, date: ev.date};
        games.set(H, {...base, opp:A, home:true, score:hc.score, oppScore:ac.score});
        games.set(A, {...base, opp:H, home:false, score:ac.score, oppScore:hc.score});
      }
      if(state === 'pre') return;
      let summary = state === 'post' ? liveNowFinalCache[ev.id] : null;
      if(!summary){
        try { summary = await get(ESPN_SUMMARY_URL + ev.id); } catch(e){ return; }
        if(state === 'post') liveNowFinalCache[ev.id] = summary;
      }
      liveParseSummary(summary, state, st.shortDetail || '');
    }));
    LIVE_PICKS.teams = teams; LIVE_PICKS.games = games; LIVE_PICKS.week = week; LIVE_PICKS.updated = new Date(); LIVE_PICKS.error = null;
  } catch(err){
    LIVE_PICKS.error = err.message || String(err);
  }
}
function liveStatFor(pick){
  if(LIVE_PICKS.week == null || String(pick.week) !== String(LIVE_PICKS.week)) return null;
  const nm = livePickNorm(pick.player), team = pick.team ? livePickTeam(pick.team) : '';
  let rec = team ? LIVE_PICKS.players.get(nm + '|' + team) : null;
  if(!rec){
    const parts = nm.split(' '), last = parts[parts.length - 1], first = (parts[0] || '')[0];
    for(const r of LIVE_PICKS.players.values()){
      if(team && r.team !== team) continue;
      const rn = livePickNorm(r.name).split(' ');
      if(rn[rn.length - 1] === last && (rn[0] || '')[0] === first){ rec = r; break; }
    }
  }
  const game = team ? LIVE_PICKS.teams.get(team) : (rec ? LIVE_PICKS.teams.get(rec.team) : null);
  if(!game || game.state === 'pre') return null;
  const actual = rec ? liveValue(rec.v, pick.stat) : 0;
  if(actual === null) return null;
  return {actual, state:game.state, detail:game.detail, inBox:!!rec};
}
function gradeMyPick(pick){
  if(pick.threshold === undefined || pick.threshold === null || pick.threshold === '') return null;
  const under = pick.direction === 'under', line = num(pick.threshold);
  const verdict = a => under ? a < line : a >= line;
  const actualRow = (DATA.playerGame || []).find(r => r.Player === pick.player && String(r.Week) === String(pick.week));
  // "Under 33.5" hits when the player finishes BELOW the line; everything else
  // (alt lines like 25+, and "Over 4.5" on whole-number stats) hits at or above it.
  if(actualRow){
    const actual = getStatValue(actualRow, pick.stat);
    return {status: verdict(actual) ? 'HIT' : 'MISS', actual, final:true, persist:true};
  }
  // Saved final result from an earlier grading (keeps past weeks graded).
  if(pick.finalStat === pick.stat && typeof pick.finalActual === 'number'){
    return {status: verdict(pick.finalActual) ? 'HIT' : 'MISS', actual: pick.finalActual, final:true, persist:true};
  }
  const live = liveStatFor(pick);
  if(!live) return {status: 'PENDING', actual: null};
  if(live.state === 'post') return {status: verdict(live.actual) ? 'HIT' : 'MISS', actual: live.actual, final:true, persist:live.inBox, fromLive:true, detail:live.detail, inBox:live.inBox};
  // Game still going. An over/at-least that is already met is locked in; an under that has
  // already gone past its line is dead. Anything else is still live.
  if(under) return live.actual >= line
    ? {status:'MISS', actual:live.actual, live:true, detail:live.detail}
    : {status:'LIVE', actual:live.actual, live:true, detail:live.detail};
  return live.actual >= line
    ? {status:'HIT', actual:live.actual, live:true, detail:live.detail}
    : {status:'LIVE', actual:live.actual, live:true, detail:live.detail};
}
// Writes final results onto the saved picks so they stay graded after the live feed moves on.
function persistSettledPicks(){
  const list = getMyPicks();
  let changed = false;
  list.forEach(p => {
    const g = gradeMyPick(p);
    if(g && g.final && g.persist && typeof g.actual === 'number' && (p.finalActual !== g.actual || p.finalStat !== p.stat)){
      p.finalActual = g.actual; p.finalStat = p.stat; p.updatedAt = new Date().toISOString(); changed = true;
    }
  });
  if(changed) saveMyPicksList(list);
}

// Pre-game estimate for a gradeable pick, reusing the same two data points
// Mike's Template and the checker already show separately: the player's own
// season hit rate at this threshold, and (if their opponent is known) that
// opponent's history of allowing the same threshold to the position. When
// both exist the estimate is their average -- two independent readings on
// the same question (will this number clear the bar) rather than one
// multiplied into the other, which would understate a leg that's strong on
// both sides. Once the actual game result comes in, gradeMyPick takes over.
function estimatePickProbability(pick){
  if(pick.threshold === undefined || pick.threshold === null || pick.threshold === '') return null;
  const playerRate = getPlayerStatFloorRate(pick.player, pick.position, pick.stat, num(pick.threshold));
  if(!playerRate) return null;
  const defenseRate = pick.opponent ? getDefenseLeadPlayerFloorRate(pick.opponent, pick.position, pick.stat, num(pick.threshold)) : null;
  if(pick.direction === 'under'){
    // The rates above count how often the number was CLEARED; an under needs the opposite.
    const flip = r => r && {hits: r.total - r.hits, total: r.total, rate: 1 - r.rate};
    const pr = flip(playerRate), dr = flip(defenseRate);
    return {probability: dr ? (pr.rate + dr.rate) / 2 : pr.rate, playerRate: pr, defenseRate: dr};
  }
  const probability = defenseRate ? (playerRate.rate + defenseRate.rate) / 2 : playerRate.rate;
  return {probability, playerRate, defenseRate};
}


// ---- Sportsbook prices (OddsPapi, via 17_prop_odds.py -> data/nfl_2026_prop_odds.csv) ----
// A price is only matched when the book has the SAME bet: same player, same stat, same line. "300+ yards" on a slip is
// Over 299.5 at the book; "Over 4.5" and "Under 60.5" are used as written. Anything else shows the nearest posted line
// instead of pretending to be a match.
let _propIdx = {src:null, val:null};
function propIndex(){
  if(_propIdx.src === DATA.propOdds) return _propIdx.val;
  const map = new Map();
  (DATA.propOdds || []).forEach(r => {
    if(!r.stat || !r.ou) return;
    if(String(r.active).toLowerCase() === 'false') return;
    const dec = parseFloat(r.decimal_odds);
    if(!(dec > 1)) return;
    const k = slipNorm(r.player) + '|' + r.stat;
    const row = {line: r.line === '' || r.line === undefined ? null : parseFloat(r.line), ou: r.ou, dec, book: r.book, game: r.game, kickoff: r.kickoff, player: r.player, stat: r.stat, fetched: r.fetched};
    if(!map.has(k)) map.set(k, []);
    map.get(k).push(row);
  });
  _propIdx = {src: DATA.propOdds, val: map};
  return map;
}
function propHasData(){ return !!(DATA.propOdds && DATA.propOdds.length); }
// The line the book itself sets for a player + stat (same rule as the Book Lines tab: both sides posted beats one-sided,
// then the over and under priced closest to even). thr is the smallest result that beats it: Over 54.5 -> 55, Over 55 -> 56.
let _propMain = {src:null, val:null};
function propMainIndex(){
  if(_propMain.src === DATA.propOdds && _propMain.val) return _propMain.val;
  const groups = new Map();
  (DATA.propOdds || []).forEach(r => {
    if(!r.stat || !r.ou || r.stat === 'Any TD') return;
    if(String(r.active).toLowerCase() === 'false') return;
    const dec = parseFloat(r.decimal_odds); if(!(dec > 1)) return;
    const line = r.line === '' || r.line === undefined ? null : parseFloat(r.line);
    if(line === null || !isFinite(line)) return;
    const ps = slipNorm(r.player) + '|' + r.stat, k = ps + '|' + line;
    if(!groups.has(k)) groups.set(k, {ps, line, over:[], under:[]});
    (r.ou === 'under' ? groups.get(k).under : groups.get(k).over).push({dec, book:r.book});
  });
  const best = a => a.length ? a.reduce((x, y) => y.dec > x.dec ? y : x) : null;
  const byPS = new Map();
  groups.forEach(g => { if(!byPS.has(g.ps)) byPS.set(g.ps, []); byPS.get(g.ps).push({line:g.line, bo:best(g.over), bu:best(g.under)}); });
  const out = new Map();
  byPS.forEach((list, ps) => {
    const score = c => (c.bo && c.bu) ? Math.abs(1 / c.bo.dec - 1 / c.bu.dec) : 1 + Math.abs(((c.bo || c.bu).dec) - 1.91);
    const m = list.reduce((a, b) => score(b) < score(a) ? b : a);
    out.set(ps, {line:m.line, thr:Math.floor(m.line) + 1, bo:m.bo, bu:m.bu});
  });
  _propMain = {src:DATA.propOdds, val:out};
  return out;
}
function propMainFor(player, stat){ return propHasData() ? (propMainIndex().get(slipNorm(player) + '|' + stat) || null) : null; }
const PROP_BOOK_SHORT = {fanduel:'FD', draftkings:'DK', caesars:'CZR', betrivers:'BR', thescore:'theScore', hardrockbet:'HR'};
function propAmerican(dec){ return dec >= 2 ? '+' + Math.round((dec - 1) * 100) : String(Math.round(-100 / (dec - 1))); }
function propWanted(pick){
  if(pick.stat === 'Any TD') return {ou:'yes', line:null};
  const t = parseFloat(pick.threshold);
  if(!isFinite(t)) return null;
  if(pick.direction === 'under') return {ou:'under', line:t};
  if(pick.direction === 'over') return {ou:'over', line:t};
  return {ou:'over', line:t - 0.5};
}
function propPrice(pick){
  if(!propHasData() || !pick) return null;
  const want = propWanted(pick); if(!want) return null;
  const rows = propIndex().get(slipNorm(pick.player) + '|' + pick.stat);
  if(!rows || !rows.length) return null;
  const same = rows.filter(r => r.ou === want.ou);
  const exact = same.filter(r => want.line === null ? true : (r.line !== null && Math.abs(r.line - want.line) < 0.01));
  if(exact.length){
    const best = exact.reduce((a, b) => b.dec > a.dec ? b : a);
    const opp = rows.find(r => r.book === best.book && r.line === best.line && ((want.ou === 'over' && r.ou === 'under') || (want.ou === 'under' && r.ou === 'over')));
    const noVig = opp ? (1 / best.dec) / (1 / best.dec + 1 / opp.dec) : null;
    return {near:false, dec:best.dec, am:propAmerican(best.dec), book:best.book, books:new Set(exact.map(r => r.book)).size, implied:1 / best.dec, noVig, line:best.line, fetched:best.fetched};
  }
  if(want.line === null || !same.length) return null;
  const near = same.filter(r => r.line !== null).sort((a, b) => Math.abs(a.line - want.line) - Math.abs(b.line - want.line))[0];
  return near ? {near:true, dec:near.dec, am:propAmerican(near.dec), book:near.book, line:near.line, ou:want.ou, wantLine:want.line} : null;
}
// Price chip for a leg that has not started. Shows the best price across books and, when the dashboard can estimate the

function propChipHtml(pick){
  const pr = propPrice(pick);
  if(!pr) return propHasData() ? '<span style="color:var(--chalk-dim);">no line</span>' : '<span style="color:var(--chalk-dim);">--</span>';
  const bk = PROP_BOOK_SHORT[pr.book] || pr.book;
  if(pr.near) return `<span style="color:var(--chalk-dim);" title="No ${pr.ou} ${pr.wantLine} posted. Nearest line shown.">${pr.ou === 'over' ? 'o' : 'u'}${pr.line} ${pr.am} ${bk}</span>`;
  const est = estimatePickProbability(pick);
  const tip = `Best of ${pr.books} book${pr.books === 1 ? '' : 's'}. Book implies ${Math.round(pr.implied * 100)}%${pr.noVig ? ` (about ${Math.round(pr.noVig * 100)}% without the book's margin)` : ''}${est ? `. Dashboard estimate ${Math.round(est.probability * 100)}%` : ''}.`;
  return `<b title="${tip}">${pr.am}</b> <span style="color:var(--chalk-dim);">${bk}${pr.books > 1 ? ' +' + (pr.books - 1) : ''} &middot; ${Math.round(pr.implied * 100)}%</span>`;
}

// A parlay needs every leg to hit, so its probability is the product of
// each leg's -- and the single weakest leg is what drags the whole thing
// down the most. Only picks with a threshold (checker-saved) can be
// estimated; anything else is set aside rather than silently skipped.
function analyzeTicketOdds(picks){
  const estimable = [];
  const skipped = [];
  picks.forEach(pick=>{
    const est = estimatePickProbability(pick);
    if(est) estimable.push({...pick, est});
    else skipped.push(pick);
  });
  if(!estimable.length) return {estimable, skipped, parlayProbability: null, weakest: null};

  const parlayProbability = estimable.reduce((prod, p) => prod * p.est.probability, 1);
  const sorted = [...estimable].sort((a,b)=>a.est.probability - b.est.probability);
  const weakest = sorted[0];
  const withoutWeakest = estimable.filter(p=>p!==weakest).reduce((prod, p) => prod * p.est.probability, 1);
  return {estimable, skipped, parlayProbability, weakest, withoutWeakest};
}

// ---------- CLOUD SYNC (Supabase) ----------
// Keeps My Picks, tickets (with odds/wager), tombstones for deleted picks and the Best Picks record in a
// Supabase table so every device sees the same thing. The browser only calls two functions (sync_get /
// sync_put) with a secret sync code; the project URL and key are typed in once per device and kept in this
// browser only, never in the page's code. Local data always works without it.
// ---- YOUR SUPABASE PROJECT (optional) ----
// Set in config.js (a separate file you upload once; index.html updates never touch it), so nobody has to type them in the app.
// The anon key is designed to be public (the database rules protect the data), so it is safe in GitHub.
// NEVER paste the service_role / secret key here.
const SUPABASE_URL = String((window.NFL_CONFIG || {}).supabaseUrl || '').trim();
const SUPABASE_ANON_KEY = String((window.NFL_CONFIG || {}).supabaseAnonKey || '').trim();
const SUPABASE_BUILT_IN = /^https:\/\/.+/.test(SUPABASE_URL) && !!SUPABASE_ANON_KEY;
const SYNC_CFG_KEY = 'nfl_dashboard_sync_cfg';
const TOMB_KEY = 'nfl_dashboard_pick_tombstones';
let _syncTimer = null, _syncBusy = false;
const SYNC_STATE = {last:null, error:null, running:false};
function syncCfg(){ try { const c = JSON.parse(localStorage.getItem(SYNC_CFG_KEY) || 'null'); if(c && SUPABASE_BUILT_IN){ c.url = SUPABASE_URL; c.key = SUPABASE_ANON_KEY; } return c && c.url && c.key && c.code ? c : null; } catch(e){ return null; } }
function syncSetCfg(c){ try { if(c) localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(c)); else localStorage.removeItem(SYNC_CFG_KEY); } catch(e){} }
function pickIdentity(p){ return [p.source, p.player, p.stat, p.week, (p.threshold ?? ''), (p.direction || '')].join('|'); }
function getTombs(){ try { return JSON.parse(localStorage.getItem(TOMB_KEY) || '{}'); } catch(e){ return {}; } }
function addTomb(p){

  try { localStorage.setItem(TOMB_KEY, JSON.stringify(t)); } catch(e){}
}
function syncSchedule(){
  if(!syncCfg() && !acctSignedIn()) return;

  _syncTimer = setTimeout(syncRun, 1500);
}
function syncStamp(p){ const t = Date.parse(p.updatedAt || p.addedAt || ''); return isNaN(t) ? 0 : t; }
function syncMerge(a, b){
  b = b || {};
  const tombs = {...(b.tombs || {})};
  Object.entries(a.tombs || {}).forEach(([k, v]) => { tombs[k] = Math.max(tombs[k] || 0, v); });
  const map = new Map();
  [...(b.picks || []), ...(a.picks || [])].forEach(p => {
    const k = pickIdentity(p), cur = map.get(k);
    if(!cur){ map.set(k, p); return; }
    const win = syncStamp(p) >= syncStamp(cur) ? p : cur, lose = win === p ? cur : p;
    const out = {...win};
    if(typeof out.finalActual !== 'number' && typeof lose.finalActual === 'number'){ out.finalActual = lose.finalActual; out.finalStat = lose.finalStat; }
    map.set(k, out);
  });
  const picks = [...map.entries()].filter(([k, p]) => !(tombs[k] && tombs[k] > Date.parse(p.addedAt || 0))).map(([, p]) => p);
  const meta = {...(b.ticketMeta || {})};
  Object.entries(a.ticketMeta || {}).forEach(([k, v]) => { if(!meta[k] || (v.updatedAt || 0) >= (meta[k].updatedAt || 0)) meta[k] = v; });
  const hist = {...(b.bpHistory || {})};
  Object.entries(a.bpHistory || {}).forEach(([k, v]) => { if(!hist[k] || (typeof hist[k].finalActual !== 'number' && typeof v.finalActual === 'number')) hist[k] = v; });
  const names = [...new Set([...(b.ticketNames || []), ...(a.ticketNames || [])])];
  return {picks, tombs, ticketMeta: meta, bpHistory: hist, ticketNames: names};
}
function syncLocalState(){
  return {picks: getMyPicks(), tombs: getTombs(), ticketMeta: getTicketMeta(), bpHistory: bpHistGet(), ticketNames: getKnownTicketNames()};
}
function syncApply(m){
  try {
    localStorage.setItem(MY_PICKS_KEY, JSON.stringify(m.picks));
    localStorage.setItem(TOMB_KEY, JSON.stringify(m.tombs));
    localStorage.setItem(TICKET_META_KEY, JSON.stringify(m.ticketMeta));
    localStorage.setItem(BP_HISTORY_KEY, JSON.stringify(m.bpHistory));
    localStorage.setItem(TICKET_NAMES_KEY, JSON.stringify(m.ticketNames));

}
function syncCore(m){
  const sortKeys = o => Array.isArray(o) ? o.map(sortKeys) : (o && typeof o === 'object') ? Object.keys(o).sort().reduce((r, k) => (r[k] = sortKeys(o[k]), r), {}) : o;
  const core = {picks: [...(m.picks || [])].sort((x, y) => pickIdentity(x).localeCompare(pickIdentity(y))), tombs: m.tombs || {}, ticketMeta: m.ticketMeta || {}, bpHistory: m.bpHistory || {}, ticketNames: [...(m.ticketNames || [])].sort()};
  return JSON.stringify(sortKeys(core));
}
async function syncRpc(cfg, fn, body){
  const res = await fetch(cfg.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, {
    method: 'POST', headers: {apikey: cfg.key, Authorization: 'Bearer ' + cfg.key, 'Content-Type': 'application/json'}, body: JSON.stringify(body),
  });
  let json = null;
  try { json = await res.json(); } catch(e){}
  if(!res.ok) throw new Error((json && (json.message || json.hint)) || ('HTTP ' + res.status));
  return json;
}

async function syncRunAccount(){
  if(_syncBusy) return;

    const merged = syncMerge(syncLocalState(), remote);
    syncApply(merged);
    if(!remote || syncCore(merged) !== syncCore(remote)) await syncRpc(cfg, 'sync_put', {code: cfg.code, payload: merged});
    SYNC_STATE.last = new Date(); SYNC_STATE.error = null;
  } catch(e){
    SYNC_STATE.error = e.message || String(e);
  } finally {
    _syncBusy = false; SYNC_STATE.running = false;
    try { window.dispatchEvent(new Event('picks-synced')); } catch(e){}
  }
}

// can't be faked by what they type: only the picks they shared are counted. Everything is protected by row level
// security in supabase_accounts.sql, not by this page. Names, ticket names and picks come from other people, so they

const ACCT_KEY = 'nfl_dashboard_acct';

function frEsc(x){ return String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c])); }
function acctGet(){ let a = null; try { a = JSON.parse(localStorage.getItem(ACCT_KEY) || 'null'); } catch(e){} if(SUPABASE_BUILT_IN){ a = {...(a || {}), url: SUPABASE_URL, key: SUPABASE_ANON_KEY}; } return a; }

async function acctFetchRaw(a, path, opts){
  opts = opts || {};
  const headers = {apikey: a.key, 'Content-Type': 'application/json', Authorization: 'Bearer ' + (opts.token || a.key), ...(opts.headers || {})};
  const res = await fetch(a.url.replace(/\/+$/, '') + path, {method: opts.method || 'GET', headers, body: opts.body === undefined ? undefined : JSON.stringify(opts.body)});
  let json = null;
  try { const txt = await res.text(); json = txt ? JSON.parse(txt) : null; } catch(e){}
  if(!res.ok) throw new Error((json && (json.message || json.error_description || json.msg || json.hint || json.error)) || ('HTTP ' + res.status));
  return json;
}
function acctStoreSession(a, j){
  if(!j || !j.access_token) return false;
  a.session = {access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || (Math.floor(Date.now() / 1000) + (j.expires_in || 3600)), user: {id: j.user.id, email: j.user.email}};

}
async function acctToken(){
  const a = acctGet();

  try {
    const j = await acctFetchRaw(a, '/auth/v1/token?grant_type=refresh_token', {method:'POST', body:{refresh_token: a.session.refresh_token}});
    if(!acctStoreSession(a, j)) throw new Error('no session');
    return a.session.access_token;
  } catch(e){
    a.session = null; acctSet(a);
    throw new Error('Your session expired. Sign in again.');
  }
}
async function acctApi(path, opts){

function acctSharedPayload(ticket, picks, meta){

  if(!mine.length) return null;
  return {
    ticket, book: meta.book || '', odds: meta.odds || '', bonus: !!meta.bonus, stake: meta.shareStake ? (meta.stake || '') : '', payout: meta.shareStake ? (meta.payout || '') : '',
    picks: mine.slice(0, 40).map(p => ({player:p.player, position:p.position, team:p.team, opponent:p.opponent || '', stat:p.stat, week:String(p.week || ''),
      threshold:p.threshold, direction:p.direction || ''})),

const _pubHash = {};
async function acctPublish(){
  const uid = acctUserId();
  if(!uid) return;
  const picks = getMyPicks(), meta = getTicketMeta();
  const want = {};
  Object.entries(meta).forEach(([t, m]) => { if(m && m.share){ const d = acctSharedPayload(t, picks, m); if(d) want[t] = d; } });
  const rows = Object.entries(want).filter(([t, d]) => { const h = JSON.stringify(d); if(_pubHash[uid + '|' + t] === h) return false; _pubHash[uid + '|' + t] = h; return true; })
    .map(([t, d]) => ({user_id: uid, ticket: t, data: d, updated_at: new Date().toISOString()}));
  if(rows.length) await acctApi('/rest/v1/shared_tickets?on_conflict=user_id,ticket', {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body: rows});
  // Remove anything that is no longer shared.
  const mineNow = await acctApi('/rest/v1/shared_tickets?select=ticket&user_id=eq.' + uid);
  for(const r of (mineNow || [])){
    if(!want[r.ticket]){
      await acctApi('/rest/v1/shared_tickets?user_id=eq.' + uid + '&ticket=eq.' + encodeURIComponent(r.ticket), {method:'DELETE', headers:{Prefer:'return=minimal'}});
      delete _pubHash[uid + '|' + r.ticket];

// ---- Ticket money: book, odds, wager, payout ----
// Read from the screenshot when the slip shows them (editable on each ticket), so a ticket's result can be
// shown as dollars won or lost, not just legs hit.
const TICKET_META_KEY = 'nfl_dashboard_ticket_meta';
function getTicketMeta(){ try { return JSON.parse(localStorage.getItem(TICKET_META_KEY) || '{}'); } catch(e){ return {}; } }
function saveTicketMeta(m, quiet){ try { localStorage.setItem(TICKET_META_KEY, JSON.stringify(m)); } catch(e){} if(!quiet && window.syncSchedule) syncSchedule(); }
function setTicketMeta(ticket, patch){
  const m = getTicketMeta();
  m[ticket] = {...(m[ticket] || {}), ...patch, updatedAt: Date.now()};
  saveTicketMeta(m);
}
function americanProfit(stake, odds){
  const o = parseFloat(odds), st = parseFloat(stake);
  if(!isFinite(o) || !isFinite(st) || !o || st <= 0) return null;
  return o > 0 ? st * o / 100 : st * 100 / Math.abs(o);
}
// Won / lost / still open, in dollars when the wager is known.
function ticketOutcome(list, meta){
  const gs = list.map(gradeMyPick);
  if(!gs.length || gs.some(g => !g)) return {state:'unknown'};
  const miss = gs.some(g => g.status === 'MISS');
  const allHit = gs.every(g => g.status === 'HIT');
  const final = gs.every(g => g.status === 'HIT' || g.status === 'MISS') && gs.every(g => g.final || g.status === 'MISS' || (g.status === 'HIT' && g.live) );
  const stake = parseFloat(meta && meta.stake);
  const haveStake = isFinite(stake) && stake > 0;
  const bonus = !!(meta && meta.bonus);
  // A bonus bet costs nothing when it loses, and on a win pays only the winnings (the stake is not returned).
  if(miss) return {state:'lost', net: haveStake ? (bonus ? 0 : -stake) : null, stake: haveStake ? (bonus ? 0 : stake) : null, bonus};
  if(allHit && gs.every(g => g.final)){
    let ret = parseFloat(meta && meta.payout);
    if(!(isFinite(ret) && ret > 0)){ const pr = americanProfit(stake, meta && meta.odds); ret = pr === null ? null : (bonus ? pr : stake + pr); }
    return {state:'won', net: haveStake && ret !== null ? (bonus ? ret : ret - stake) : null, stake: haveStake ? (bonus ? 0 : stake) : null, ret, bonus};
  }
  const pr = haveStake ? americanProfit(stake, meta && meta.odds) : null;
  return {state:'open', toWin: pr, bonus, stake: haveStake ? stake : null, hitSoFar: gs.filter(g => g.status === 'HIT').length, legs: gs.length};
}

  if(!st) return '<div class="line-note">The price step has not reported yet. It writes a status line each time it really tries; if this stays empty after a manual run from the Actions tab, the new <code>run_daily.py</code> or <code>17_prop_odds.py</code> is not in the repo root.</div>';
  const ok = st.outcome === 'ok';
  return `<div class="player-preview-stats" style="border-left:3px solid ${ok ? 'var(--mint)' : 'var(--gold)'};padding-left:10px;"><b>Last attempt:</b> ${frEsc(st.ran_at)} &middot; <b style="color:${ok ? 'var(--mint)' : 'var(--gold)'};">${frEsc(st.outcome)}</b><br>${frEsc(st.detail)}</div>`;
}

    return `<div class="panel"><div class="panel-title">Prop Prices</div>
      <div class="panel-note">No prop prices loaded yet. They come from <code>17_prop_odds.py</code>, which the workflow runs on
      Thursdays and Sundays to save requests. Set up once: (1) add your key as a GitHub secret named <b>RAPIDAPI_KEY</b>

  }
  return `<div class="panel"><div class="panel-title">Prop Prices</div>

      <label class="ctl-label">Player <input type="text" id="pp-player" placeholder="search" style="width:150px;"></label>
      <label class="ctl-label"><input type="checkbox" id="pp-alt"> alternate lines</label>
      <label class="ctl-label"><input type="checkbox" id="pp-ana"> show the app's read</label>
    </div>
