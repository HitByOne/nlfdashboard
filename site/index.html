function mountMyPicks(){
  const container = $('#mypicks-table');
  const resultEl = $('#checker-result');

  // Team dropdown + cascading player dropdown (filtered by team and
  // position), instead of free-text typing -- avoids typos/ambiguity.
  const allTeams = [...new Set((DATA.playerGame || []).map(r=>r.Team))].sort();
  $('#checker-team').innerHTML = '<option value="">All teams</option>' +
    allTeams.map(t=>`<option value="${t}">${teamName(t)}</option>`).join('');

  function refreshCheckerPlayerList(){
    const team = $('#checker-team').value;
    const position = $('#checker-position').value;
    const players = [...new Set(
      (DATA.playerGame || [])
        .filter(r=> (!team || r.Team===team) && (!position || r.Position===position))
        .map(r=>r.Player)
    )].sort();
    const playerSelect = $('#checker-player');
    const previousValue = playerSelect.value;
    playerSelect.innerHTML = '<option value="">Select a player...</option>' +
      players.map(p=>`<option value="${p}">${p}</option>`).join('');
    if(players.includes(previousValue)) playerSelect.value = previousValue;
  }
  refreshCheckerPlayerList();
  $('#checker-team').addEventListener('change', refreshCheckerPlayerList);
  $('#checker-position').addEventListener('change', refreshCheckerPlayerList);

  $('#checker-btn').addEventListener('click', ()=>{
    const player = $('#checker-player').value.trim();
    const statKey = $('#checker-stat').value;
    const threshold = parseFloat($('#checker-threshold').value);

    if(!player || isNaN(threshold)){
      resultEl.innerHTML = '<div class="empty">Select a player and enter a number to check.</div>';
      return;
    }

    const posRow = (DATA.playerGame || []).find(r=>r.Player===player);
    if(!posRow){
      resultEl.innerHTML = `<div class="empty">No games logged for "${player}".</div>`;
      return;
    }
    const position = posRow.Position;
    const team = posRow.Team;

    const playerRate = getPlayerStatFloorRate(player, position, statKey, threshold);
    if(!playerRate){
      resultEl.innerHTML = `<div class="empty">No games logged for ${player} at ${position} yet.</div>`;
      return;
    }

    const wk2Row = (DATA.week2 || []).find(r=>r.Team===team);
    const opponent = wk2Row ? wk2Row.Opponent : null;
    const defenseRate = opponent ? getDefenseLeadPlayerFloorRate(opponent, position, statKey, threshold) : null;

    resultEl.innerHTML = `
      <div class="log-pos-group">
        <div class="log-pos-label" style="font-size:14px;">${player} (${position}, ${teamName(team)}) -- ${threshold}+ ${statKey}</div>
        <div class="player-preview-stats">${player} has hit ${threshold}+ ${statKey} in <b style="color:var(--mint);">${playerRate.hits} of ${playerRate.total}</b> games this season (${fmt(playerRate.rate*100,0)}%)</div>
        ${defenseRate ? `
          <div class="player-preview-stats">${teamName(opponent)} (their upcoming opponent) has allowed ${threshold}+ ${statKey} to the opposing lead ${position} in <b style="color:var(--mint);">${defenseRate.hits} of ${defenseRate.total}</b> games (${fmt(defenseRate.rate*100,0)}%)</div>
        ` : `<div class="player-preview-stats" style="color:var(--chalk-dim);">No upcoming opponent loaded for ${team} yet -- showing player's own rate only.</div>`}
        ${opponent && wk2Row.Week ? (()=>{
          const saved = isPickSaved({source:'Custom Checker', player, stat:statKey, week:wk2Row.Week, threshold});
          const summary = `${threshold}+ ${statKey} vs ${opponent} (Wk ${wk2Row.Week})`;
          return `<button class="save-pick-btn" style="margin-top:8px;" ${saved?'disabled':''}
            data-player="${player}" data-position="${position}" data-team="${team}" data-opponent="${opponent}"
            data-stat="${statKey}" data-week="${wk2Row.Week}" data-threshold="${threshold}"
            data-summary="${summary.replace(/"/g,'&quot;')}">${saved?'&#10003; Saved -- check My Picks after the game':'+ Add to My Picks'}</button>`;
        })() : `<div class="player-preview-stats" style="color:var(--chalk-dim);">No upcoming week loaded for ${team} yet, so this can't be saved for grading.</div>`}
      </div>`;

    const saveBtn = resultEl.querySelector('.save-pick-btn');
    if(saveBtn) saveBtn.addEventListener('click', ()=>{
      addToMyPicks({
        source: 'Custom Checker', player: saveBtn.dataset.player, position: saveBtn.dataset.position,
        team: saveBtn.dataset.team, opponent: saveBtn.dataset.opponent, stat: saveBtn.dataset.stat,
        week: saveBtn.dataset.week, threshold: parseFloat(saveBtn.dataset.threshold), summary: saveBtn.dataset.summary,
      });
      $('#checker-btn').click(); // redraw the result so the button flips to "Saved"
    });
  });

  $('#new-ticket-btn').addEventListener('click', ()=>{
    const name = $('#new-ticket-name').value.trim();
    if(!name){
      alert('Enter a ticket name first.');
      return;
    }
    addNewTicketName(name);
    $('#new-ticket-name').value = '';
    apply();
  });

  $('#clear-all-picks-btn').addEventListener('click', ()=>{
    if(confirm('Clear all saved picks? This cannot be undone.')){
      saveMyPicksList([]);
      apply();
    }
  });

  function apply(){
    const picks = getMyPicks();
    if(!picks.length){
      container.innerHTML = '<div class="empty">No picks saved yet -- use the "+ Add" button on Best Picks, Predictions, or Team Game Log.</div>';
      return;
    }

    const ticketNames = getAllTicketNames();
    const byTicket = {};
    ticketNames.forEach(t=>{ byTicket[t] = []; });
    picks.forEach(p=>{
      const t = p.ticket || 'Ticket A';
      if(!byTicket[t]) byTicket[t] = [];
      byTicket[t].push(p);
    });

    const nonEmptyTickets = Object.entries(byTicket).filter(([,list])=>list.length);
    if(!nonEmptyTickets.length){
      container.innerHTML = '<div class="empty">No picks saved yet -- use the "+ Add" button on Best Picks, Predictions, or Team Game Log.</div>';
      return;
    }

    container.innerHTML = nonEmptyTickets.map(([ticket, list])=>{
      const safeId = ticket.replace(/[^a-zA-Z0-9]/g, '_');
      const graded = list.map(gradeMyPick).filter(Boolean);
      const hits = graded.filter(g=>g.status==='HIT').length;
      const misses = graded.filter(g=>g.status==='MISS').length;
      const pending = graded.filter(g=>g.status==='PENDING').length;
      let summaryLine = '';
      if(graded.length){
        if(misses > 0) summaryLine = `<span style="color:var(--red);">${misses} leg${misses===1?'':'s'} missed</span> &middot; ${hits} hit &middot; ${pending} pending`;
        else if(pending > 0) summaryLine = `${hits} of ${graded.length} graded legs hit so far &middot; <span style="color:var(--chalk-dim);">${pending} still pending</span>`;
        else summaryLine = `<span style="color:var(--mint);">All ${hits} graded legs hit</span>`;
      }

      // Pre-game likelihood, separate from the post-game Result column above --
      // this is a season-rate estimate for legs that haven't played yet (or
      // are still useful context even once some have).
      const odds = analyzeTicketOdds(list);
      let oddsHtml = '';
      if(odds.estimable.length){
        const legRows = [...odds.estimable].sort((a,b)=>a.est.probability - b.est.probability).map(p=>{
          const pct = fmt(p.est.probability * 100, 0);
          const isWeakest = p === odds.weakest;
          const color = p.est.probability >= 0.65 ? 'var(--mint)' : p.est.probability <= 0.35 ? 'var(--red)' : 'var(--chalk)';
          const defPart = p.est.defenseRate
            ? `, ${teamName(p.opponent)} allows it in ${p.est.defenseRate.hits}/${p.est.defenseRate.total} games`
            : ' (no opponent data -- player rate only)';
          return `<div class="player-preview-stats">${isWeakest ? '&#9888; ' : ''}<b style="color:${color};">${pct}%</b> -- ${p.player} ${pickLegLabel(p)} (own rate ${p.est.playerRate.hits}/${p.est.playerRate.total}${defPart})${isWeakest ? ' <span style="color:var(--red);">weakest leg</span>' : ''}</div>`;
        }).join('');

        const parlayPct = fmt(odds.parlayProbability * 100, 1);
        const withoutPct = odds.estimable.length > 1 ? fmt(odds.withoutWeakest * 100, 1) : null;
        oddsHtml = `
          <div class="log-pos-group" style="margin-top:10px;margin-bottom:0;">
            <div class="log-pos-label">Pre-Game Likelihood Estimate (${odds.estimable.length} of ${list.length} legs, based on season rates -- not a graded result)</div>
            ${legRows}
            <div class="player-preview-stats" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--hash-line);">
              All ${odds.estimable.length} legs hitting together: <b style="color:var(--gold);">~${parlayPct}%</b>
              ${withoutPct ? ` &middot; without the weakest leg (${odds.weakest.player} ${pickLegLabel(odds.weakest)}): <b style="color:var(--mint);">~${withoutPct}%</b>` : ''}
            </div>
            ${(odds.weakest && odds.estimable.length > 1) ? `<div class="player-preview-stats" style="color:var(--red);">Consider removing ${odds.weakest.player} ${pickLegLabel(odds.weakest)} -- it's the weakest link at ~${fmt(odds.weakest.est.probability*100,0)}%, and cutting it raises the rest hitting together from ~${parlayPct}% to ~${withoutPct}%.</div>` : ''}
            ${odds.skipped.length ? `<div class="player-preview-stats" style="color:var(--chalk-dim);">${odds.skipped.length} other pick${odds.skipped.length===1?'':'s'} in this ticket ${odds.skipped.length===1?"wasn't":"weren't"} saved with a specific number, so ${odds.skipped.length===1?"it isn't":"they aren't"} included here.</div>` : ''}
          </div>`;
      }

      return `
      <div class="log-pos-group" style="margin-bottom:16px;">
        <div class="log-pos-label" style="font-size:14px;">${ticket} (${list.length} pick${list.length===1?'':'s'})${summaryLine ? ` -- ${summaryLine}` : ''}</div>
        <div class="table-scroll" id="ticket-table-${safeId}"></div>
        ${oddsHtml}
      </div>`;
    }).join('');

    // Re-wired after every render of a ticket's table (including re-sorts).
    function wireTicketControls(tableContainer){
      $$('.move-pick-select', tableContainer).forEach(sel=>{
        sel.addEventListener('change', ()=>{
          moveMyPickToTicket(parseInt(sel.dataset.moveIdx, 10), sel.value);
          apply();
        });
      });
      $$('.save-pick-btn', tableContainer).forEach(btn=>{
        if(btn.dataset.removeIdx === undefined) return;
        btn.addEventListener('click', ()=>{
          removeFromMyPicks(parseInt(btn.dataset.removeIdx, 10));
          apply();
        });
      });
      $$('.save-pick-btn[data-save-edit-idx]', tableContainer).forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const idx = parseInt(btn.dataset.saveEditIdx, 10);
          const input = tableContainer.querySelector(`.edit-threshold-input[data-edit-idx="${idx}"]`);
          const newThreshold = parseFloat(input.value);
          if(isNaN(newThreshold)){ alert('Enter a valid number.'); return; }
          editMyPickThreshold(idx, newThreshold);
          apply();
        });
      });
      // Enter key in the number box saves too, without needing the button.
      $$('.edit-threshold-input', tableContainer).forEach(input=>{
        input.addEventListener('keydown', (e)=>{
          if(e.key !== 'Enter') return;
          const idx = parseInt(input.dataset.editIdx, 10);
          const newThreshold = parseFloat(input.value);
          if(isNaN(newThreshold)){ alert('Enter a valid number.'); return; }
          editMyPickThreshold(idx, newThreshold);
          apply();
        });
      });
    }

    nonEmptyTickets.forEach(([ticket, list])=>{
      const safeId = ticket.replace(/[^a-zA-Z0-9]/g, '_');
      const tableContainer = document.getElementById(`ticket-table-${safeId}`);
      const cols = [
        {key:'source', label:'Source'},
        {key:'player', label:'Player'},
        {key:'position', label:'Pos'},
        {key:'team', label:'Team', render:teamChip},
        {key:'opponent', label:'Opp', render:teamChip},
        {key:'stat', label:'Stat'},
        {key:'week', label:'Wk', numeric:true},
        {key:'summary', label:'Details'},
        {key:'_edit', label:'Number', render:(v,row)=>{
          const idx = picks.indexOf(row);
          if(row.threshold === undefined || row.threshold === null || row.threshold === ''){
            return '<span style="color:var(--chalk-dim);">--</span>';
          }
          return `<span style="white-space:nowrap;">
            <input type="number" class="edit-threshold-input" data-edit-idx="${idx}" value="${row.threshold}" style="width:64px;">
            <button class="save-pick-btn" data-save-edit-idx="${idx}">Save</button>
          </span>`;
        }},
        {key:'_result', label:'Result', render:(v,row)=>{
          const g = gradeMyPick(row);
          if(!g) return '<span style="color:var(--chalk-dim);">--</span>';
          if(g.status === 'PENDING') return '<span style="color:var(--chalk-dim);">Pending</span>';
          const color = g.status === 'HIT' ? 'var(--mint)' : 'var(--red)';
          return `<span style="color:${color};font-weight:700;">${g.status}</span> <span style="color:var(--chalk-dim);">(${fmt(g.actual)} actual)</span>`;
        }},
        {key:'_move', label:'Move to', render:(v,row)=>{
          const idx = picks.indexOf(row);
          return `<select class="move-pick-select" data-move-idx="${idx}">${ticketNames.map(t=>`<option value="${t}" ${t===ticket?'selected':''}>${t}</option>`).join('')}</select>`;
        }},
        {key:'_remove', label:'', render:(v,row)=>{
          const idx = picks.indexOf(row);
          return `<button class="save-pick-btn" data-remove-idx="${idx}">Remove</button>`;
        }},
      ];
      buildTable(tableContainer, cols, list, {defaultSort:'week', defaultDir:'desc', onRender: wireTicketControls});
    });
  }

  apply();
}

// ---------- TAB: MIKE'S TEMPLATE ----------
// Implements a specific weekly selection methodology in full: find a clear
// game-script favorite (moderate spread) facing a run defense that's below
// average, with a bell-cow RB getting real touch volume, and build
// conservative floor-based tickets around that -- explicitly avoiding
// anytime-TD props and anything beyond a 2-leg ticket.
//
// The spread/touch-volume checks below are shown as CONTEXT, not a hard
// AND-gate -- requiring all three simultaneously (moderate spread + bottom-
// half run D + 15+ touches) left almost nothing this early in a season.
// The real signal this version leans on is convergence: a player's own
// season hit rate at a yardage floor AND the opponent's own history of
// giving up that much to the opposing lead back, checked together across a
// range of thresholds, surfacing whichever floor is genuinely strong on
// both sides -- not just a defense's season-average rank.
const TEMPLATE_SPREAD_MIN = 3, TEMPLATE_SPREAD_MAX = 7.5;
const TEMPLATE_MIN_TOUCHES = 15;
const TEMPLATE_STRONG_RATE = 0.65; // "genuinely strong" hit rate threshold on both sides

// Which stat and which floor candidates to test, per position.
const TEMPLATE_STAT_BY_POS = {
  QB: {key:'Pass Yards', floors:[200, 225, 250, 275, 300, 325, 350]},
  RB: {key:'Rush Yards', floors:[40, 50, 60, 70, 80, 90, 100]},
  WR: {key:'Receiving Yards', floors:[40, 50, 60, 70, 80, 90, 100]},
  TE: {key:'Receiving Yards', floors:[30, 40, 50, 60, 70, 80]},
};

// The Spread column is a single shared string like "DAL -3.5" (team +
// number), not a separately-signed value per team row -- parse it and
// return the correct signed spread for whichever team is asked about
// (negative = favored, positive = underdog), regardless of which team the
// string itself is anchored to.
function parseSpreadForTeam(team, spreadStr){
  if(!spreadStr) return null;
  const match = String(spreadStr).trim().match(/^([A-Za-z]+)\s*([+-]?\d+\.?\d*)$/);
  if(!match) return null;
  const anchorTeam = match[1].toUpperCase();
  const value = parseFloat(match[2]);
  if(isNaN(value)) return null;
  return anchorTeam === team ? value : -value;
}

function isBottomHalfRunDefense(team){
  const rows = (DATA.defVsPos || []).filter(r=>r.Position==='RB');
  if(!rows.length) return null;
  const values = rows.map(r=>num(r['Rush Yards Allowed Per Game'])).sort((a,b)=>a-b);
  const median = values[Math.floor(values.length/2)];
  const teamRow = rows.find(r=>r.Defense===team);
  if(!teamRow) return null;
  const teamValue = num(teamRow['Rush Yards Allowed Per Game']);
  return {isBottomHalf: teamValue > median, teamValue, leagueMedian: median};
}

// The team's highest-volume player at a given position -- volume defined
// by whatever's most relevant to that position (pass attempts for QB,
// touches for RB, targets for WR/TE).
function getTeamTopVolumePlayer(team, position){
  const byPlayer = {};
  (DATA.playerGame || []).filter(r=>r.Team===team && r.Position===position).forEach(r=>{
    if(!byPlayer[r.Player]) byPlayer[r.Player] = {player:r.Player, games:[]};
    byPlayer[r.Player].games.push(r);
  });
  const withVolume = Object.values(byPlayer).map(p=>{
    let totalVolume;
    if(position === 'QB') totalVolume = p.games.reduce((s,g)=>s+num(g['Pass Attempts']),0);
    else if(position === 'RB') totalVolume = p.games.reduce((s,g)=>s+num(g['Rush Attempts'])+num(g['Receptions']),0);
    else totalVolume = p.games.reduce((s,g)=>s+num(g['Targets']),0);
    return {...p, avgVolume: totalVolume / p.games.length};
  });
  withVolume.sort((a,b)=>b.avgVolume-a.avgVolume);
  return withVolume[0] || null;
}

// Centralized so "Any TD" (a combined Rush TD + Receiving TD event, not a
// single CSV column) only needs to be special-cased once, here -- every
// grading/estimating function below reads a stat value through this
// instead of indexing playerGame rows directly.
function getStatValue(row, statKey){
  return statKey === 'Any TD' ? num(row['Rush TD']) + num(row['Receiving TD']) : num(row[statKey]);
}

function getPlayerStatFloorRate(player, position, statKey, threshold){
  const games = (DATA.playerGame || []).filter(r=>r.Player===player && r.Position===position);
  if(!games.length) return null;
  const hits = games.filter(g=>getStatValue(g, statKey) >= threshold).length;
  return {hits, total: games.length, rate: hits / games.length};
}

// The defense's own history: for every game they've played, what did the
// OPPOSING team's leading player AT THIS POSITION actually gain in this
// stat? Then check how often that leading number has cleared a given
// threshold -- "has this defense given up 70+ to the opposing lead back in
// every game" (or 250+ passing to the opposing QB, or 70+ receiving to the
// opposing WR1) is a much sharper, game-by-game signal than a season-
// average allowed rank.
function getDefenseLeadPlayerFloorRate(defense, position, statKey, threshold){
  const rows = (DATA.playerGame || []).filter(r=>r.Opponent===defense && r.Position===position);
  const byWeek = {};
  rows.forEach(r=>{
    const wk = r.Week;
    const val = getStatValue(r, statKey);
    if(!(wk in byWeek) || val > byWeek[wk]) byWeek[wk] = val;
  });
  const weeklyMax = Object.values(byWeek);
  if(!weeklyMax.length) return null;
  const hits = weeklyMax.filter(v=>v >= threshold).length;
  return {hits, total: weeklyMax.length, rate: hits / weeklyMax.length};
}

// Find the highest floor where BOTH the player's own hit rate AND the
// defense's history of giving up that much to the lead player at this
// position are strong -- that's the genuine convergence pick, not just a
// low, easy number.
function findBestConvergenceFloor(player, position, statKey, floors, defense){
  let best = null;
  floors.forEach(threshold=>{
    const playerRate = getPlayerStatFloorRate(player, position, statKey, threshold);
    const defenseRate = getDefenseLeadPlayerFloorRate(defense, position, statKey, threshold);
    if(!playerRate || !defenseRate) return;
    if(playerRate.rate >= TEMPLATE_STRONG_RATE && defenseRate.rate >= TEMPLATE_STRONG_RATE){
      if(!best || threshold > best.threshold) best = {threshold, playerRate, defenseRate};
    }
  });
  return best;
}

function computeMikesTemplatePicks(){
  const games = new Map();
  (DATA.week2 || []).forEach(r=>{
    const gid = r['Game ID'];
    if(!gid) return;
    if(!games.has(gid)) games.set(gid, {sides:{}});
    const isHome = r['Home/Away'] === 'Home';
    games.get(gid).sides[isHome ? 'home' : 'away'] = r;
  });
  const gameList = [...games.values()].filter(g=>g.sides.home && g.sides.away);

  const results = [];
  gameList.forEach(g=>{
    const home = g.sides.home, away = g.sides.away;
    const spreadStr = home.Spread || away.Spread || '';

    [[home.Team, away.Team], [away.Team, home.Team]].forEach(([team, opponent])=>{
      PICKS_POSITIONS.forEach(position=>{
        const statCfg = TEMPLATE_STAT_BY_POS[position];
        const topPlayer = getTeamTopVolumePlayer(team, position);
        if(!topPlayer) return;

        const convergence = findBestConvergenceFloor(topPlayer.player, position, statCfg.key, statCfg.floors, opponent);
        if(!convergence) return; // no threshold cleared the bar on both sides -- not shown at all

        const spread = parseSpreadForTeam(team, spreadStr);
        const runDef = position === 'RB' ? isBottomHalfRunDefense(opponent) : null;

        results.push({
          team, opponent, position, statLabel: statCfg.key, week: home.Week,
          spread, spreadInRange: spread !== null && spread <= -TEMPLATE_SPREAD_MIN && spread >= -TEMPLATE_SPREAD_MAX,
          runDef,
          player: topPlayer.player, avgVolume: topPlayer.avgVolume,
          touchesMet: position === 'RB' ? topPlayer.avgVolume >= TEMPLATE_MIN_TOUCHES : null,
          convergence,
        });
      });
    });
  });

  // Strongest convergence first: higher floor, then higher combined hit rate.
  results.sort((a,b)=>
    b.convergence.threshold - a.convergence.threshold ||
    (b.convergence.playerRate.rate + b.convergence.defenseRate.rate) - (a.convergence.playerRate.rate + a.convergence.defenseRate.rate)
  );
  return results;
}

function renderMikesTemplate(){
  return `
  <div class="panel">
    <div class="panel-title">Mike's Template</div>
    <div class="panel-note">
      The core signal here is convergence, applied across every skill position: a player's own season hit
      rate at a stat floor (rush yards for RB, receiving yards for WR/TE, pass yards for QB) AND this
      specific opponent's history of giving up that much to the opposing lead player at that position in
      every game so far -- checked across a range of floors so the line shown is the highest one that's
      genuinely strong on both sides, not just an easy number. Spread (-3 to -7.5) and volume are shown as
      context, not a hard requirement -- this early in a season, demanding everything at once left almost
      nothing. <b>Line context:</b> offensive-line health and the pass-protection / run-blocking matchup
      come from the Line Play data (the official injury report cross-referenced with snap counts, so
      "starters" are the five linemen who actually play the most). It's shown as context, not a
      requirement -- it doesn't change which players qualify.
    </div>
    <div id="mikes-template-list"></div>
  </div>`;
}

// ---------- TAB: ANYTIME TD PROPS ----------
// Same convergence philosophy as Mike's Template, applied to touchdowns
// specifically: for each team, which player is most likely to score,
// based on their own season rate of scoring at least one TD (rushing or
// receiving combined) AND how often the upcoming opponent has allowed
// ANY player at that position to score against them, game by game.
const TD_STRONG_RATE = 0.5; // lower bar than yardage floors -- TDs are inherently rarer events

function getPlayerAnytimeTDRate(player, position){
  const games = (DATA.playerGame || []).filter(r=>r.Player===player && r.Position===position);
  if(!games.length) return null;
  const hits = games.filter(g => (num(g['Rush TD']) + num(g['Receiving TD'])) >= 1).length;
  return {hits, total: games.length, rate: hits / games.length};
}

// Per week, did ANY opposing player at this position score against this
// defense? Rate across all their games so far.
function getDefenseAllowsAnyTDRate(defense, position){
  const rows = (DATA.playerGame || []).filter(r=>r.Opponent===defense && r.Position===position);
  const byWeek = {};
  rows.forEach(r=>{
    const wk = r.Week;
    const scored = (num(r['Rush TD']) + num(r['Receiving TD'])) >= 1 ? 1 : 0;
    byWeek[wk] = Math.max(byWeek[wk] || 0, scored);
  });
  const weeks = Object.values(byWeek);
  if(!weeks.length) return null;
  const hits = weeks.filter(v=>v >= 1).length;
  return {hits, total: weeks.length, rate: hits / weeks.length};
}

function computeAnytimeTDPicks(){
  const games = new Map();
  (DATA.week2 || []).forEach(r=>{
    const gid = r['Game ID'];
    if(!gid) return;
    if(!games.has(gid)) games.set(gid, {sides:{}});
    const isHome = r['Home/Away'] === 'Home';
    games.get(gid).sides[isHome ? 'home' : 'away'] = r;
  });
  const gameList = [...games.values()].filter(g=>g.sides.home && g.sides.away);

  const results = [];
  gameList.forEach(g=>{
    const home = g.sides.home.Team, away = g.sides.away.Team;
    const week = g.sides.home.Week;

    [[home, away], [away, home]].forEach(([team, opponent])=>{
      // Every eligible skill player on the team is a candidate, not just
      // the top-volume one -- a WR2 who scores often is still relevant here.
      const players = [...new Set(
        (DATA.playerGame || []).filter(r=>r.Team===team && PICKS_POSITIONS.includes(r.Position)).map(r=>r.Player)
      )];

      let best = null;
      players.forEach(player=>{
        if(isPlayerOut(player)) return;
        const posRow = (DATA.playerGame || []).find(r=>r.Player===player && r.Team===team);
        const position = posRow.Position;

        const playerRate = getPlayerAnytimeTDRate(player, position);
        const defenseRate = getDefenseAllowsAnyTDRate(opponent, position);
        if(!playerRate || !defenseRate) return;

        const score = playerRate.rate * defenseRate.rate;
        if(!best || score > best.score){
          best = {player, position, playerRate, defenseRate, score};
        }
      });

      if(!best || best.score <= 0) return;
      results.push({team, opponent, week, ...best});
    });
  });

  results.sort((a,b)=>b.score-a.score);
  return results;
}

function renderAnytimeTD(){
  return `
  <div class="panel">
    <div class="panel-title">Anytime TD Props</div>
    <div class="panel-note">
      For each team, the player most likely to score based on two things multiplied together: their own
      season rate of scoring at least one TD (rushing or receiving combined) per game, and how often the
      upcoming opponent has let ANY player at that position score against them, game by game. Out/Doubtful
      players are excluded. TD scoring is inherently streaky and lower-sample than yardage stats -- treat
      these as a starting point for research, not a settled answer.
    </div>
    <div id="anytime-td-list"></div>
  </div>`;
}

function mountAnytimeTD(){
  const container = $('#anytime-td-list');
  const picks = computeAnytimeTDPicks();

  if(!picks.length){
    container.innerHTML = '<div class="empty">No strong anytime-TD signals yet -- check back once more games/stats are logged.</div>';
    return;
  }

  // "Any TD" is graded as Rush TD + Receiving TD >= 1 -- getStatValue (used
  // by gradeMyPick/estimatePickProbability) already knows this special stat
  // name, so these picks plug straight into the same grading/likelihood
  // system every other threshold pick uses, with threshold fixed at 1.
  function wireAnytimeTDSaves(tableContainer){

  const cols = [

    {key:'_defenseRate', label:'Opp Allows TD Rate', numeric:true, render:(v,row)=>`${row.defenseRate.hits}/${row.defenseRate.total} (${fmt(row.defenseRate.rate*100,0)}%)`},
    {key:'score', label:'Combined', numeric:true, render:v=>fmt(v*100,0)+'%'},
    {key:'_save', label:'', render:(v,row)=>{

      const summary = `Anytime TD vs ${teamName(row.opponent)} (Wk ${row.week}) -- own rate ${fmt(row.playerRate.rate*100,0)}%, opp allows ${fmt(row.defenseRate.rate*100,0)}%`;
      return `<button class="save-pick-btn" ${saved?'disabled':''}
        data-player="${row.player}" data-position="${row.position}" data-team="${row.team}" data-opponent="${row.opponent}"
        data-week="${row.week}" data-summary="${summary.replace(/"/g,'&quot;')}">${saved?'&#10003;':'+ Add'}</button>`;

// ---------- TAB: LIVE NOW ----------
// Real-time box scores pulled straight from ESPN in the browser -- the same
// host and mechanism the ticker already uses. The daily pipeline can't do
// this: it deliberately records a week only once EVERY game in it is
// finished (so it never grabs a half-played Monday night slate), which
// means in-progress games only exist in ESPN's live feed. Players are
// grouped by stat category exactly like a printed box score, because
// ESPN's live boxscore doesn't label positions.
const ESPN_SUMMARY_URL = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=';
const LIVE_NOW_REFRESH_MS = 45000;
const liveNowFinalCache = {};   // a final game's box score never changes again -- fetch it once

// LIVE-NOW-HELPERS-START
const LIVE_NOW_CATEGORIES = ['passing','rushing','receiving'];
const LIVE_NOW_TEAM_STATS = [
  ['totalyards','Total Yds'], ['netpassingyards','Pass Yds'], ['rushingyards','Rush Yds'],
  ['turnovers','TO'], ['thirddowneff','3rd Down'], ['possessiontime','TOP'],
];

function liveCategoryTableHtml(cat){
  const athletes = cat.athletes || [];
  if(!athletes.length) return '';
  const labels = cat.labels || [];
  return `
    <div class="log-pos-group">
      <div class="log-pos-label">${String(cat.displayName || cat.name || '').toUpperCase()}</div>
      <div class="table-scroll"><table>
        <thead><tr><th>Player</th>${labels.map(l=>`<th class="num">${l}</th>`).join('')}</tr></thead>
        <tbody>${athletes.map(a=>`<tr><td>${(a.athlete || {}).displayName || '?'}</td>${(a.stats || []).map(v=>`<td class="num">${v}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
    </div>`;
}

// Picks a handful of headline team stats out of ESPN's team statistics list,
// matched by ESPN's own stat name. Anything not present is simply skipped.
function livePickTeamStats(statsArr){
  const byName = {};
  (statsArr || []).forEach(x=>{ byName[String(x.name || '').toLowerCase()] = x; });
  return LIVE_NOW_TEAM_STATS
    .map(([needle, label]) => byName[needle] ? `${label} ${byName[needle].displayValue}` : null)
    .filter(Boolean);
}

// Live games first, then finals, then upcoming; kickoff order within each.
function liveSortGames(games){
  const order = {in:0, post:1, pre:2};
  return [...games].sort((a,b)=>
    (order[a.state] ?? 3) - (order[b.state] ?? 3) || new Date(a.date) - new Date(b.date)
  );
}

function liveGameFromEvent(ev, summary){
  const comp = (ev.competitions || [])[0] || {};
  const competitors = comp.competitors || [];
  const home = competitors.find(c=>c.homeAway==='home') || {};
  const away = competitors.find(c=>c.homeAway==='away') || {};
  const statusType = (ev.status || {}).type || {};
  return {
    id: ev.id, date: ev.date,
    home: (home.team || {}).abbreviation || '?', away: (away.team || {}).abbreviation || '?',
    homeScore: home.score, awayScore: away.score,
    state: statusType.state || 'pre', detail: statusType.shortDetail || '',
    summary,
  };
}

function liveGameCardHtml(g){
  const statusLabel = g.state === 'in' ? (g.detail || 'LIVE') : g.state === 'post' ? 'Final' : (g.detail || 'Upcoming');
  const scoreHtml = g.state === 'pre' ? '' :
    `<div class="matchup-time" style="font-size:16px;color:var(--chalk);">${g.awayScore} &ndash; ${g.homeScore}</div>`;
  const box = (g.summary || {}).boxscore || {};

  function teamColumn(abbr){
    const playerBlock = (box.players || []).find(b => (b.team || {}).abbreviation === abbr);
    const teamBlock = (box.teams || []).find(b => (b.team || {}).abbreviation === abbr);
    const chips = livePickTeamStats((teamBlock || {}).statistics);
    const tables = playerBlock
      ? (playerBlock.statistics || [])
          .filter(c => LIVE_NOW_CATEGORIES.includes(String(c.name || '').toLowerCase()))
          .map(liveCategoryTableHtml).join('')
      : '';
    return `
      <div class="matchup-side-label"><b>${abbr}</b> ${teamName(abbr)}</div>
      ${chips.length ? `<div class="context-row"><span class="context-chip">${chips.join(' &middot; ')}</span></div>` : ''}
      ${tables || '<div class="empty" style="padding:8px 0;">No player stats yet.</div>'}`;
  }

  return `
  <div class="matchup-card" data-away="${g.away}" data-home="${g.home}" data-state="${g.state}">
    <div class="matchup-head">
      <div class="matchup-teams">${teamName(g.away)}<span class="at">@</span>${teamName(g.home)}</div>
      <div style="display:flex;align-items:center;gap:12px;">
        ${scoreHtml}
        <span class="live-chip live-${g.state}">${statusLabel}</span>
      </div>
    </div>
    ${g.state === 'pre' ? '' : `
    <div class="matchup-body">
      <div class="matchup-side">${teamColumn(g.away)}</div>
      <div class="matchup-side">${teamColumn(g.home)}</div>
    </div>`}
  </div>`;
}

function renderLiveNow(){

  <div class="panel">
    <div class="panel-title">Live Now</div>
    <div class="panel-note">
      Real-time box scores pulled straight from ESPN in your browser -- separate from the daily pipeline,
      which only records a week once every game in it is finished. Refreshes automatically every 45
      seconds while this tab is open. Players are grouped by stat category like a printed box score,
      since ESPN's live feed doesn't label positions.
    </div>
    <div class="controls">
      <div class="pill-group" id="livenow-pills">
        <span class="pill active" data-f="all">All</span>
        <span class="pill" data-f="in">Live</span>
        <span class="pill" data-f="post">Final</span>
        <span class="pill" data-f="pre">Upcoming</span>
      </div>
      <button class="save-pick-btn" id="livenow-refresh">Refresh now</button>
      <span id="livenow-updated" style="font-family:var(--mono);font-size:11px;color:var(--chalk-dim);"></span>
    </div>
    <div class="matchup-grid single-col" id="livenow-list"><div class="empty">Loading live games&hellip;</div></div>
  </div>`;
}

function mountLiveNow(){
  const list = $('#livenow-list');
  let games = [];
  let filter = 'all';

  function draw(){
    const shown = liveSortGames(games).filter(g => filter === 'all' || g.state === filter);
    list.innerHTML = shown.length ? shown.map(liveGameCardHtml).join('') : '<div class="empty">No games in this view right now.</div>';

    // Arrived here from a ticker click -- scroll to and flash that game.
    if(pendingHighlightGame){
      const {away, home} = pendingHighlightGame;
      const card = document.querySelector(
        `.matchup-card[data-away="${away}"][data-home="${home}"], .matchup-card[data-away="${home}"][data-home="${away}"]`
      );
      if(card){
        card.scrollIntoView({behavior:'smooth', block:'center'});
        card.classList.remove('card-highlight');
        void card.offsetWidth;
        card.classList.add('card-highlight');
      }
      pendingHighlightGame = null;
    }
  }

  async function fetchJson(url){
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  async function load(){
    const updated = $('#livenow-updated');
    if(!updated) return; // tab was closed while a refresh was pending
    try {
      const sb = await fetchJson(ESPN_SCOREBOARD_URL);
      const events = sb.events || [];
      const summaries = await Promise.all(events.map(async ev=>{
        const state = ((ev.status || {}).type || {}).state;
        if(state === 'pre') return null;
        if(state === 'post' && liveNowFinalCache[ev.id]) return liveNowFinalCache[ev.id];
        try {
          const summary = await fetchJson(ESPN_SUMMARY_URL + ev.id);
          if(state === 'post') liveNowFinalCache[ev.id] = summary;
          return summary;
        } catch(e){ return null; }
      }));
      games = events.map((ev,i)=>liveGameFromEvent(ev, summaries[i]));
      updated.textContent = 'Updated ' + new Date().toLocaleTimeString();
      draw();
    } catch(err){
      console.warn('Live Now fetch failed:', err);
      if(games.length){
        updated.textContent = 'Refresh failed at ' + new Date().toLocaleTimeString() + ' -- showing last good data';
      } else {
        list.innerHTML = `<div class="empty">Couldn't load live data from ESPN (${err.message}). If the ticker up top isn't showing live scores either, your browser is blocking the cross-origin request -- hit Refresh to retry.</div>`;
      }
    }
  }

  $$('#livenow-pills .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      $$('#livenow-pills .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      filter = p.dataset.f;
      draw();
    });
  });
  $('#livenow-refresh').addEventListener('click', load);

  load();
  if(window.__liveNowTimer) clearInterval(window.__liveNowTimer);
  window.__liveNowTimer = setInterval(()=>{ if(!document.hidden) load(); }, LIVE_NOW_REFRESH_MS);
}

function renderLiveHub(){

// ---------- TAB: LINE PLAY (OL / DL) ----------
// Offensive/defensive line information from 13_line_play.py (nflverse play-by-play,
// snap counts, and the official injury report). Team rates are credited to the whole
// unit -- sacks and stuffs also come from linebackers/DBs -- so these are line-play
// indicators, not individual grades. Ranks run 1 = best at the unit's job.
const LINE_PCT = v => `${(num(v) * 100).toFixed(1)}%`;
const LINE_EDGE_GAP = 0.25;   // how far apart (in league-percentile) two units must be to call an edge
const LINE_OUT = new Set(['Out', 'Doubtful']);
const LINE_RISK = new Set(['Questionable', 'DNP (no game status yet)']);
const LINE_METRICS = {
  OL: [
    {key:'OL Sack Rate',          label:'Sack rate allowed',           fmt:LINE_PCT, better:'low'},
    {key:'OL QB Hit Rate',        label:'QB hit rate allowed',         fmt:LINE_PCT, better:'low'},
    {key:'OL Disruption Rate',    label:'Sack + hit rate allowed',     fmt:LINE_PCT, better:'low'},
    {key:'OL Stuff Rate',         label:'Runs stuffed (0 or fewer yds)', fmt:LINE_PCT, better:'low'},
    {key:'OL YPC',                label:'Yards per carry',             fmt:v=>num(v).toFixed(2), better:'high'},
    {key:'OL Explosive Run Rate', label:'10+ yard run rate',           fmt:LINE_PCT, better:'high'},
    {key:'OL Rush EPA',           label:'Rush EPA per play',           fmt:v=>num(v).toFixed(3), better:'high'},
  ],
  DL: [
    {key:'DL Sack Rate',          label:'Sack rate',                   fmt:LINE_PCT, better:'high'},
    {key:'DL QB Hit Rate',        label:'QB hit rate',                 fmt:LINE_PCT, better:'high'},
    {key:'DL Disruption Rate',    label:'Sack + hit rate',             fmt:LINE_PCT, better:'high'},
    {key:'DL Stuff Rate',         label:'Runs stuffed (0 or fewer yds)', fmt:LINE_PCT, better:'high'},
    {key:'DL YPC',                label:'Yards per carry allowed',     fmt:v=>num(v).toFixed(2), better:'low'},
    {key:'DL Explosive Run Rate', label:'10+ yard runs allowed',       fmt:LINE_PCT, better:'low'},
    {key:'DL Rush EPA',           label:'Rush EPA per play allowed',   fmt:v=>num(v).toFixed(3), better:'low'},
  ],
};

// Same normalization as the pipeline (lowercase letters, suffixes dropped) so a
// player in the snap table lines up with the same player on the injury report.
function normLineName(name){
  return String(name).replace(/[.,]/g, ' ').split(/\s+/)
    .filter(t => t && !['jr','sr','ii','iii','iv','v'].includes(t.toLowerCase()))
    .map(t => t.toLowerCase().replace(/[^a-z]/g, '')).join('');
}

let _lineRankCache = {src: null, ranks: {}};
function getLineRanks(){
  if(_lineRankCache.src === DATA.lineTeam) return _lineRankCache.ranks;
  const rows = DATA.lineTeam || [];
  const ranks = {};
  [...LINE_METRICS.OL, ...LINE_METRICS.DL].forEach(m=>{
    const usable = rows.filter(r => r[m.key] !== '' && r[m.key] != null);
    usable.sort((a,b) => m.better === 'low' ? num(a[m.key]) - num(b[m.key]) : num(b[m.key]) - num(a[m.key]));
    ranks[m.key] = {};
    usable.forEach((r,i)=>{ ranks[m.key][r.Team] = i + 1; });
  });
  _lineRankCache = {src: DATA.lineTeam, ranks};
  return ranks;
}
function lineTeamRow(team){ return (DATA.lineTeam || []).find(r => r.Team === team) || null; }

// Pass protection vs pass rush, and run blocking vs run stopping, as league
// percentiles (1.0 = best in the league at its job). A gap of 0.25 (~8 ranks)
// or more between the two units is called an edge for the better one.
function lineBattle(offTeam, defTeam){
  const n = (DATA.lineTeam || []).length;
  if(!n || !lineTeamRow(offTeam) || !lineTeamRow(defTeam)) return null;
  const ranks = getLineRanks();
  const pct = rank => n > 1 ? 1 - (rank - 1) / (n - 1) : 0.5;
  const make = (offKey, defKey) => {
    const offRank = ranks[offKey][offTeam], defRank = ranks[defKey][defTeam];
    const diff = pct(defRank) - pct(offRank);   // > 0: the defensive front is better than the offensive line
    return {offRank, defRank, diff, edge: diff >= LINE_EDGE_GAP ? 'defense' : diff <= -LINE_EDGE_GAP ? 'offense' : 'even'};
  };
  return {pass: make('OL Disruption Rate', 'DL Disruption Rate'), run: make('OL Rush EPA', 'DL Rush EPA'), n};
}
function lineEdgeLabel(edge){
  return edge === 'offense' ? 'favors the offense' : edge === 'defense' ? 'favors the defense' : 'about even';
}

function lineChip(injury){
  if(!injury) return '<span class="line-chip ok">Healthy</span>';
  const cls = LINE_OUT.has(injury.Availability) ? 'out' : LINE_RISK.has(injury.Availability) ? 'risk' : '';
  return `<span class="line-chip ${cls}">${injury.Availability}</span>`;
}

// Context lines for Mike's Template: is this team's line healthy, and how does
// its line stack up against the opponent's for the kind of play the pick needs?
function lineContextHtml(team, opponent, position){
  const battle = lineBattle(team, opponent);
  const row = lineTeamRow(team), opp = lineTeamRow(opponent);
  if(!battle || !row || !opp) return '';

  const olOut = num(row['OL Starters Out']), olRisk = num(row['OL Starters At Risk']);
  const olColor = olOut > 0 ? 'var(--red)' : olRisk > 0 ? 'var(--gold)' : 'var(--mint)';
  const olLine = (olOut === 0 && olRisk === 0)
    ? 'all 5 starters clear on the injury report'
    : `${olOut} starter${olOut === 1 ? '' : 's'} out, ${olRisk} at risk -- ${row['OL Health Note']}`;

  const dlOut = num(opp['DL Key Players Out']), dlRisk = num(opp['DL Key Players At Risk']);
  const dlLine = (dlOut === 0 && dlRisk === 0)
    ? 'no key rushers or starters on the injury report'
    : `${dlOut} out, ${dlRisk} at risk -- ${opp['DL Health Note']}`;

  const isRun = position === 'RB';
  const b = isRun ? battle.run : battle.pass;
  const edgeColor = b.edge === 'offense' ? 'var(--mint)' : b.edge === 'defense' ? 'var(--red)' : 'var(--chalk-dim)';
  const battleLine = isRun
    ? `Run game: ${team} run blocking #${b.offRank} vs ${opponent} run defense #${b.defRank} of ${battle.n} -- ${lineEdgeLabel(b.edge)}`
    : `Pass game: ${team} pass protection #${b.offRank} vs ${opponent} pass rush #${b.defRank} of ${battle.n} -- ${lineEdgeLabel(b.edge)}`;

  return `
    <div class="player-preview-stats" style="color:${olColor};">${team} O-line: ${olLine}.</div>
    <div class="player-preview-stats" style="color:${edgeColor};">${battleLine}</div>
    <div class="player-preview-stats">${opponent} D-line: ${dlLine}.</div>`;
}

function lineCardHtml(kind, team){
  const row = lineTeamRow(team);
  if(!row) return '<div class="empty">No line data for this team.</div>';
  const ranks = getLineRanks();
  const n = DATA.lineTeam.length;
  const dash = v => (v === '' || v == null) ? '--' : fmt(num(v));

  const metrics = LINE_METRICS[kind].map(m=>{
    const r = ranks[m.key][team];
    const color = r <= n / 3 ? 'var(--mint)' : r > n * 2 / 3 ? 'var(--red)' : 'var(--chalk)';
    return `<div class="line-metric"><span>${m.label}</span><span><b style="color:var(--chalk);">${m.fmt(row[m.key])}</b> <span style="color:${color};">#${r}</span></span></div>`;
  }).join('');

  const injuries = (DATA.lineInjuries || []).filter(i => i.Team === team && i.Group === kind);
  const injByName = {};
  injuries.forEach(i => { injByName[normLineName(i.Player)] = i; });

  const all = (DATA.linePlayers || []).filter(r => r.Team === team && r.Group === kind);
  let shown, peopleHtml;
  if(kind === 'OL'){
    const ORDER = {T:0, G:1, C:2, OL:3};
    shown = all.filter(r => r.Role === 'Starter')
      .sort((a,b) => (ORDER[a.Position] ?? 9) - (ORDER[b.Position] ?? 9) || a.Player.localeCompare(b.Player));
    peopleHtml = shown.map(p => `<div class="line-player">
        <span class="line-player-name">${p.Player} <span class="player-preview-pos">${p.Position}</span></span>
        <span class="line-player-meta">${fmt(num(p['Last Game Snap Pct']) * 100, 0)}% of snaps last game &middot; ${p.Games} G</span>
        ${lineChip(injByName[normLineName(p.Player)])}</div>`).join('');
  } else {
    shown = all.filter(r => r.Role === 'Starter' || r.Role === 'Edge (LB)').sort((a,b) => num(b.Snaps) - num(a.Snaps));
    peopleHtml = shown.map(p => `<div class="line-player">
        <span class="line-player-name">${p.Player} <span class="player-preview-pos">${p.Position}${p.Role === 'Edge (LB)' ? ' edge' : ''}</span></span>
        <span class="line-player-meta">${dash(p.Sacks)} sk &middot; ${dash(p['QB Hits'])} hits &middot; ${dash(p.TFL)} TFL &middot; ${p.Games} G</span>
        ${lineChip(injByName[normLineName(p.Player)])}</div>`).join('');
  }

  const out = num(row[kind === 'OL' ? 'OL Starters Out' : 'DL Key Players Out']);
  const risk = num(row[kind === 'OL' ? 'OL Starters At Risk' : 'DL Key Players At Risk']);
  const note = row[`${kind} Health Note`];
  const banner = (out === 0 && risk === 0)
    ? `<div class="line-banner ok">${kind === 'OL' ? 'All 5 starters' : 'All key players'} clear on the injury report</div>`
    : `<div class="line-banner ${out > 0 ? 'out' : 'risk'}">${out} out, ${risk} at risk -- ${note}</div>`;

  const shownNames = new Set(shown.map(p => normLineName(p.Player)));
  const others = injuries.filter(i => !shownNames.has(normLineName(i.Player)));
  const othersHtml = others.length
    ? `<div class="line-note">Also on the injury report: ${others.map(i =>
        `${i.Player} (${i.Position}) ${i.Availability}${i.Injury ? ' - ' + i.Injury : ''}${i.Role === 'No snaps yet' ? ' [no snaps this season]' : ''}`).join('; ')}</div>`
    : '';

  const continuity = kind === 'OL'
    ? `<div class="line-note">${row['OL Lineups Used']} different starting five${num(row['OL Lineups Used']) === 1 ? '' : 's'} in ${row['OL Games Tracked']} game${num(row['OL Games Tracked']) === 1 ? '' : 's'}${
        row['OL Same Starters vs Prev Game'] !== '' ? ` &middot; ${row['OL Same Starters vs Prev Game']} of 5 starters repeated from the previous game` : ''}</div>`
    : '';

  return `
    <div class="matchup-side-label"><b>${team}</b> ${teamName(team)} &mdash; ${kind === 'OL' ? 'Offensive Line' : 'Defensive Line'}</div>
    ${banner}
    ${metrics}
    <div class="line-sub-title">${kind === 'OL' ? 'Starting five (most snaps, latest game)' : 'Starters and edge rushers'}</div>
    ${peopleHtml || '<div class="empty" style="padding:8px 0;">No snap data yet.</div>'}
    ${othersHtml}
    ${continuity}`;
}

function renderLines(){
  const teams = (DATA.lineTeam || []).map(r => r.Team).sort();
  const first = (DATA.week2 || [])[0];
  const defaultOff = first && teams.includes(first.Team) ? first.Team : teams[0];
  const defaultDef = first && teams.includes(first.Opponent) ? first.Opponent : teams[1];
  const opts = (sel) => teams.map(t => `<option value="${t}" ${t === sel ? 'selected' : ''}>${teamName(t)}</option>`).join('');
  return `
  <div class="panel">
    <div class="panel-title">Line Play (OL / DL)</div>
    <div class="panel-note">
      Pick an offense and a defense to compare that offensive line against that defensive front. Rates are
      season-to-date from play-by-play and are credited to the whole unit (sacks and stuffs also come from
      linebackers and defensive backs), so treat them as line-play indicators rather than individual grades;
      with only a few games played they swing a lot. Ranks run 1 = best at the unit's job. "Starters" are
      the top five OL (top four DL) by snaps in a team's latest game, with edge rushers the data lists as
      linebackers included when they're producing sacks or QB hits. Injury status comes from the official
      weekly report. Pressure data and who blocked whom on a given play aren't available.
      ${!teams.length ? '<br><br><b>No line data yet</b> -- run the pipeline (13_line_play.py) to populate this tab.' : ''}
    </div>
    <div class="controls">
      <label style="font-family:var(--mono);font-size:12px;color:var(--chalk-dim);">OFFENSE</label>
      <select id="line-off">${opts(defaultOff)}</select>
      <button class="save-pick-btn" id="line-flip" title="Swap offense and defense">&#8646; Flip</button>
      <label style="font-family:var(--mono);font-size:12px;color:var(--chalk-dim);">DEFENSE</label>
      <select id="line-def">${opts(defaultDef)}</select>
    </div>
    <div id="line-battle"></div>
    <div class="line-grid">
      <div id="line-off-card"></div>
      <div id="line-def-card"></div>
    </div>
  </div>

  <div class="line-grid">
    <div class="panel"><div class="panel-title" style="font-size:16px;">Offensive Lines</div><div id="line-ol-table"></div></div>
    <div class="panel"><div class="panel-title" style="font-size:16px;">Defensive Lines</div><div id="line-dl-table"></div></div>
  </div>

  <div class="line-grid">
    <div class="panel">
      <div class="panel-title" style="font-size:16px;">Line Injuries</div>
      <div class="panel-note" id="line-inj-note"></div>
      <div class="controls"><div class="pill-group" id="line-inj-pills">
        <span class="pill active" data-group="">ALL</span><span class="pill" data-group="OL">OL</span><span class="pill" data-group="DL">DL</span>
      </div></div>
      <div id="line-inj-table"></div>
    </div>
    <div class="panel">
      <div class="panel-title" style="font-size:16px;">Top Pass Rushers</div>
      <div class="panel-note">Defensive linemen plus LB-listed edge rushers with at least 1 sack or 2 QB hits, by sacks then QB hits.</div>
      <div id="line-rush-table"></div>
    </div>
  </div>`;
}

function mountLines(){
  if(!(DATA.lineTeam || []).length){
    ['line-battle','line-off-card','line-def-card','line-ol-table','line-dl-table','line-inj-table','line-rush-table']
      .forEach(id => { const el = document.getElementById(id); if(el) el.innerHTML = ''; });
    return;
  }

  function drawMatchup(){
    const off = $('#line-off').value, def = $('#line-def').value;
    const b = lineBattle(off, def);
    const chip = (label, battle, offName, defName, what) => {
      const color = battle.edge === 'offense' ? 'var(--mint)' : battle.edge === 'defense' ? 'var(--red)' : 'var(--chalk-dim)';
      return `<span class="context-chip" style="color:${color};">${label}: ${offName} ${what[0]} #${battle.offRank} vs ${defName} ${what[1]} #${battle.defRank} of ${b.n} -- ${lineEdgeLabel(battle.edge)}</span>`;
    };
    $('#line-battle').innerHTML = b ? `
      <div class="context-row" style="margin:12px 0;">
        ${chip('Pass', b.pass, off, def, ['pass protection', 'pass rush'])}
        ${chip('Run', b.run, off, def, ['run blocking', 'run defense'])}
      </div>
      <div class="line-note" style="margin-top:0;margin-bottom:12px;">Green favors the selected offense, red favors the selected defense. An edge needs the two units to be roughly 8+ league ranks apart.</div>` : '';
    $('#line-off-card').innerHTML = lineCardHtml('OL', off);
    $('#line-def-card').innerHTML = lineCardHtml('DL', def);
  }
  $('#line-off').addEventListener('change', drawMatchup);
  $('#line-def').addEventListener('change', drawMatchup);
  $('#line-flip').addEventListener('click', ()=>{
    const o = $('#line-off'), d = $('#line-def');
    const old = o.value; o.value = d.value; d.value = old;
    drawMatchup();
  });
  drawMatchup();

  // ---- league tables
  const pctCol = (key, label) => ({key, label, numeric:true, render:v => LINE_PCT(v)});
  const flagCol = (key, label, color) => ({key, label, numeric:true,
    render:v => num(v) > 0 ? `<span style="color:${color};font-weight:700;">${v}</span>` : '0'});
  buildTable($('#line-ol-table'), [
    {key:'Team', label:'Team', render:teamChip},
    pctCol('OL Sack Rate', 'Sack %'), pctCol('OL QB Hit Rate', 'QB Hit %'), pctCol('OL Disruption Rate', 'Sack+Hit %'),
    pctCol('OL Stuff Rate', 'Stuffed %'),
    {key:'OL YPC', label:'YPC', numeric:true, render:v => num(v).toFixed(2)},
    {key:'OL Rush EPA', label:'Rush EPA', numeric:true, render:v => num(v).toFixed(3)},
    flagCol('OL Starters Out', 'Out', 'var(--red)'), flagCol('OL Starters At Risk', 'At Risk', 'var(--gold)'),
    {key:'OL Lineups Used', label:'Lineups', numeric:true},
  ], DATA.lineTeam, {defaultSort:'OL Disruption Rate', defaultDir:'asc'});

  buildTable($('#line-dl-table'), [
    {key:'Team', label:'Team', render:teamChip},
    pctCol('DL Sack Rate', 'Sack %'), pctCol('DL QB Hit Rate', 'QB Hit %'), pctCol('DL Disruption Rate', 'Sack+Hit %'),
    pctCol('DL Stuff Rate', 'Stuffed %'),
    {key:'DL YPC', label:'YPC Alwd', numeric:true, render:v => num(v).toFixed(2)},
    {key:'DL Rush EPA', label:'Rush EPA Alwd', numeric:true, render:v => num(v).toFixed(3)},
    flagCol('DL Key Players Out', 'Out', 'var(--red)'), flagCol('DL Key Players At Risk', 'At Risk', 'var(--gold)'),
  ], DATA.lineTeam, {defaultSort:'DL Disruption Rate', defaultDir:'desc'});

  // ---- injuries: starters first, then by how bad the status is
  const AVAIL_RANK = {'Out':0, 'Doubtful':1, 'Questionable':2, 'DNP (no game status yet)':3, 'Limited':4};
  const injRows = (DATA.lineInjuries || []).map(r => ({
    ...r,
    _priority: (r.Role === 'Starter' || r.Role === 'Edge (LB)' ? 0 : 10) + (AVAIL_RANK[r.Availability] ?? 5),
  }));
  const injNote = $('#line-inj-note');
  injNote.textContent = injRows.length
    ? `Week ${injRows[0].Week} injury report, linemen only. "Starter"/"Edge (LB)" are the key players -- reserves and players with no snaps this season are listed after them. Players practicing fully with no game status are left out.`
    : 'No linemen on the injury report yet.';
  let injGroup = '';
  function drawInjuries(){
    const rows = injRows.filter(r => !injGroup || r.Group === injGroup);
    buildTable($('#line-inj-table'), [
      {key:'Team', label:'Team', render:teamChip},
      {key:'Player', label:'Player'}, {key:'Position', label:'Pos'},
      {key:'Availability', label:'Status', render:(v,row) => lineChip(row)},
      {key:'Injury', label:'Injury'}, {key:'Role', label:'Role'},
      {key:'Season Snaps', label:'Snaps', numeric:true},
    ], rows, {defaultSort:'_priority', defaultDir:'asc'});
  }
  $$('#line-inj-pills .pill').forEach(pill => pill.addEventListener('click', ()=>{
    $$('#line-inj-pills .pill').forEach(x => x.classList.remove('active'));
    pill.classList.add('active');
    injGroup = pill.dataset.group;
    drawInjuries();
  }));
  drawInjuries();

  // ---- top pass rushers
  const injIndex = {};
  (DATA.lineInjuries || []).forEach(i => { injIndex[`${i.Team}|${normLineName(i.Player)}`] = i; });
  const rushers = (DATA.linePlayers || [])
    .filter(r => r.Group === 'DL' && r.Sacks !== '' && r.Sacks != null)
    .map(r => ({...r, _sacks: num(r.Sacks), _hits: num(r['QB Hits']), _tfl: num(r.TFL), _injury: injIndex[`${r.Team}|${normLineName(r.Player)}`] || null}))
    .sort((a,b) => b._sacks - a._sacks || b._hits - a._hits)
    .slice(0, 25);
  buildTable($('#line-rush-table'), [
    {key:'Player', label:'Player'}, {key:'Team', label:'Team', render:teamChip},
    {key:'Position', label:'Pos', render:(v,row) => row.Role === 'Edge (LB)' ? 'LB (edge)' : v},
    {key:'Games', label:'G', numeric:true}, {key:'Snaps', label:'Snaps', numeric:true},
    {key:'_sacks', label:'Sacks', numeric:true, render:v => fmt(v)},
    {key:'_hits', label:'QB Hits', numeric:true, render:v => fmt(v)},
    {key:'_tfl', label:'TFL', numeric:true, render:v => fmt(v)},
    {key:'_injury', label:'Status', render:(v,row) => lineChip(row._injury)},
  ], rushers, {defaultSort:'_sacks', defaultDir:'desc'});
}

// ---------- ROUTER ----------
const renderers = {
  overview: {render: renderOverview, mount: mountOverview},
  live: {render: renderLiveHub, mount: mountLiveHub},
  matchup: {render: renderMatchup, mount: mountMatchup},
  teams: {render: renderTeams, mount: mountTeams},
  teamweek: {render: renderTeamWeek, mount: mountTeamWeek},
  players: {render: renderPlayers, mount: mountPlayers},
  defense: {render: renderDefense, mount: mountDefense},
  sos: {render: renderSOS, mount: mountSOS},
  week2: {render: renderWeek2, mount: mountWeek2},
  streaks: {render: renderStreaks, mount: mountStreaks},
  milestones: {render: renderMilestones, mount: mountMilestones},
  injuries: {render: renderInjuries, mount: mountInjuries},
  epa: {render: renderEpa, mount: mountEpa},
  picks: {render: renderPicks, mount: mountPicks},
  power: {render: renderPowerRankings, mount: mountPowerRankings},
  coaching: {render: renderCoaching, mount: mountCoaching},
  lines: {render: renderLines, mount: mountLines},
  predictions: {render: renderPredictions, mount: mountPredictions},
  mypicks: {render: renderMyPicks, mount: mountMyPicks},
  mikes: {render: renderMikesTemplate, mount: mountMikesTemplate},
  anytimetd: {render: renderAnytimeTD, mount: mountAnytimeTD},
};
function showTab(tab){
  if(window.__liveNowTimer){ clearInterval(window.__liveNowTimer); window.__liveNowTimer = null; }
  $$('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  const r = renderers[tab];
  $('#content').innerHTML = r.render();
  r.mount();
}
async function loadCSV(path){
  const res = await fetch(path, {cache: 'no-store'});
  if(!res.ok) throw new Error(`${path} -> HTTP ${res.status}`);
  const text = await res.text();
  const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
  return parsed.data;
}

// Core files (everything the ESPN pipeline generates) should still show the
// full error page if they fail -- something's genuinely wrong. But
// milestones.csv depends on an external nflverse download on top of ESPN,
// so it's more prone to an occasional failure and shouldn't be able to
// take down the whole dashboard just because it's missing or briefly broken.
const OPTIONAL_CSV_KEYS = ['milestones', 'teamMilestones', 'injuries', 'epa', 'gameTeamStats', 'gameQbStats', 'redzone', 'coaching', 'lineTeam', 'linePlayers', 'lineInjuries'];
async function loadCSVLenient(key, path){
  try {
    return await loadCSV(path);
  } catch(err){
    if(OPTIONAL_CSV_KEYS.includes(key)){
      console.warn(`Optional file ${path} unavailable, continuing without it:`, err);
      return [];
    }
    throw err;
  }
}

async function init(){
  try {
    const entries = await Promise.all(
      Object.entries(CSV_FILES).map(async ([key, path]) => [key, await loadCSVLenient(key, path)])
    );
    DATA = Object.fromEntries(entries);
  } catch(err){
    console.error(err);
    $('#content').innerHTML = `<div class="empty" style="padding:60px 20px;">
      Couldn't load data (${err.message}).<br><br>
      This page fetches its CSVs from a <code>data/</code> folder next to it, so it needs
      to be served over http(s) -- opening the file directly (file://) won't work in most
      browsers. Run a local server (e.g. <code>python3 -m http.server</code> in this folder)
      or view it via its hosted URL, and make sure <code>data/</code> contains the required CSVs.
    </div>`;
    return;
  }

  LATEST_RESULTS_WEEK = DATA.teamWeek && DATA.teamWeek.length
    ? Math.max(...DATA.teamWeek.map(r=>num_(r.Week)))
    : (DATA.playerGame && DATA.playerGame.length ? Math.max(...DATA.playerGame.map(r=>num_(r.Week))) : null);
  PREVIEW_WEEK = DATA.week2 && DATA.week2.length ? num_(DATA.week2[0].Week) : (LATEST_RESULTS_WEEK ? LATEST_RESULTS_WEEK + 1 : null);

  $$('#tabs button').forEach(b=> b.addEventListener('click', ()=> showTab(b.dataset.tab)));
  $('#ticker-track').addEventListener('click', (e)=>{
    const item = e.target.closest('.ticker-item');
    if(item) goToGameDetails(item.dataset.away, item.dataset.home, item.dataset.state);
  });
  renderHero();
  renderTicker();
  showTab('overview');
}
init();
</script>
