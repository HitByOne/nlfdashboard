<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gridiron Ledger — NFL 2026 Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --field:#0B0F19;
    --field-deep:#070A12;
    --chalk:#EDEFF7;
    --chalk-dim:#8B93AC;
    --hash:#2A3348;
    --hash-line:#1B2233;
    --gold:#4C8DFF;
    --gold-deep:#3568CC;
    --red:#FF5C6C;
    --mint:#33D6A6;
    --panel:#121826;
    --panel-border:#232B3E;
    --mono:'IBM Plex Mono', monospace;
    --cond:'Barlow Condensed', sans-serif;
    --display:'Archivo Black', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--field);
    color:var(--chalk);
    font-family:var(--cond);
    min-height:100vh;
  }
  a{color:inherit;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 20px 60px;}

  /* ---- Header ---- */
  header.hero{
    border-bottom:3px solid var(--gold);
    background:linear-gradient(180deg, var(--field-deep), var(--field) 80%);
    padding:34px 0 22px;
    margin-bottom:26px;
  }
  .hero-inner{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;}
  .hero-title{
    font-family:var(--display);
    font-size:clamp(28px, 4vw, 46px);
    letter-spacing:0.5px;
    line-height:1;
    margin:0;
    color:var(--chalk);
  }
  .hero-title span{color:var(--gold);}
  .hero-sub{
    font-family:var(--mono);
    color:var(--chalk-dim);
    font-size:13px;
    margin-top:10px;
    letter-spacing:0.3px;
  }
  .hero-meta{
    font-family:var(--mono);
    font-size:12px;
    color:var(--gold);
    text-align:right;
    line-height:1.6;
  }
  .hero-meta b{color:var(--chalk);font-family:var(--cond);font-weight:600;}

  /* ---- Ticker (horizontal bar, always visible regardless of screen width) ---- */
  .ticker-side{
    display:flex;align-items:stretch;
    background:var(--field-deep);
    border-bottom:1px solid var(--panel-border);
  }
  .ticker-label{
    flex:0 0 auto;
    display:flex;align-items:center;gap:6px;
    padding:0 16px;
    font-family:var(--cond);font-weight:700;font-size:13px;
    color:var(--gold);
    background:var(--panel);
    border-right:1px solid var(--panel-border);
    white-space:nowrap;
  }
  .ticker-track{
    flex:1 1 auto;
    display:flex;
    overflow-x:auto;
    scrollbar-width:thin;
  }
  .ticker-item{
    flex:0 0 auto;
    display:flex;flex-direction:column;justify-content:center;gap:3px;
    padding:8px 18px;
    border-right:1px solid var(--panel-border);
    min-width:120px;
  }
  .ticker-time{
    font-family:var(--mono);font-size:10px;color:var(--chalk-dim);
    text-transform:uppercase;letter-spacing:0.4px;
  }
  .ticker-teams{
    display:flex;align-items:baseline;gap:5px;
    font-family:var(--cond);font-weight:700;font-size:14px;
    color:var(--chalk);
  }
  .ticker-at{color:var(--chalk-dim);font-weight:500;font-size:11px;}
  .ticker-score{color:var(--gold);font-family:var(--mono);}
  .ticker-empty{padding:10px 16px;font-family:var(--mono);font-size:12px;color:var(--chalk-dim);}


  /* ---- Tabs ---- */
  nav.tabs{
    display:flex;
    gap:2px;
    overflow-x:auto;
    border-bottom:1px solid var(--panel-border);
    margin-bottom:22px;
  }
  nav.tabs button{
    background:transparent;
    border:none;
    color:var(--chalk-dim);
    font-family:var(--cond);
    font-weight:600;
    font-size:16px;
    padding:12px 18px;
    cursor:pointer;
    white-space:nowrap;
    border-bottom:3px solid transparent;
    transition:color .15s, border-color .15s;
  }
  nav.tabs button:hover{color:var(--chalk);}
  nav.tabs button.active{color:var(--gold);border-bottom-color:var(--gold);}

  /* ---- Panels ---- */
  .panel{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:4px;
    padding:20px;
    margin-bottom:20px;
  }
  .panel-title{
    font-family:var(--cond);
    font-weight:700;
    font-size:19px;
    margin:0 0 4px;
    color:var(--chalk);
  }
  .panel-note{
    font-family:var(--mono);
    font-size:12px;
    color:var(--chalk-dim);
    margin:0 0 16px;
  }
  .grid-2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;}
  @media (max-width:900px){.grid-2{grid-template-columns:1fr;}}
  .mu-grid{display:grid;grid-template-columns:1fr;gap:24px;}

  /* ---- Controls ---- */
  .controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  select, input[type="text"]{
    background:var(--field-deep);
    border:1px solid var(--hash);
    color:var(--chalk);
    font-family:var(--mono);
    font-size:13px;
    padding:8px 10px;
    border-radius:3px;
  }
  select:focus, input:focus{outline:1px solid var(--gold);}
  .pill-group{display:flex;gap:6px;flex-wrap:wrap;}
  .pill{
    background:var(--field-deep);
    border:1px solid var(--hash);
    color:var(--chalk-dim);
    font-family:var(--mono);
    font-size:12px;
    padding:6px 12px;
    border-radius:20px;
    cursor:pointer;
    transition:all .12s;
  }
  .pill.active{background:var(--gold);border-color:var(--gold);color:var(--field-deep);font-weight:600;}
  .pill:hover:not(.active){border-color:var(--gold);color:var(--chalk);}

  /* ---- Table ---- */
  .table-scroll{overflow-x:auto;}
  table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px;}
  thead th{
    text-align:left;
    padding:8px 10px;
    color:var(--gold);
    border-bottom:2px solid var(--hash);
    white-space:nowrap;
    cursor:pointer;
    user-select:none;
    position:sticky;top:0;background:var(--panel);
  }
  thead th:hover{color:var(--chalk);}
  thead th.sorted::after{content:' ▾';font-size:10px;}
  thead th.sorted-asc::after{content:' ▴';font-size:10px;}
  tbody td{padding:7px 10px;border-bottom:1px solid var(--hash-line);white-space:nowrap;color:var(--chalk);}
  tbody tr:hover{background:rgba(227,169,59,0.06);}
  tbody tr:nth-child(even){background:rgba(255,255,255,0.015);}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .rank-badge{
    display:inline-block;min-width:22px;text-align:center;
    background:var(--field-deep);border:1px solid var(--hash);
    border-radius:3px;padding:2px 5px;color:var(--gold);font-size:11px;
  }
  .team-chip{
    font-family:var(--cond);font-weight:700;letter-spacing:0.5px;
    background:var(--field-deep);border:1px solid var(--gold-deep);
    color:var(--gold);padding:2px 8px;border-radius:3px;font-size:12px;
  }
  .heat{border-radius:2px;padding:3px 8px;display:inline-block;min-width:48px;text-align:center;font-weight:600;}

  /* ---- Upcoming Matchups ---- */
  .day-group{margin-bottom:28px;}
  .day-group:last-child{margin-bottom:0;}
  .day-header{
    font-family:var(--cond);font-weight:700;font-size:14px;
    color:var(--gold);text-transform:uppercase;letter-spacing:0.8px;
    margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--panel-border);
  }
  .matchup-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:16px;}
  .matchup-card{
    background:var(--field-deep);border:1px solid var(--panel-border);
    border-radius:6px;overflow:hidden;
  }
  .matchup-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--panel-border);
  }
  .matchup-teams{
    font-family:var(--cond);font-weight:700;font-size:18px;color:var(--chalk);
    display:flex;align-items:baseline;gap:8px;
  }
  .matchup-teams .at{color:var(--chalk-dim);font-weight:500;font-size:13px;}
  .matchup-time{
    font-family:var(--mono);font-size:11px;color:var(--chalk-dim);
    text-align:right;line-height:1.5;
  }
  .matchup-body{display:grid;grid-template-columns:1fr 1fr;}
  .matchup-side{padding:12px 14px;}
  .matchup-side + .matchup-side{border-left:1px solid var(--panel-border);}
  .matchup-side-label{
    font-family:var(--mono);font-size:11px;color:var(--chalk-dim);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-bottom:10px;
  }
  .matchup-side-label b{color:var(--gold);font-weight:700;}
  .player-preview{margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--hash-line);}
  .player-preview:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
  .player-preview-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .player-preview-name{font-family:var(--cond);font-weight:700;font-size:13px;color:var(--chalk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .player-preview-pos{font-family:var(--mono);font-size:10px;color:var(--gold);flex:0 0 auto;}
  .player-preview-stats{font-family:var(--mono);font-size:11px;color:var(--chalk-dim);margin-top:2px;}
  .player-preview-matchup{display:block;font-family:var(--mono);font-size:10.5px;margin-top:3px;font-weight:600;}

  /* ---- Stat cards ---- */
  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
  .stat-card{
    flex:1;min-width:150px;
    background:var(--panel);border:1px solid var(--panel-border);
    border-left:3px solid var(--gold);
    padding:14px 16px;border-radius:4px;
  }
  .stat-card .label{font-family:var(--mono);font-size:11px;color:var(--chalk-dim);text-transform:uppercase;letter-spacing:0.5px;}
  .stat-card .value{font-family:var(--display);font-size:24px;color:var(--chalk);margin-top:6px;}
  .stat-card .value span{color:var(--gold);font-size:14px;font-family:var(--cond);}

  canvas{max-width:100%;}
  .empty{color:var(--chalk-dim);font-family:var(--mono);font-size:13px;padding:20px;text-align:center;}
  footer{text-align:center;padding:30px 0 10px;font-family:var(--mono);font-size:11px;color:var(--hash);}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div>
      <h1 class="hero-title">GRIDIRON <span>LEDGER</span></h1>
      <div class="hero-sub" id="hero-sub"></div>
    </div>
    <div class="hero-meta" id="hero-meta">
    </div>
  </div>
</header>

<div class="ticker-side">
  <div class="ticker-label">WEEK <span id="ticker-week">-</span></div>
  <div class="ticker-track" id="ticker-track"></div>
</div>

<div class="wrap">
  <nav class="tabs" id="tabs">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="matchup">Matchup Explorer</button>
    <button data-tab="teams">Team Summary</button>
    <button data-tab="teamweek">Team Game Log</button>
    <button data-tab="players">Player Stats</button>
    <button data-tab="defense">Defense vs Position</button>
    <button data-tab="sos">Strength of Schedule</button>
    <button data-tab="week2">Upcoming Matchups</button>
  </nav>

  <div id="content"><div class="empty" style="padding:60px 20px;">Loading latest stats&hellip;</div></div>
</div>

<footer>GRIDIRON LEDGER &mdash; generated from CSV data uploaded by user &middot; not affiliated with the NFL</footer>

<script>
let DATA = { teamSummary:[], teamWeek:[], playerGame:[], defVsPos:[], sos:[], week2:[] };

// Every week's data -- including week 1 -- comes from the same place: these
// CSVs, fetched fresh on every page load. Nothing is embedded/baked into
// this file. Re-run the pipeline to refresh the CSVs and just reload the
// page; there is no separate "build the dashboard" step anymore.
const CSV_FILES = {
  teamSummary: 'data/nfl_2026_team_summary.csv',
  teamWeek:    'data/nfl_2026_team_week_stats.csv',
  playerGame:  'data/nfl_2026_player_game_stats.csv',
  defVsPos:    'data/nfl_2026_defense_vs_position.csv',
  sos:         'data/nfl_2026_strength_of_schedule.csv',
  week2:       'data/nfl_2026_upcoming_matchups.csv',
};

const TEAM_NAMES = {
  ARI:'Arizona Cardinals', ATL:'Atlanta Falcons', BAL:'Baltimore Ravens', BUF:'Buffalo Bills',
  CAR:'Carolina Panthers', CHI:'Chicago Bears', CIN:'Cincinnati Bengals', CLE:'Cleveland Browns',
  DAL:'Dallas Cowboys', DEN:'Denver Broncos', DET:'Detroit Lions', GB:'Green Bay Packers',
  HOU:'Houston Texans', IND:'Indianapolis Colts', JAX:'Jacksonville Jaguars', KC:'Kansas City Chiefs',
  LAC:'Los Angeles Chargers', LAR:'Los Angeles Rams', LV:'Las Vegas Raiders', MIA:'Miami Dolphins',
  MIN:'Minnesota Vikings', NE:'New England Patriots', NO:'New Orleans Saints', NYG:'New York Giants',
  NYJ:'New York Jets', PHI:'Philadelphia Eagles', PIT:'Pittsburgh Steelers', SEA:'Seattle Seahawks',
  SF:'San Francisco 49ers', TB:'Tampa Bay Buccaneers', TEN:'Tennessee Titans', WSH:'Washington Commanders'
};
function teamName(abbr){ return TEAM_NAMES[abbr] || abbr; }

// Derive "what week are we on" straight from the data instead of hardcoding
// it, so the header text stays correct all season without editing the template.
function num_(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
let LATEST_RESULTS_WEEK = null;
let PREVIEW_WEEK = null;

function renderHero(){
  const parts = [];
  if(LATEST_RESULTS_WEEK) parts.push(`WEEK ${LATEST_RESULTS_WEEK} RESULTS`);
  if(PREVIEW_WEEK) parts.push(`WEEK ${PREVIEW_WEEK} MATCHUP PREP`);
  $('#hero-sub').textContent = `2026 SEASON${parts.length ? ' \u00b7 ' + parts.join(' + ') : ''}`;
  $('#hero-meta').innerHTML = `
    <div><b>${DATA.teamSummary.length}</b> teams tracked &middot; <b>${DATA.playerGame.length}</b> player logs</div>
    <div>Built from your uploaded weekly data exports</div>`;
}

const ESPN_SCOREBOARD_URL = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';
let liveScoreboardTimer = null;
let liveScoreboardWorked = false;

async function fetchLiveScoreboard(){
  const res = await fetch(ESPN_SCOREBOARD_URL);
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  return (data.events || []).map(ev=>{
    const comp = (ev.competitions || [])[0] || {};
    const competitors = comp.competitors || [];
    const home = competitors.find(c=>c.homeAway==='home') || {};
    const away = competitors.find(c=>c.homeAway==='away') || {};
    const statusType = (ev.status || {}).type || {};
    return {
      date: ev.date,
      homeAbbr: (home.team || {}).abbreviation || '?',
      awayAbbr: (away.team || {}).abbreviation || '?',
      homeScore: home.score,
      awayScore: away.score,
      state: statusType.state,           // 'pre' | 'in' | 'post'
      detail: statusType.shortDetail,     // e.g. "Sun 1:00 PM", "Final", "Q3 4:15"
    };
  });
}

function renderTicker(){
  fetchLiveScoreboard().then(games=>{
    liveScoreboardWorked = true;
    renderTickerGames(games, {live:true});
    if(!liveScoreboardTimer){
      // Re-poll every 60s so in-progress games actually update while the page is open.
      liveScoreboardTimer = setInterval(()=>{
        fetchLiveScoreboard().then(g=>renderTickerGames(g, {live:true})).catch(()=>{});
      }, 60000);
    }
  }).catch(err=>{
    // Browser blocked the cross-origin call (or it's offline) -- fall back
    // to the static CSV matchups so the panel still shows something useful.
    console.warn('Live ESPN scoreboard unavailable, falling back to CSV data:', err);
    renderTickerFromCSV();
  });
}

function renderTickerGames(games, opts={}){
  const track = $('#ticker-track');
  if(!track) return;
  $('#ticker-week').textContent = opts.live ? 'LIVE' : (PREVIEW_WEEK || '-');
  if(!games.length){
    track.innerHTML = '<div class="ticker-empty">No games found.</div>';
    return;
  }
  track.innerHTML = games.map(g=>{
    const label = g.state === 'in' ? (g.detail || 'LIVE')
                : g.state === 'post' ? 'Final'
                : (g.detail || '');
    const scoreLine = g.state === 'pre'
      ? `<span>${g.awayAbbr}</span><span class="ticker-at">@</span><span>${g.homeAbbr}</span>`
      : `<span title="${teamName(g.awayAbbr)}">${g.awayAbbr}</span><span class="ticker-score">${g.awayScore}</span>
         <span class="ticker-score">${g.homeScore}</span><span title="${teamName(g.homeAbbr)}">${g.homeAbbr}</span>`;
    return `
    <div class="ticker-item">
      <div class="ticker-time">${label}</div>
      <div class="ticker-teams">${scoreLine}</div>
    </div>`;
  }).join('');
}

function renderTickerFromCSV(){
  const track = $('#ticker-track');
  if(!track) return;
  if(!DATA.week2 || !DATA.week2.length){
    track.innerHTML = '<div class="ticker-empty">No upcoming matchups loaded yet.</div>';
    return;
  }
  // One row per team per game in the source data -- collapse to one entry per game.
  const seen = new Set();
  const games = [];
  DATA.week2.forEach(r=>{
    const gid = r['Game ID'];
    if(!gid || seen.has(gid)) return;
    seen.add(gid);
    const isHome = r['Home/Away'] === 'Home';
    games.push({
      date: r.Date,
      home: isHome ? r.Team : r.Opponent,
      away: isHome ? r.Opponent : r.Team,
    });
  });
  games.sort((a,b)=> new Date(a.date) - new Date(b.date));

  $('#ticker-week').textContent = PREVIEW_WEEK || '-';
  track.innerHTML = games.map(g=>{
    const dt = new Date(g.date);
    const dayStr = isNaN(dt) ? '' : dt.toLocaleDateString('en-US',{weekday:'short'});
    const timeStr = isNaN(dt) ? '' : dt.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    return `
    <div class="ticker-item">
      <div class="ticker-time">${dayStr}${timeStr ? ' &middot; ' + timeStr : ''}</div>
      <div class="ticker-teams">
        <span title="${teamName(g.away)}">${g.away}</span>
        <span class="ticker-at">@</span>
        <span title="${teamName(g.home)}">${g.home}</span>
      </div>
    </div>`;
  }).join('') || '<div class="ticker-empty">No upcoming matchups loaded yet.</div>';
}

// ---------- helpers ----------
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => Array.from(el.querySelectorAll(sel));
function num(v){ const n = parseFloat(v); return isNaN(n) ? 0 : n; }
function fmt(v, d=1){ const n = num(v); return Number.isInteger(n) ? n.toString() : n.toFixed(d); }
function teamChip(t){ return `<span class="team-chip">${teamName(t)}</span>`; }
function heatColor(rank, max){
  // rank 1 = best matchup (most points allowed) -> mint green, rank max = tough matchup -> coral
  const pct = 1 - ((rank-1)/(max-1||1));
  const good = [51,214,166];   // mint
  const bad  = [255,92,108];   // coral
  const r = Math.round(bad[0] + (good[0]-bad[0])*pct);
  const g = Math.round(bad[1] + (good[1]-bad[1])*pct);
  const b = Math.round(bad[2] + (good[2]-bad[2])*pct);
  return `background:rgba(${r},${g},${b},0.22);border:1px solid rgba(${r},${g},${b},0.6);color:var(--chalk);`;
}

let charts = {};
function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }

// generic sortable table builder
function buildTable(container, columns, rows, opts={}){
  const state = container._sortState || {key: opts.defaultSort || columns[0].key, dir: opts.defaultDir || 'desc'};
  container._sortState = state;
  let sorted = [...rows].sort((a,b)=>{
    let av = a[state.key], bv = b[state.key];
    const an = parseFloat(av), bn = parseFloat(bv);
    const isNum = !isNaN(an) && !isNaN(bn) && av !== '' && bv !== '';
    let cmp;
    if(isNum) cmp = an - bn; else cmp = String(av).localeCompare(String(bv));
    return state.dir === 'asc' ? cmp : -cmp;
  });
  if(opts.limit) sorted = sorted.slice(0, opts.limit);

  const thead = columns.map(c=>{
    let cls = '';
    if(c.key === state.key) cls = state.dir === 'asc' ? 'sorted-asc' : 'sorted';
    return `<th class="${cls}" data-key="${c.key}" style="${c.numeric?'text-align:right':''}">${c.label}</th>`;
  }).join('');

  const tbody = sorted.map(row=>{
    return '<tr>' + columns.map(c=>{
      const raw = row[c.key];
      const val = c.render ? c.render(raw, row) : raw;
      return `<td class="${c.numeric?'num':''}">${val}</td>`;
    }).join('') + '</tr>';
  }).join('');

  container.innerHTML = `<div class="table-scroll"><table><thead><tr>${thead}</tr></thead><tbody>${tbody || `<tr><td colspan="${columns.length}" class="empty">No rows match your filters.</td></tr>`}</tbody></table></div>`;

  $$('th', container).forEach(th=>{
    th.addEventListener('click', ()=>{
      const key = th.dataset.key;
      if(state.key === key){ state.dir = state.dir === 'asc' ? 'desc' : 'asc'; }
      else { state.key = key; state.dir = 'desc'; }
      buildTable(container, columns, rows, opts);
    });
  });
}

// ---------- TAB: OVERVIEW ----------
function renderOverview(){
  const ts = DATA.teamSummary;

  return `

function renderWeek2(){
  const wk = DATA.week2 && DATA.week2.length ? DATA.week2[0].Week : null;
  return `
  <div class="panel">
    <div class="panel-title">${wk ? `Week ${wk} Matchups` : 'Upcoming Matchups'}</div>
    <div class="panel-note">For each game, each team's top producers this season with their real stat line, plus how the opposing defense has performed against that position -- built for gauging matchups, not just fantasy points.</div>
    <div class="controls">
      <input type="text" id="wk2-search" placeholder="Filter team (e.g. Bills or BUF)">
    </div>
    <div id="wk2-days"></div>
  </div>`;
}

function mountWeek2(){
  function apply(){
    const q = $('#wk2-search').value.trim().toUpperCase();

    // Collapse the two team-perspective rows ESPN/the pipeline produces per
    // game into one row per actual game, keeping both sides' data.
    const games = new Map();
    (DATA.week2 || []).forEach(r=>{
      const gid = r['Game ID'];
      if(!gid) return;
      if(!games.has(gid)) games.set(gid, {date: r.Date, sides: {}});
      const isHome = r['Home/Away'] === 'Home';
      games.get(gid).sides[isHome ? 'home' : 'away'] = r;
    });

    let gameList = [...games.values()].filter(g=>g.sides.home && g.sides.away);

    if(q){
      gameList = gameList.filter(g=>{
        const home = g.sides.home, away = g.sides.away;
        return [home.Team, home.Opponent, away.Team, away.Opponent].some(t=>
          t.toUpperCase().includes(q) || teamName(t).toUpperCase().includes(q)
        );
      });
    }

    gameList.sort((a,b)=> new Date(a.date) - new Date(b.date));

    // Group into day-of-week sections, in date order.
    const dayGroups = [];
    gameList.forEach(g=>{
      const dt = new Date(g.date);
      const dayKey = isNaN(dt) ? 'TBD' : dt.toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'});
      let group = dayGroups.find(d=>d.key === dayKey);
      if(!group){ group = {key: dayKey, games: []}; dayGroups.push(group); }
      group.games.push(g);
    });

    function meterColor(pct){
      // Same mint-to-coral scale used everywhere else: high value (defense
      // allows a lot) = good matchup = mint; low value = coral.
      const good = [51,214,166], bad = [255,92,108];
      const r = Math.round(bad[0] + (good[0]-bad[0])*pct);
      const g = Math.round(bad[1] + (good[1]-bad[1])*pct);
      const b = Math.round(bad[2] + (good[2]-bad[2])*pct);
      return `rgb(${r},${g},${b})`;
    }

    // A real lineup breakdown per team: 1 QB, 2 RB, 3 WR, 2 TE, each the
    // top producer(s) at that position this season (ranked internally by
    // total PPR just as a single number to sort mixed stat lines by --
    // never shown to the user, since this isn't a fantasy display).
    const LINEUP_SLOTS = {QB:1, RB:2, WR:3, TE:2};

    function getTopPlayers(team){
      const byPlayer = {};
      (DATA.playerGame || []).filter(r=>r.Team===team).forEach(r=>{
        if(!byPlayer[r.Player]) byPlayer[r.Player] = {Player:r.Player, Position:r.Position, games:[]};
        byPlayer[r.Player].games.push(r);
      });
      const summarized = Object.values(byPlayer).map(p=>({
        ...p, totalPPR: p.games.reduce((s,g)=>s+num(g['PPR Points']),0)
      }));

      const lineup = [];
      Object.entries(LINEUP_SLOTS).forEach(([pos, count])=>{
        const atPos = summarized
          .filter(p=>p.Position===pos)
          .sort((a,b)=>b.totalPPR - a.totalPPR)
          .slice(0, count);
        lineup.push(...atPos);
      });
      return lineup;
    }

    // Real box-score line summed across their games, formatted by what's
    // actually relevant to their position rather than a generic PPG number.
    function statLine(player){
      const sum = key => player.games.reduce((s,g)=>s+num(g[key]),0);
      const passAtt=sum('Pass Attempts'), passCmp=sum('Pass Completions'), passYds=sum('Pass Yards'), passTD=sum('Pass TD'), int=sum('Interceptions');
      const rushAtt=sum('Rush Attempts'), rushYds=sum('Rush Yards'), rushTD=sum('Rush TD');
      const rec=sum('Receptions'), recYds=sum('Receiving Yards'), recTD=sum('Receiving TD');

      const parts = [];
      if(passAtt > 0) parts.push(`${Math.round(passCmp)}/${Math.round(passAtt)}, ${Math.round(passYds)} yds, ${Math.round(passTD)} TD${int>0?`, ${Math.round(int)} INT`:''}`);
      if(rushAtt > 0) parts.push(`${Math.round(rushAtt)} car, ${Math.round(rushYds)} yds${rushTD>0?`, ${Math.round(rushTD)} TD`:''}`);
      if(rec > 0 || recYds > 0) parts.push(`${Math.round(rec)} rec, ${Math.round(recYds)} yds${recTD>0?`, ${Math.round(recTD)} TD`:''}`);
      return parts.join(' &middot; ') || 'No stats yet';
    }

    // Raw stat that actually matters for each position -- yards and
    // touchdowns allowed, the kind of thing a betting line is built on --
    // instead of a fantasy-points conversion.
    const MATCHUP_STAT_BY_POS = {
      QB: {primary:'Pass Yards Allowed Per Game', primaryLabel:'pass yds/g', secondary:'Pass TD Allowed Per Game', secondaryLabel:'pass TD/g'},
      RB: {primary:'Rush Yards Allowed Per Game', primaryLabel:'rush yds/g', secondary:'Rush TD Allowed Per Game', secondaryLabel:'rush TD/g'},
      WR: {primary:'Receiving Yards Allowed Per Game', primaryLabel:'rec yds/g', secondary:'Receptions Allowed Per Game', secondaryLabel:'rec/g'},
      TE: {primary:'Receiving Yards Allowed Per Game', primaryLabel:'rec yds/g', secondary:'Receptions Allowed Per Game', secondaryLabel:'rec/g'},
    };

    function sideHtml(team, defenseTeam){
      const topPlayers = getTopPlayers(team);
      return `
        <div class="matchup-side-label" title="${teamName(team)} offense vs ${teamName(defenseTeam)} defense">
          <b>${team}</b> offense vs <b>${defenseTeam}</b> D
        </div>
        ${topPlayers.length ? topPlayers.map(p=>{
          const cfg = MATCHUP_STAT_BY_POS[p.Position];
          const dvp = cfg ? (DATA.defVsPos || []).find(d=>d.Defense===defenseTeam && d.Position===p.Position) : null;
          let matchupTag = '';
          if(dvp){
            const allAtPos = (DATA.defVsPos || []).filter(d=>d.Position===p.Position);
            const primaryVal = num(dvp[cfg.primary]);
            const maxPrimary = Math.max(1, ...allAtPos.map(d=>num(d[cfg.primary])));
            const pct = Math.min(1, primaryVal / maxPrimary);
            const color = meterColor(pct);
            const secondaryVal = fmt(num(dvp[cfg.secondary]));
            matchupTag = `<span class="player-preview-matchup" style="color:${color};">${defenseTeam} allows ${fmt(primaryVal)} ${cfg.primaryLabel}, ${secondaryVal} ${cfg.secondaryLabel}</span>`;
          }
          return `
          <div class="player-preview">
            <div class="player-preview-head">
              <span class="player-preview-name">${p.Player}</span>
              <span class="player-preview-pos">${p.Position}</span>
            </div>
            <div class="player-preview-stats">${statLine(p)}</div>
            ${matchupTag}
          </div>`;
        }).join('') : '<div class="empty" style="padding:8px 0;">No player stats logged yet.</div>'}
      `;
    }

    $('#wk2-days').innerHTML = dayGroups.length ? dayGroups.map(group=>`
      <div class="day-group">
        <div class="day-header">${group.key}</div>
        <div class="matchup-grid">
          ${group.games.map(g=>{
            const home = g.sides.home, away = g.sides.away;
            const dt = new Date(g.date);
            const timeStr = isNaN(dt) ? '' : dt.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
            return `
            <div class="matchup-card">
              <div class="matchup-head">
                <div class="matchup-teams">${teamName(away.Team)}<span class="at">@</span>${teamName(home.Team)}</div>
                <div class="matchup-time">${timeStr}</div>
              </div>
              <div class="matchup-body">
                <div class="matchup-side">${sideHtml(away.Team, home.Team)}</div>
                <div class="matchup-side">${sideHtml(home.Team, away.Team)}</div>
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>
    `).join('') : '<div class="empty">No matchups match your filter.</div>';
  }

  $('#wk2-search').addEventListener('input', apply);
  apply();
}

// ---------- TAB: MATCHUP EXPLORER ----------
const MATCHUP_POSITIONS = ['QB','RB','TE','WR'];
function renderMatchup(){
  const teams = [...new Set(DATA.teamSummary.map(r=>r.Team))].sort();
  const defaultOff = teams.includes('DAL') ? 'DAL' : teams[0];
  const defaultDef = teams.includes('NYG') ? 'NYG' : teams[1];
  return `
  <div class="panel">
    <div class="panel-title">Matchup Explorer</div>
    <div class="panel-note">Pick an offense, a defense, and a position. Left table is that offense's players game-by-game. Right table is every other team's player at that position who has played against the selected defense (excludes the offense's own team, so a past matchup between these two teams isn't double-counted).</div>
    <div class="controls">
      <label style="font-family:var(--mono);font-size:12px;color:var(--chalk-dim);">OFFENSE</label>
      <select id="mu-off">${teams.map(t=>`<option value="${t}" ${t===defaultOff?'selected':''}>${teamName(t)}</option>`).join('')}</select>
      <span style="color:var(--gold);font-family:var(--display);font-size:14px;">VS</span>
      <label style="font-family:var(--mono);font-size:12px;color:var(--chalk-dim);">DEFENSE</label>
      <select id="mu-def">${teams.map(t=>`<option value="${t}" ${t===defaultDef?'selected':''}>${teamName(t)}</option>`).join('')}</select>
      <div class="pill-group" id="mu-pos-pills">
        ${MATCHUP_POSITIONS.map((p,i)=>`<span class="pill ${i===0?'active':''}" data-pos="${p}">${p}</span>`).join('')}
      </div>
    </div>
    <div id="mu-rank"></div>
    <div class="mu-grid">
      <div>
        <div class="panel-title" id="mu-off-title" style="font-size:16px;"></div>
        <div id="mu-off-table"></div>
      </div>
      <div>
        <div class="panel-title" id="mu-def-title" style="font-size:16px;"></div>
        <div id="mu-def-table"></div>
      </div>
    </div>
  </div>`;
}

const MATCHUP_COLS = {
  base: [
    {key:'Week', label:'Week', numeric:true},
    {key:'Player', label:'Player'},
    {key:'Position', label:'Pos'},
    {key:'Team', label:'Team', render:t=>`<span class="team-chip" title="${teamName(t)}">${t}</span>`},
    {key:'Opponent', label:'Opp', render:t=>`<span class="team-chip" title="${teamName(t)}">${t}</span>`},
  ],
  QB: [
    {key:'Pass Completions', label:'Cmp', numeric:true},
    {key:'Pass Attempts', label:'Att', numeric:true},
    {key:'Pass Yards', label:'Pass Yds', numeric:true},
    {key:'Pass TD', label:'Pass TD', numeric:true},
    {key:'Interceptions', label:'INT', numeric:true},
    {key:'PPR Points', label:'PPR', numeric:true, render:v=>fmt(v)},
  ],
  RB: [
    {key:'Rush Attempts', label:'Rush Att', numeric:true},
    {key:'Rush Yards', label:'Rush Yds', numeric:true},
    {key:'Rush TD', label:'Rush TD', numeric:true},
    {key:'Receptions', label:'Rec', numeric:true},
    {key:'Receiving Yards', label:'Rec Yds', numeric:true},
    {key:'Receiving TD', label:'Rec TD', numeric:true},
    {key:'PPR Points', label:'PPR', numeric:true, render:v=>fmt(v)},
  ],
  TE: [
    {key:'Targets', label:'Tgt', numeric:true},
    {key:'Receptions', label:'Rec', numeric:true},
    {key:'Receiving Yards', label:'Rec Yds', numeric:true},
    {key:'Receiving TD', label:'Rec TD', numeric:true},
    {key:'PPR Points', label:'PPR', numeric:true, render:v=>fmt(v)},
  ],
  WR: [
    {key:'Targets', label:'Tgt', numeric:true},
    {key:'Receptions', label:'Rec', numeric:true},
    {key:'Receiving Yards', label:'Rec Yds', numeric:true},
    {key:'Receiving TD', label:'Rec TD', numeric:true},
    {key:'PPR Points', label:'PPR', numeric:true, render:v=>fmt(v)},
  ],
};

function mountMatchup(){
  let pos = MATCHUP_POSITIONS[0];
  function apply(){
    const off = $('#mu-off').value;
    const def = $('#mu-def').value;
    const cols = [...MATCHUP_COLS.base, ...MATCHUP_COLS[pos]];

    const offRows = DATA.playerGame.filter(r=>r.Team===off && r.Position===pos);
    // Exclude the offense's own team here -- the point of this table is to
    // show OTHER teams' performances against the defense, for comparison.
    // Without this, a team that already played this defense sees its own
    // game mirrored back in both tables.
    const defRows = DATA.playerGame.filter(r=>r.Opponent===def && r.Position===pos && r.Team!==off);

    $('#mu-off-title').textContent = `Offensive Stats for ${teamName(off)} ${pos}s`;
    $('#mu-def-title').textContent = `${pos}s Played Against ${teamName(def)}`;

    buildTable($('#mu-off-table'), cols, offRows, {defaultSort:'Week', defaultDir:'asc'});
    buildTable($('#mu-def-table'), cols, defRows, {defaultSort:'Week', defaultDir:'asc'});

    const defVs = DATA.defVsPos.find(r=>r.Defense===def && r.Position===pos);
    const allAtPos = DATA.defVsPos.filter(r=>r.Position===pos);
    const maxRank = Math.max(...allAtPos.map(r=>num(r['PPR Points Allowed Rank'])));
    if(defVs){
      const rank = num(defVs['PPR Points Allowed Rank']);
      $('#mu-rank').innerHTML = `<div style="margin-bottom:14px;"><span class="heat" style="${heatColor(rank, maxRank)}">${teamChip(def)} ranks #${rank} of ${maxRank} vs ${pos} &middot; ${fmt(defVs['PPR Points Allowed Per Game'])} PPR pts/g allowed</span></div>`;
    } else {
      $('#mu-rank').innerHTML = '';
    }
  }
  $('#mu-off').addEventListener('change', apply);
  $('#mu-def').addEventListener('change', apply);
  $$('#mu-pos-pills .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      $$('#mu-pos-pills .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      pos = p.dataset.pos;
      apply();
    });
  });
  apply();
}

// ---------- ROUTER ----------
const renderers = {
  overview: {render: renderOverview, mount: mountOverview},
  matchup: {render: renderMatchup, mount: mountMatchup},
  teams: {render: renderTeams, mount: mountTeams},
  teamweek: {render: renderTeamWeek, mount: mountTeamWeek},
  players: {render: renderPlayers, mount: mountPlayers},
  defense: {render: renderDefense, mount: mountDefense},
  sos: {render: renderSOS, mount: mountSOS},
  week2: {render: renderWeek2, mount: mountWeek2},
};
function showTab(tab){
  $$('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  const r = renderers[tab];
  $('#content').innerHTML = r.render();
  r.mount();
}
async function loadCSV(path){
  const res = await fetch(path, {cache: 'no-store'});
  if(!res.ok) throw new Error(`${path} -> HTTP ${res.status}`);
  const text = await res.text();
  const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
  return parsed.data;
}

async function init(){
  try {
    const entries = await Promise.all(
      Object.entries(CSV_FILES).map(async ([key, path]) => [key, await loadCSV(path)])
    );
    DATA = Object.fromEntries(entries);
  } catch(err){
    console.error(err);
    $('#content').innerHTML = `<div class="empty" style="padding:60px 20px;">
      Couldn't load data (${err.message}).<br><br>
      This page fetches its CSVs from a <code>data/</code> folder next to it, so it needs
      to be served over http(s) -- opening the file directly (file://) won't work in most
      browsers. Run a local server (e.g. <code>python3 -m http.server</code> in this folder)
      or view it via its hosted URL, and make sure <code>data/</code> contains the required CSVs.
    </div>`;
    return;
  }

  LATEST_RESULTS_WEEK = DATA.teamWeek && DATA.teamWeek.length
    ? Math.max(...DATA.teamWeek.map(r=>num_(r.Week)))
    : (DATA.playerGame && DATA.playerGame.length ? Math.max(...DATA.playerGame.map(r=>num_(r.Week))) : null);
  PREVIEW_WEEK = DATA.week2 && DATA.week2.length ? num_(DATA.week2[0].Week) : (LATEST_RESULTS_WEEK ? LATEST_RESULTS_WEEK + 1 : null);

  $$('#tabs button').forEach(b=> b.addEventListener('click', ()=> showTab(b.dataset.tab)));
  renderHero();
  renderTicker();
  showTab('overview');
}
init();
</script>
</body>
