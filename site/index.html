function mountWeek2(){
  // Computed once per mount (not per team/game) since it's the same
  // league-wide ranking regardless of which game is being shown.
  const powerRankRows = computePowerRankings();
  const powerRankLookup = {};
  powerRankRows.forEach((r,i)=>{ powerRankLookup[r.team] = {rank: i+1, total: powerRankRows.length, score: r.powerScore}; });

  function apply(){
    const q = $('#wk2-search').value.trim().toUpperCase();

    // Collapse the two team-perspective rows ESPN/the pipeline produces per
    // game into one row per actual game, keeping both sides' data.
    const games = new Map();
    (DATA.week2 || []).forEach(r=>{
      const gid = r['Game ID'];
      if(!gid) return;
      if(!games.has(gid)) games.set(gid, {date: r.Date, sides: {}});
      const isHome = r['Home/Away'] === 'Home';
      games.get(gid).sides[isHome ? 'home' : 'away'] = r;
    });

    let gameList = [...games.values()].filter(g=>g.sides.home && g.sides.away);

    if(q){
      gameList = gameList.filter(g=>{
        const home = g.sides.home, away = g.sides.away;
        return [home.Team, home.Opponent, away.Team, away.Opponent].some(t=>
          t.toUpperCase().includes(q) || teamName(t).toUpperCase().includes(q)
        );
      });
    }

    gameList.sort((a,b)=> new Date(a.date) - new Date(b.date));

    function meterColor(pct){
      // Same mint-to-coral scale used everywhere else: high value (defense
      // allows a lot) = good matchup = mint; low value = coral.
      const good = [51,214,166], bad = [255,92,108];
      const r = Math.round(bad[0] + (good[0]-bad[0])*pct);
      const g = Math.round(bad[1] + (good[1]-bad[1])*pct);
      const b = Math.round(bad[2] + (good[2]-bad[2])*pct);
      return `rgb(${r},${g},${b})`;
    }

    // Rest & schedule context: days since a team's last completed game.
    function getTeamRestInfo(team, gameDate){
      const weeks = (DATA.teamWeek || []).filter(r=>r.Team===team);
      if(!weeks.length) return null;
      let lastGame = null;
      weeks.forEach(r=>{
        const d = new Date(r.Date);
        if(!isNaN(d) && (!lastGame || d > lastGame)) lastGame = d;
      });
      if(!lastGame) return null;
      const gd = new Date(gameDate);
      if(isNaN(gd)) return null;
      const days = Math.round((gd - lastGame) / (1000*60*60*24));
      if(days <= 0) return null;
      let label, cls;
      if(days <= 4){ label = `Short week &middot; ${days}d rest`; cls='rest-short'; }
      else if(days >= 12){ label = `Off bye &middot; ${days}d rest`; cls='rest-bye'; }
      else { label = `${days}d rest`; cls='rest-normal'; }
      return {days, label, cls};
    }

    // Static division map -- doesn't change during a season.
    const TEAM_DIVISIONS = {
      ARI:'NFC West', ATL:'NFC South', BAL:'AFC North', BUF:'AFC East',
      CAR:'NFC South', CHI:'NFC North', CIN:'AFC North', CLE:'AFC North',
      DAL:'NFC East', DEN:'AFC West', DET:'NFC North', GB:'NFC North',
      HOU:'AFC South', IND:'AFC South', JAX:'AFC South', KC:'AFC West',
      LAC:'AFC West', LAR:'NFC West', LV:'AFC West', MIA:'AFC East',
      MIN:'NFC North', NE:'AFC East', NO:'NFC South', NYG:'NFC East',
      NYJ:'AFC East', PHI:'NFC East', PIT:'AFC North', SEA:'NFC West',
      SF:'NFC West', TB:'NFC South', TEN:'AFC South', WSH:'NFC East',
    };

    // INT margin (takeaways - giveaways) from data already loaded. NOTE:
    // this is interceptions only -- fumbles aren't tracked in the pipeline
    // yet, so this is a partial turnover picture, not the full thing.
    function getTeamIntMargin(team){
      const forced = (DATA.playerGame || []).filter(r=>r.Opponent===team).reduce((s,r)=>s+num(r['Interceptions']),0);
      const thrown = (DATA.playerGame || []).filter(r=>r.Team===team).reduce((s,r)=>s+num(r['Interceptions']),0);
      return forced - thrown;
    }
    function intMarginBadge(team){
      const margin = getTeamIntMargin(team);
      if(margin === 0) return `<span class="context-chip">INT margin: even</span>`;
      const color = margin > 0 ? 'var(--mint)' : 'var(--red)';
      return `<span class="context-chip" style="color:${color};">INT margin: ${margin > 0 ? '+' : ''}${margin}</span>`;
    }

    function injuryBadge(team){
      const rows = (DATA.injuries || []).filter(r=>r.Team===team && isRelevantInjury(r));
      if(!rows.length) return '';
      const outCount = rows.filter(r=>/out|doubtful/i.test(r.Status || '')).length;
      const names = rows.map(r=>`${r.Player} (${r.Status})`).join(', ');
      return `<span class="context-chip" style="${outCount ? 'color:var(--red);' : ''}" title="${names}">${rows.length} injur${rows.length===1?'y':'ies'}${outCount ? ` &middot; ${outCount} OUT` : ''}</span>`;
    }

    // EPA matchup context: this offense's EPA/play next to what THIS
    // SPECIFIC opposing defense has allowed -- the exact "Team A offense
    // vs Team B defense" comparison, shown as two real numbers side by
    // side, not combined into a prediction.
    function getTeamEpa(team, side){
      const row = (DATA.epa || []).find(r=>r.Team===team && r.Side===side);
      return row ? {epa: num(row['EPA/Play']), gp: num(row['Games Played'])} : null;
    }
    function epaMatchupLine(offenseTeam, defenseTeam){
      const off = getTeamEpa(offenseTeam, 'Offense');
      const def = getTeamEpa(defenseTeam, 'Defense');
      if(!off && !def) return '';
      const smallSample = (off && off.gp < 4) || (def && def.gp < 4);
      const parts = [];
      if(off) parts.push(`${offenseTeam} off: ${fmt(off.epa,3)} EPA/play`);
      if(def) parts.push(`${defenseTeam} D allows: ${fmt(def.epa,3)} EPA/play`);
      return `<div class="context-row"><span class="context-chip" title="EPA/play: real per-play efficiency, shown as-is -- not combined into a prediction">${parts.join(' &middot; ')}${smallSample ? ' (small sample)' : ''}</span></div>`;
    }

    // Closest active milestone for a player, if any (a player can be
    // tracked toward more than one stat's milestone -- show whichever is
    // nearest so this stays useful, not cluttered). Only counts as "close"
    // if within 20% of that stat's milestone step (e.g. within 10 for a
    // 50-TD milestone, within 200 for a 1000-yard one) -- otherwise a
    // player merely on-track toward some future round number isn't
    // meaningfully "chasing" it yet.
    function getClosestMilestone(player){
      const entries = (DATA.milestones || []).filter(m=>m.Player===player);
      const close = entries.filter(m => num(m.Remaining) <= (MILESTONE_STEP_JS[m.Stat] || 50) * MILESTONE_CLOSE_FRACTION);
      if(!close.length) return null;
      return close.reduce((closest, m) =>
        (!closest || num(m.Remaining) < num(closest.Remaining)) ? m : closest
      , null);
    }
    function milestoneBadge(player){
      const m = getClosestMilestone(player);
      if(!m) return '';
      const remaining = num(m.Remaining);
      return `<span class="milestone-badge">&#127919; ${remaining} ${m.Stat} from ${m.Milestone}</span>`;
    }

    // A real lineup breakdown per team: 1 QB, 2 RB, 3 WR, 2 TE, each the
    // top producer(s) at that position this season -- ranked by the yardage
    // relevant to that position (not a fantasy points formula).
    const LINEUP_SLOTS = {QB:1, RB:2, WR:3, TE:2};
    const RANK_VALUE_BY_POS = {
      QB: g => num(g['Pass Yards']),
      RB: g => num(g['Rush Yards']) + num(g['Receiving Yards']),
      WR: g => num(g['Receiving Yards']),
      TE: g => num(g['Receiving Yards']),
    };

    function getTopPlayers(team){
      const byPlayer = {};
      (DATA.playerGame || []).filter(r=>r.Team===team).forEach(r=>{
        if(!byPlayer[r.Player]) byPlayer[r.Player] = {Player:r.Player, Position:r.Position, games:[]};
        byPlayer[r.Player].games.push(r);
      });
      const summarized = Object.values(byPlayer).map(p=>{
        const valueFn = RANK_VALUE_BY_POS[p.Position] || (()=>0);
        return {...p, rankValue: p.games.reduce((s,g)=>s+valueFn(g), 0)};
      });

      const lineup = [];
      Object.entries(LINEUP_SLOTS).forEach(([pos, count])=>{
        const atPos = summarized
          .filter(p=>p.Position===pos)
          .sort((a,b)=>b.rankValue - a.rankValue)
          .slice(0, count);
        lineup.push(...atPos);
      });
      return lineup;
    }

    // Real box-score line summed across their games, formatted by what's
    // actually relevant to their position rather than a generic PPG number.
    function statLine(player){
      const sum = key => player.games.reduce((s,g)=>s+num(g[key]),0);
      const passAtt=sum('Pass Attempts'), passCmp=sum('Pass Completions'), passYds=sum('Pass Yards'), passTD=sum('Pass TD'), int=sum('Interceptions');
      const rushAtt=sum('Rush Attempts'), rushYds=sum('Rush Yards'), rushTD=sum('Rush TD');
      const rec=sum('Receptions'), recYds=sum('Receiving Yards'), recTD=sum('Receiving TD'), targets=sum('Targets');

      const parts = [];
      if(passAtt > 0) parts.push(`${Math.round(passCmp)}/${Math.round(passAtt)}, ${Math.round(passYds)} yds, ${Math.round(passTD)} TD${int>0?`, ${Math.round(int)} INT`:''}`);
      if(rushAtt > 0) parts.push(`${Math.round(rushAtt)} car, ${Math.round(rushYds)} yds${rushTD>0?`, ${Math.round(rushTD)} TD`:''}`);
      if(rec > 0 || recYds > 0 || targets > 0) parts.push(`${Math.round(rec)} rec${targets>0?` (${Math.round(targets)} tgt)`:''}, ${Math.round(recYds)} yds${recTD>0?`, ${Math.round(recTD)} TD`:''}`);
      return parts.join(' &middot; ') || 'No stats yet';
    }

    // Raw stat that actually matters for each position -- yards and
    // touchdowns allowed, the kind of thing a betting line is built on --
    // instead of a fantasy-points conversion.
    const MATCHUP_STAT_BY_POS = {
      QB: {primary:'Pass Yards Allowed Per Game', primaryLabel:'pass yds/g', secondary:'Pass TD Allowed Per Game', secondaryLabel:'pass TD/g'},
      RB: {primary:'Rush Yards Allowed Per Game', primaryLabel:'rush yds/g', secondary:'Rush TD Allowed Per Game', secondaryLabel:'rush TD/g'},
      WR: {primary:'Receiving Yards Allowed Per Game', primaryLabel:'rec yds/g', secondary:'Receptions Allowed Per Game', secondaryLabel:'rec/g'},
      TE: {primary:'Receiving Yards Allowed Per Game', primaryLabel:'rec yds/g', secondary:'Receptions Allowed Per Game', secondaryLabel:'rec/g'},
    };

    function teamContextHtml(team, defenseTeam, gameDate){
      const rest = getTeamRestInfo(team, gameDate);
      const margin = getTeamIntMargin(team);
      const off = getTeamEpa(team, 'Offense');
      const def = getTeamEpa(defenseTeam, 'Defense');
      const injRows = (DATA.injuries || []).filter(r=>r.Team===team && isRelevantInjury(r));

      const powerInfo = powerRankLookup[team];
      const powerColor = powerInfo ? (powerInfo.rank <= powerInfo.total/3 ? 'var(--mint)' : powerInfo.rank > powerInfo.total*2/3 ? 'var(--red)' : null) : null;

      const items = [
        {label: 'Power Rank', value: powerInfo ? `#${powerInfo.rank} of ${powerInfo.total}` : 'No data yet', color: powerColor},
        {label: 'Rest', value: rest ? rest.label.replace(/<[^>]*>/g,'') : 'No data yet', color: rest?.cls==='rest-short' ? 'var(--red)' : rest?.cls==='rest-bye' ? 'var(--mint)' : null},
        {label: 'INT Margin', value: margin===0 ? 'Even' : (margin>0 ? `+${margin}` : `${margin}`), color: margin>0 ? 'var(--mint)' : margin<0 ? 'var(--red)' : null},
      ];
      if(off) items.push({label: `${team} Offensive EPA/Play`, value: `${fmt(off.epa,3)}${off.gp<4 ? ' (small sample)' : ''}`});
      if(def) items.push({label: `${defenseTeam} Defensive EPA/Play Allowed`, value: `${fmt(def.epa,3)}${def.gp<4 ? ' (small sample)' : ''}`});

      // Injuries get their own row per player (name + position), not a
      // single count -- the position comes from the player-game data since
      // the injury feed itself doesn't carry it.
      const injuryListHtml = injRows.length ? injRows.map(r=>{
        const posRow = (DATA.playerGame || []).find(p=>p.Player===r.Player && p.Team===team);
        const pos = posRow ? posRow.Position : '';
        const isOut = /out|doubtful/i.test(r.Status || '');
        return `
          <div class="player-preview">
            <div class="player-preview-head">
              <span class="player-preview-name">${r.Player}</span>
              <span class="player-preview-pos">${pos}</span>
            </div>
            <div class="player-preview-stats" style="${isOut ? 'color:var(--red);' : ''}">${r.Status}${r.Injury ? ` &middot; ${r.Injury}` : ''}</div>
          </div>`;
      }).join('') : `
        <div class="player-preview">
          <div class="player-preview-head"><span class="player-preview-name">Injuries</span></div>
          <div class="player-preview-stats">None listed</div>
        </div>`;

      return `
        <div class="matchup-side-label" title="${teamName(team)} offense vs ${teamName(defenseTeam)} defense">
          <b>${team}</b> offense vs <b>${defenseTeam}</b> D
        </div>
        ${items.map(it=>`
          <div class="player-preview">
            <div class="player-preview-head">
              <span class="player-preview-name">${it.label}</span>
            </div>
            <div class="player-preview-stats" style="${it.color ? `color:${it.color};` : ''}">${it.value}</div>
          </div>
        `).join('')}
        ${injuryListHtml}
      `;
    }

    function playerListHtml(team, defenseTeam){
      const topPlayers = getTopPlayers(team);
      return `
        <div class="matchup-side-label"><b>${team}</b> top players</div>
        ${topPlayers.length ? topPlayers.map(p=>{
          const cfg = MATCHUP_STAT_BY_POS[p.Position];
          const dvp = cfg ? (DATA.defVsPos || []).find(d=>d.Defense===defenseTeam && d.Position===p.Position) : null;
          let matchupTag = '';
          if(dvp){
            const allAtPos = (DATA.defVsPos || []).filter(d=>d.Position===p.Position);
            const primaryVal = num(dvp[cfg.primary]);
            const maxPrimary = Math.max(1, ...allAtPos.map(d=>num(d[cfg.primary])));
            const pct = Math.min(1, primaryVal / maxPrimary);
            const color = meterColor(pct);
            const secondaryVal = fmt(num(dvp[cfg.secondary]));
            matchupTag = `<span class="player-preview-matchup" style="color:${color};">${defenseTeam} allows ${fmt(primaryVal)} ${cfg.primaryLabel}, ${secondaryVal} ${cfg.secondaryLabel}</span>`;
          }
          const rz = (DATA.redzone || []).find(r=>r.Player===p.Player && r.Team===team);
          let rzBadge = '';
          if(rz){
            const rzParts = [];
            if(num(rz['RZ Targets']) > 0) rzParts.push(`${Math.round(num(rz['RZ Targets']))} RZ tgt (${Math.round(num(rz['RZ Target Share'])*100)}% share)`);
            if(num(rz['RZ Rush Attempts']) > 0) rzParts.push(`${Math.round(num(rz['RZ Rush Attempts']))} RZ car (${Math.round(num(rz['RZ Rush Share'])*100)}% share)`);
            if(rzParts.length) rzBadge = `<span class="player-preview-matchup" style="color:var(--gold);">${rzParts.join(' &middot; ')}</span>`;
          }
          return `
          <div class="player-preview">
            <div class="player-preview-head">
              <span class="player-preview-name">${p.Player}</span>
              <span class="player-preview-pos">${p.Position}</span>
            </div>
            <div class="player-preview-stats">${statLine(p)}</div>
            ${matchupTag}
            ${rzBadge}
            ${milestoneBadge(p.Player)}
          </div>`;
        }).join('') : '<div class="empty" style="padding:8px 0;">No player stats logged yet.</div>'}
      `;
    }

    $('#wk2-days').innerHTML = gameList.length ? gameList.map(g=>{
      const home = g.sides.home, away = g.sides.away;
      const dt = new Date(g.date);
      const dayStr = isNaN(dt) ? 'TBD' : dt.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
      const timeStr = isNaN(dt) ? '' : dt.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
      const mlBadge = ml => (ml !== '' && ml != null && !isNaN(num(ml))) ? `<span class="ml-badge">${num(ml)>0?'+':''}${Math.round(num(ml))}</span>` : '';
      const spread = home.Spread || away.Spread || '';
      const overUnder = home['Over/Under'] || away['Over/Under'] || '';
      const isDivisional = TEAM_DIVISIONS[away.Team] && TEAM_DIVISIONS[away.Team] === TEAM_DIVISIONS[home.Team];

      return `
      <div class="matchup-card" data-away="${away.Team}" data-home="${home.Team}">
        <div class="matchup-head">
          <div class="matchup-teams">
            ${teamName(away.Team)}${mlBadge(away['Team Moneyline'])}<span class="at">@</span>${teamName(home.Team)}${mlBadge(home['Team Moneyline'])}
            ${isDivisional ? `<span class="div-badge">DIV</span>` : ''}
          </div>
          <div class="matchup-time">${dayStr}${timeStr ? ' &middot; '+timeStr : ''}</div>
        </div>
        ${(spread || overUnder) ? `
        <div class="odds-strip">
          ${spread ? `<span class="odds-chip">${spread}</span>` : ''}
          ${overUnder ? `<span class="odds-chip">O/U ${overUnder}</span>` : ''}
        </div>` : ''}
        <div class="wk2-four-col">
          <div>${teamContextHtml(away.Team, home.Team, g.date)}</div>
          <div>${playerListHtml(away.Team, home.Team)}</div>
          <div>${teamContextHtml(home.Team, away.Team, g.date)}</div>
          <div>${playerListHtml(home.Team, away.Team)}</div>
        </div>
      </div>`;
    }).join('') : '<div class="empty">No matchups match your filter.</div>';
  }

  $('#wk2-search').addEventListener('input', apply);
  apply();
}

// ---------- TAB: MATCHUP EXPLORER ----------
const MATCHUP_POSITIONS = ['QB','RB','TE','WR'];
// One entry per actual game this week, built from the two team-perspective rows
// the pipeline writes for each game (same source Upcoming Matchups uses).
function matchupScheduleGames(){
  const byId = new Map();
  (DATA.week2 || []).forEach(r=>{
    const gid = r['Game ID'];
    if(!gid) return;
    if(!byId.has(gid)) byId.set(gid, {id: gid, date: r.Date, week: r.Week, rows: []});
    byId.get(gid).rows.push(r);
  });
  const games = [];
  byId.forEach(g=>{
    const homeRow = g.rows.find(r => r['Home/Away'] === 'Home');
    const awayRow = g.rows.find(r => r['Home/Away'] === 'Away');
    let home, away;
    if(homeRow && awayRow){ home = homeRow.Team; away = awayRow.Team; }
    else if(homeRow){ home = homeRow.Team; away = homeRow.Opponent; }
    else if(awayRow){ away = awayRow.Team; home = awayRow.Opponent; }
    if(!home || !away) return;
    games.push({id: g.id, date: g.date, week: g.week, away, home, spread: (g.rows.find(r => r.Spread) || {}).Spread || ''});
  });
  const time = d => { const t = +new Date(d); return isNaN(t) ? Infinity : t; };
  games.sort((a,b) => time(a.date) === time(b.date) ? 0 : time(a.date) < time(b.date) ? -1 : 1);
  return games;
}


// ---------- "Starters only" filter ----------
// There's no depth chart in the box-score data, so a starter is whoever leads
// his team's position group in usage over the games logged: QB1 by pass
// attempts, RB1 by rush attempts plus targets, the top three WRs and TE1 by
// targets. It's a usage proxy, so a player who just took over a job (or lost
// one to injury) can lag a game or two behind. One flag drives every table.
const STARTER_SLOTS = {QB:1, RB:1, WR:3, TE:1};
const STARTERS_KEY = 'nfl_dashboard_starters_only';
function getStartersOnly(){ try { return localStorage.getItem(STARTERS_KEY) === '1'; } catch(e){ return false; } }
function setStartersOnly(on){ try { localStorage.setItem(STARTERS_KEY, on ? '1' : '0'); } catch(e){} }
let _starterCache = {src:null, set:null, slots:null};
function getStarterSlots(){ getStarterSet(); return _starterCache.slots; }
function getStarterSet(){
  if(_starterCache.src === DATA.playerGame) return _starterCache.set;
  const usage = {};
  (DATA.playerGame || []).forEach(r => {
    const k = r.Team + '|' + r.Position + '|' + r.Player;
    const u = r.Position === 'QB' ? num(r['Pass Attempts'])
      : r.Position === 'RB' ? num(r['Rush Attempts']) + num(r.Targets)
      : num(r.Targets);
    usage[k] = (usage[k] || 0) + u;
  });
  const groups = {};
  Object.entries(usage).forEach(([k, u]) => {
    const [team, pos, player] = k.split('|');
    if(!STARTER_SLOTS[pos]) return;
    (groups[team + '|' + pos] = groups[team + '|' + pos] || []).push({player, u});
  });
  const set = new Set(), slots = new Map();
  Object.entries(groups).forEach(([k, list]) => {
    const [team, pos] = k.split('|');
    list.sort((a, b) => b.u - a.u).slice(0, STARTER_SLOTS[pos]).forEach((x, i) => {
      set.add(team + '|' + x.player);
      slots.set(team + '|' + x.player, STARTER_SLOTS[pos] > 1 ? pos + (i + 1) : pos + '1');
    });
  });
  _starterCache = {src: DATA.playerGame, set, slots};
  return set;
}
function isStarter(row){ return getStarterSet().has(row.Team + '|' + row.Player); }
const STARTER_TIP = 'Starters = QB1, RB1, WR1-3, TE1 on each team, ranked by usage so far this season (pass attempts / rush attempts + targets / targets).';
function starterPillHtml(id){
  return `<span class="pill ${getStartersOnly() ? 'active' : ''}" id="${id}" title="${STARTER_TIP}">Starters only</span>`;
}

// ---------- Player ranks for Matchup Explorer ----------
// Each player's league rank at his position by a yardage-per-game number, season
// to date. The point: a defense holding the league's BEST backs down says more
// than holding an average back down, so every row carries the rank. RBs get
// three separate ranks, because a back can be elite as a rusher and
// unremarkable as a receiver (or the reverse) and the question being asked
// is usually about one of them. The FIRST metric listed is the primary one.
const MATCHUP_TOP_N = 10;
const MATCHUP_RANK_METRICS = {
  QB: [{id:'pass',  label:'Pass Yds/G', short:'pass yds', value: r => num(r['Pass Yards'])}],
  RB: [
    {id:'scrim', label:'Rush + Rec Yds/G', short:'Rush+Rec yds', pill:'Rush + Rec', value: r => num(r['Rush Yards']) + num(r['Receiving Yards'])},
    {id:'rush',  label:'Rush Yds/G',       short:'rush yds',     pill:'Rush',       value: r => num(r['Rush Yards'])},
    {id:'rec',   label:'Rec Yds/G',        short:'rec yds',      pill:'Rec',        value: r => num(r['Receiving Yards'])},
  ],
  WR: [{id:'rec', label:'Rec Yds/G', short:'rec yds', value: r => num(r['Receiving Yards'])}],
  TE: [{id:'rec', label:'Rec Yds/G', short:'rec yds', value: r => num(r['Receiving Yards'])}],
};
function ordinal(n){ const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

let _playerRankCache = {src: null, len: -1, data: {}};
// -> { QB: { pass: {ranks, n, minGames, label} }, RB: { scrim: {...}, rush: {...}, rec: {...} }, ... }
function getPlayerRanks(){
  const src = DATA.playerGame || [];
  if(_playerRankCache.src === src && _playerRankCache.len === src.length) return _playerRankCache.data;
  const out = {};
  MATCHUP_POSITIONS.forEach(pos => {
    const metrics = MATCHUP_RANK_METRICS[pos];
    const byPlayer = {};
    src.filter(r => r.Position === pos).forEach(r => {
      const p = byPlayer[r.Player] || (byPlayer[r.Player] = {player: r.Player, weeks: new Set(), totals: {}});
      p.weeks.add(r.Week);
      metrics.forEach(m => { p.totals[m.id] = (p.totals[m.id] || 0) + m.value(r); });
    });
    const players = Object.values(byPlayer);
    // A player needs at least half as many games as the most-active player at his
    // position, so one big game in garbage time can't outrank a season of production.
    const minGames = Math.max(1, Math.ceil(Math.max(0, ...players.map(p => p.weeks.size)) / 2));
    out[pos] = {};
    metrics.forEach(m => {
      const eligible = players.filter(p => p.weeks.size >= minGames)
        .map(p => ({player: p.player, games: p.weeks.size, total: p.totals[m.id] || 0, perGame: (p.totals[m.id] || 0) / p.weeks.size}))
        .sort((a, b) => b.perGame - a.perGame || b.total - a.total || a.player.localeCompare(b.player));
      const ranks = {};
      eligible.forEach((p, i) => { ranks[p.player] = {...p, rank: i + 1}; });
      out[pos][m.id] = {ranks, n: eligible.length, minGames, label: m.label};
    });
  });
  _playerRankCache = {src, len: src.length, data: out};
  return out;
}

// Adds the derived columns every Matchup Explorer row needs: Rush+Rec yards, and
// for each rank metric a rank, a sortable score (higher = better, 0 = unranked),
// and a tooltip. The primary metric is also exposed as _rank/_rankScore/_rankTitle,
// which is what the position-independent "Rank" column reads.
function matchupAugmentRows(rows, pos){
  const metrics = MATCHUP_RANK_METRICS[pos] || [];
  const info = getPlayerRanks()[pos] || {};
  return rows.map(r => {
    const out = {...r, 'Rush + Rec Yards': num(r['Rush Yards']) + num(r['Receiving Yards']), 'Pass + Rush Yards': num(r['Pass Yards']) + num(r['Rush Yards'])};
    metrics.forEach((m, idx) => {
      const mi = info[m.id];
      const ranked = mi && mi.ranks[r.Player];
      const rank = ranked ? ranked.rank : null;
      const title = ranked
        ? `${ordinal(rank)} of ${mi.n} ${pos}s by ${mi.label} (${ranked.perGame.toFixed(1)} per game over ${ranked.games} games)`
        : `Not ranked: ${pos}s need at least ${mi ? mi.minGames : 1} games played to be ranked`;
      out['_rank_' + m.id] = rank;
      out['_rankScore_' + m.id] = rank ? 1000 - rank : 0;
      out['_rankTitle_' + m.id] = title;
      if(idx === 0){ out._rank = rank; out._rankScore = out['_rankScore_' + m.id]; out._rankTitle = title; }
    });
    return out;
  });
}

// Cell renderer for the secondary rank columns (RB's Rush Rk / Rec Rk).
function matchupRankCell(id){
  return (v, row) => {
    const rank = row['_rank_' + id], title = row['_rankTitle_' + id];
    return rank
      ? `<span class="rank-badge${rank <= MATCHUP_TOP_N ? ' top' : ''}" title="${title}">#${rank}</span>`
      : `<span class="rank-badge" title="${title}">--</span>`;
  };
}

// "Top backs faced": the top-ranked players at this position (by the chosen metric)
// who have played this defense, each compared with his own average in every OTHER
// game this season.
function topFacedHtml(def, pos, metricId){
  const metrics = MATCHUP_RANK_METRICS[pos];
  if(!metrics) return '';
  const metric = metrics.find(m => m.id === metricId) || metrics[0];
  const info = (getPlayerRanks()[pos] || {})[metric.id];
  if(!info) return '';

  const all = (DATA.playerGame || []).filter(r => r.Position === pos);
  const faced = new Map();
  all.filter(r => r.Opponent === def).forEach(r => {
    if(!faced.has(r.Player)) faced.set(r.Player, []);
    faced.get(r.Player).push(r);
  });
  const mean = rows => rows.reduce((sum, r) => sum + metric.value(r), 0) / rows.length;
  const top = [...faced.entries()]
    .map(([player, rows]) => ({player, rows, rank: (info.ranks[player] || {}).rank}))
    .filter(x => x.rank && x.rank <= MATCHUP_TOP_N)
    .sort((a, b) => a.rank - b.rank)
    .map(x => {
      const others = all.filter(r => r.Player === x.player && r.Opponent !== def);
      return {...x, team: x.rows[0].Team, weeks: x.rows.map(r => r.Week).join(', '), vs: mean(x.rows), usual: others.length ? mean(others) : null};
    });

  // Only positions with more than one metric (RB) get a switch; the rest just state theirs.
  const control = metrics.length > 1
    ? `<span class="mu-faced-by">Ranked by</span><span class="pill-group">${metrics.map(m =>
        `<span class="pill mu-faced-pill ${m.id === metric.id ? 'active' : ''}" data-metric="${m.id}">${m.pill}</span>`).join('')}</span>`
    : `<span class="mu-faced-by">Ranked by ${metric.label}</span>`;
  const head = `<div class="mu-faced-head"><div class="mu-faced-title">Top-${MATCHUP_TOP_N} ${pos}s ${teamName(def)} has faced</div><div class="mu-faced-ctl">${control}</div></div>`;

  if(!top.length){
    return `<div class="mu-faced">${head}
      <div class="mu-faced-row">None yet -- ${faced.size} ${pos}${faced.size === 1 ? '' : 's'} faced so far, none ranked in the top ${MATCHUP_TOP_N} by ${metric.label}.</div></div>`;
  }
  const rowsHtml = top.map(x => `<div class="mu-faced-row"><b>${x.player}</b> <span class="player-preview-pos">${x.team}</span> #${x.rank} &mdash; ${fmt(x.vs)} ${metric.short} (Wk ${x.weeks})${
    x.usual === null ? ', no other games to compare' : ` vs ${fmt(x.usual)} in his other games`}</div>`).join('');
  const comparable = top.filter(x => x.usual !== null && x.usual > 0);
  const gamesCount = top.reduce((sum, x) => sum + x.rows.length, 0);
  let summary = '';
  if(comparable.length){
    const vsAvg = comparable.reduce((sum, x) => sum + x.vs, 0) / comparable.length;
    const usualAvg = comparable.reduce((sum, x) => sum + x.usual, 0) / comparable.length;
    summary = `<div class="mu-faced-sum">Held these ${comparable.length} to an average of <b>${fmt(vsAvg)}</b> ${metric.short} vs <b>${fmt(usualAvg)}</b> in their other games (${Math.round(vsAvg / usualAvg * 100)}% of usual) &middot; ${gamesCount} game${gamesCount === 1 ? '' : 's'} total.</div>`;
  }
  return `<div class="mu-faced">${head}${rowsHtml}${summary}</div>`;
}

function mountMatchup(){
  let pos = MATCHUP_POSITIONS[0];

  // Buttons live inside tables that get rebuilt on every sort, so this is
  // passed to buildTable as onRender and re-wired after each render.
  function wireSaveButtons(tableContainer){
    $$('.save-pick-btn', tableContainer).forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        addToMyPicks({
          source: 'Matchup Explorer', player: btn.dataset.player, position: btn.dataset.position,
          team: btn.dataset.team, opponent: btn.dataset.opponent, stat: 'Game Log',
          week: btn.dataset.week, summary: btn.dataset.summary,
        });
        apply();
      });
    });
  }

  // Which rank metric the "top players faced" box uses, remembered per position.
  const rankBy = {};

  function apply(){
    const off = $('#mu-off').value;
    const def = $('#mu-def').value;
    const statCols = MATCHUP_COLS[pos];

    // Each row is one player's one game -- saving it keeps that stat line
    // (and which matchup you were viewing) as a pick.
    const saveCol = {key:'_save', label:'', render:(v,row)=>{
      const saved = isPickSaved({source:'Matchup Explorer', player:row.Player, stat:'Game Log', week:row.Week});
      const summary = `${singleGameStatLine(row)} in Wk ${row.Week} vs ${row.Opponent} (viewing ${off} vs ${def})`;
      return `<button class="save-pick-btn" ${saved?'disabled':''} data-player="${row.Player}" data-position="${row.Position}" data-team="${row.Team}" data-opponent="${row.Opponent}" data-week="${row.Week}" data-summary="${summary.replace(/"/g,'&quot;')}">${saved?'&#10003;':'+ Add'}</button>`;
    }};
    const cols = [...MATCHUP_COLS.base, ...statCols, saveCol];

    const startersOnly = getStartersOnly();
    const keep = r => !startersOnly || isStarter(r);
    const offRows = matchupAugmentRows(DATA.playerGame.filter(r=>r.Team===off && r.Position===pos && keep(r)), pos);
    // Exclude the offense's own team here -- the point of this table is to
    // show OTHER teams' performances against the defense, for comparison.
    // Without this, a team that already played this defense sees its own
    // game mirrored back in both tables.
    const defRows = matchupAugmentRows(DATA.playerGame.filter(r=>r.Opponent===def && r.Position===pos && r.Team!==off && keep(r)), pos);

    $('#mu-off-title').textContent = `Offensive Stats for ${teamName(off)} ${pos}s${startersOnly ? ' (starters only)' : ''}`;
    $('#mu-def-title').textContent = `${pos}s Played Against ${teamName(def)}${startersOnly ? ' (starters only)' : ''}`;

    // Totals row: every stat column summed across the rows shown.
    const footerFor = rows => ({
      labelSpan: MATCHUP_COLS.base.length,
      label: `Totals (${rows.length} player-game${rows.length===1 ? '' : 's'})`,
      cells: [...statCols.map(c => c.noSum ? '' : Math.round(rows.reduce((sum, r) => sum + num(r[c.key]), 0)).toLocaleString()), ''],
    });
    const tableOpts = rows => ({defaultSort:'Week', defaultDir:'asc', bandBy:'Week', footer: footerFor(rows), onRender: wireSaveButtons});
    buildTable($('#mu-off-table'), cols, offRows, tableOpts(offRows));
    buildTable($('#mu-def-table'), cols, defRows, tableOpts(defRows));

    const defVs = DATA.defVsPos.find(r=>r.Defense===def && r.Position===pos);
    const allAtPos = DATA.defVsPos.filter(r=>r.Position===pos);
    const rankStat = DEFENSE_RANK_STAT[pos];
    if(defVs && rankStat){
      const sorted = [...allAtPos].sort((a,b)=> num(b[rankStat]) - num(a[rankStat]));
      const rank = sorted.findIndex(r=>r.Defense===def) + 1;
      const maxRank = sorted.length;
      const statVal = fmt(defVs[rankStat]);
      const statLabel = rankStat.replace(' Allowed Per Game', '/g allowed');
      $('#mu-rank').innerHTML = `<div style="margin-bottom:14px;"><span class="heat" style="${heatColor(rank, maxRank)}">${teamChip(def)} ranks #${rank} of ${maxRank} vs ${pos} &middot; ${statVal} ${statLabel}</span></div>`;
    } else {
      $('#mu-rank').innerHTML = '';
    }
    const metrics = MATCHUP_RANK_METRICS[pos];
    const rankInfo = getPlayerRanks()[pos] || {};
    const primary = rankInfo[metrics[0].id];
    const rule = primary ? `season to date (needs ${primary.minGames}+ games to be ranked; top ${MATCHUP_TOP_N} highlighted in gold)` : '';
    $('#mu-rank-note').textContent = !primary ? ''
      : metrics.length === 1
        ? `Rank = league rank among ${pos}s by ${metrics[0].label}, ${rule}.`
        : `League ranks among ${pos}s, ${rule}: Rank = ${metrics[0].label}, Rush Rk = ${metrics[1].label}, Rec Rk = ${metrics[2].label}.`;
    $('#mu-faced').innerHTML = topFacedHtml(def, pos, rankBy[pos]);
    syncSchedule();
  }

  // The schedule always reflects the current selection: a game is highlighted
  // when the two chosen teams are playing each other (either direction), and
  // the team currently on offense is marked -- so it stays correct no matter
  // whether you got here by clicking a game, using Flip, or the dropdowns.
  function syncSchedule(){
    const off = $('#mu-off').value, def = $('#mu-def').value;
    $$('#mu-schedule-list .mu-game').forEach(card=>{
      const a = card.dataset.away, h = card.dataset.home;
      const active = (off === a && def === h) || (off === h && def === a);
      card.classList.toggle('active', active);
      $$('.mu-game-team', card).forEach(t => t.classList.toggle('offense', active && t.dataset.team === off));
    });
  }
  function setMatchup(off, def){
    const offEl = $('#mu-off'), defEl = $('#mu-def');
    const has = (el, v) => [...el.options].some(o => o.value === v);
    if(!has(offEl, off) || !has(defEl, def)) return;   // team missing from the explorer's list
    offEl.value = off;
    defEl.value = def;
    apply();
  }
  function pickFromGame(card, teamEl){
    const away = card.dataset.away, home = card.dataset.home;
    const off = teamEl ? teamEl.dataset.team : away;
    setMatchup(off, off === away ? home : away);
  }
  $('#mu-faced').addEventListener('click', e=>{
    const pill = e.target.closest('.mu-faced-pill');
    if(!pill) return;
    rankBy[pos] = pill.dataset.metric;
    apply();
  });
  $('#mu-schedule-list').addEventListener('click', e=>{
    const card = e.target.closest('.mu-game');
    if(card) pickFromGame(card, e.target.closest('.mu-game-team'));
  });
  $('#mu-schedule-list').addEventListener('keydown', e=>{
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('.mu-game');
    if(!card) return;
    e.preventDefault();
    pickFromGame(card, e.target.closest('.mu-game-team'));
  });

  $('#mu-starters').addEventListener('click', ()=>{
    const on = !getStartersOnly();
    setStartersOnly(on);
    $('#mu-starters').classList.toggle('active', on);
    apply();
  });
  $('#mu-off').addEventListener('change', apply);
  $('#mu-def').addEventListener('change', apply);
  $('#mu-flip').addEventListener('click', ()=>{
    const offEl = $('#mu-off'), defEl = $('#mu-def');
    const oldOff = offEl.value;
    offEl.value = defEl.value;
    defEl.value = oldOff;
    apply();
  });
  $$('#mu-pos-pills .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      $$('#mu-pos-pills .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      pos = p.dataset.pos;
      apply();
    });
  });
  apply();
}

// ---------- TAB: STREAKS ----------
// Consecutive-game streaks by position -- the kind of trend line betting
// props are built on ("hit the over in N straight games"). "Any TD" is
// tracked for every position since anytime-TD is the single most-bet
// streak of all.
const STREAK_DEFS = {
  QB: [
    {key:'passTD2', label:'2+ Pass TD', check:r=>num(r['Pass TD'])>=2},
    {key:'pass250', label:'250+ Pass Yds', check:r=>num(r['Pass Yards'])>=250},
    {key:'rushTD', label:'Any TD', highlight:true, check:r=>num(r['Rush TD'])>=1},
  ],
  RB: [
    {key:'rush100', label:'100+ Rush Yds', check:r=>num(r['Rush Yards'])>=100},
    {key:'anyTD', label:'Any TD', highlight:true, check:r=>num(r['Rush TD'])>=1 || num(r['Receiving TD'])>=1},
  ],
  WR: [
    {key:'rec75', label:'75+ Rec Yds', check:r=>num(r['Receiving Yards'])>=75},
    {key:'anyTD', label:'Any TD', highlight:true, check:r=>num(r['Receiving TD'])>=1 || num(r['Rush TD'])>=1},
  ],
  TE: [
    {key:'rec50', label:'50+ Rec Yds', check:r=>num(r['Receiving Yards'])>=50},
    {key:'anyTD', label:'Any TD', highlight:true, check:r=>num(r['Receiving TD'])>=1},
  ],
};

// Team-level scoring streaks -- uses real final scores from gameTeamStats
// (10_game_stats.py), not a touchdown-count proxy. Offense scoring 20+ is
// a streak worth knowing; a defense ALLOWING 24+ every game is arguably
// more useful (a leaky defense trend), so that one's highlighted like the
// player "Any TD" streaks are.
const TEAM_STREAK_DEFS = [
  {key:'off20', label:'20+ Points Scored', check:r=>num(r['Final Score'])>=20},
  {key:'def24', label:'24+ Points Allowed', highlight:true, check:r=>num(r['Opponent Score'])>=24},
];

function computeStreaks(){
  const byPlayer = {};
  (DATA.playerGame || []).forEach(r=>{
    const key = r.Player + '|' + r.Team;
    if(!byPlayer[key]) byPlayer[key] = {Player:r.Player, Team:r.Team, Position:r.Position, games:[]};
    byPlayer[key].games.push(r);
  });

  const results = [];
  Object.values(byPlayer).forEach(p=>{
    const defs = STREAK_DEFS[p.Position];
    if(!defs) return;
    const sortedGames = [...p.games].sort((a,b)=>num(a.Week) - num(b.Week));

    defs.forEach(def=>{
      // Walk backward from the most recent game; streak breaks the first
      // time a game fails the condition.
      let streak = 0;
      for(let i = sortedGames.length - 1; i >= 0; i--){
        if(def.check(sortedGames[i])) streak++;
        else break;
      }
      if(streak >= 2){
        results.push({
          Player: p.Player, Team: p.Team, Position: p.Position,
          StreakType: def.label, StreakLength: streak, highlight: !!def.highlight,
        });
      }
    });
  });

  // Team-level scoring streaks, from real final scores.
  const byTeam = {};
  (DATA.gameTeamStats || []).forEach(r=>{
    if(!byTeam[r.Team]) byTeam[r.Team] = [];
    byTeam[r.Team].push(r);
  });
  Object.entries(byTeam).forEach(([team, games])=>{
    const sortedGames = [...games].sort((a,b)=>num(a.Week) - num(b.Week));
    TEAM_STREAK_DEFS.forEach(def=>{
      let streak = 0;
      for(let i = sortedGames.length - 1; i >= 0; i--){
        if(def.check(sortedGames[i])) streak++;
        else break;
      }
      if(streak >= 2){
        results.push({
          Player: team, Team: team, Position: 'TEAM',
          StreakType: def.label, StreakLength: streak, highlight: !!def.highlight,
        });
      }
    });
  });

  return results.sort((a,b)=> b.StreakLength - a.StreakLength);
}

const DS_DEFAULTS = {'Receiving Yards':100,'Receptions':8,'Receiving TD':1,'Rush Yards':100,'Rush TD':1,'Pass Yards':250,'Pass TD':2,'Any TD':1};
const DS_POS_SETS = {REC:['WR','TE','RB'], WR:['WR'], TE:['TE'], RB:['RB'], QB:['QB']};

// Per defense, per game week: what did the opponent produce in this stat?
// Weeks come from the games that defense actually played (rows where it was
// the Opponent), so bye weeks never break a streak.
function computeDefenseStreaks(posKey, stat, scope, threshold){
  const set = DS_POS_SETS[posKey] || [];
  const byDef = {};
  (DATA.playerGame || []).forEach(r=>{
    if(!r.Opponent) return;
    const d = byDef[r.Opponent] || (byDef[r.Opponent] = {});
    const w = num(r.Week);
    const g = d[w] || (d[w] = {total:0, max:0});
    if(set.includes(r.Position)){
      const v = getStatValue(r, stat);
      g.total += v;
      if(v > g.max) g.max = v;
    }
  });
  return Object.entries(byDef).map(([def, weeks])=>{
    const list = Object.keys(weeks).map(Number).sort((a,b)=>a-b).map(w=>{
      const val = scope === 'total' ? weeks[w].total : weeks[w].max;
      return {week:w, val:Math.round(val*10)/10, hit: val >= threshold};
    });
    let streak = 0;
    for(let i = list.length - 1; i >= 0; i--){ if(list[i].hit) streak++; else break; }
    const hits = list.filter(x=>x.hit).length;
    return {Defense:def, Streak:streak, Hits:hits, Games:list.length, Rate: list.length ? hits/list.length : 0, list};
  });
}

function mountDefStreaks(){
  const container = $('#defstreak-table');
  if(!container) return;
  let minStreak = 1;
  const cols = [
    {key:'_sort', label:'Streak', numeric:true, render:(v,row)=>{ const v2 = row.Streak; return `<span class="heat" style="${v2>=2 ? 'background:rgba(227,169,59,0.22);border:1px solid rgba(227,169,59,0.6);' : (v2===1 ? 'background:rgba(51,214,166,0.18);border:1px solid rgba(51,214,166,0.5);' : '')}">${v2} game${v2===1?'':'s'}</span>`; }},
    {key:'Defense', label:'Defense', render:teamChip},
    {key:'Rate', label:'Season', numeric:true, render:(v,row)=>`${row.Hits}/${row.Games}`},
    {key:'list', label:'By week (oldest to newest)', render:(v)=>v.map(x=>
      `<span class="heat" style="margin-right:4px;${x.hit ? 'background:rgba(51,214,166,0.18);border:1px solid rgba(51,214,166,0.5);' : 'background:rgba(255,92,108,0.14);border:1px solid rgba(255,92,108,0.45);'}">W${x.week}: ${x.val}</span>`).join('')},
  ];
  function apply(){
    const rows = computeDefenseStreaks($('#ds-pos').value, $('#ds-stat').value, $('#ds-scope').value, num($('#ds-thresh').value));
    const shown = rows.filter(r=>r.Streak >= minStreak || minStreak === 1);
    if(!shown.length){ container.innerHTML = '<div class="empty">No defense has an active streak that long for this setting. Try a lower number.</div>'; return; }
    // Sort key: current streak first, then season hit rate.
    shown.forEach(r=>{ r._sort = r.Streak*100 + r.Rate*10; });
    buildTable(container, cols, shown, {defaultSort:'_sort', defaultDir:'desc'});
  }
  $('#ds-stat').addEventListener('change', ()=>{ $('#ds-thresh').value = DS_DEFAULTS[$('#ds-stat').value] ?? 1; apply(); });
  ['ds-pos','ds-scope'].forEach(id=>$('#'+id).addEventListener('change', apply));
  $('#ds-thresh').addEventListener('input', apply);
  $$('#ds-min-pills .pill').forEach(p=>p.addEventListener('click', ()=>{
    $$('#ds-min-pills .pill').forEach(x=>x.classList.remove('active'));
    p.classList.add('active'); minStreak = num(p.dataset.min); apply();
  }));
  apply();
}

    },

  function apply(){

// ---------- Pass location ("where the ball goes") ----------
const PL_LOCS = ['Left','Middle','Right'], PL_LENS = ['Short','Deep'];
function plSummarize(rows){
  const cells = {}; let total = 0;
  PL_LOCS.forEach(l => PL_LENS.forEach(d => { cells[l + '|' + d] = {att:0, comp:0, yds:0, td:0, int:0}; }));
  rows.forEach(r => {
    const c = cells[r.Location + '|' + r.Length]; if(!c) return;
    c.att += num(r.Att); c.comp += num(r.Comp); c.yds += num(r.Yards); c.td += num(r.TD); c.int += num(r.INT);
    total += num(r.Att);
  });
  return {cells, total};
}
function plSides(sum){
  const out = {};
  PL_LOCS.forEach(l => { out[l] = sum.total ? PL_LENS.reduce((a, d) => a + sum.cells[l + '|' + d].att, 0) / sum.total : 0; });
  return out;
}
function plLeague(){
  return plSummarize((DATA.passLocation || []).filter(r => r.Kind === 'OFF'));
}
function plSvg(sum, league, title){
  const W = 460, H = 310, x0 = 62, x1 = 250, x2 = 448, y0 = 44, rowH = 78;
  let g = `<text class="pl-axis" x="${(x0 + x2) / 2}" y="18" style="letter-spacing:.18em">${title}</text>`;
  g += `<text class="pl-axis" x="${(x0 + x1) / 2}" y="36">SHORT &middot; under 15 yds</text><text class="pl-axis" x="${(x1 + x2) / 2}" y="36">DEEP &middot; 15+ yds</text>`;
  PL_LOCS.forEach((l, ri) => {
    const y = y0 + ri * rowH;
    g += `<text class="pl-axis" x="${x0 - 8}" y="${y + rowH / 2 + 3}" style="text-anchor:end">${l.toUpperCase()}</text>`;
    PL_LENS.forEach((d, ci) => {
      const cx = ci === 0 ? x0 : x1, cw = ci === 0 ? x1 - x0 : x2 - x1;
      const c = sum.cells[l + '|' + d], lg = league.cells[l + '|' + d];
      const share = sum.total ? c.att / sum.total : 0, lshare = league.total ? lg.att / league.total : 0;
      const diff = (share - lshare) * 100;
      const a = Math.min(0.85, Math.abs(diff) / 12 * 0.75 + 0.08);
      const fill = diff >= 0 ? `rgba(227,169,59,${a})` : `rgba(90,150,255,${a})`;
      const ya = c.att ? c.yds / c.att : 0;
      g += `<g><title>${l} ${d}: ${c.att} att, ${Math.round(share*100)}% of throws (league ${Math.round(lshare*100)}%), ${c.att ? Math.round(c.comp/c.att*100) : 0}% comp, ${ya.toFixed(1)} yds/att, ${c.td} TD, ${c.int} INT</title>
        <rect x="${cx + 2}" y="${y + 2}" width="${cw - 4}" height="${rowH - 4}" rx="8" fill="${fill}" stroke="rgba(255,255,255,.08)"/>
        <text class="pl-cell-pct" x="${cx + cw / 2}" y="${y + rowH / 2 - 2}">${sum.total ? Math.round(share * 100) : 0}%</text>
        <text class="pl-cell-sub" x="${cx + cw / 2}" y="${y + rowH / 2 + 14}">${c.att} att &middot; ${c.att ? Math.round(c.comp / c.att * 100) : 0}% &middot; ${ya.toFixed(1)} Y/A</text></g>`;
    });
  });
  g += `<line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y0 + rowH * 3}" stroke="#e3a93b" stroke-width="2" stroke-dasharray="3 6" stroke-linecap="round"/>`;
  g += `<text class="pl-axis" x="${x0}" y="${y0 + rowH * 3 + 16}" style="text-anchor:start">&#8592; LINE OF SCRIMMAGE</text>`;
  return `<svg class="pl-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${title}">${g}</svg>`;
}
function plReadChips(sum, league){
  if(!sum.total) return '<span>No charted passes yet</span>';
  const s = plSides(sum), lg = plSides(league);
  const chips = PL_LOCS.map(l => {
    const d = Math.round((s[l] - lg[l]) * 100);
    const cls = d >= 5 ? 'pl-up' : (d <= -5 ? 'pl-down' : '');
    return `<span>${l} <b class="${cls}">${Math.round(s[l] * 100)}%</b> <small>(${d >= 0 ? '+' : ''}${d} vs league)</small></span>`;
  });
  const deepShare = PL_LOCS.reduce((a, l) => a + sum.cells[l + '|Deep'].att, 0) / sum.total;
  const lgDeep = PL_LOCS.reduce((a, l) => a + league.cells[l + '|Deep'].att, 0) / league.total;
  chips.push(`<span>Deep <b>${Math.round(deepShare * 100)}%</b> <small>(${deepShare >= lgDeep ? '+' : ''}${Math.round((deepShare - lgDeep) * 100)} vs league)</small></span>`);
  chips.push(`<span>${sum.total} charted throws</span>`);
  return chips.join('');
}

// ---------- TAB: DEFENSE FIELD ----------
// Players drawn on a field in their position groups. IMPORTANT: the public
// nflverse data has no alignment or coverage-assignment information, so this
// is an illustrative 11-personnel / base-defense layout built from who plays
// each position group (snap counts) -- not where anyone lined up on a snap.
// The only coverage evidence is the "credited plays" log (pass breakups,
// interceptions, tackles after a catch), shown as a proxy and labelled so.
function dfLast(name){ const t = String(name).replace(/\b(Jr|Sr|II|III|IV)\.?$/i,'').trim().split(/\s+/); return t[t.length-1] || name; }
function dfHealthColor(a){
  if(a === 'Out' || a === 'Doubtful') return '#ff5c6c';
  if(a === 'Questionable' || a === 'Limited' || (a||'').startsWith('DNP')) return '#e3a93b';
  return '#33d6a6';
}
function dfSpread(n, lo, hi){
  if(n <= 0) return [];
  if(n === 1) return [(lo+hi)/2];
  return Array.from({length:n}, (_, i) => lo + (hi-lo) * i / (n-1));
}
// Put edge players (DE) on the outside, interior (DT/NT) in the middle.
function dfOrderFront(list, edgePos){
  const edges = list.filter(p => edgePos.includes(p.Position));
  const mid = list.filter(p => !edgePos.includes(p.Position));
  const left = [], right = [];
  edges.forEach((p, i) => (i % 2 === 0 ? left : right).push(p));
  return [...left, ...mid, ...right.reverse()];
}

function dfDefenseNodes(team){
  const all = (DATA.defenseRoster || []).filter(r => r.Team === team);
  const byGroup = g => all.filter(r => r.Group === g);
  const starters = g => byGroup(g).filter(r => r.Role === 'Starter').sort((a,b)=>num(b['Last Game Snaps'])-num(a['Last Game Snaps']));
  const nodes = [];
  const dl = dfOrderFront(starters('DL'), ['DE']);
  const lb = dfOrderFront(starters('LB'), ['OLB']);
  const cbAll = byGroup('CB').filter(r => r.Role === 'Starter' || r.Role === 'Nickel').sort((a,b)=>num(b['Last Game Snaps'])-num(a['Last Game Snaps']));
  const cbs = cbAll.filter(r => r.Role === 'Starter'), nickel = cbAll.filter(r => r.Role === 'Nickel');
  const safeties = starters('S');
  dfSpread(dl.length, 175, 385).forEach((y, i) => nodes.push({p:dl[i], x:545, y, side:'D'}));
  dfSpread(lb.length, 205, 405).forEach((y, i) => nodes.push({p:lb[i], x:625, y, side:'D', lab:'R'}));
  cbs.forEach((p, i) => nodes.push({p, x:640, y: i === 0 ? 60 : 520, side:'D'}));
  nickel.forEach(p => nodes.push({p, x:580, y:135, side:'D', nickel:true, lab:'R'}));

}

function dfOffenseNodes(team){
  const pg = (DATA.playerGame || []).filter(r => r.Team === team);

  pg.forEach(r => { const k = r.Player + '|' + r.Position; (by[k] = by[k] || {Player:r.Player, Position:r.Position, games:[]}).games.push(r); });
  const players = Object.values(by).map(o => {

      recYds:sum('Receiving Yards'), rushYds:sum('Rush Yards'), passYds:sum('Pass Yards'), ptd:sum('Pass TD'), td:sum('Rush TD')+sum('Receiving TD')};
  });
  const top = (pos, key, n) => players.filter(p => p.Position === pos).sort((a,b)=>b[key]-a[key]).slice(0, n);
  const qb = top('QB','att',1)[0], rb = top('RB','rushAtt',1)[0], wrs = top('WR','tgt',3), te = top('TE','tgt',1)[0];
  const f = n => (Math.round(n*10)/10).toString();
  const lines = {
    QB: p => `${f(p.passYds/p.G)} pyd/g`, RB: p => `${f(p.rushYds/p.G)} ryd/g`,
    WR: p => `${f(p.rec/p.G)} rec · ${f(p.recYds/p.G)} yd/g`, TE: p => `${f(p.rec/p.G)} rec · ${f(p.recYds/p.G)} yd/g`,
  };
  const nodes = [];
  const add = (p, x, y, label) => { if(p) nodes.push({o:p, x, y, side:'O', label}); };
  add(qb, 360, 280, 'QB'); add(rb, 300, 280, 'RB');

  // Offensive line from the line-play table.

  let order = [T[0], G[0], C[0], G[1], T[1]].filter(Boolean);
  if(order.length < ol.length) order = [...order, ...O, ...T.slice(2), ...G.slice(2), ...C.slice(1)];

// "Shutdown corner" evidence from the credited-plays log. A receiver counts as
// HELD when the defender is credited on a play against him (breakup, INT or
// tackle after the catch) AND that receiver finished the game under 75% of his
// yards in other games, with a normal output of at least 40 yds/g. It is a
// proxy: coverage that never touches the ball cannot be seen in public data.
let _dfShutCache = {src:null, val:null};
function dfShutdownMap(){
  if(_dfShutCache.src === DATA.defenseCoverage) return _dfShutCache.val;
  const pg = DATA.playerGame || [];
  const byPlayer = {};
  pg.forEach(r => { (byPlayer[r.Player] = byPlayer[r.Player] || []).push(r); });
  const map = {};
  (DATA.defenseCoverage || []).forEach(c => {
    const key = c.Team + '|' + c.Defender;
    const e = map[key] || (map[key] = {Defender:c.Defender, Team:c.Team, plays:0, pbu:0, ints:0, held:{}});
    e.plays++;
    if(c.Event === 'Pass breakup') e.pbu++;
    if(c.Event === 'Interception') e.ints++;
    const rows = byPlayer[c.Receiver] || [];
    const others = rows.filter(x => x.Opponent !== c.Team);
    const mine = rows.filter(x => x.Opponent === c.Team && num(x.Week) === num(c.Week))[0];
    if(!others.length || !mine) return;
    const avg = others.reduce((a, x) => a + num(x['Receiving Yards']), 0) / others.length;
    const got = num(mine['Receiving Yards']);
    if(avg >= 40 && got <= avg * 0.75) e.held[c.Receiver + '|' + c.Week] = {Receiver:c.Receiver, Week:num(c.Week), avg:Math.round(avg), got};
  });
  Object.values(map).forEach(e => { e.heldList = Object.values(e.held).sort((a,b)=>b.avg-a.avg); e.heldCount = e.heldList.length; });
  _dfShutCache = {src: DATA.defenseCoverage, val: map};
  return map;
}

// What did each receiver who faced this defense do versus their normal
// output in OTHER games? Real, team-level, no coverage data required.
function dfReceiversFaced(defTeam){
  const pg = DATA.playerGame || [];
  const faced = pg.filter(r => r.Opponent === defTeam && ['WR','TE','RB'].includes(r.Position));
  const rows = [];
  const seen = new Set();
  faced.forEach(r => {
    const key = r.Player + '|' + r.Team;
    if(seen.has(key)) return; seen.add(key);
    const others = pg.filter(x => x.Player === r.Player && x.Team === r.Team && x.Opponent !== defTeam);
    const vs = faced.filter(x => x.Player === r.Player && x.Team === r.Team);
    if(!others.length) return;
    const avg = others.reduce((a, x) => a + num(x['Receiving Yards']), 0) / others.length;
    const got = vs.reduce((a, x) => a + num(x['Receiving Yards']), 0) / vs.length;
    rows.push({Player:r.Player, Team:r.Team, Pos:r.Position, avg, got, diff: got - avg, week: vs.map(x=>x.Week).join(',')});
  });
  return rows.sort((a, b) => b.avg - a.avg);
}

    const dt = new Date(g.date);

    return `<div class="mu-game" role="button" tabindex="0" data-away="${g.away}" data-home="${g.home}" title="${teamName(g.away)} at ${teamName(g.home)}">

      <div class="mu-game-meta">${when}${g.spread ? ' &middot; ' + g.spread : ''}</div></div>`;

  const opts = sel => teams.map(t => `<option value="${t}" ${t === sel ? 'selected' : ''}>${teamName(t)}</option>`).join('');
  return `

    <div class="panel-title">Defense Field</div>

    The "credited plays" log only counts breakups, interceptions and tackles after a catch, so it understates how much a good corner is really doing.</div>
    <div class="controls">
      <label class="ctl-label">Defense <select id="df-def">${opts(defTeam)}</select></label>
      <button class="save-pick-btn" id="df-flip" type="button" title="Swap offense and defense">&#8644; Flip</button>
      <label class="ctl-label">Offense <select id="df-off">${opts(offTeam)}</select></label>
    </div>
    <div class="df-wrap">
      <div id="df-field"></div>
      <div class="df-detail panel" id="df-detail"></div>
    </div>
  </div>
  <div class="panel" id="pl-panel"><div class="panel-title">Where the Ball Goes</div>
    <div class="panel-note">Share of charted passes by field third and depth, from the <b>offense's</b> point of view (left is the top of the field, as drawn above). Gold = more than the league average to that spot, blue = less. The right-hand graphic is every pass the selected <b>defense</b> has faced, so you can see where teams throw against them. This shows where the ball was thrown, not who covered it: a side a defense "faces" less could be taken away or just avoided. Sacks and spikes are excluded.</div>
    <div class="controls"><label class="ctl-label">Quarterback <select id="pl-qb"></select></label></div>
    <div class="pl-grid"><div><div class="pl-read" id="pl-read-off"></div><div id="pl-off"></div></div>

  <div class="panel"><div class="panel-title">Shutdown Corner Watch</div>
    <div class="panel-note">Ranks defenders by how many receivers they are <b>credited against</b> (breakup, interception or tackle after the catch) who then finished under 75% of their normal yards, counting only receivers who normally get 40+ yds/g. It is a floor, not a full picture: a corner who erases his man without touching the ball does not show up, and early-season samples are small. Click a row to jump to that player on the field.</div>
    <div class="controls">
      <div class="pill-group" id="df-grp-pills"><span class="pill active" data-g="CB">CB</span><span class="pill" data-g="S">S</span><span class="pill" data-g="LB">LB</span><span class="pill" data-g="">All</span></div>
      <label class="ctl-label"><input type="checkbox" id="df-shut-team"> Only the selected defense</label>

    <div class="panel-title">This Week's Games${weekLabel}</div>

function mountField(){
  if(!$('#df-def')) return;
  let selected = null, defNodes = [], offNodes = [];
  function detail(){
    const box = $('#df-detail');
    const defTeam = $('#df-def').value;
    if(!selected){ box.innerHTML = '<div class="empty" style="padding:20px 0;">Click a player to see details.</div>'; return; }
    box.innerHTML = selected.kind === 'D' ? dfDefenderDetail(defNodes[selected.i].p, defTeam) : dfOffenseDetail(offNodes[selected.i], defTeam);
  }
  function draw(){
    const defTeam = $('#df-def').value, offTeam = $('#df-off').value;
    $('#df-field').innerHTML = dfFieldSvg(defNodes, offNodes, selected, defTeam, offTeam);
    $$('#df-field .df-node').forEach(el => el.addEventListener('click', () => {
      selected = {kind: el.dataset.kind, i: num(el.dataset.i)};
      draw(); detail();
    }));
  }
  function build(){
    const defTeam = $('#df-def').value, offTeam = $('#df-off').value;
    defNodes = dfDefenseNodes(defTeam);
    offNodes = dfOffenseNodes(offTeam);
    selected = null;
    draw(); detail();
    $('#df-faced-title').textContent = `Receivers who have faced ${teamName(defTeam)}`;
    const rows = dfReceiversFaced(defTeam).map(r => ({...r, avg: Math.round(r.avg), got: Math.round(r.got), diff: Math.round(r.diff)}));
    buildTable($('#df-faced'), [
      {key:'Player', label:'Receiver'}, {key:'Team', label:'Team', render:teamChip}, {key:'Pos', label:'Pos'},
      {key:'week', label:'Wk'},
      {key:'avg', label:'His other-game avg yds', numeric:true},
      {key:'got', label:`Yds vs ${defTeam}`, numeric:true},
      {key:'diff', label:'Diff', numeric:true, render:v => `<span class="${v <= -15 ? 'df-good' : (v >= 15 ? 'df-bad' : '')}">${v > 0 ? '+' : ''}${v}</span>`},
    ], rows, {defaultSort:'avg', defaultDir:'desc', limit:15});
    if(!rows.length) $('#df-faced').innerHTML = '<div class="empty">No receivers with other-game history have faced this defense yet.</div>';
  }
  function plPanel(){
    const panel = $('#pl-panel'); if(!panel) return;
    const rows = DATA.passLocation || [];
    if(!rows.length){
      panel.innerHTML = '<div class="panel-title">Where the Ball Goes</div><div class="empty">No pass-location data yet. Run <code>15_pass_location.py</code> (part of <code>run_daily.py</code>) to create <code>data/nfl_2026_pass_location.csv</code>.</div>';
      return;
    }
    const off = $('#df-off').value, def = $('#df-def').value;
    const qbRows = rows.filter(r => r.Kind === 'QB' && r.Team === off);
    const qbs = {}; qbRows.forEach(r => { qbs[r.Name] = (qbs[r.Name] || 0) + num(r.Att); });
    const names = Object.keys(qbs).sort((a, b) => qbs[b] - qbs[a]);
    const sel = $('#pl-qb'), prev = sel.value;
    sel.innerHTML = `<option value="__team">${off} team total</option>` + names.map(n => `<option value="${n}">${n} (${qbs[n]} att)</option>`).join('');
    sel.value = names.includes(prev) ? prev : (names[0] || '__team');
    const league = plLeague();
    const offRows = sel.value === '__team' ? rows.filter(r => r.Kind === 'OFF' && r.Team === off) : qbRows.filter(r => r.Name === sel.value);
    const defRows = rows.filter(r => r.Kind === 'DEF' && r.Team === def);
    const so = plSummarize(offRows), sd = plSummarize(defRows);
    const offLabel = sel.value === '__team' ? `${off} THROWS` : `${dfLast(sel.value).toUpperCase()} THROWS`;
    $('#pl-off').innerHTML = plSvg(so, league, offLabel);
    $('#pl-def').innerHTML = plSvg(sd, league, `${def} FACES`);
    $('#pl-read-off').innerHTML = plReadChips(so, league);
    $('#pl-read-def').innerHTML = plReadChips(sd, league);
    // Matchup read: which side the QB leans to vs where this defense sees the most volume.
    if(so.total && sd.total){
      const a = plSides(so), b = plSides(sd), lg = plSides(league);
      const lean = PL_LOCS.slice().sort((x, y) => (a[y] - lg[y]) - (a[x] - lg[x]))[0];
      const avoid = PL_LOCS.slice().sort((x, y) => (a[x] - lg[x]) - (a[y] - lg[y]))[0];
      const faces = PL_LOCS.slice().sort((x, y) => (b[y] - lg[y]) - (b[x] - lg[x]))[0];
      const fewer = PL_LOCS.slice().sort((x, y) => (b[x] - lg[x]) - (b[y] - lg[y]))[0];
      $('#pl-match').innerHTML = `Read: the offense leans <b>${lean}</b> (${Math.round((a[lean]-lg[lean])*100) >= 0 ? '+' : ''}${Math.round((a[lean]-lg[lean])*100)} pts vs league) and goes <b>${avoid}</b> least (${Math.round((a[avoid]-lg[avoid])*100)}); this defense has faced the most volume to the <b>${faces}</b> (${Math.round((b[faces]-lg[faces])*100) >= 0 ? '+' : ''}${Math.round((b[faces]-lg[faces])*100)}) and the least to the <b>${fewer}</b> (${Math.round((b[fewer]-lg[fewer])*100)}). Small samples swing a lot early in the season.`;
    } else $('#pl-match').textContent = '';
  }
  $('#pl-qb') && $('#pl-qb').addEventListener('change', () => { plPanel(); });
  let shutGroup = 'CB';
  function shutTable(){
    const defTeam = $('#df-def').value, only = $('#df-shut-team').checked;
    const roster = {};
    (DATA.defenseRoster || []).forEach(r => { roster[r.Team + '|' + r.Player] = r; });
    const rows = Object.values(dfShutdownMap()).map(e => ({...e, r: roster[e.Team + '|' + e.Defender]}))
      .filter(e => e.r && (!shutGroup || e.r.Group === shutGroup) && (!only || e.Team === defTeam) && e.plays >= 2)
      .map(e => ({Defender:e.Defender, Team:e.Team, Pos:e.r.Position, held:e.heldCount, plays:e.plays, pbu:e.pbu, ints:e.ints, who:e.heldList}));
    const box = $('#df-shut');
    if(!rows.length){ box.innerHTML = '<div class="empty">No defenders match yet. This needs the defensive coverage file (run 14_defense_roster.py) and a few weeks of games.</div>'; return; }
    buildTable(box, [
      {key:'Defender', label:'Defender', render:v => `<b>${v}</b>`}, {key:'Team', label:'Team', render:teamChip}, {key:'Pos', label:'Pos'},
      {key:'held', label:'Receivers held', numeric:true, render:v => v ? `<span class="df-star">&#9733; ${v}</span>` : '0'},
      {key:'plays', label:'Credited plays', numeric:true}, {key:'pbu', label:'PBU', numeric:true}, {key:'ints', label:'INT', numeric:true},
      {key:'who', label:'Held (normal avg &rarr; that game)', render:l => l.map(x => `${dfLast(x.Receiver)} ${x.avg}&rarr;${x.got} (W${x.Week})`).join(' &middot; ')},
    ], rows, {defaultSort:'held', defaultDir:'desc', limit:25});
    $$('#df-shut tbody tr', box).forEach((tr, i) => { tr.style.cursor = 'pointer'; });
    $$('#df-shut tbody tr').forEach(tr => tr.addEventListener('click', () => {
      const name = tr.querySelector('td b')?.textContent;
      const team = (tr.querySelectorAll('td')[1]?.textContent || '');
      const abbr = Object.keys(TEAM_NAMES).find(k => TEAM_NAMES[k] === team || teamName(k) === team);
      if(!name || !abbr) return;
      $('#df-def').value = abbr; build();
      const i = defNodes.findIndex(n => n.p.Player === name);
      if(i >= 0){ selected = {kind:'D', i}; draw(); detail(); $('#df-field').scrollIntoView({behavior:'smooth', block:'center'}); }
    }));
  }
  function syncSchedule(){
    const off = $('#df-off').value, def = $('#df-def').value;
    $$('#df-schedule-list .mu-game').forEach(card => {
      const a = card.dataset.away, h = card.dataset.home;
      const active = (off === a && def === h) || (off === h && def === a);
      card.classList.toggle('active', active);
      $$('.mu-game-team', card).forEach(t => t.classList.toggle('offense', active && t.dataset.team === off));
    });
  }
  function pickFromGame(card, teamEl){
    const away = card.dataset.away, home = card.dataset.home;
    const off = teamEl ? teamEl.dataset.team : away;
    const def = off === away ? home : away;
    const has = (el, v) => [...el.options].some(o => o.value === v);
    if(!has($('#df-off'), off) || !has($('#df-def'), def)) return;
    $('#df-off').value = off; $('#df-def').value = def; build();
  }
  const sl = $('#df-schedule-list');
  sl.addEventListener('click', e => { const c = e.target.closest('.mu-game'); if(c) pickFromGame(c, e.target.closest('.mu-game-team')); });
  sl.addEventListener('keydown', e => {
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const c = e.target.closest('.mu-game'); if(!c) return;
    e.preventDefault(); pickFromGame(c, e.target.closest('.mu-game-team'));
  });
  const _build = build;
  build = function(){ _build(); shutTable(); syncSchedule(); plPanel(); };
  $$('#df-grp-pills .pill').forEach(pl => pl.addEventListener('click', () => {
    $$('#df-grp-pills .pill').forEach(x => x.classList.remove('active')); pl.classList.add('active');
    shutGroup = pl.dataset.g; shutTable();
  }));
  $('#df-shut-team').addEventListener('change', shutTable);
  $('#df-def').addEventListener('change', () => build());
  $('#df-off').addEventListener('change', () => build());
  $('#df-flip').addEventListener('click', () => {
    const a = $('#df-def').value; $('#df-def').value = $('#df-off').value; $('#df-off').value = a; build();
  });
  build();
}

// This tab is powered by data/nfl_2026_milestones.csv, generated by

// pipeline. No manual list to maintain, no ESPN endpoint guesswork.
function renderMilestones(){
  return `
  <div class="panel">
    <div class="panel-title">Milestone Watch</div>
    <div class="panel-note">
      <b>Career</b> uses ESPN's own career totals (regular season, always current through the latest game).
      <b>With Current Team</b> counts only the seasons a player has spent with the team they're on now --
      the numbers you'd see in a franchise record book -- using finer milestone steps (10 TDs, 500 yards)
      since a few seasons with one team never reaches career-sized round numbers. Closest to the
      milestone sorts first.
      ${!DATA.milestones || !DATA.milestones.length ? '<br><br><b>No milestone data yet</b> -- run the pipeline (07_milestone_watch.py) to populate this.' : ''}
    </div>
    <div class="controls">
      <div class="pill-group" id="ms-scope-pills">
        <span class="pill active" data-scope="career">Career</span>
        <span class="pill" data-scope="team">With Current Team</span>
      </div>
      <input type="text" id="ms-search" placeholder="Search player...">
      <select id="ms-stat"><option value="">All stats</option></select>
    </div>
    <div id="milestones-table"></div>
  </div>`;
}
function mountMilestones(){
  const container = $('#milestones-table');
  const statSelect = $('#ms-stat');
  let scope = 'career';

  function rowsForScope(){
    const raw = scope === 'team' ? (DATA.teamMilestones || []) : (DATA.milestones || []);
    return raw.map(m=>({
      Player: m.Player, Team: m.Team, Position: m.Position, Stat: m.Stat,
      current: num(m['Current Total']),
      target: num(m['Milestone']),
      remaining: num(m['Remaining']),
    }));
  }

  function apply(){
    const rows = rowsForScope();
    if(!rows.length){
      container.innerHTML = scope === 'team'
        ? '<div class="empty">No with-current-team milestone data yet. Re-run the pipeline (07_milestone_watch.py) to generate it.</div>'
        : '<div class="empty">No milestone data yet. Run 07_milestone_watch.py.</div>';
      return;
    }

    // Rebuild the stat dropdown for this scope, keeping the current pick if it still exists.
    const previousStat = statSelect.value;
    const statOptions = [...new Set(rows.map(r=>r.Stat))].sort();
    statSelect.innerHTML = '<option value="">All stats</option>' + statOptions.map(x=>`<option value="${x}">${x}</option>`).join('');
    if(statOptions.includes(previousStat)) statSelect.value = previousStat;

    const maxRemaining = Math.max(5, ...rows.map(r=>Math.max(1, r.remaining)));
    const cols = [
      {key:'remaining', label:'To Go', numeric:true, render:(v)=>
        `<span class="heat" style="${heatColor(Math.round(Math.max(1,v)), Math.round(maxRemaining))}">${v}</span>`
      },
      {key:'Player', label:'Player'},
      {key:'Team', label:'Team', render:teamChip},
      {key:'Position', label:'Pos'},
      {key:'Stat', label:'Stat'},
      {key:'current', label: scope === 'team' ? 'With Team' : 'Career Total', numeric:true},
      {key:'target', label:'Milestone', numeric:true},
    ];

    const q = $('#ms-search').value.trim().toLowerCase();
    const statFilter = statSelect.value;
    const filtered = rows.filter(r=>
      (!q || r.Player.toLowerCase().includes(q)) &&
      (!statFilter || r.Stat === statFilter)
    );
    buildTable(container, cols, filtered, {defaultSort:'remaining', defaultDir:'asc'});
  }

  $$('#ms-scope-pills .pill').forEach(pill=>{
    pill.addEventListener('click', ()=>{
      $$('#ms-scope-pills .pill').forEach(x=>x.classList.remove('active'));
      pill.classList.add('active');
      scope = pill.dataset.scope;
      apply();
    });
  });
  $('#ms-search').addEventListener('input', apply);
  statSelect.addEventListener('change', apply);
  apply();
}
