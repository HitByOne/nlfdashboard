function mountWeek2(){
  // Computed once per mount (not per team/game) since it's the same
  // league-wide ranking regardless of which game is being shown.
  const powerRankRows = computePowerRankings();
  const powerRankLookup = {};
  powerRankRows.forEach((r,i)=>{ powerRankLookup[r.team] = {rank: i+1, total: powerRankRows.length, score: r.powerScore}; });

  function apply(){
    const q = $('#wk2-search').value.trim().toUpperCase();

    // Collapse the two team-perspective rows ESPN/the pipeline produces per
    // game into one row per actual game, keeping both sides' data.
    const games = new Map();
    (DATA.week2 || []).forEach(r=>{
      const gid = r['Game ID'];
      if(!gid) return;
      if(!games.has(gid)) games.set(gid, {date: r.Date, sides: {}});
      const isHome = r['Home/Away'] === 'Home';
      games.get(gid).sides[isHome ? 'home' : 'away'] = r;
    });

    let gameList = [...games.values()].filter(g=>g.sides.home && g.sides.away);

    if(q){
      gameList = gameList.filter(g=>{
        const home = g.sides.home, away = g.sides.away;
        return [home.Team, home.Opponent, away.Team, away.Opponent].some(t=>
          t.toUpperCase().includes(q) || teamName(t).toUpperCase().includes(q)
        );
      });
    }

    gameList.sort((a,b)=> new Date(a.date) - new Date(b.date));

    function meterColor(pct){
      // Same mint-to-coral scale used everywhere else: high value (defense
      // allows a lot) = good matchup = mint; low value = coral.
      const good = [51,214,166], bad = [255,92,108];
      const r = Math.round(bad[0] + (good[0]-bad[0])*pct);
      const g = Math.round(bad[1] + (good[1]-bad[1])*pct);
      const b = Math.round(bad[2] + (good[2]-bad[2])*pct);
      return `rgb(${r},${g},${b})`;
    }

    // Rest & schedule context: days since a team's last completed game.
    function getTeamRestInfo(team, gameDate){
      const weeks = (DATA.teamWeek || []).filter(r=>r.Team===team);
      if(!weeks.length) return null;
      let lastGame = null;
      weeks.forEach(r=>{
        const d = new Date(r.Date);
        if(!isNaN(d) && (!lastGame || d > lastGame)) lastGame = d;
      });
      if(!lastGame) return null;
      const gd = new Date(gameDate);
      if(isNaN(gd)) return null;
      const days = Math.round((gd - lastGame) / (1000*60*60*24));
      if(days <= 0) return null;
      let label, cls;
      if(days <= 4){ label = `Short week &middot; ${days}d rest`; cls='rest-short'; }
      else if(days >= 12){ label = `Off bye &middot; ${days}d rest`; cls='rest-bye'; }
      else { label = `${days}d rest`; cls='rest-normal'; }
      return {days, label, cls};
    }

    // Static division map -- doesn't change during a season.
    const TEAM_DIVISIONS = {
      ARI:'NFC West', ATL:'NFC South', BAL:'AFC North', BUF:'AFC East',
      CAR:'NFC South', CHI:'NFC North', CIN:'AFC North', CLE:'AFC North',
      DAL:'NFC East', DEN:'AFC West', DET:'NFC North', GB:'NFC North',
      HOU:'AFC South', IND:'AFC South', JAX:'AFC South', KC:'AFC West',
      LAC:'AFC West', LAR:'NFC West', LV:'AFC West', MIA:'AFC East',
      MIN:'NFC North', NE:'AFC East', NO:'NFC South', NYG:'NFC East',
      NYJ:'AFC East', PHI:'NFC East', PIT:'AFC North', SEA:'NFC West',
      SF:'NFC West', TB:'NFC South', TEN:'AFC South', WSH:'NFC East',
    };

    // INT margin (takeaways - giveaways) from data already loaded. NOTE:
    // this is interceptions only -- fumbles aren't tracked in the pipeline
    // yet, so this is a partial turnover picture, not the full thing.
    function getTeamIntMargin(team){
      const forced = (DATA.playerGame || []).filter(r=>r.Opponent===team).reduce((s,r)=>s+num(r['Interceptions']),0);
      const thrown = (DATA.playerGame || []).filter(r=>r.Team===team).reduce((s,r)=>s+num(r['Interceptions']),0);
      return forced - thrown;
    }
    function intMarginBadge(team){
      const margin = getTeamIntMargin(team);
      if(margin === 0) return `<span class="context-chip">INT margin: even</span>`;
      const color = margin > 0 ? 'var(--mint)' : 'var(--red)';
      return `<span class="context-chip" style="color:${color};">INT margin: ${margin > 0 ? '+' : ''}${margin}</span>`;
    }

    function injuryBadge(team){
      const rows = (DATA.injuries || []).filter(r=>r.Team===team && isRelevantInjury(r));
      if(!rows.length) return '';
      const outCount = rows.filter(r=>/out|doubtful/i.test(r.Status || '')).length;
      const names = rows.map(r=>`${r.Player} (${r.Status})`).join(', ');
      return `<span class="context-chip" style="${outCount ? 'color:var(--red);' : ''}" title="${names}">${rows.length} injur${rows.length===1?'y':'ies'}${outCount ? ` &middot; ${outCount} OUT` : ''}</span>`;
    }

    // EPA matchup context: this offense's EPA/play next to what THIS
    // SPECIFIC opposing defense has allowed -- the exact "Team A offense
    // vs Team B defense" comparison, shown as two real numbers side by
    // side, not combined into a prediction.
    function getTeamEpa(team, side){
      const row = (DATA.epa || []).find(r=>r.Team===team && r.Side===side);
      return row ? {epa: num(row['EPA/Play']), gp: num(row['Games Played'])} : null;
    }
    function epaMatchupLine(offenseTeam, defenseTeam){
      const off = getTeamEpa(offenseTeam, 'Offense');
      const def = getTeamEpa(defenseTeam, 'Defense');
      if(!off && !def) return '';
      const smallSample = (off && off.gp < 4) || (def && def.gp < 4);
      const parts = [];
      if(off) parts.push(`${offenseTeam} off: ${fmt(off.epa,3)} EPA/play`);
      if(def) parts.push(`${defenseTeam} D allows: ${fmt(def.epa,3)} EPA/play`);
      return `<div class="context-row"><span class="context-chip" title="EPA/play: real per-play efficiency, shown as-is -- not combined into a prediction">${parts.join(' &middot; ')}${smallSample ? ' (small sample)' : ''}</span></div>`;
    }

    // Closest active milestone for a player, if any (a player can be
    // tracked toward more than one stat's milestone -- show whichever is
    // nearest so this stays useful, not cluttered). Only counts as "close"
    // if within 20% of that stat's milestone step (e.g. within 10 for a
    // 50-TD milestone, within 200 for a 1000-yard one) -- otherwise a
    // player merely on-track toward some future round number isn't
    // meaningfully "chasing" it yet.
    function getClosestMilestone(player){
      const entries = (DATA.milestones || []).filter(m=>m.Player===player);
      const close = entries.filter(m => num(m.Remaining) <= (MILESTONE_STEP_JS[m.Stat] || 50) * MILESTONE_CLOSE_FRACTION);
      if(!close.length) return null;
      return close.reduce((closest, m) =>
        (!closest || num(m.Remaining) < num(closest.Remaining)) ? m : closest
      , null);
    }
    function milestoneBadge(player){
      const m = getClosestMilestone(player);
      if(!m) return '';
      const remaining = num(m.Remaining);
      return `<span class="milestone-badge">&#127919; ${remaining} ${m.Stat} from ${m.Milestone}</span>`;
    }

    // A real lineup breakdown per team: 1 QB, 2 RB, 3 WR, 2 TE, each the
    // top producer(s) at that position this season -- ranked by the yardage
    // relevant to that position (not a fantasy points formula).
    const LINEUP_SLOTS = {QB:1, RB:2, WR:3, TE:2};
    const RANK_VALUE_BY_POS = {
      QB: g => num(g['Pass Yards']),
      RB: g => num(g['Rush Yards']) + num(g['Receiving Yards']),
      WR: g => num(g['Receiving Yards']),
      TE: g => num(g['Receiving Yards']),
    };

    function getTopPlayers(team){
      const byPlayer = {};
      (DATA.playerGame || []).filter(r=>r.Team===team).forEach(r=>{
        if(!byPlayer[r.Player]) byPlayer[r.Player] = {Player:r.Player, Position:r.Position, games:[]};
        byPlayer[r.Player].games.push(r);
      });
      const summarized = Object.values(byPlayer).map(p=>{
        const valueFn = RANK_VALUE_BY_POS[p.Position] || (()=>0);
        return {...p, rankValue: p.games.reduce((s,g)=>s+valueFn(g), 0)};
      });

      const lineup = [];
      Object.entries(LINEUP_SLOTS).forEach(([pos, count])=>{
        const atPos = summarized
          .filter(p=>p.Position===pos)
          .sort((a,b)=>b.rankValue - a.rankValue)
          .slice(0, count);
        lineup.push(...atPos);
      });
      return lineup;
    }

    // Real box-score line summed across their games, formatted by what's
    // actually relevant to their position rather than a generic PPG number.
    function statLine(player){
      const sum = key => player.games.reduce((s,g)=>s+num(g[key]),0);
      const passAtt=sum('Pass Attempts'), passCmp=sum('Pass Completions'), passYds=sum('Pass Yards'), passTD=sum('Pass TD'), int=sum('Interceptions');
      const rushAtt=sum('Rush Attempts'), rushYds=sum('Rush Yards'), rushTD=sum('Rush TD');
      const rec=sum('Receptions'), recYds=sum('Receiving Yards'), recTD=sum('Receiving TD'), targets=sum('Targets');

      const parts = [];
      if(passAtt > 0) parts.push(`${Math.round(passCmp)}/${Math.round(passAtt)}, ${Math.round(passYds)} yds, ${Math.round(passTD)} TD${int>0?`, ${Math.round(int)} INT`:''}`);
      if(rushAtt > 0) parts.push(`${Math.round(rushAtt)} car, ${Math.round(rushYds)} yds${rushTD>0?`, ${Math.round(rushTD)} TD`:''}`);
      if(rec > 0 || recYds > 0 || targets > 0) parts.push(`${Math.round(rec)} rec${targets>0?` (${Math.round(targets)} tgt)`:''}, ${Math.round(recYds)} yds${recTD>0?`, ${Math.round(recTD)} TD`:''}`);
      return parts.join(' &middot; ') || 'No stats yet';
    }

    // Raw stat that actually matters for each position -- yards and
    // touchdowns allowed, the kind of thing a betting line is built on --
    // instead of a fantasy-points conversion.
    const MATCHUP_STAT_BY_POS = {
      QB: {primary:'Pass Yards Allowed Per Game', primaryLabel:'pass yds/g', secondary:'Pass TD Allowed Per Game', secondaryLabel:'pass TD/g'},
      RB: {primary:'Rush Yards Allowed Per Game', primaryLabel:'rush yds/g', secondary:'Rush TD Allowed Per Game', secondaryLabel:'rush TD/g'},
      WR: {primary:'Receiving Yards Allowed Per Game', primaryLabel:'rec yds/g', secondary:'Receptions Allowed Per Game', secondaryLabel:'rec/g'},
      TE: {primary:'Receiving Yards Allowed Per Game', primaryLabel:'rec yds/g', secondary:'Receptions Allowed Per Game', secondaryLabel:'rec/g'},
    };

    function teamContextHtml(team, defenseTeam, gameDate){
      const rest = getTeamRestInfo(team, gameDate);
      const margin = getTeamIntMargin(team);
      const off = getTeamEpa(team, 'Offense');
      const def = getTeamEpa(defenseTeam, 'Defense');
      const injRows = (DATA.injuries || []).filter(r=>r.Team===team && isRelevantInjury(r));

      const powerInfo = powerRankLookup[team];
      const powerColor = powerInfo ? (powerInfo.rank <= powerInfo.total/3 ? 'var(--mint)' : powerInfo.rank > powerInfo.total*2/3 ? 'var(--red)' : null) : null;

      const items = [
        {label: 'Power Rank', value: powerInfo ? `#${powerInfo.rank} of ${powerInfo.total}` : 'No data yet', color: powerColor},
        {label: 'Rest', value: rest ? rest.label.replace(/<[^>]*>/g,'') : 'No data yet', color: rest?.cls==='rest-short' ? 'var(--red)' : rest?.cls==='rest-bye' ? 'var(--mint)' : null},
        {label: 'INT Margin', value: margin===0 ? 'Even' : (margin>0 ? `+${margin}` : `${margin}`), color: margin>0 ? 'var(--mint)' : margin<0 ? 'var(--red)' : null},
      ];
      if(off) items.push({label: `${team} Offensive EPA/Play`, value: `${fmt(off.epa,3)}${off.gp<4 ? ' (small sample)' : ''}`});
      if(def) items.push({label: `${defenseTeam} Defensive EPA/Play Allowed`, value: `${fmt(def.epa,3)}${def.gp<4 ? ' (small sample)' : ''}`});

      // Injuries get their own row per player (name + position), not a
      // single count -- the position comes from the player-game data since
      // the injury feed itself doesn't carry it.
      const injuryListHtml = injRows.length ? injRows.map(r=>{
        const posRow = (DATA.playerGame || []).find(p=>p.Player===r.Player && p.Team===team);
        const pos = posRow ? posRow.Position : '';
        const isOut = /out|doubtful/i.test(r.Status || '');
        return `
          <div class="player-preview">
            <div class="player-preview-head">
              <span class="player-preview-name">${r.Player}</span>
              <span class="player-preview-pos">${pos}</span>
            </div>
            <div class="player-preview-stats" style="${isOut ? 'color:var(--red);' : ''}">${r.Status}${r.Injury ? ` &middot; ${r.Injury}` : ''}</div>
          </div>`;
      }).join('') : `
        <div class="player-preview">
          <div class="player-preview-head"><span class="player-preview-name">Injuries</span></div>
          <div class="player-preview-stats">None listed</div>
        </div>`;

      return `
        <div class="matchup-side-label" title="${teamName(team)} offense vs ${teamName(defenseTeam)} defense">
          <b>${team}</b> offense vs <b>${defenseTeam}</b> D
        </div>
        ${items.map(it=>`
          <div class="player-preview">
            <div class="player-preview-head">
              <span class="player-preview-name">${it.label}</span>
            </div>
            <div class="player-preview-stats" style="${it.color ? `color:${it.color};` : ''}">${it.value}</div>
          </div>
        `).join('')}
        ${injuryListHtml}
      `;
    }

    function playerListHtml(team, defenseTeam){
      const topPlayers = getTopPlayers(team);
      return `
        <div class="matchup-side-label"><b>${team}</b> top players</div>
        ${topPlayers.length ? topPlayers.map(p=>{
          const cfg = MATCHUP_STAT_BY_POS[p.Position];
          const dvp = cfg ? (DATA.defVsPos || []).find(d=>d.Defense===defenseTeam && d.Position===p.Position) : null;
          let matchupTag = '';
          if(dvp){
            const allAtPos = (DATA.defVsPos || []).filter(d=>d.Position===p.Position);
            const primaryVal = num(dvp[cfg.primary]);
            const maxPrimary = Math.max(1, ...allAtPos.map(d=>num(d[cfg.primary])));
            const pct = Math.min(1, primaryVal / maxPrimary);
            const color = meterColor(pct);
            const secondaryVal = fmt(num(dvp[cfg.secondary]));
            matchupTag = `<span class="player-preview-matchup" style="color:${color};">${defenseTeam} allows ${fmt(primaryVal)} ${cfg.primaryLabel}, ${secondaryVal} ${cfg.secondaryLabel}</span>`;
          }
          const rz = (DATA.redzone || []).find(r=>r.Player===p.Player && r.Team===team);
          let rzBadge = '';
          if(rz){
            const rzParts = [];
            if(num(rz['RZ Targets']) > 0) rzParts.push(`${Math.round(num(rz['RZ Targets']))} RZ tgt (${Math.round(num(rz['RZ Target Share'])*100)}% share)`);
            if(num(rz['RZ Rush Attempts']) > 0) rzParts.push(`${Math.round(num(rz['RZ Rush Attempts']))} RZ car (${Math.round(num(rz['RZ Rush Share'])*100)}% share)`);
            if(rzParts.length) rzBadge = `<span class="player-preview-matchup" style="color:var(--gold);">${rzParts.join(' &middot; ')}</span>`;
          }
          return `
          <div class="player-preview">
            <div class="player-preview-head">
              <span class="player-preview-name">${p.Player}</span>
              <span class="player-preview-pos">${p.Position}</span>
            </div>
            <div class="player-preview-stats">${statLine(p)}</div>
            ${matchupTag}
            ${rzBadge}
            ${milestoneBadge(p.Player)}
          </div>`;
        }).join('') : '<div class="empty" style="padding:8px 0;">No player stats logged yet.</div>'}
      `;
    }

    $('#wk2-days').innerHTML = gameList.length ? gameList.map(g=>{
      const home = g.sides.home, away = g.sides.away;
      const dt = new Date(g.date);
      const dayStr = isNaN(dt) ? 'TBD' : dt.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
      const timeStr = isNaN(dt) ? '' : dt.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'});
      const mlBadge = ml => (ml !== '' && ml != null && !isNaN(num(ml))) ? `<span class="ml-badge">${num(ml)>0?'+':''}${Math.round(num(ml))}</span>` : '';
      const spread = home.Spread || away.Spread || '';
      const overUnder = home['Over/Under'] || away['Over/Under'] || '';
      const isDivisional = TEAM_DIVISIONS[away.Team] && TEAM_DIVISIONS[away.Team] === TEAM_DIVISIONS[home.Team];

      return `
      <div class="matchup-card" data-away="${away.Team}" data-home="${home.Team}">
        <div class="matchup-head">

            ${teamName(away.Team)}${mlBadge(away['Team Moneyline'])}<span class="at">@</span>${teamName(home.Team)}${mlBadge(home['Team Moneyline'])}
            ${isDivisional ? `<span class="div-badge">DIV</span>` : ''}
          </div>
          <div class="matchup-time">${dayStr}${timeStr ? ' &middot; '+timeStr : ''}</div>
        </div>
        ${(spread || overUnder) ? `
        <div class="odds-strip">
          ${spread ? `<span class="odds-chip">${spread}</span>` : ''}
          ${overUnder ? `<span class="odds-chip">O/U ${overUnder}</span>` : ''}
        </div>` : ''}
        <div class="wk2-four-col">
          <div>${teamContextHtml(away.Team, home.Team, g.date)}</div>
          <div>${playerListHtml(away.Team, home.Team)}</div>
          <div>${teamContextHtml(home.Team, away.Team, g.date)}</div>
          <div>${playerListHtml(home.Team, away.Team)}</div>
        </div>
      </div>`;
    }).join('') : '<div class="empty">No matchups match your filter.</div>';
  }

  $('#wk2-search').addEventListener('input', apply);
  apply();
}

const MATCHUP_POSITIONS = ['QB','RB','TE','WR'];
// One entry per actual game this week, built from the two team-perspective rows
// the pipeline writes for each game (same source Upcoming Matchups uses).
function matchupScheduleGames(){
  const byId = new Map();
  (DATA.week2 || []).forEach(r=>{
    const gid = r['Game ID'];
    if(!gid) return;
    if(!byId.has(gid)) byId.set(gid, {id: gid, date: r.Date, week: r.Week, rows: []});
    byId.get(gid).rows.push(r);
  });
  const games = [];
  byId.forEach(g=>{
    const homeRow = g.rows.find(r => r['Home/Away'] === 'Home');
    const awayRow = g.rows.find(r => r['Home/Away'] === 'Away');
    let home, away;
    if(homeRow && awayRow){ home = homeRow.Team; away = awayRow.Team; }
    else if(homeRow){ home = homeRow.Team; away = homeRow.Opponent; }
    else if(awayRow){ away = awayRow.Team; home = awayRow.Opponent; }
    if(!home || !away) return;
    games.push({id: g.id, date: g.date, week: g.week, away, home, spread: (g.rows.find(r => r.Spread) || {}).Spread || ''});
  });
  const time = d => { const t = +new Date(d); return isNaN(t) ? Infinity : t; };
  games.sort((a,b) => time(a.date) === time(b.date) ? 0 : time(a.date) < time(b.date) ? -1 : 1);
  return games;
}

      <div class="mu-game-meta">${when}${g.spread ? ' &middot; ' + g.spread : ''}</div>

  }).join('');
  return `
  <div class="mu-layout">
  <div class="mu-main">
  <div class="panel">
    <div class="panel-title">Matchup Explorer</div>
    <div class="panel-note">Pick an offense, a defense, and a position, or click a game in this week's schedule on the right. Left table is that offense's players game-by-game. Right table is every other team's player at that position who has played against the selected defense (excludes the offense's own team, so a past matchup between these two teams isn't double-counted).</div>
    <div class="controls">
      <label style="font-family:var(--mono);font-size:12px;color:var(--chalk-dim);">OFFENSE</label>
      <select id="mu-off">${teams.map(t=>`<option value="${t}" ${t===defaultOff?'selected':''}>${teamName(t)}</option>`).join('')}</select>
      <button class="save-pick-btn" id="mu-flip" title="Swap offense and defense">&#8646; Flip</button>
      <label style="font-family:var(--mono);font-size:12px;color:var(--chalk-dim);">DEFENSE</label>
      <select id="mu-def">${teams.map(t=>`<option value="${t}" ${t===defaultDef?'selected':''}>${teamName(t)}</option>`).join('')}</select>
      <div class="pill-group" id="mu-pos-pills">
        ${MATCHUP_POSITIONS.map((p,i)=>`<span class="pill ${i===0?'active':''}" data-pos="${p}">${p}</span>`).join('')}
      </div>
    </div>
    <div id="mu-rank"></div>

      </div>
      <div>
        <div class="panel-title" id="mu-def-title" style="font-size:16px;"></div>

  <aside class="mu-schedule panel">
    <div class="panel-title">This Week's Games${weekLabel}</div>
    <div class="panel-note" style="margin-bottom:10px;">Click a game to load it (away team on offense). Click a team to put that team on offense instead. Use Flip for the other side.</div>
    <div id="mu-schedule-list">${gameCards || '<div class="empty" style="padding:8px 0;">No schedule loaded yet for this week.</div>'}</div>
  </aside>
  </div>`;
}

// ---------- Player ranks for Matchup Explorer ----------
// Each player's league rank at his position by one yardage number per game,
// season to date. The point: a defense holding the league's BEST backs down
// says more than holding an average back down, so every row carries the rank.
const MATCHUP_TOP_N = 10;
const MATCHUP_RANK_METRIC = {
  QB: {label: 'Pass Yds/G',       short: 'pass yds',     value: r => num(r['Pass Yards'])},
  RB: {label: 'Rush + Rec Yds/G', short: 'Rush+Rec yds', value: r => num(r['Rush Yards']) + num(r['Receiving Yards'])},
  WR: {label: 'Rec Yds/G',        short: 'rec yds',      value: r => num(r['Receiving Yards'])},
  TE: {label: 'Rec Yds/G',        short: 'rec yds',      value: r => num(r['Receiving Yards'])},
};
function ordinal(n){ const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }

let _playerRankCache = {src: null, len: -1, data: {}};
function getPlayerRanks(){
  const src = DATA.playerGame || [];
  if(_playerRankCache.src === src && _playerRankCache.len === src.length) return _playerRankCache.data;
  const out = {};
  MATCHUP_POSITIONS.forEach(pos => {
    const metric = MATCHUP_RANK_METRIC[pos];
    const byPlayer = {};
    src.filter(r => r.Position === pos).forEach(r => {
      const p = byPlayer[r.Player] || (byPlayer[r.Player] = {player: r.Player, weeks: new Set(), total: 0});
      p.weeks.add(r.Week);
      p.total += metric.value(r);
    });
    const list = Object.values(byPlayer).map(p => ({player: p.player, games: p.weeks.size, total: p.total, perGame: p.total / p.weeks.size}));
    // A player needs at least half as many games as the most-active player at his
    // position, so one big game in garbage time can't outrank a season of production.
    const minGames = Math.max(1, Math.ceil(Math.max(0, ...list.map(p => p.games)) / 2));
    const eligible = list.filter(p => p.games >= minGames)
      .sort((a, b) => b.perGame - a.perGame || b.total - a.total || a.player.localeCompare(b.player));
    const ranks = {};
    eligible.forEach((p, i) => { ranks[p.player] = {...p, rank: i + 1}; });
    out[pos] = {ranks, n: eligible.length, minGames, label: metric.label};
  });
  _playerRankCache = {src, len: src.length, data: out};
  return out;
}

// Adds the derived columns every Matchup Explorer row needs.
function matchupAugmentRows(rows, pos){
  const info = getPlayerRanks()[pos];
  return rows.map(r => {
    const ranked = info && info.ranks[r.Player];
    return {
      ...r,
      'Rush + Rec Yards': num(r['Rush Yards']) + num(r['Receiving Yards']),
      _rank: ranked ? ranked.rank : null,
      _rankScore: ranked ? 1000 - ranked.rank : 0,
      _rankTitle: ranked
        ? `${ordinal(ranked.rank)} of ${info.n} ${pos}s by ${info.label} (${ranked.perGame.toFixed(1)} per game over ${ranked.games} games)`
        : `Not ranked: ${pos}s need at least ${info ? info.minGames : 1} games played to be ranked`,
    };
  });
}

// "Top backs faced": the top-ranked players at this position who have played this
// defense, each compared with his own average in every OTHER game this season.
function topFacedHtml(def, pos){
  const info = getPlayerRanks()[pos], metric = MATCHUP_RANK_METRIC[pos];
  if(!info || !metric) return '';
  const all = (DATA.playerGame || []).filter(r => r.Position === pos);
  const faced = new Map();
  all.filter(r => r.Opponent === def).forEach(r => {
    if(!faced.has(r.Player)) faced.set(r.Player, []);
    faced.get(r.Player).push(r);
  });
  const mean = rows => rows.reduce((sum, r) => sum + metric.value(r), 0) / rows.length;
  const top = [...faced.entries()]
    .map(([player, rows]) => ({player, rows, rank: (info.ranks[player] || {}).rank}))
    .filter(x => x.rank && x.rank <= MATCHUP_TOP_N)
    .sort((a, b) => a.rank - b.rank)
    .map(x => {
      const others = all.filter(r => r.Player === x.player && r.Opponent !== def);
      return {...x, team: x.rows[0].Team, weeks: x.rows.map(r => r.Week).join(', '), vs: mean(x.rows), usual: others.length ? mean(others) : null};
    });

  const title = `Top-${MATCHUP_TOP_N} ${pos}s ${teamName(def)} has faced`;
  if(!top.length){
    return `<div class="mu-faced"><div class="mu-faced-title">${title}</div>
      <div class="mu-faced-row">None yet -- ${faced.size} ${pos}${faced.size === 1 ? '' : 's'} faced so far, none ranked in the top ${MATCHUP_TOP_N}.</div></div>`;
  }
  const rowsHtml = top.map(x => `<div class="mu-faced-row"><b>${x.player}</b> <span class="player-preview-pos">${x.team}</span> #${x.rank} &mdash; ${fmt(x.vs)} ${metric.short} (Wk ${x.weeks})${
    x.usual === null ? ', no other games to compare' : ` vs ${fmt(x.usual)} in his other games`}</div>`).join('');
  const comparable = top.filter(x => x.usual !== null && x.usual > 0);
  const gamesCount = top.reduce((sum, x) => sum + x.rows.length, 0);
  let summary = '';
  if(comparable.length){
    const vsAvg = comparable.reduce((sum, x) => sum + x.vs, 0) / comparable.length;
    const usualAvg = comparable.reduce((sum, x) => sum + x.usual, 0) / comparable.length;
    summary = `<div class="mu-faced-sum">Held these ${comparable.length} to an average of <b>${fmt(vsAvg)}</b> ${metric.short} vs <b>${fmt(usualAvg)}</b> in their other games (${Math.round(vsAvg / usualAvg * 100)}% of usual) &middot; ${gamesCount} game${gamesCount === 1 ? '' : 's'} total.</div>`;
  }
  return `<div class="mu-faced"><div class="mu-faced-title">${title}</div>${rowsHtml}${summary}</div>`;
}

function mountMatchup(){
  let pos = MATCHUP_POSITIONS[0];

  // Buttons live inside tables that get rebuilt on every sort, so this is
  // passed to buildTable as onRender and re-wired after each render.
  function wireSaveButtons(tableContainer){
    $$('.save-pick-btn', tableContainer).forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        addToMyPicks({
          source: 'Matchup Explorer', player: btn.dataset.player, position: btn.dataset.position,
          team: btn.dataset.team, opponent: btn.dataset.opponent, stat: 'Game Log',
          week: btn.dataset.week, summary: btn.dataset.summary,
        });
        apply();
      });
    });
  }

  function apply(){
    const off = $('#mu-off').value;
    const def = $('#mu-def').value;
    const statCols = MATCHUP_COLS[pos];

    // Each row is one player's one game -- saving it keeps that stat line
    // (and which matchup you were viewing) as a pick.
    const saveCol = {key:'_save', label:'', render:(v,row)=>{
      const saved = isPickSaved({source:'Matchup Explorer', player:row.Player, stat:'Game Log', week:row.Week});
      const summary = `${singleGameStatLine(row)} in Wk ${row.Week} vs ${row.Opponent} (viewing ${off} vs ${def})`;
      return `<button class="save-pick-btn" ${saved?'disabled':''} data-player="${row.Player}" data-position="${row.Position}" data-team="${row.Team}" data-opponent="${row.Opponent}" data-week="${row.Week}" data-summary="${summary.replace(/"/g,'&quot;')}">${saved?'&#10003;':'+ Add'}</button>`;
    }};
    const cols = [...MATCHUP_COLS.base, ...statCols, saveCol];

    const offRows = matchupAugmentRows(DATA.playerGame.filter(r=>r.Team===off && r.Position===pos), pos);
    // Exclude the offense's own team here -- the point of this table is to
    // show OTHER teams' performances against the defense, for comparison.
    // Without this, a team that already played this defense sees its own
    // game mirrored back in both tables.
    const defRows = matchupAugmentRows(DATA.playerGame.filter(r=>r.Opponent===def && r.Position===pos && r.Team!==off), pos);

    $('#mu-off-title').textContent = `Offensive Stats for ${teamName(off)} ${pos}s`;
    $('#mu-def-title').textContent = `${pos}s Played Against ${teamName(def)}`;

    // Totals row: every stat column summed across the rows shown.
    const footerFor = rows => ({
      labelSpan: MATCHUP_COLS.base.length,
      label: `Totals (${rows.length} player-game${rows.length===1 ? '' : 's'})`,
      cells: [...statCols.map(c => Math.round(rows.reduce((sum, r) => sum + num(r[c.key]), 0)).toLocaleString()), ''],
    });
    const tableOpts = rows => ({defaultSort:'Week', defaultDir:'asc', footer: footerFor(rows), onRender: wireSaveButtons});
    buildTable($('#mu-off-table'), cols, offRows, tableOpts(offRows));
    buildTable($('#mu-def-table'), cols, defRows, tableOpts(defRows));

    const defVs = DATA.defVsPos.find(r=>r.Defense===def && r.Position===pos);
    const allAtPos = DATA.defVsPos.filter(r=>r.Position===pos);
    const rankStat = DEFENSE_RANK_STAT[pos];
    if(defVs && rankStat){
      const sorted = [...allAtPos].sort((a,b)=> num(b[rankStat]) - num(a[rankStat]));
      const rank = sorted.findIndex(r=>r.Defense===def) + 1;
      const maxRank = sorted.length;
      const statVal = fmt(defVs[rankStat]);
      const statLabel = rankStat.replace(' Allowed Per Game', '/g allowed');
      $('#mu-rank').innerHTML = `<div style="margin-bottom:14px;"><span class="heat" style="${heatColor(rank, maxRank)}">${teamChip(def)} ranks #${rank} of ${maxRank} vs ${pos} &middot; ${statVal} ${statLabel}</span></div>`;
    } else {
      $('#mu-rank').innerHTML = '';
    }
    const rankInfo = getPlayerRanks()[pos];
    $('#mu-rank-note').textContent = rankInfo
      ? `Rank = league rank among ${pos}s by ${rankInfo.label}, season to date (needs ${rankInfo.minGames}+ games to be ranked; top ${MATCHUP_TOP_N} highlighted in gold).`
      : '';
    $('#mu-faced').innerHTML = topFacedHtml(def, pos);
    syncSchedule();
  }

  // The schedule always reflects the current selection: a game is highlighted
  // when the two chosen teams are playing each other (either direction), and
  // the team currently on offense is marked -- so it stays correct no matter
  // whether you got here by clicking a game, using Flip, or the dropdowns.
  function syncSchedule(){
    const off = $('#mu-off').value, def = $('#mu-def').value;
    $$('#mu-schedule-list .mu-game').forEach(card=>{
      const a = card.dataset.away, h = card.dataset.home;
      const active = (off === a && def === h) || (off === h && def === a);
      card.classList.toggle('active', active);
      $$('.mu-game-team', card).forEach(t => t.classList.toggle('offense', active && t.dataset.team === off));
    });
  }
  function setMatchup(off, def){
    const offEl = $('#mu-off'), defEl = $('#mu-def');
    const has = (el, v) => [...el.options].some(o => o.value === v);
    if(!has(offEl, off) || !has(defEl, def)) return;   // team missing from the explorer's list
    offEl.value = off;
    defEl.value = def;
    apply();
  }
  function pickFromGame(card, teamEl){
    const away = card.dataset.away, home = card.dataset.home;
    const off = teamEl ? teamEl.dataset.team : away;
    setMatchup(off, off === away ? home : away);
  }
  $('#mu-schedule-list').addEventListener('click', e=>{
    const card = e.target.closest('.mu-game');
    if(card) pickFromGame(card, e.target.closest('.mu-game-team'));
  });
  $('#mu-schedule-list').addEventListener('keydown', e=>{
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('.mu-game');
    if(!card) return;
    e.preventDefault();
    pickFromGame(card, e.target.closest('.mu-game-team'));
  });

  $('#mu-off').addEventListener('change', apply);
  $('#mu-def').addEventListener('change', apply);
  $('#mu-flip').addEventListener('click', ()=>{
    const offEl = $('#mu-off'), defEl = $('#mu-def');
    const oldOff = offEl.value;
    offEl.value = defEl.value;
    defEl.value = oldOff;
    apply();
  });
  $$('#mu-pos-pills .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      $$('#mu-pos-pills .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      pos = p.dataset.pos;
      apply();
    });
  });
  apply();
}

// ---------- TAB: STREAKS ----------
// Consecutive-game streaks by position -- the kind of trend line betting
// props are built on ("hit the over in N straight games"). "Any TD" is
// tracked for every position since anytime-TD is the single most-bet
// streak of all.
const STREAK_DEFS = {
  QB: [
    {key:'passTD2', label:'2+ Pass TD', check:r=>num(r['Pass TD'])>=2},
    {key:'pass250', label:'250+ Pass Yds', check:r=>num(r['Pass Yards'])>=250},
    {key:'rushTD', label:'Any TD', highlight:true, check:r=>num(r['Rush TD'])>=1},
  ],
  RB: [
    {key:'rush100', label:'100+ Rush Yds', check:r=>num(r['Rush Yards'])>=100},
    {key:'anyTD', label:'Any TD', highlight:true, check:r=>num(r['Rush TD'])>=1 || num(r['Receiving TD'])>=1},
  ],
  WR: [
    {key:'rec75', label:'75+ Rec Yds', check:r=>num(r['Receiving Yards'])>=75},
    {key:'anyTD', label:'Any TD', highlight:true, check:r=>num(r['Receiving TD'])>=1 || num(r['Rush TD'])>=1},
  ],
  TE: [
    {key:'rec50', label:'50+ Rec Yds', check:r=>num(r['Receiving Yards'])>=50},
    {key:'anyTD', label:'Any TD', highlight:true, check:r=>num(r['Receiving TD'])>=1},
  ],
};

// Team-level scoring streaks -- uses real final scores from gameTeamStats
// (10_game_stats.py), not a touchdown-count proxy. Offense scoring 20+ is
// a streak worth knowing; a defense ALLOWING 24+ every game is arguably
// more useful (a leaky defense trend), so that one's highlighted like the
// player "Any TD" streaks are.
const TEAM_STREAK_DEFS = [
  {key:'off20', label:'20+ Points Scored', check:r=>num(r['Final Score'])>=20},
  {key:'def24', label:'24+ Points Allowed', highlight:true, check:r=>num(r['Opponent Score'])>=24},
];

function computeStreaks(){
  const byPlayer = {};
  (DATA.playerGame || []).forEach(r=>{
    const key = r.Player + '|' + r.Team;
    if(!byPlayer[key]) byPlayer[key] = {Player:r.Player, Team:r.Team, Position:r.Position, games:[]};
    byPlayer[key].games.push(r);
  });

  const results = [];
  Object.values(byPlayer).forEach(p=>{
    const defs = STREAK_DEFS[p.Position];
    if(!defs) return;
    const sortedGames = [...p.games].sort((a,b)=>num(a.Week) - num(b.Week));

    defs.forEach(def=>{
      // Walk backward from the most recent game; streak breaks the first
      // time a game fails the condition.
      let streak = 0;
      for(let i = sortedGames.length - 1; i >= 0; i--){
        if(def.check(sortedGames[i])) streak++;
        else break;
      }
      if(streak >= 2){
        results.push({
          Player: p.Player, Team: p.Team, Position: p.Position,
          StreakType: def.label, StreakLength: streak, highlight: !!def.highlight,
        });
      }
    });
  });

  // Team-level scoring streaks, from real final scores.
  const byTeam = {};
  (DATA.gameTeamStats || []).forEach(r=>{
    if(!byTeam[r.Team]) byTeam[r.Team] = [];
    byTeam[r.Team].push(r);
  });
  Object.entries(byTeam).forEach(([team, games])=>{
    const sortedGames = [...games].sort((a,b)=>num(a.Week) - num(b.Week));
    TEAM_STREAK_DEFS.forEach(def=>{
      let streak = 0;
      for(let i = sortedGames.length - 1; i >= 0; i--){
        if(def.check(sortedGames[i])) streak++;
        else break;
      }
      if(streak >= 2){
        results.push({
          Player: team, Team: team, Position: 'TEAM',
          StreakType: def.label, StreakLength: streak, highlight: !!def.highlight,
        });
      }
    });
  });

  return results.sort((a,b)=> b.StreakLength - a.StreakLength);
}

function renderStreaks(){
  return `
  <div class="panel">
    <div class="panel-title">Active Streaks</div>
    <div class="panel-note">Consecutive games (most recent, uninterrupted) a player or team has hit a threshold. Only 2+ game streaks are shown -- as more weeks get logged, these will get more meaningful. Gold rows are touchdown streaks (for QBs, rushing TDs specifically -- passing TDs are tracked separately under "2+ Pass TD") or a defense allowing 24+ points. TEAM filter shows offense/defense scoring streaks from real final scores.</div>
    <div class="controls">
      <input type="text" id="streak-search" placeholder="Search player...">
      <select id="streak-type"><option value="">All streak types</option></select>
      <div class="pill-group" id="streak-pos-pills">
        <span class="pill active" data-pos="">ALL</span>
        <span class="pill" data-pos="QB">QB</span>
        <span class="pill" data-pos="RB">RB</span>
        <span class="pill" data-pos="WR">WR</span>
        <span class="pill" data-pos="TE">TE</span>
        <span class="pill" data-pos="TEAM">TEAM</span>
      </div>
    </div>
    <div id="streaks-table"></div>
  </div>`;
}

function mountStreaks(){
  const allStreaks = computeStreaks();
  const container = $('#streaks-table');

  const typeOptions = [...new Set(allStreaks.map(r=>r.StreakType))].sort();
  const typeSelect = $('#streak-type');
  typeSelect.innerHTML = '<option value="">All streak types</option>' +
    typeOptions.map(t=>`<option value="${t}">${t}</option>`).join('');

  const cols = [

      `<span class="heat" style="${row.highlight ? 'background:rgba(227,169,59,0.22);border:1px solid rgba(227,169,59,0.6);' : 'background:rgba(51,214,166,0.18);border:1px solid rgba(51,214,166,0.5);'}">${v} games</span>`
    },
    {key:'Player', label:'Player'},
    {key:'Team', label:'Team', render:teamChip},
    {key:'Position', label:'Pos'},
    {key:'StreakType', label:'Streak Type'},
  ];

  let pos = '';
  function apply(){

    const filtered = allStreaks.filter(r=>

    );
    buildTable(container, cols, filtered, {defaultSort:'StreakLength', defaultDir:'desc'});
    if(!filtered.length){
      container.innerHTML = '<div class="empty">No active streaks match your filters.</div>';
    }
  }

  $('#streak-search').addEventListener('input', apply);
  typeSelect.addEventListener('change', apply);
  $$('#streak-pos-pills .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      $$('#streak-pos-pills .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      pos = p.dataset.pos;

  apply();

      {key:'Stat', label:'Stat'},

    const q = $('#ms-search').value.trim().toLowerCase();
    const statFilter = statSelect.value;
    const filtered = rows.filter(r=>
      (!q || r.Player.toLowerCase().includes(q)) &&
      (!statFilter || r.Stat === statFilter)

    buildTable(container, cols, filtered, {defaultSort:'remaining', defaultDir:'asc'});

// ---------- TAB: EPA / EFFICIENCY ----------
// Powered by data/nfl_2026_team_epa.csv, generated by 09_epa_efficiency.py
// from nflverse's real play-by-play data. EPA (Expected Points Added per
// play) and success rate are much better indicators of true team quality
// than raw yards/points, since they account for down/distance/field
// position on every play instead of just game totals.
function renderEpa(){
  return `
  <div class="panel">
    <div class="panel-title">EPA / Efficiency</div>
    <div class="panel-note">
      Expected Points Added per play and success rate, from real play-by-play data --
      not a formula to add together and predict a score, just a read on how efficient
      each side has actually been. <b>Early-season numbers are noisy</b> -- treat anything
      under ~4 games played with real caution. Click a team to see pass/rush splits and
      recent (last 3 games) form. Mint = strong, coral = weak.
      ${!DATA.epa || !DATA.epa.length ? '<br><br><b>No EPA data yet</b> -- run the pipeline (09_epa_efficiency.py) to populate this.' : ''}
    </div>
    <div class="controls">
      <input type="text" id="epa-search" placeholder="Search team...">
    </div>
    <div id="epa-table"></div>
  </div>`;
}

function mountEpa(){
  const container = $('#epa-table');
  const raw = DATA.epa || [];
  if(!raw.length){
    container.innerHTML = '<div class="empty">No EPA data yet. Run 09_epa_efficiency.py.</div>';
    return;
  }

  // Combine the Offense and Defense rows nflverse-side produces per team
  // into one row per team, offense and defense side by side.
  const byTeam = {};
  raw.forEach(r=>{
    if(!byTeam[r.Team]) byTeam[r.Team] = {Team: r.Team};
    const side = r.Side === 'Offense' ? 'off' : 'def';
    byTeam[r.Team][`${side}EpaPlay`] = num(r['EPA/Play']);
    byTeam[r.Team][`${side}Success`] = num(r['Success Rate']);
    byTeam[r.Team][`${side}PassEpa`] = num(r['Pass EPA/Play']);
    byTeam[r.Team][`${side}RushEpa`] = num(r['Rush EPA/Play']);
    byTeam[r.Team][`${side}Last3Epa`] = num(r['Last3 EPA/Play']);
    byTeam[r.Team][`${side}Last3Success`] = num(r['Last3 Success Rate']);
    byTeam[r.Team].gamesPlayed = num(r['Games Played']);
  });
  const teams = Object.values(byTeam);

  const maxOffEpa = Math.max(...teams.map(t=>Math.abs(t.offEpaPlay || 0)), 0.01);
  const maxDefEpa = Math.max(...teams.map(t=>Math.abs(t.defEpaPlay || 0)), 0.01);

  function epaColor(val, maxAbs, higherIsBetter){
    const pct = Math.max(-1, Math.min(1, val / maxAbs));
    const scaled = higherIsBetter ? (pct + 1) / 2 : (1 - pct) / 2;
    return meterColorGlobal(scaled);
  }
  // Shared mint-to-coral scale, matching the rest of the app.
  function meterColorGlobal(pct){
    const good = [51,214,166], bad = [255,92,108];
    const r = Math.round(bad[0] + (good[0]-bad[0])*pct);
    const g = Math.round(bad[1] + (good[1]-bad[1])*pct);
    const b = Math.round(bad[2] + (good[2]-bad[2])*pct);
    return `rgb(${r},${g},${b})`;
  }

  const expanded = new Set();

  function apply(){
    const q = $('#epa-search').value.trim().toLowerCase();
    const filtered = teams
      .filter(t=> !q || t.Team.toLowerCase().includes(q) || teamName(t.Team).toLowerCase().includes(q))
      .sort((a,b)=> (b.offEpaPlay||0) - (a.offEpaPlay||0));

    const headHtml = `<tr>
      <th></th><th>Team</th><th>GP</th>
      <th>Off EPA/Play</th><th>Off Success%</th>
      <th>Def EPA/Play Allowed</th><th>Def Success% Allowed</th>
    </tr>`;

    const bodyHtml = filtered.map(t=>{
      const isOpen = expanded.has(t.Team);
      const smallSample = t.gamesPlayed < 4;
      const rowHtml = `
        <tr class="epa-row" data-team="${t.Team}" style="cursor:pointer;">
          <td class="num" style="color:var(--chalk-dim);">${isOpen ? '&#9662;' : '&#9656;'}</td>
          <td>${teamChip(t.Team)}${smallSample ? '<span class="context-chip" style="margin-left:6px;">small sample</span>' : ''}</td>
          <td class="num">${t.gamesPlayed}</td>
          <td class="num"><span class="heat" style="background:${epaColor(t.offEpaPlay,maxOffEpa,true)}30;border:1px solid ${epaColor(t.offEpaPlay,maxOffEpa,true)};">${fmt(t.offEpaPlay,3)}</span></td>
          <td class="num">${fmt((t.offSuccess||0)*100,1)}%</td>
          <td class="num"><span class="heat" style="background:${epaColor(t.defEpaPlay,maxDefEpa,false)}30;border:1px solid ${epaColor(t.defEpaPlay,maxDefEpa,false)};">${fmt(t.defEpaPlay,3)}</span></td>
          <td class="num">${fmt((t.defSuccess||0)*100,1)}%</td>
        </tr>`;

      const detailHtml = isOpen ? `
        <tr class="def-detail-row">
          <td colspan="7" style="background:var(--field-deep);padding:10px 16px;">
            <div style="display:flex;gap:24px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;">
              <div>
                <div style="color:var(--chalk-dim);margin-bottom:4px;">OFFENSE SPLITS</div>
                <div>Pass EPA/play: <b style="color:var(--chalk);">${fmt(t.offPassEpa,3)}</b></div>
                <div>Rush EPA/play: <b style="color:var(--chalk);">${fmt(t.offRushEpa,3)}</b></div>
                <div>Last 3 games EPA/play: <b style="color:var(--chalk);">${fmt(t.offLast3Epa,3)}</b> (${fmt((t.offLast3Success||0)*100,1)}% success)</div>
              </div>
              <div>
                <div style="color:var(--chalk-dim);margin-bottom:4px;">DEFENSE SPLITS (allowed)</div>
                <div>Pass EPA/play: <b style="color:var(--chalk);">${fmt(t.defPassEpa,3)}</b></div>
                <div>Rush EPA/play: <b style="color:var(--chalk);">${fmt(t.defRushEpa,3)}</b></div>
                <div>Last 3 games EPA/play: <b style="color:var(--chalk);">${fmt(t.defLast3Epa,3)}</b> (${fmt((t.defLast3Success||0)*100,1)}% success)</div>
              </div>
            </div>
          </td>
        </tr>` : '';

      return rowHtml + detailHtml;
    }).join('');

    container.innerHTML = `<div class="table-scroll"><table><thead>${headHtml}</thead><tbody>${bodyHtml}</tbody></table></div>`;

    $$('.epa-row', container).forEach(tr=>{
      tr.addEventListener('click', ()=>{
        const team = tr.dataset.team;
        if(expanded.has(team)) expanded.delete(team);
        else expanded.add(team);
        apply();
      });
    });
  }

  $('#epa-search').addEventListener('input', apply);
  apply();
}

// ---------- TAB: BEST PICKS ----------
// Ranked matchup edges for this week's games. Combines: how a player's own
// season production compares to what the opposing defense allows at their
// position (the core signal), whether both are trending the right way over
// the last 3 games (a modest boost, not a separate score), and any
// milestone they're closing in on (called out, also a small boost so it
// helps break ties toward more newsworthy picks). Out/Doubtful players are
// excluded entirely -- a great matchup on paper means nothing if they
// don't play.
// Each position can be evaluated on more than one stat -- a pick isn't
// forced into one fixed category (RB always "Rush Yards", etc.). Every
// applicable stat for a player is scored, and whichever gives the
// strongest combined signal (their own quality x this defense's weakness
// at that specific stat) becomes their pick, shown with which stat it was.
const PICKS_STAT_OPTIONS = {
  QB: [
    {key:'Pass Yards', label:'Pass Yards', defenseKey:'Pass Yards Allowed Per Game'},
    {key:'Pass TD', label:'Pass TD', defenseKey:'Pass TD Allowed Per Game'},
  ],
  RB: [
    {key:'Rush Yards', label:'Rush Yards', defenseKey:'Rush Yards Allowed Per Game'},
    {key:'Receiving Yards', label:'Receiving Yards', defenseKey:'Receiving Yards Allowed Per Game'},
    {key:'Receptions', label:'Receptions', defenseKey:'Receptions Allowed Per Game'},
  ],
  WR: [
    {key:'Receiving Yards', label:'Receiving Yards', defenseKey:'Receiving Yards Allowed Per Game'},
    {key:'Receptions', label:'Receptions', defenseKey:'Receptions Allowed Per Game'},
    {key:'Receiving TD', label:'Receiving TD', defenseKey:'Receiving TD Allowed Per Game'},
  ],
  TE: [
    {key:'Receiving Yards', label:'Receiving Yards', defenseKey:'Receiving Yards Allowed Per Game'},
    {key:'Receptions', label:'Receptions', defenseKey:'Receptions Allowed Per Game'},
  ],
};
const PICKS_POSITIONS = ['QB','RB','WR','TE'];

function getPlayerSeasonAndLast3(playerName, position, statKey){
  const games = (DATA.playerGame || []).filter(r=>r.Player===playerName && r.Position===position)
    .sort((a,b)=>num(a.Week)-num(b.Week));
  if(!games.length) return null;
  const seasonAvg = games.reduce((s,g)=>s+num(g[statKey]),0) / games.length;
  const last3 = games.slice(-3);
  const last3Avg = last3.reduce((s,g)=>s+num(g[statKey]),0) / last3.length;
  return {seasonAvg, last3Avg, gamesPlayed: games.length};
}

function getDefenseSeasonAndLast3(defense, position, statOption){
  const row = (DATA.defVsPos || []).find(r=>r.Defense===defense && r.Position===position);
  if(!row) return null;
  const seasonAllowed = num(row[statOption.defenseKey]);
  const totalKey = statOption.defenseKey.replace(' Per Game', '');
  const rawKey = DEFENSE_STAT_RAW_MAP[totalKey] || statOption.key;
  const log = getDefenseWeeklyLog(defense, position);
  const last3 = log.slice(-3);
  const last3Allowed = last3.length ? last3.reduce((s,w)=>s+num(w[rawKey]),0)/last3.length : seasonAllowed;
  return {seasonAllowed, last3Allowed};
}

function getClosestMilestoneGlobal(player){
  const entries = (DATA.milestones || []).filter(m=>m.Player===player);
  const close = entries.filter(m => num(m.Remaining) <= (MILESTONE_STEP_JS[m.Stat] || 50) * MILESTONE_CLOSE_FRACTION);
  if(!close.length) return null;
  return close.reduce((c,m)=>(!c || num(m.Remaining) < num(c.Remaining)) ? m : c, null);
}

function isPlayerOut(player){
  return (DATA.injuries || []).some(r=>r.Player===player && /out|doubtful/i.test(r.Status || ''));
}

// League-wide percentile per position PER STAT: 1.0 = the top producer at
// that position in that specific stat this season, 0.0 = the lowest.
function buildPlayerPercentileRanks(){
  const ranks = {};
  PICKS_POSITIONS.forEach(pos=>{
    ranks[pos] = {};
    (PICKS_STAT_OPTIONS[pos] || []).forEach(opt=>{
      const byPlayer = {};
      (DATA.playerGame || []).filter(r=>r.Position===pos).forEach(r=>{
        if(!byPlayer[r.Player]) byPlayer[r.Player] = [];
        byPlayer[r.Player].push(num(r[opt.key]));
      });
      const avgs = Object.entries(byPlayer).map(([player, vals]) => ({player, avg: vals.reduce((s,v)=>s+v,0)/vals.length}));
      avgs.sort((a,b)=>b.avg-a.avg);
      const n = avgs.length;
      ranks[pos][opt.key] = {};
      avgs.forEach((e,i)=>{ ranks[pos][opt.key][e.player] = n>1 ? 1 - i/(n-1) : 1; });
    });
  });
  return ranks;
}

// Same idea for defenses, per stat: 1.0 = allows the most of that specific
// stat at this position (weakest, best matchup), 0.0 = allows the least.
function buildDefensePercentileRanks(){
  const ranks = {};
  PICKS_POSITIONS.forEach(pos=>{
    ranks[pos] = {};
    (PICKS_STAT_OPTIONS[pos] || []).forEach(opt=>{
      const rows = (DATA.defVsPos || []).filter(r=>r.Position===pos);
      const sorted = [...rows].sort((a,b)=>num(b[opt.defenseKey]) - num(a[opt.defenseKey]));
      const n = sorted.length;
      ranks[pos][opt.key] = {};
      sorted.forEach((r,i)=>{ ranks[pos][opt.key][r.Defense] = n>1 ? 1 - i/(n-1) : 1; });
    });
  });
  return ranks;
}

function computeGamePicks(awayTeam, homeTeam, playerPercentiles, defensePercentiles){
  const sides = [[awayTeam, homeTeam], [homeTeam, awayTeam]]; // [offenseTeam, defenseTeam]
  const candidates = [];

  sides.forEach(([offenseTeam, defenseTeam])=>{
    const players = [...new Set(
      (DATA.playerGame || []).filter(r=>r.Team===offenseTeam && PICKS_POSITIONS.includes(r.Position)).map(r=>r.Player)
    )];

    players.forEach(player=>{
      if(isPlayerOut(player)) return;
      const posRow = (DATA.playerGame || []).find(r=>r.Player===player && r.Team===offenseTeam);
      const position = posRow.Position;
      const statOptions = PICKS_STAT_OPTIONS[position] || [];

      // Evaluate every applicable stat for this player and keep whichever
      // gives the strongest combined signal -- that becomes their pick.
      let best = null;
      statOptions.forEach(opt=>{
        const playerTrend = getPlayerSeasonAndLast3(player, position, opt.key);
        const defTrend = getDefenseSeasonAndLast3(defenseTeam, position, opt);
        if(!playerTrend || !defTrend) return;
        if(playerTrend.seasonAvg <= 0) return; // this player doesn't actually produce this stat

        const playerPct = playerPercentiles[position]?.[opt.key]?.[player] ?? 0;
        const defPct = defensePercentiles[position]?.[opt.key]?.[defenseTeam] ?? 0;
        let score = playerPct * defPct;

        const defenseTrendUp = defTrend.last3Allowed > defTrend.seasonAllowed * 1.1;
        const playerTrendUp = playerTrend.last3Avg > playerTrend.seasonAvg * 1.1;
        if(defenseTrendUp) score *= 1.1;
        if(playerTrendUp) score *= 1.1;

        const entry = {
          player, position, team: offenseTeam, opponent: defenseTeam,
          statLabel: opt.label,
          playerSeasonAvg: playerTrend.seasonAvg, playerLast3Avg: playerTrend.last3Avg,
          defenseSeasonAllowed: defTrend.seasonAllowed, defenseLast3Allowed: defTrend.last3Allowed,
          defenseTrendUp, playerTrendUp, score,
        };
        if(!best || score > best.score) best = entry;
      });

      if(!best) return;
      const milestone = getClosestMilestoneGlobal(player);
      if(milestone) best.score *= 1.05;
      best.milestone = milestone;
      candidates.push(best);
    });
  });

  candidates.sort((a,b)=>b.score-a.score);
  return candidates.slice(0,5);
}

    <div class="panel-note">

// ---------- TAB: POWER RANKINGS ----------
// Combines three things already computed elsewhere into one ranked list:
// net EPA/play (offense minus defense allowed -- the single best predictor
// of true team quality), real win-loss record (from actual final scores in
// gameTeamStats, not a touchdown-count proxy), and strength of schedule.
// Each is converted to a league-wide percentile and blended transparently
// (50% EPA, 30% record, 20% SOS) so the ranking is explainable, not a black
// box -- every component is shown in the table, not just the final score.
function computePowerRankings(){
  const teams = [...new Set((DATA.teamSummary || []).map(r=>r.Team))];

  const records = {};
  (DATA.gameTeamStats || []).forEach(r=>{
    if(!records[r.Team]) records[r.Team] = {wins:0, losses:0, ties:0};
    const diff = num(r['Final Score']) - num(r['Opponent Score']);
    if(diff > 0) records[r.Team].wins++;
    else if(diff < 0) records[r.Team].losses++;
    else records[r.Team].ties++;
  });

  const epaByTeam = {};
  (DATA.epa || []).forEach(r=>{
    if(!epaByTeam[r.Team]) epaByTeam[r.Team] = {};
    epaByTeam[r.Team][r.Side] = num(r['EPA/Play']);
  });

  const sosByTeam = {};
  (DATA.sos || []).forEach(r=>{ sosByTeam[r.Team] = num(r['Played SOS']); });

  const rows = teams.map(team=>{
    const off = epaByTeam[team]?.Offense ?? 0;
    const def = epaByTeam[team]?.Defense ?? 0;
    const rec = records[team] || {wins:0, losses:0, ties:0};
    const gp = rec.wins + rec.losses + rec.ties;
    return {
      team, off, def, netEpa: off - def,
      wins: rec.wins, losses: rec.losses, ties: rec.ties, gp,
      winPct: gp > 0 ? (rec.wins + rec.ties*0.5) / gp : null,
      sos: sosByTeam[team] ?? null,
    };
  });

  function addPercentile(items, valueFn, outKey, fallback){
    const withValue = items.filter(r => valueFn(r) !== null);
    const sorted = [...withValue].sort((a,b)=> valueFn(b) - valueFn(a));
    const n = sorted.length;
    sorted.forEach((r,i)=>{ r[outKey] = n>1 ? 1 - i/(n-1) : 1; });
    items.forEach(r=>{ if(valueFn(r) === null) r[outKey] = fallback; });
  }

  addPercentile(rows, r=>r.netEpa, 'epaPct', 0.5);
  addPercentile(rows, r=>r.winPct, 'winPct_pct', 0.5);
  addPercentile(rows, r=>r.sos, 'sosPct', 0.5);

  rows.forEach(r=>{ r.powerScore = r.epaPct*0.5 + r.winPct_pct*0.3 + r.sosPct*0.2; });
  rows.sort((a,b)=> b.powerScore - a.powerScore);
  return rows;
}

function renderPowerRankings(){
  return `
  <div class="panel">
    <div class="panel-title">Power Rankings</div>
    <div class="panel-note">
      Blends net EPA/play (50% -- the single best predictor of true quality), real win-loss record from
      actual final scores (30%), and strength of schedule (20%) into one ranked list. Every component is
      shown below, not hidden inside one score -- a team can be ranked highly on efficiency while its
      record hasn't caught up yet, or vice versa.
      ${!DATA.gameTeamStats || !DATA.gameTeamStats.length ? '<br><br><b>No real-score record data yet</b> -- run 10_game_stats.py to populate win-loss records (rankings still work from EPA/SOS alone until then).' : ''}

}

// ---------- TAB: PREDICTIONS ----------
// A transparent, simplified model -- not a professional forecasting
// system. Every input and formula is shown inline rather than hidden
// behind a single output number, matching how the rest of this app treats
// "predictive"-feeling features (see Best Picks, EPA/Efficiency). Real
// outcomes involve injuries, weather, coaching decisions, and randomness
// this model doesn't fully capture -- treat this as an illustrative
// estimate built from your own season data, not a guarantee.
const HOME_FIELD_ADVANTAGE = 2.0;   // points -- a widely-cited long-run NFL average
const AVG_PLAYS_PER_GAME = 65;      // rough average plays/team/game, used only to translate an EPA/play gap into an approximate point margin
const MARGIN_SCALE = 14;            // spread-to-win-probability curve steepness, calibrated to typical NFL game-margin variance (~13-14 pt standard deviation)

function predictGameOutcome(awayTeam, homeTeam, powerByTeam){
  const away = powerByTeam[awayTeam];
  const home = powerByTeam[homeTeam];
  if(!away || !home) return null;

  const epaDiff = home.netEpa - away.netEpa;
  const predictedMargin = epaDiff * AVG_PLAYS_PER_GAME + HOME_FIELD_ADVANTAGE; // positive = home favored
  const homeWinProb = 1 / (1 + Math.pow(10, -predictedMargin / MARGIN_SCALE));

  return {
    predictedMargin, homeWinProb, awayWinProb: 1 - homeWinProb,
    homeNetEpa: home.netEpa, awayNetEpa: away.netEpa,
  };
}

// Matchup-adjusted stat projection: blend a player's season and recent-form
// average, then scale by how this specific opponent compares to the
// league average at that stat/position.
//
// Two safeguards against small-sample volatility (without them, an
// early-season defense that's had one shootout game can look 2-3x worse
// than league average from pure noise, and multiplying that into an
// already-elevated player average compounds into unrealistic numbers --
// e.g. projecting a 500-yard passing game):
//   1. The raw matchup factor is capped to [0.6, 1.6] -- a defense truly
//      being 60% better or worse than average is already extreme; beyond
//      that is far more likely noise than a real, stable tendency.
//   2. The factor is shrunk toward neutral (1.0) based on how many games
//      this defense has actually played, fully trusted only by 6 games in.
function projectPlayerStat(player, position, statOption, opponent){
  const playerTrend = getPlayerSeasonAndLast3(player, position, statOption.key);
  const defTrend = getDefenseSeasonAndLast3(opponent, position, statOption);
  if(!playerTrend || !defTrend || playerTrend.seasonAvg <= 0) return null;

  const allRows = (DATA.defVsPos || []).filter(r=>r.Position===position);
  if(!allRows.length) return null;
  const leagueAvgAllowed = allRows.reduce((s,r)=>s+num(r[statOption.defenseKey]),0) / allRows.length;

  const defRow = allRows.find(r=>r.Defense===opponent);
  const gamesPlayed = defRow ? num(defRow['Games Played']) : 0;

  let rawFactor = leagueAvgAllowed > 0 ? defTrend.seasonAllowed / leagueAvgAllowed : 1;
  rawFactor = Math.max(0.6, Math.min(1.6, rawFactor));
  const shrinkWeight = Math.min(1, gamesPlayed / 6);
  const matchupFactor = 1 + (rawFactor - 1) * shrinkWeight;

  const blendedAvg = playerTrend.seasonAvg * 0.6 + playerTrend.last3Avg * 0.4;
  const projected = blendedAvg * matchupFactor;

  return {projected, seasonAvg: playerTrend.seasonAvg, matchupFactor, gamesPlayed};
}

function pickProjectionPlayers(team){
  const byPlayer = {};
  (DATA.playerGame || []).filter(r=>r.Team===team && PICKS_POSITIONS.includes(r.Position)).forEach(r=>{
    if(!byPlayer[r.Player]) byPlayer[r.Player] = {player:r.Player, position:r.Position, games:[]};
    byPlayer[r.Player].games.push(r);
  });
  const primaryStatFor = pos => (PICKS_STAT_OPTIONS[pos] || [])[0];
  const withVolume = Object.values(byPlayer).map(p=>{
    const opt = primaryStatFor(p.position);
    const total = opt ? p.games.reduce((s,g)=>s+num(g[opt.key]),0) : 0;
    return {...p, volume: total};
  });
  const LINEUP_SLOTS = {QB:1, RB:2, WR:2, TE:1};
  const lineup = [];
  Object.entries(LINEUP_SLOTS).forEach(([pos, count])=>{
    lineup.push(...withVolume.filter(p=>p.position===pos).sort((a,b)=>b.volume-a.volume).slice(0, count));
  });
  return lineup;
}

function renderPredictions(){
  return `
  <div class="panel">
    <div class="panel-title">Predictions</div>
    <div class="panel-note">
      A simplified, fully transparent model -- not a professional betting line. Win probability comes from
      the EPA/play gap between the two teams (the same metric behind Power Rankings), converted to an
      approximate point margin and a standard home-field adjustment (~2 pts). Player stat projections blend
      each player's season and last-3-game average, scaled by how this specific opponent compares to the
      league average at that stat -- that matchup factor is capped and dampened early in a season (shown
      as "dampened" until the opponent has 6+ games logged), since a defense's allowed stats are genuinely
      noisy on a small sample and can otherwise compound into unrealistic projections. Real games involve
      injuries, weather, coaching decisions, and randomness this model can't see -- treat every number here
      as an estimate to weigh, not a guarantee.
    </div>
    <div id="predictions-list"></div>
  </div>`;
}

function mountPredictions(){
  const container = $('#predictions-list');

  const games = new Map();
  (DATA.week2 || []).forEach(r=>{
    const gid = r['Game ID'];
    if(!gid) return;
    if(!games.has(gid)) games.set(gid, {date: r.Date, sides: {}});
    const isHome = r['Home/Away'] === 'Home';
    games.get(gid).sides[isHome ? 'home' : 'away'] = r;
  });
  const gameList = [...games.values()].filter(g=>g.sides.home && g.sides.away)
    .sort((a,b)=> new Date(a.date) - new Date(b.date));

  if(!gameList.length){
    container.innerHTML = '<div class="empty">No upcoming matchups loaded yet.</div>';
    return;
  }

  const powerRows = computePowerRankings();
  const powerByTeam = {};
  powerRows.forEach(r=>{ powerByTeam[r.team] = r; });

  function apply(){
    container.innerHTML = gameList.map(g=>{
      const away = g.sides.away.Team, home = g.sides.home.Team;
      const week = g.sides.away.Week;
      const outcome = predictGameOutcome(away, home, powerByTeam);

      const outcomeHtml = outcome ? `
        <div class="context-row" style="margin-bottom:14px;">
          <span class="context-chip" style="${outcome.homeWinProb>=0.5?'color:var(--mint);':'color:var(--red);'}">
            ${outcome.homeWinProb>=0.5 ? teamName(home) : teamName(away)} favored, ${fmt(Math.max(outcome.homeWinProb,outcome.awayWinProb)*100,0)}% win probability
          </span>
          <span class="context-chip">Est. margin: ${fmt(Math.abs(outcome.predictedMargin),1)} pts</span>
          <span class="context-chip">Net EPA/play: ${away} ${fmt(outcome.awayNetEpa,3)} vs ${home} ${fmt(outcome.homeNetEpa,3)}</span>
        </div>
      ` : `<div class="empty" style="padding:8px 0;">Not enough EPA data yet to estimate this game.</div>`;

      function teamProjectionHtml(team, opponent){
        const lineup = pickProjectionPlayers(team);
        return `
          <div class="matchup-side-label"><b>${team}</b> projected vs <b>${opponent}</b></div>
          ${lineup.length ? lineup.map(p=>{
            const statOptions = PICKS_STAT_OPTIONS[p.position] || [];
            const projections = statOptions.map(opt=>{
              const proj = projectPlayerStat(p.player, p.position, opt, opponent);
              return proj ? {label: opt.label, ...proj} : null;
            }).filter(Boolean);

            if(!projections.length) return '';

            return `
              <div class="player-preview">
                <div class="player-preview-head">
                  <span class="player-preview-name">${p.player}</span>
                  <span class="player-preview-pos">${p.position}</span>
                </div>
                ${projections.map(proj=>{
                  const diff = proj.projected - proj.seasonAvg;
                  const diffColor = diff > proj.seasonAvg*0.05 ? 'var(--mint)' : diff < -proj.seasonAvg*0.05 ? 'var(--red)' : 'var(--chalk-dim)';
                  const saved = isPickSaved({source:'Predictions', player:p.player, stat:proj.label, week});
                  const summary = `Projected ${fmt(proj.projected)} ${proj.label} vs ${opponent} (season avg ${fmt(proj.seasonAvg)}, ${fmt(proj.matchupFactor,2)}x matchup factor)`;
                  return `<div class="player-preview-stats">${proj.label}: <b style="color:var(--chalk);">${fmt(proj.projected)}</b> (season avg ${fmt(proj.seasonAvg)}) <span style="color:${diffColor};">${fmt(proj.matchupFactor,2)}x</span>${proj.gamesPlayed < 6 ? ` <span style="color:var(--chalk-dim);">(dampened, opp. has ${proj.gamesPlayed} games)</span>` : ''}
                    <button class="save-pick-btn" style="margin-left:8px;padding:1px 7px;font-size:9px;" ${saved?'disabled':''} data-player="${p.player}" data-position="${p.position}" data-team="${team}" data-opponent="${opponent}" data-stat="${proj.label}" data-week="${week}" data-summary="${summary.replace(/"/g,'&quot;')}">${saved?'&#10003;':'+ Add'}</button>
                  </div>`;
                }).join('')}
              </div>`;
          }).join('') : '<div class="empty" style="padding:8px 0;">Not enough data to project this team yet.</div>'}
        `;
      }

      return `
        <div class="matchup-card" style="margin-bottom:20px;">
          <div class="matchup-head">
            <div class="matchup-teams">${teamName(away)}<span class="at">@</span>${teamName(home)}</div>
          </div>
          <div style="padding:16px 20px 0;">${outcomeHtml}</div>
          <div class="matchup-body">
            <div class="matchup-side">${teamProjectionHtml(away, home)}</div>
            <div class="matchup-side">${teamProjectionHtml(home, away)}</div>
          </div>
      </div>`;
    }).join('');

    $$('.save-pick-btn', container).forEach(btn=>{
      btn.addEventListener('click', (e)=>{
        e.stopPropagation();
        addToMyPicks({
          source: 'Predictions', player: btn.dataset.player, position: btn.dataset.position,
          team: btn.dataset.team, opponent: btn.dataset.opponent, stat: btn.dataset.stat,
          week: btn.dataset.week, summary: btn.dataset.summary,
        });
        apply();
      });
    });
  }

  apply();
}
