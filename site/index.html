// ---------- TAB: FILM ROOM ----------
// Watching film, in numbers. For every team the latest game (tonight's too, while it is
// being played, straight from ESPN) is turned into notes on what the defense gave up and
// to whom, who is out, and who is back. Defenses change little week to week unless a
// starter is missing, so those notes are carried into that team's NEXT game: each starter
// on the next opponent gets a projection with the film folded in.
// The film counts for 35% (one game is noisy), and only once the game is final. All
// numbers come from box scores; there is no coverage or alignment data, so "film" here
// means results, not what a coach would see on tape.
const FILM_WEIGHT = 0.35;
const FILM_STAT = {QB:'Pass Yards', RB:'Rush Yards', WR:'Receiving Yards', TE:'Receiving Yards'};
const FILM_POS_LABEL = {QB:'Quarterback', RB:'Running backs', WR:'Wide receivers', TE:'Tight ends'};
const filmScheduleCache = {};
let filmSelected = null;

async function filmFetchSchedule(week){
  if(filmScheduleCache[week]) return filmScheduleCache[week];
  try {
    const r = await fetch(`${ESPN_SCOREBOARD_URL}?week=${week}&seasontype=2`);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const sb = await r.json();
    const map = {};
    (sb.events || []).forEach(ev => {
      const cs = (((ev.competitions || [])[0]) || {}).competitors || [];
      const h = cs.find(c => c.homeAway === 'home'), a = cs.find(c => c.homeAway === 'away');
      if(!h || !a) return;
      const H = livePickTeam((h.team || {}).abbreviation), A = livePickTeam((a.team || {}).abbreviation);
      map[H] = {opp:A, home:true, date:ev.date, week};
      map[A] = {opp:H, home:false, date:ev.date, week};
    });
    if(Object.keys(map).length) filmScheduleCache[week] = map;
    return map;
  } catch(e){ return {}; }
}

function filmCsvMaxWeek(){ return (DATA.playerGame || []).reduce((m, r) => Math.max(m, num(r.Week)), 0); }
function filmPosMap(){
  const m = {};
  (DATA.playerGame || []).forEach(r => { m[livePickNorm(r.Player)] = r.Position; });
  return m;
}
// Which week is the "latest film", and which games make it up.
function filmWeekInfo(){
  const csvMax = filmCsvMaxWeek();
  const liveGames = LIVE_PICKS.games || new Map();
  const started = [...liveGames.values()].some(g => g.state !== 'pre');
  const useLive = !!(LIVE_PICKS.week && started && LIVE_PICKS.week > csvMax);
  const week = useLive ? LIVE_PICKS.week : csvMax;
  const games = [], seen = new Set();
  if(useLive){
    liveGames.forEach((g, team) => {
      if(g.state === 'pre') return;
      const key = [team, g.opp].sort().join('|');
      if(seen.has(key)) return; seen.add(key);
      const home = g.home ? team : g.opp, away = g.home ? g.opp : team;
      const hs = g.home ? g.score : g.oppScore, as = g.home ? g.oppScore : g.score;
      games.push({away, home, state:g.state, detail:g.detail, awayScore:as, homeScore:hs, source:'live'});
    });
  } else {
    const gts = (DATA.gameTeamStats || []).filter(r => num(r.Week) === week);
    (DATA.playerGame || []).filter(r => num(r.Week) === week).forEach(r => {
      const key = [r.Team, r.Opponent].sort().join('|');
      if(seen.has(key)) return; seen.add(key);
      const mine = gts.find(x => x.Team === r.Team && x.Opponent === r.Opponent) || gts.find(x => x.Team === r.Team);
      const theirs = gts.find(x => x.Team === r.Opponent);
      let away = r.Team, home = r.Opponent, as = '', hs = '';
      if(mine && mine['Home/Away']) { if(mine['Home/Away'] === 'Home'){ home = r.Team; away = r.Opponent; hs = mine['Final Score']; as = mine['Opponent Score']; } else { away = r.Team; home = r.Opponent; as = mine['Final Score']; hs = mine['Opponent Score']; } }
      games.push({away, home, state:'post', detail:'Final', awayScore:as, homeScore:hs, source:'csv'});
    });
  }
  const order = {in:0, post:1};
  games.sort((a, b) => (order[a.state] ?? 2) - (order[b.state] ?? 2) || a.away.localeCompare(b.away));
  return {week, useLive, games};
}

// Rows in player-game shape for the offense that faced `defense` in the film game.
function filmRows(defense, info, game){
  const opp = game.away === defense ? game.home : game.away;
  if(game.source === 'csv') return (DATA.playerGame || []).filter(r => r.Opponent === defense && num(r.Week) === info.week && FILM_STAT[r.Position]);
  const pos = filmPosMap();
  const rows = [];
  LIVE_PICKS.players.forEach(rec => {
    if(rec.team !== opp) return;
    const v = rec.v;
    let p = pos[livePickNorm(rec.name)];
    if(!p) p = v.passYds > 0 || v.passAtt > 0 ? 'QB' : (v.recYds >= v.rushYds && v.rec > 0) ? 'WR' : 'RB';
    if(!FILM_STAT[p]) return;
    rows.push({Player:rec.name, Team:opp, Opponent:defense, Week:info.week, Position:p,
      'Pass Yards':v.passYds, 'Pass TD':v.passTD, Interceptions:v.ints, 'Pass Attempts':v.passAtt || 0,
      'Rush Attempts':v.rushAtt || 0, 'Rush Yards':v.rushYds, 'Rush TD':v.rushTD,
      Receptions:v.rec, 'Receiving Yards':v.recYds, 'Receiving TD':v.recTD, Targets:v.tgts || 0});
  });
  return rows;
}

function filmGroupTotals(rows){
  const t = {QB:{yds:0, td:0}, RB:{yds:0, td:0}, WR:{yds:0, td:0}, TE:{yds:0, td:0}};
  rows.forEach(r => {
    const g = t[r.Position]; if(!g) return;
    g.yds += num(r[FILM_STAT[r.Position]]);
    g.td += r.Position === 'QB' ? num(r['Pass TD']) : num(r['Rush TD']) + num(r['Receiving TD']);
  });
  return t;
}
// What a defense normally allows per game to each position group (games before the film week),
// falling back to the league average when it has fewer than two earlier games.
let _filmLeague = {src:null, val:null};
function filmLeagueGroupAvg(){
  if(_filmLeague.src === DATA.playerGame) return _filmLeague.val;
  const per = {};
  (DATA.playerGame || []).forEach(r => { if(FILM_STAT[r.Position]) (per[r.Opponent + '|' + r.Week] = per[r.Opponent + '|' + r.Week] || []).push(r); });
  const sums = {QB:0, RB:0, WR:0, TE:0}; let n = 0;
  Object.values(per).forEach(rows => { const t = filmGroupTotals(rows); Object.keys(sums).forEach(k => { sums[k] += t[k].yds; }); n++; });
  const val = {}; Object.keys(sums).forEach(k => { val[k] = n ? sums[k] / n : 0; });
  _filmLeague = {src: DATA.playerGame, val};
  return val;
}
function filmBaseline(defense, week){
  const byWeek = {};
  (DATA.playerGame || []).forEach(r => { if(r.Opponent === defense && num(r.Week) < week && FILM_STAT[r.Position]) (byWeek[r.Week] = byWeek[r.Week] || []).push(r); });
  const weeks = Object.values(byWeek);
  if(weeks.length < 2) return {avg: filmLeagueGroupAvg(), n: weeks.length, league: true};
  const sums = {QB:0, RB:0, WR:0, TE:0};
  weeks.forEach(rows => { const t = filmGroupTotals(rows); Object.keys(sums).forEach(k => { sums[k] += t[k].yds; }); });
  Object.keys(sums).forEach(k => { sums[k] /= weeks.length; });
  return {avg: sums, n: weeks.length, league: false};
}
function filmPlayerAvg(player, position, week){
  const g = (DATA.playerGame || []).filter(r => r.Player === player && r.Position === position && num(r.Week) < week);
  if(g.length < 2) return null;
  const stat = FILM_STAT[position];
  return {avg: g.reduce((a, r) => a + num(r[stat]), 0) / g.length, n: g.length};
}
function filmLine(r){
  const f = x => Math.round(num(x));
  if(r.Position === 'QB') return `${f(r['Pass Yards'])} pass yds${num(r['Rush Yards']) ? ', ' + f(r['Rush Yards']) + ' rush yds' : ''}, ${f(r['Pass TD'])} TD, ${f(r.Interceptions)} INT`;
  if(r.Position === 'RB') return `${f(r['Rush Attempts'])} car, ${f(r['Rush Yards'])} yds${num(r.Receptions) ? `, ${f(r.Receptions)}-${f(r['Receiving Yards'])} rec` : ''}${num(r['Rush TD']) + num(r['Receiving TD']) ? `, ${f(num(r['Rush TD']) + num(r['Receiving TD']))} TD` : ''}`;
  return `${f(r.Receptions)} rec, ${f(r['Receiving Yards'])} yds${num(r['Receiving TD']) ? `, ${f(r['Receiving TD'])} TD` : ''}${num(r.Targets) ? ` (${f(r.Targets)} tgt)` : ''}`;
}

// Defender availability for the next game, from the Defense Field data.
function filmAvailability(team){
  const all = (DATA.defenseRoster || []).filter(r => r.Team === team);
  if(!all.length) return null;
  const teamLast = all.reduce((m, r) => Math.max(m, num(r['Last Game Week'])), 0);
  const core = r => r.Role === 'Starter' || r.Role === 'Nickel';
  const label = r => `${r.Player} (${r.Group}${r.Injury ? ', ' + r.Injury : ''}${num(r['Last Game Snap Pct']) ? `, ${Math.round(num(r['Last Game Snap Pct']) * 100)}% last game` : ''})`;
  return {
    out: all.filter(r => core(r) && /out|doubtful|reserve|ir\b/i.test(r.Availability || '') ),
    questionable: all.filter(r => core(r) && /question/i.test(r.Availability || '')),
    returning: all.filter(r => !core(r) && num(r['Last Game Snaps']) === 0 && num(r['Last Game Week']) < teamLast && num(r.Games) >= 3 && num(r.Snaps) / Math.max(1, num(r.Games)) >= 30 && !/out|doubtful|question/i.test(r.Availability || '')),
    label,
  };
}

function filmDefenseAnalysis(defense, info, game){
  const rows = filmRows(defense, info, game);
  const final = game.state === 'post';
  const t = filmGroupTotals(rows);
  const base = filmBaseline(defense, info.week);
  const groups = Object.keys(FILM_STAT).map(pos => {
    const b = base.avg[pos] || 0;
    return {pos, film:t[pos].yds, td:t[pos].td, base:b, ratio: b > 0 ? t[pos].yds / b : null};
  });
  const bullets = [];
  const stat = r => num(r[FILM_STAT[r.Position]]);
  const ranked = [...rows].sort((a, b) => (r => r.Position === 'QB' ? stat(r) * 0.4 : stat(r))(b) - (r => r.Position === 'QB' ? stat(r) * 0.4 : stat(r))(a));
  ranked.slice(0, 3).forEach(r => {
    if(stat(r) <= 0) return;
    const pa = filmPlayerAvg(r.Player, r.Position, info.week);
    const tail = pa && pa.avg > 0 ? ` vs his ${fmt(pa.avg, 0)} average (${fmt(stat(r) / pa.avg, 1)}x)` : '';
    bullets.push(`<b>${r.Player}</b> (${r.Position}): ${filmLine(r)}${tail}.`);
  });
  if(final){
    bullets.push(...rows.filter(r => {
      const pa = filmPlayerAvg(r.Player, r.Position, info.week);
      return pa && pa.n >= 3 && pa.avg >= 30 && stat(r) < pa.avg * 0.5 && isStarter(r);
    }).slice(0, 3).map(r => {
      const pa = filmPlayerAvg(r.Player, r.Position, info.week);
      return `Held <b>${r.Player}</b> (${r.Position}) to ${fmt(stat(r), 0)} ${FILM_STAT[r.Position].toLowerCase().replace(' yards', ' yds')} against a ${fmt(pa.avg, 0)} average.`;
    }));
  }
  if(!rows.length) bullets.push("No box score lines for the opposing offense in this game yet, so there are no notes.");
  groups.forEach(g => {
    if(g.ratio === null || !final || !rows.length) return;
    if(g.ratio >= 1.25 && g.film >= 40) bullets.push(`Leaked to the ${FILM_POS_LABEL[g.pos].toLowerCase()}: ${fmt(g.film, 0)} yards, ${fmt(g.ratio, 1)}x what they normally allow.`);
    else if(g.ratio <= 0.75) bullets.push(`Clamped the ${FILM_POS_LABEL[g.pos].toLowerCase()}: ${fmt(g.film, 0)} yards, ${fmt(g.ratio, 1)}x what they normally allow.`);
    if(g.td >= 2) bullets.push(`Gave up ${g.td} touchdowns to the ${FILM_POS_LABEL[g.pos].toLowerCase()}.`);
  });
  return {rows, groups, bullets, base, final};
}

// Next opponent for a team: the loaded upcoming week if it is after the film week, else ESPN's.
function filmNextGame(team, info, nextSched){
  const wk = (DATA.week2 || []).find(r => r.Team === team && num(r.Week) > info.week);
  if(wk) return {opp:wk.Opponent, home:wk['Home/Away'] === 'Home', week:num(wk.Week), date:wk.Date, spread:wk.Spread || '', source:'loaded'};
  const s = nextSched && nextSched[team];
  if(s) return {opp:s.opp, home:s.home, week:s.week, date:s.date, spread:'', source:'ESPN'};
  return null;
}

function filmNextRead(defense, analysis, next){
  const N = next.opp;
  const spread = next.spread ? bpSpreadFor(N, next.spread) : 0;
  const defGames = new Set((DATA.playerGame || []).filter(r => r.Opponent === defense).map(r => r.Week)).size;
  const avail = filmAvailability(defense);
  const outGroups = new Set(avail ? avail.out.map(r => r.Group) : []);
  const out = [];
  bpTeamPlayers(N, true).forEach(p => {
    if(p.games.length < 2) return;
    const stat = FILM_STAT[p.Position];
    const vals = p.games.map(g => getStatValue(g, stat));
    const avg = vals.reduce((a, v) => a + v, 0) / vals.length;
    if(avg <= 0) return;
    const l3 = p.games.slice().sort((a, b) => num(a.Week) - num(b.Week)).slice(-3).map(g => getStatValue(g, stat));
    const l3avg = l3.reduce((a, v) => a + v, 0) / l3.length;
    const defRows = bpDefenseSamples(defense, p.Position, true, N);
    const league = bpLeagueAvg(p.Position, stat, true);
    const allowed = defRows.length ? defRows.reduce((a, r) => a + getStatValue(r, stat), 0) / defRows.length : league;
    const pj = bpProject(vals, l3avg, allowed, league, defGames, stat, spread);
    const grp = analysis.groups.find(g => g.pos === p.Position);
    let filmFactor = 1;
    if(analysis.final && grp && grp.ratio !== null) filmFactor = 1 + (Math.max(0.6, Math.min(1.6, grp.ratio)) - 1) * FILM_WEIGHT;
    const proj = pj.proj * filmFactor;
    const lean = proj >= avg * 1.08 ? 'over' : proj <= avg * 0.92 ? 'under' : 'neutral';
    const warn = [];
    if(p.Position === 'WR' || p.Position === 'TE'){ if(outGroups.has('CB')) warn.push('CB out'); if(outGroups.has('S')) warn.push('S out'); }
    if(p.Position === 'RB' || p.Position === 'QB'){ if(outGroups.has('DL')) warn.push('DL out'); if(outGroups.has('LB')) warn.push('LB out'); }
    out.push({slot:p.slot, player:p.Player, pos:p.Position, stat, avg, l3avg, season:pj.proj, filmFactor, proj, lean, warn, line:Math.round(proj * 2) / 2});
  });
  const order = {QB:0, RB:1, WR:2, TE:3};
  return out.sort((a, b) => order[a.pos] - order[b.pos] || a.slot.localeCompare(b.slot));
}

function filmTeamHtml(team, info, game, nextSched){
  const an = filmDefenseAnalysis(team, info, game);
  const opp = game.away === team ? game.home : game.away;
  const myScore = game.away === team ? game.awayScore : game.homeScore, oppScore = game.away === team ? game.homeScore : game.awayScore;
  const scoreTxt = (myScore !== '' && myScore !== undefined) ? `${myScore}-${oppScore}` : '';
  const status = game.state === 'in' ? `<span class="live-chip live-in">LIVE</span> ${game.detail || ''}` : 'Final';
  const avail = filmAvailability(team);
  const next = filmNextGame(team, info, nextSched);
  const pct = r => r.ratio === null ? '--' : fmt(r.ratio, 2) + 'x';
  const groupRows = an.groups.map(g => `<tr><td>${FILM_POS_LABEL[g.pos]}</td><td class="num"><b>${fmt(g.film, 0)}</b></td><td class="num">${g.td}</td><td class="num">${fmt(g.base, 0)}</td><td class="num" style="color:${g.ratio === null ? 'var(--chalk-dim)' : g.ratio >= 1.25 ? 'var(--red)' : g.ratio <= 0.75 ? 'var(--mint)' : 'var(--chalk)'};">${pct(g)}</td></tr>`).join('');
  let availHtml = '';
  if(avail){
    const parts = [];
    if(avail.out.length) parts.push(`<span style="color:var(--red);">Out / doubtful:</span> ${avail.out.map(avail.label).join('; ')}`);
    if(avail.questionable.length) parts.push(`<span style="color:var(--gold);">Questionable:</span> ${avail.questionable.map(avail.label).join('; ')}`);
    if(avail.returning.length) parts.push(`<span style="color:var(--mint);">Back (missed the last game):</span> ${avail.returning.map(r => `${r.Player} (${r.Group})`).join('; ')}`);
    availHtml = parts.length
      ? parts.map(p => `<div class="player-preview-stats">${p}</div>`).join('') + (avail.out.length ? '<div class="line-note">A starter who is out means this film may overstate the defense: the group he plays in is the one to be careful with.</div>' : '')
      : '<div class="player-preview-stats" style="color:var(--chalk-dim);">No starters listed out or questionable. The defense should look much like it did on this film.</div>';
  } else availHtml = '<div class="player-preview-stats" style="color:var(--chalk-dim);">Defender availability needs the Defense Field data (14_defense_roster.py).</div>';

  let nextHtml;
  if(!next){
    nextHtml = `<div class="empty" style="padding:8px 0;">${info.useLive ? "Next week's schedule couldn't be loaded from ESPN yet, or this team is on a bye." : 'No next game loaded (bye week, or the schedule is not out yet).'}</div>`;
  } else {
    const rd = filmNextRead(team, an, next);
    const note = !an.final ? `<div class="line-note">This game is still being played, so the film is not in the projections yet. The notes above update as it goes; once it is final the film is blended in (35% weight).</div>` : '';
    nextHtml = `<div class="log-pos-label" style="font-size:13px;margin-top:12px;">Carry it to Week ${next.week}: ${next.home ? 'hosting' : 'at'} ${teamChip(next.opp)}${next.spread ? ` <span style="color:var(--chalk-dim);font-weight:400;">&middot; ${next.spread}</span>` : ''}</div>
      <div class="line-note" style="margin-bottom:6px;">Starters on ${teamName(next.opp)} against the ${teamName(team)} defense. "Season-only" is the Best Picks style projection; "With film" folds in how this defense just played.</div>
      ${rd.length ? `<div class="table-scroll"><table><thead><tr><th>Player</th><th>Stat</th><th>Own avg</th><th>Last 3</th><th>Season-only</th><th>Film factor</th><th>With film</th><th>Book-style line</th><th>Read</th></tr></thead><tbody>${rd.map(x => `<tr>
        <td><span class="player-preview-pos">${x.slot}</span> ${x.player}</td><td>${x.stat}</td><td class="num">${fmt(x.avg)}</td><td class="num">${fmt(x.l3avg)}</td><td class="num">${fmt(x.season)}</td>
        <td class="num" style="color:${x.filmFactor > 1.02 ? 'var(--mint)' : x.filmFactor < 0.98 ? 'var(--red)' : 'var(--chalk-dim)'};">${an.final ? fmt(x.filmFactor, 2) + 'x' : '--'}</td>
        <td class="num"><b>${fmt(x.proj)}</b></td><td class="num">${x.line.toFixed(1)}</td>
        <td style="white-space:nowrap;"><b style="color:${x.lean === 'over' ? 'var(--mint)' : x.lean === 'under' ? 'var(--red)' : 'var(--chalk-dim)'};">${x.lean === 'over' ? 'Lean over' : x.lean === 'under' ? 'Lean under' : 'Neutral'}</b>${x.warn.length ? ` <span style="color:var(--gold);">&#9888; ${x.warn.join(', ')}</span>` : ''}</td></tr>`).join('')}</tbody></table></div>${note}`
        : '<div class="empty" style="padding:8px 0;">Not enough games logged for that offense yet.</div>'}`;
  }
  return `<div class="log-pos-group" style="margin-bottom:22px;">
    <div class="log-pos-label" style="font-size:14px;">${teamName(team)} defense &middot; Week ${info.week} vs ${teamName(opp)} ${scoreTxt ? `&middot; ${scoreTxt}` : ''} &middot; ${status}</div>
    ${an.bullets.length ? `<ul style="margin:8px 0 8px 18px;line-height:1.55;">${an.bullets.map(b => `<li>${b}</li>`).join('')}</ul>` : '<div class="player-preview-stats" style="color:var(--chalk-dim);">Nothing stands out yet.</div>'}
    <div class="table-scroll"><table><thead><tr><th>Allowed to</th><th class="num">Yards</th><th class="num">TD</th><th class="num" title="${an.base.league ? 'League average per game (fewer than 2 earlier games for this defense)' : "This defense's average per game before this one"}">${an.base.league ? 'League avg' : 'Usual'}</th><th class="num">vs usual</th></tr></thead><tbody>${groupRows}</tbody></table></div>
    ${availHtml}
    ${nextHtml}
  </div>`;
}

function renderFilm(){
  return `
  <div class="panel">
    <div class="panel-title">Film Room</div>
    <div class="panel-note">
      The latest game for every team, turned into notes you can carry into the next one. Pick a game below; for each
      defense you get what it gave up and to whom, how that compares with what it usually allows, who is out or back,
      and then next week's opponent: every starter with a projection that blends in what the defense just showed.
      Defenses change little week to week unless a starter is missing, which is why the availability list sits next to
      the notes. Tonight's game updates live from ESPN; a finished week comes from the daily data. One game is a small
      sample, so the film counts for ${Math.round(FILM_WEIGHT * 100)}% and only once the game is final. These are box score results, not coverage
      or alignment (that data is not published), so read them as tendencies.
    </div>
    <div class="controls">
      <button class="save-pick-btn" id="film-refresh">Refresh</button>
      <span id="film-status" style="font-family:var(--mono);font-size:11px;color:var(--chalk-dim);"></span>
    </div>
    <div class="controls"><div class="pill-group" id="film-games" style="flex-wrap:wrap;"></div></div>
    <div id="film-detail"><div class="empty">Loading film...</div></div>
  </div>`;
}

function mountFilm(){
  let info = null, nextSched = {};
  function draw(){
    const gamesEl = $('#film-games'), detailEl = $('#film-detail');
    if(!gamesEl || !detailEl) return;
    if(!info || !info.games.length){
      gamesEl.innerHTML = '';
      detailEl.innerHTML = '<div class="empty">No games to review yet. Once a week of games has been played (or one is live), it shows here.</div>';
      return;
    }
    const key = g => g.away + '@' + g.home;
    if(!filmSelected || !info.games.some(g => key(g) === filmSelected)) filmSelected = key(info.games[0]);
    gamesEl.innerHTML = info.games.map(g => `<span class="pill ${key(g) === filmSelected ? 'active' : ''}" data-k="${key(g)}">${g.away} @ ${g.home}${g.state === 'in' ? ' &middot; LIVE' : ''}</span>`).join('');
    $$('#film-games .pill').forEach(pl => pl.addEventListener('click', () => { filmSelected = pl.dataset.k; draw(); }));
    const g = info.games.find(x => key(x) === filmSelected);
    detailEl.innerHTML = `<div class="line-note" style="margin-bottom:10px;">Week ${info.week}${info.useLive ? ' (from ESPN, not yet in the daily data)' : ''}. Each side below is that team's DEFENSE: what it gave up, then the next opponent.</div>` +
      [g.away, g.home].map(t => filmTeamHtml(t, info, g, nextSched)).join('');
  }
  async function load(){
    const st = $('#film-status');
    if(st) st.textContent = 'Checking ESPN...';
    await refreshLivePicks();
    if(!$('#film-status')) return;
    info = filmWeekInfo();
    nextSched = await filmFetchSchedule(info.week + 1);
    const s2 = $('#film-status');
    if(!s2) return;
    s2.textContent = LIVE_PICKS.error ? `ESPN unavailable (${LIVE_PICKS.error}); using saved data only.` : `Updated ${new Date().toLocaleTimeString()}`;
    draw();
  }
  $('#film-refresh').addEventListener('click', load);
  if(window.__filmTimer) clearInterval(window.__filmTimer);
  window.__filmTimer = setInterval(() => {
    if(!$('#film-status')){ clearInterval(window.__filmTimer); window.__filmTimer = null; return; }
    if(!document.hidden && info && info.games.some(g => g.state === 'in')) load();
  }, 45000);
  load();
}

// ---------- TAB: LINE PLAY (OL / DL) ----------
// Offensive/defensive line information from 13_line_play.py (nflverse play-by-play,
// snap counts, and the official injury report). Team rates are credited to the whole
// unit -- sacks and stuffs also come from linebackers/DBs -- so these are line-play
// indicators, not individual grades. Ranks run 1 = best at the unit's job.
const LINE_PCT = v => `${(num(v) * 100).toFixed(1)}%`;
const LINE_EDGE_GAP = 0.25;   // how far apart (in league-percentile) two units must be to call an edge
const LINE_OUT = new Set(['Out', 'Doubtful']);
const LINE_RISK = new Set(['Questionable', 'DNP (no game status yet)']);
const LINE_METRICS = {
  OL: [
    {key:'OL Sack Rate',          label:'Sack rate allowed',           fmt:LINE_PCT, better:'low'},
    {key:'OL QB Hit Rate',        label:'QB hit rate allowed',         fmt:LINE_PCT, better:'low'},
    {key:'OL Disruption Rate',    label:'Sack + hit rate allowed',     fmt:LINE_PCT, better:'low'},
    {key:'OL Stuff Rate',         label:'Runs stuffed (0 or fewer yds)', fmt:LINE_PCT, better:'low'},
    {key:'OL YPC',                label:'Yards per carry',             fmt:v=>num(v).toFixed(2), better:'high'},
    {key:'OL Explosive Run Rate', label:'10+ yard run rate',           fmt:LINE_PCT, better:'high'},
    {key:'OL Rush EPA',           label:'Rush EPA per play',           fmt:v=>num(v).toFixed(3), better:'high'},
  ],
  DL: [
    {key:'DL Sack Rate',          label:'Sack rate',                   fmt:LINE_PCT, better:'high'},
    {key:'DL QB Hit Rate',        label:'QB hit rate',                 fmt:LINE_PCT, better:'high'},
    {key:'DL Disruption Rate',    label:'Sack + hit rate',             fmt:LINE_PCT, better:'high'},
    {key:'DL Stuff Rate',         label:'Runs stuffed (0 or fewer yds)', fmt:LINE_PCT, better:'high'},
    {key:'DL YPC',                label:'Yards per carry allowed',     fmt:v=>num(v).toFixed(2), better:'low'},
    {key:'DL Explosive Run Rate', label:'10+ yard runs allowed',       fmt:LINE_PCT, better:'low'},
    {key:'DL Rush EPA',           label:'Rush EPA per play allowed',   fmt:v=>num(v).toFixed(3), better:'low'},
  ],
};

// Same normalization as the pipeline (lowercase letters, suffixes dropped) so a
// player in the snap table lines up with the same player on the injury report.
function normLineName(name){
  return String(name).replace(/[.,]/g, ' ').split(/\s+/)
    .filter(t => t && !['jr','sr','ii','iii','iv','v'].includes(t.toLowerCase()))
    .map(t => t.toLowerCase().replace(/[^a-z]/g, '')).join('');
}

let _lineRankCache = {src: null, ranks: {}};
function getLineRanks(){
  if(_lineRankCache.src === DATA.lineTeam) return _lineRankCache.ranks;
  const rows = DATA.lineTeam || [];
  const ranks = {};
  [...LINE_METRICS.OL, ...LINE_METRICS.DL].forEach(m=>{
    const usable = rows.filter(r => r[m.key] !== '' && r[m.key] != null);
    usable.sort((a,b) => m.better === 'low' ? num(a[m.key]) - num(b[m.key]) : num(b[m.key]) - num(a[m.key]));
    ranks[m.key] = {};
    usable.forEach((r,i)=>{ ranks[m.key][r.Team] = i + 1; });
  });
  _lineRankCache = {src: DATA.lineTeam, ranks};
  return ranks;
}
function lineTeamRow(team){ return (DATA.lineTeam || []).find(r => r.Team === team) || null; }

// Pass protection vs pass rush, and run blocking vs run stopping, as league
// percentiles (1.0 = best in the league at its job). A gap of 0.25 (~8 ranks)
// or more between the two units is called an edge for the better one.
function lineBattle(offTeam, defTeam){
  const n = (DATA.lineTeam || []).length;
  if(!n || !lineTeamRow(offTeam) || !lineTeamRow(defTeam)) return null;
  const ranks = getLineRanks();
  const pct = rank => n > 1 ? 1 - (rank - 1) / (n - 1) : 0.5;
  const make = (offKey, defKey) => {
    const offRank = ranks[offKey][offTeam], defRank = ranks[defKey][defTeam];
    const diff = pct(defRank) - pct(offRank);   // > 0: the defensive front is better than the offensive line
    return {offRank, defRank, diff, edge: diff >= LINE_EDGE_GAP ? 'defense' : diff <= -LINE_EDGE_GAP ? 'offense' : 'even'};
  };
  return {pass: make('OL Disruption Rate', 'DL Disruption Rate'), run: make('OL Rush EPA', 'DL Rush EPA'), n};
}
function lineEdgeLabel(edge){
  return edge === 'offense' ? 'favors the offense' : edge === 'defense' ? 'favors the defense' : 'about even';
}

function lineChip(injury){
  if(!injury) return '<span class="line-chip ok">Healthy</span>';
  const cls = LINE_OUT.has(injury.Availability) ? 'out' : LINE_RISK.has(injury.Availability) ? 'risk' : '';
  return `<span class="line-chip ${cls}">${injury.Availability}</span>`;
}

// Context lines for Mike's Template: is this team's line healthy, and how does
// its line stack up against the opponent's for the kind of play the pick needs?
function lineContextHtml(team, opponent, position){
  const battle = lineBattle(team, opponent);
  const row = lineTeamRow(team), opp = lineTeamRow(opponent);
  if(!battle || !row || !opp) return '';

  const olOut = num(row['OL Starters Out']), olRisk = num(row['OL Starters At Risk']);
  const olColor = olOut > 0 ? 'var(--red)' : olRisk > 0 ? 'var(--gold)' : 'var(--mint)';
  const olLine = (olOut === 0 && olRisk === 0)
    ? 'all 5 starters clear on the injury report'
    : `${olOut} starter${olOut === 1 ? '' : 's'} out, ${olRisk} at risk -- ${row['OL Health Note']}`;

  const dlOut = num(opp['DL Key Players Out']), dlRisk = num(opp['DL Key Players At Risk']);
  const dlLine = (dlOut === 0 && dlRisk === 0)
    ? 'no key rushers or starters on the injury report'
    : `${dlOut} out, ${dlRisk} at risk -- ${opp['DL Health Note']}`;

  const isRun = position === 'RB';
  const b = isRun ? battle.run : battle.pass;
  const edgeColor = b.edge === 'offense' ? 'var(--mint)' : b.edge === 'defense' ? 'var(--red)' : 'var(--chalk-dim)';
  const battleLine = isRun
    ? `Run game: ${team} run blocking #${b.offRank} vs ${opponent} run defense #${b.defRank} of ${battle.n} -- ${lineEdgeLabel(b.edge)}`
    : `Pass game: ${team} pass protection #${b.offRank} vs ${opponent} pass rush #${b.defRank} of ${battle.n} -- ${lineEdgeLabel(b.edge)}`;

  return `
    <div class="player-preview-stats" style="color:${olColor};">${team} O-line: ${olLine}.</div>
    <div class="player-preview-stats" style="color:${edgeColor};">${battleLine}</div>
    <div class="player-preview-stats">${opponent} D-line: ${dlLine}.</div>`;
}

function lineCardHtml(kind, team){
  const row = lineTeamRow(team);
  if(!row) return '<div class="empty">No line data for this team.</div>';
  const ranks = getLineRanks();
  const n = DATA.lineTeam.length;
  const dash = v => (v === '' || v == null) ? '--' : fmt(num(v));

  const metrics = LINE_METRICS[kind].map(m=>{
    const r = ranks[m.key][team];
    const color = r <= n / 3 ? 'var(--mint)' : r > n * 2 / 3 ? 'var(--red)' : 'var(--chalk)';
    return `<div class="line-metric"><span>${m.label}</span><span><b style="color:var(--chalk);">${m.fmt(row[m.key])}</b> <span style="color:${color};">#${r}</span></span></div>`;
  }).join('');

  const injuries = (DATA.lineInjuries || []).filter(i => i.Team === team && i.Group === kind);
  const injByName = {};
  injuries.forEach(i => { injByName[normLineName(i.Player)] = i; });

  const all = (DATA.linePlayers || []).filter(r => r.Team === team && r.Group === kind);
  let shown, peopleHtml;
  if(kind === 'OL'){
    const ORDER = {T:0, G:1, C:2, OL:3};
    shown = all.filter(r => r.Role === 'Starter')
      .sort((a,b) => (ORDER[a.Position] ?? 9) - (ORDER[b.Position] ?? 9) || a.Player.localeCompare(b.Player));
    peopleHtml = shown.map(p => `<div class="line-player">
        <span class="line-player-name">${p.Player} <span class="player-preview-pos">${p.Position}</span></span>
        <span class="line-player-meta">${fmt(num(p['Last Game Snap Pct']) * 100, 0)}% of snaps last game &middot; ${p.Games} G</span>
        ${lineChip(injByName[normLineName(p.Player)])}</div>`).join('');
  } else {
    shown = all.filter(r => r.Role === 'Starter' || r.Role === 'Edge (LB)').sort((a,b) => num(b.Snaps) - num(a.Snaps));
    peopleHtml = shown.map(p => `<div class="line-player">
        <span class="line-player-name">${p.Player} <span class="player-preview-pos">${p.Position}${p.Role === 'Edge (LB)' ? ' edge' : ''}</span></span>
        <span class="line-player-meta">${dash(p.Sacks)} sk &middot; ${dash(p['QB Hits'])} hits &middot; ${dash(p.TFL)} TFL &middot; ${p.Games} G</span>
        ${lineChip(injByName[normLineName(p.Player)])}</div>`).join('');
  }

  const out = num(row[kind === 'OL' ? 'OL Starters Out' : 'DL Key Players Out']);
  const risk = num(row[kind === 'OL' ? 'OL Starters At Risk' : 'DL Key Players At Risk']);
  const note = row[`${kind} Health Note`];
  const banner = (out === 0 && risk === 0)
    ? `<div class="line-banner ok">${kind === 'OL' ? 'All 5 starters' : 'All key players'} clear on the injury report</div>`
    : `<div class="line-banner ${out > 0 ? 'out' : 'risk'}">${out} out, ${risk} at risk -- ${note}</div>`;

  const shownNames = new Set(shown.map(p => normLineName(p.Player)));
  const others = injuries.filter(i => !shownNames.has(normLineName(i.Player)));
  const othersHtml = others.length
    ? `<div class="line-note">Also on the injury report: ${others.map(i =>
        `${i.Player} (${i.Position}) ${i.Availability}${i.Injury ? ' - ' + i.Injury : ''}${i.Role === 'No snaps yet' ? ' [no snaps this season]' : ''}`).join('; ')}</div>`
    : '';

  const continuity = kind === 'OL'
    ? `<div class="line-note">${row['OL Lineups Used']} different starting five${num(row['OL Lineups Used']) === 1 ? '' : 's'} in ${row['OL Games Tracked']} game${num(row['OL Games Tracked']) === 1 ? '' : 's'}${
        row['OL Same Starters vs Prev Game'] !== '' ? ` &middot; ${row['OL Same Starters vs Prev Game']} of 5 starters repeated from the previous game` : ''}</div>`
    : '';

  return `
    <div class="matchup-side-label"><b>${team}</b> ${teamName(team)} &mdash; ${kind === 'OL' ? 'Offensive Line' : 'Defensive Line'}</div>
    ${banner}
    ${metrics}
    <div class="line-sub-title">${kind === 'OL' ? 'Starting five (most snaps, latest game)' : 'Starters and edge rushers'}</div>
    ${peopleHtml || '<div class="empty" style="padding:8px 0;">No snap data yet.</div>'}
    ${othersHtml}
    ${continuity}`;
}

      return `<span class="context-chip" style="color:${color};">${label}: ${offName} ${what[0]} #${battle.offRank} vs ${defName} ${what[1]} #${battle.defRank} of ${b.n} -- ${lineEdgeLabel(battle.edge)}</span>`;

    pctCol('OL Stuff Rate', 'Stuffed %'),
    {key:'OL YPC', label:'YPC', numeric:true, render:v => num(v).toFixed(2)},
    {key:'OL Rush EPA', label:'Rush EPA', numeric:true, render:v => num(v).toFixed(3)},
    flagCol('OL Starters Out', 'Out', 'var(--red)'), flagCol('OL Starters At Risk', 'At Risk', 'var(--gold)'),
    {key:'OL Lineups Used', label:'Lineups', numeric:true},
  ], DATA.lineTeam, {defaultSort:'OL Disruption Rate', defaultDir:'asc'});

  buildTable($('#line-dl-table'), [
    {key:'Team', label:'Team', render:teamChip},
    pctCol('DL Sack Rate', 'Sack %'), pctCol('DL QB Hit Rate', 'QB Hit %'), pctCol('DL Disruption Rate', 'Sack+Hit %'),
    pctCol('DL Stuff Rate', 'Stuffed %'),
    {key:'DL YPC', label:'YPC Alwd', numeric:true, render:v => num(v).toFixed(2)},
    {key:'DL Rush EPA', label:'Rush EPA Alwd', numeric:true, render:v => num(v).toFixed(3)},
    flagCol('DL Key Players Out', 'Out', 'var(--red)'), flagCol('DL Key Players At Risk', 'At Risk', 'var(--gold)'),
  ], DATA.lineTeam, {defaultSort:'DL Disruption Rate', defaultDir:'desc'});

  // ---- injuries: starters first, then by how bad the status is
  const AVAIL_RANK = {'Out':0, 'Doubtful':1, 'Questionable':2, 'DNP (no game status yet)':3, 'Limited':4};
  const injRows = (DATA.lineInjuries || []).map(r => ({
    ...r,
    _priority: (r.Role === 'Starter' || r.Role === 'Edge (LB)' ? 0 : 10) + (AVAIL_RANK[r.Availability] ?? 5),
  }));
  const injNote = $('#line-inj-note');
  injNote.textContent = injRows.length
    ? `Week ${injRows[0].Week} injury report, linemen only. "Starter"/"Edge (LB)" are the key players -- reserves and players with no snaps this season are listed after them. Players practicing fully with no game status are left out.`
    : 'No linemen on the injury report yet.';
  let injGroup = '';
  function drawInjuries(){
    const rows = injRows.filter(r => !injGroup || r.Group === injGroup);
    buildTable($('#line-inj-table'), [
      {key:'Team', label:'Team', render:teamChip},
      {key:'Player', label:'Player'}, {key:'Position', label:'Pos'},
      {key:'Availability', label:'Status', render:(v,row) => lineChip(row)},
      {key:'Injury', label:'Injury'}, {key:'Role', label:'Role'},

  $$('#line-inj-pills .pill').forEach(pill => pill.addEventListener('click', ()=>{

    pill.classList.add('active');
    injGroup = pill.dataset.group;
    drawInjuries();
  }));
  drawInjuries();

  // ---- top pass rushers
  const injIndex = {};
  (DATA.lineInjuries || []).forEach(i => { injIndex[`${i.Team}|${normLineName(i.Player)}`] = i; });
  const rushers = (DATA.linePlayers || [])
    .filter(r => r.Group === 'DL' && r.Sacks !== '' && r.Sacks != null)
    .map(r => ({...r, _sacks: num(r.Sacks), _hits: num(r['QB Hits']), _tfl: num(r.TFL), _injury: injIndex[`${r.Team}|${normLineName(r.Player)}`] || null}))
    .sort((a,b) => b._sacks - a._sacks || b._hits - a._hits)
    .slice(0, 25);
  buildTable($('#line-rush-table'), [
    {key:'Player', label:'Player'}, {key:'Team', label:'Team', render:teamChip},
    {key:'Position', label:'Pos', render:(v,row) => row.Role === 'Edge (LB)' ? 'LB (edge)' : v},
    {key:'Games', label:'G', numeric:true}, {key:'Snaps', label:'Snaps', numeric:true},
    {key:'_sacks', label:'Sacks', numeric:true, render:v => fmt(v)},
    {key:'_hits', label:'QB Hits', numeric:true, render:v => fmt(v)},
    {key:'_tfl', label:'TFL', numeric:true, render:v => fmt(v)},
    {key:'_injury', label:'Status', render:(v,row) => lineChip(row._injury)},
  ], rushers, {defaultSort:'_sacks', defaultDir:'desc'});
}

// ---- Tonight screen ----
const TN_STATS = [['all', 'All'], ['Pass Yards', 'Passing'], ['Rush Yards', 'Rushing'], ['Receiving Yards', 'Rec yds'], ['Receptions', 'Catches']];
const TN_POS = [['all', 'All'], ['QB', 'QB'], ['RB', 'RB'], ['WR', 'WR'], ['TE', 'TE']];
const TN_SORT = [['edge', 'Biggest edge'], ['soft', 'Softest defense'], ['time', 'Kickoff']];
const TN_LEAN = 0.08;            // the projection has to sit this far (as a share of the line) from the book's line before it calls a side
const TN_NAME = {'Pass Yards':'Pass yds', 'Rush Yards':'Rush yds', 'Receiving Yards':'Rec yds', 'Receptions':'Catches'};
const tnState = {sel: null, stat: 'all', pos: 'all', sort: 'edge', open: null, lineOnly: false, limit: 40};
let _tnDef = {src: null, mode: null, val: {}};
function tnGames(){
  const g = new Map();
  (DATA.week2 || []).forEach(r => {
    const id = r['Game ID']; if(!id) return;
    if(!g.has(id)) g.set(id, {gid: id, date: r.Date, sides: {}});
    g.get(id).sides[r['Home/Away'] === 'Home' ? 'home' : 'away'] = r;
  });
  return [...g.values()].filter(x => x.sides.home && x.sides.away).sort((a, b) => new Date(a.date) - new Date(b.date)).map(x => ({
    gid: x.gid, date: x.date, win: bpWindow(x.date), away: x.sides.away.Team, home: x.sides.home.Team, week: x.sides.away.Week,
    spread: x.sides.away.Spread || x.sides.home.Spread || '', ou: x.sides.away['Over/Under'] || x.sides.home['Over/Under'] || ''}));
}
// What each defense has given up per game to a position (starters or everyone, as the Best Picks setting says), and where it ranks. 1 = gives up the most.
function tnDefRank(defense, pos, stat){
  const mode = bpDefMode(bpMode());
  if(_tnDef.src !== DATA.playerGame || _tnDef.mode !== mode) _tnDef = {src: DATA.playerGame, mode, val: {}};
  const key = pos + '|' + stat;
  if(!_tnDef.val[key]){
    const teams = [...new Set((DATA.playerGame || []).map(r => r.Opponent).filter(Boolean))];
    const arr = teams.map(t => { const rows = bpDefenseSamples(t, pos, mode, ''); const byGame = new Set(rows.map(r => r.Week)).size;
      return {t, n: rows.length, avg: rows.length ? rows.reduce((a, r) => a + getStatValue(r, stat), 0) / rows.length : null}; }).filter(x => x.avg !== null);
    arr.sort((a, b) => b.avg - a.avg);
    const m = {}; arr.forEach((x, i) => { m[x.t] = {rank: i + 1, avg: x.avg, n: x.n}; });
    _tnDef.val[key] = {m, of: arr.length};
  }
  const e = _tnDef.val[key], d = e.m[defense];
  return d ? {rank: d.rank, of: e.of, avg: d.avg, n: d.n} : null;
}
function tnRows(){
  const games = tnGames();
  const sel = tnState.sel || new Set();
  const hurt = {}; (DATA.injuries || []).forEach(r => { if(r.Player && /questionable|doubtful|out|day/i.test(r.Status || '')) hurt[r.Player] = r.Status; });
  const rows = [];
  games.filter(g => sel.has(g.gid)).forEach(g => {
    [[g.away, g.home], [g.home, g.away]].forEach(([off, def]) => {
      const spr = bpSpreadFor(off, g.spread) || 0;
      bpTeamPlayers(off, bpMode()).forEach(p => {
        if(tnState.pos !== 'all' && p.Position !== tnState.pos) return;
        const games_ = p.games.slice().sort((a, b) => num(a.Week) - num(b.Week));
        if(games_.length < BP_MIN_PLAYER_GAMES) return;
        (BP_STATS[p.Position] || []).forEach(stat => {
          if(stat === 'Pass + Rush Yards') return;
          if(tnState.stat !== 'all' && tnState.stat !== stat) return;
          const vals = games_.map(r => getStatValue(r, stat));
          const avg = vals.reduce((a, v) => a + v, 0) / vals.length;
          if(avg <= 0) return;
          const l3 = vals.slice(-3), l3avg = l3.reduce((a, v) => a + v, 0) / l3.length;
          const dr = tnDefRank(def, p.Position, stat);
          const defRows = bpDefenseSamples(def, p.Position, bpMode(), off);
          let pj = null;
          if(defRows.length >= BP_MIN_DEF_SAMPLES){
            const allowed = defRows.reduce((a, r) => a + getStatValue(r, stat), 0) / defRows.length;
            const defGames = new Set((DATA.playerGame || []).filter(r => r.Opponent === def).map(r => r.Week)).size;
            pj = bpProject(vals, l3avg, allowed, bpLeagueAvg(p.Position, stat, bpMode()), defGames, stat, spr);
          }
          const proj = pj ? pj.proj : avg * 0.6 + l3avg * 0.4;
          const bk = propHasData() ? propMainFor(p.Player, stat) : null;
          const line = bk ? bk.line : null;
          const pct = line ? (proj - line) / line : null;
          let call = 'none';
          if(line !== null) call = (vals.length >= 3 && Math.abs(pct) >= TN_LEAN) ? (pct > 0 ? 'over' : 'under') : 'pass';
          const px = call === 'over' ? bk.bo : call === 'under' ? bk.bu : null;
          rows.push({player: p.Player, pos: p.Position, slot: p.slot, off, def, stat, game: g, vals, weeks: games_.map(r => r.Week), proj, pj, avg, l3avg, dr, defRows, line, pct,
            call, px, bk, hurt: hurt[p.Player] || '', key: g.gid + '|' + p.Player + '|' + stat});
        });
      });
    });
  });
  if(tnState.lineOnly) { const w = rows.filter(r => r.line !== null); if(w.length) return tnSort(w); }
  return tnSort(rows);
}
function tnSort(rows){
  const by = tnState.sort;
  const edge = r => r.pct === null ? -1 : Math.abs(r.pct);
  if(by === 'soft') rows.sort((a, b) => (a.dr ? a.dr.rank : 99) - (b.dr ? b.dr.rank : 99) || edge(b) - edge(a));
  else if(by === 'time') rows.sort((a, b) => new Date(a.game.date) - new Date(b.game.date) || edge(b) - edge(a));
  else rows.sort((a, b) => edge(b) - edge(a) || (a.dr ? a.dr.rank : 99) - (b.dr ? b.dr.rank : 99));
  return rows;
}
function tnSideHtml(games){
  const days = []; games.forEach(g => { let d = days.find(x => x.label === g.win.day); if(!d){ d = {label: g.win.day || 'TBD', games: []}; days.push(d); } d.games.push(g); });
  return days.map(d => `<div class="tn-day"><span>${d.label}</span><button class="tn-all" data-act="day" data-day="${d.label}">${d.games.every(g => tnState.sel.has(g.gid)) ? 'none' : 'all'}</button></div>` +
    d.games.map(g => `<button class="tn-g${tnState.sel.has(g.gid) ? ' on' : ''}" data-act="game" data-gid="${g.gid}">${g.away} <i>@</i> ${g.home}<small>${g.win.time.replace(' ET', '')}</small></button>`).join('')).join('') +
    `<div class="tn-opts"><button class="tn-sw${tnState.lineOnly ? ' on' : ''}" data-act="lineonly"><span class="knob"></span>Only players with a book line</button></div>`;
}
function tnTrack(r){
  const pts = [r.proj, r.dr ? r.dr.avg : r.avg].concat(r.line !== null ? [r.line] : []);
  const lo = Math.min(...pts) * 0.7, hi = Math.max(...pts) * 1.18 || 1;
  const pos = v => Math.max(2, Math.min(98, (v - lo) / (hi - lo) * 100));
  const col = r.call === 'over' ? 'var(--t-over)' : r.call === 'under' ? 'var(--t-under)' : 'var(--t-pass)';
  const a = pos(r.proj), b = pos(r.dr ? r.dr.avg : r.avg);
  return `<div class="tn-track"><span class="fill" style="left:${Math.min(a, b)}%;width:${Math.abs(a - b)}%;background:${col}"></span>` +
    (r.line !== null ? `<span class="ln" style="left:${pos(r.line)}%" title="Book line ${r.line}"></span>` : '') +
    `<span class="d dv" style="left:${b}%;background:${col};color:${col}" title="Defense allows ${fmt(r.dr ? r.dr.avg : r.avg)}"></span><span class="d me" style="left:${a}%" title="He gets ${fmt(r.proj)}"></span></div>`;
}
function tnRowHtml(r){
  const open = tnState.open === r.key;
  const ref = r.line !== null ? r.line : r.proj;
  const dots = r.vals.slice(-5).map(v => `<i style="background:${r.line === null ? 'var(--t-faint)' : v > r.line ? 'var(--t-over)' : 'var(--t-under)'}" title="${fmt(v)}"></i>`).join('');
  const hit = r.line !== null ? r.vals.filter(v => v > r.line).length : null;
  const diffTxt = r.line !== null ? (r.proj - r.line >= 0 ? '+' : '') + fmt(r.proj - r.line) : '';
  const col = r.call === 'over' ? 'var(--t-over)' : r.call === 'under' ? 'var(--t-under)' : 'var(--t-dim)';
  const callHtml = r.call === 'none' ? `<div class="tn-call none"><div class="cl">NO LINE</div><div class="cv">${fmt(r.proj)}</div></div>` :
    `<div class="tn-call" style="--c:${col}"><div class="cl">${r.call === 'pass' ? 'PASS' : r.call.toUpperCase()}</div><div class="cv" style="color:${col}">${r.line}</div>` +
    `${r.px ? `<div class="lab" style="color:${col}">${propAmerican(r.px.dec)} ${PROP_BOOK_SHORT[r.px.book] || r.px.book}</div>` : ''}</div>`;
  const dtxt = r.dr ? `#${r.dr.rank} of ${r.dr.of}` : 'few games';
  return `<div class="tn-card${open ? ' open' : ''}"><div class="tn-row" data-act="open" data-key="${r.key}">
    <div class="tn-who"><div class="tn-pos">${r.pos}</div><div><div class="tn-nm">${r.player}</div>
      <div class="tn-mt">${r.off} vs ${r.def} &middot; ${TN_NAME[r.stat]}${r.hurt ? ` &middot; <span class="tn-inj">${r.hurt}</span>` : ''}</div></div></div>
    <div class="tn-cmp"><div class="tn-pair"><div><span class="big">${fmt(r.proj)}</span><span class="lab">he gets</span></div>
      <div><span class="big" style="color:var(--t-dim)">${r.dr ? fmt(r.dr.avg) : '--'}</span><span class="lab">defense allows (${dtxt})</span></div>
      ${r.line !== null ? `<div class="tn-diff" style="color:${col}">${diffTxt}</div>` : ''}</div>${tnTrack(r)}</div>
    <div class="tn-form"><div class="tn-dots">${dots}</div><span class="lab">${hit !== null ? `over ${r.line}: ${hit}/${r.vals.length}` : 'last ' + Math.min(5, r.vals.length)}</span></div>
    ${callHtml}</div>${open ? `<div class="tn-more">${tnBreakdownHtml(r)}</div>` : ''}</div>`;
}
function tnBarsHtml(items, line){
  if(!items.length) return '<div class="tn-empty">No games yet</div>';
  const max = Math.max(...items.map(i => i.v), line || 0, 1), H = 60;
  return `<div class="tn-bars">${line ? `<div class="tn-ref" style="bottom:${20 + line / max * H}px"><b>${line}</b></div>` : ''}` +
    items.map(i => `<div class="b"><span class="v" style="color:${i.c || 'var(--t-text)'}">${fmt(i.v, 0)}</span><i style="height:${Math.max(2, i.v / max * H)}px;background:${i.c || 'var(--t-dim)'}"></i><span>${i.l}</span></div>`).join('') + '</div>';
}
function tnBreakdownHtml(r){
  const mine = r.vals.slice(-8).map((v, i, a) => ({v, l: 'Wk ' + r.weeks.slice(-8)[i], c: r.line === null ? 'var(--t-dim)' : v > r.line ? 'var(--t-over)' : 'var(--t-under)'}));
  const theirs = r.defRows.slice().sort((a, b) => num(a.Week) - num(b.Week)).slice(-8).map(x => ({v: getStatValue(x, r.stat), l: String(x.Player).split(' ').slice(-1)[0], c: r.line === null ? 'var(--t-dim)' : getStatValue(x, r.stat) > r.line ? 'var(--t-over)' : 'var(--t-under)'}));
  const lg = bpLeagueAvg(r.pos, r.stat, bpMode());
  const why = [];
  why.push(`<p><b>${r.player}</b> averages <b>${fmt(r.avg)}</b> ${TN_NAME[r.stat].toLowerCase()} over ${r.vals.length} games (<b>${fmt(r.l3avg)}</b> the last three).</p>`);
  if(r.dr) why.push(`<p><b>${r.def}</b> give up <b>${fmt(r.dr.avg)}</b> a game to ${r.pos}s${lg ? ` against a league average of ${fmt(lg)}` : ''}, <b>#${r.dr.rank} of ${r.dr.of}</b> (1 = softest), from ${r.dr.n} player games.</p>`);
  else why.push(`<p>${r.def} have not faced enough ${r.pos}s yet, so the defense is not weighed.</p>`);
  if(r.pj) why.push(`<p>The projection of <b>${fmt(r.proj)}</b> blends his season and recent form, scales it by how that defense treats the position${Math.abs(r.pj.script - 1) > 0.005 ? ' and nudges it for the game script (spread ' + (bpSpreadFor(r.off, r.game.spread) > 0 ? '+' : '') + fmt(bpSpreadFor(r.off, r.game.spread) || 0) + ')' : ''}. Range ${fmt(r.pj.lo, 0)}&ndash;${fmt(r.pj.hi, 0)}.</p>`);
  if(r.line !== null) why.push(`<p>Book line <b>${r.line}</b>${r.bk && r.bk.bo ? ` (over ${propAmerican(r.bk.bo.dec)} ${PROP_BOOK_SHORT[r.bk.bo.book] || r.bk.bo.book}${r.bk.bu ? ', under ' + propAmerican(r.bk.bu.dec) + ' ' + (PROP_BOOK_SHORT[r.bk.bu.book] || r.bk.bu.book) : ''})` : ''}. ` +
    (r.call === 'pass' ? `The projection is within ${Math.round(TN_LEAN * 100)}% of the line, which is too close to call.` : r.call === 'none' ? '' : `The projection is ${Math.abs(Math.round(r.pct * 100))}% ${r.pct > 0 ? 'above' : 'below'} it, so the call is the <b>${r.call}</b>.`) + '</p>');
  else why.push('<p>No book line has been posted for this player yet, so there is no call.</p>');
  return `<div class="tn-bk wide"><div><div class="tn-h">${r.player}, last games${r.line !== null ? ' vs the line' : ''}</div>${tnBarsHtml(mine, r.line)}</div>
    <div><div class="tn-h">${r.pos}s against ${r.def}</div>${tnBarsHtml(theirs, r.line)}</div><div class="tn-why">${why.join('')}</div></div>`;
}
function tnSeg(id, list, cur){ return `<div class="tn-seg" id="${id}">${list.map(([k, l]) => `<button data-act="${id}" data-k="${k}" class="${cur === k ? 'on' : ''}">${l}</button>`).join('')}</div>`; }
function renderTonight(){
  const games = tnGames();
  if(!games.length) return `<div class="tn-wrap"><div class="tn-main"><h2 class="tn-title">Tonight</h2><div class="tn-empty" style="padding:50px 0;">No upcoming games are loaded yet.</div></div></div>`;
  if(!tnState.sel){
    const now = Date.now() - 5 * 3600 * 1000;
    const first = games.find(g => new Date(g.date).getTime() > now) || games[0];
    tnState.sel = new Set(games.filter(g => g.win.day === first.win.day).map(g => g.gid));
  }
  const rows = tnRows(), shown = rows.slice(0, tnState.limit);
  const sg = games.filter(g => tnState.sel.has(g.gid));
  const days = [...new Set(sg.map(g => g.win.day))];
  const title = sg.length === 1 ? `${sg[0].away} @ ${sg[0].home}` : sg.length ? (days.length === 1 ? days[0] : `${sg.length} games`) : 'Pick a game';
  const nLines = rows.filter(r => r.line !== null).length, nCalls = rows.filter(r => r.call === 'over' || r.call === 'under').length;
  const sub = sg.length ? `${sg.length} game${sg.length > 1 ? 's' : ''} &middot; ${rows.length} player lines &middot; ${nCalls} calls${propHasData() ? '' : ' &middot; no book lines loaded yet'}` : 'Choose games on the left';
  return `<div class="tn-wrap"><div class="tn-side">${tnSideHtml(games)}</div><div class="tn-main">
    <div class="tn-top"><div><h2 class="tn-title">${title}</h2><div class="tn-sub">${sub}</div></div></div>
    <div class="tn-bar">${tnSeg('tn-stat', TN_STATS, tnState.stat)}${tnSeg('tn-pos', TN_POS, tnState.pos)}<div class="tn-sort">${tnSeg('tn-sort', TN_SORT, tnState.sort)}</div></div>
    ${shown.map(tnRowHtml).join('') || '<div class="tn-empty" style="padding:40px 0;">No players match these filters.</div>'}
    ${rows.length > shown.length ? `<div style="text-align:center;margin:10px 0;"><div class="tn-seg"><button data-act="more">Show ${Math.min(40, rows.length - shown.length)} more</button></div></div>` : ''}
    <div class="tn-note">He gets = season and last-3 form scaled by how the defense treats his position and the game script. Defense allows = average per game to that position (rank 1 gives up the most). A call needs the projection ${Math.round(TN_LEAN * 100)}% or more away from the book line and at least 3 games of history. Early in the season this is a rough guide, not a lock.</div>
  </div></div>`;
}
function tnRedraw(){ const y = window.scrollY; $('#content').innerHTML = renderTonight(); mountTonight(); window.scrollTo(0, y); }
function mountTonight(){
  const w = $('.tn-wrap'); if(!w) return;
  w.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if(!b) return;
    const a = b.dataset.act, games = tnGames();
    if(a === 'game'){ tnState.sel.has(b.dataset.gid) ? tnState.sel.delete(b.dataset.gid) : tnState.sel.add(b.dataset.gid); tnState.open = null; tnState.limit = 40; }
    else if(a === 'day'){ const ds = games.filter(g => (g.win.day || 'TBD') === b.dataset.day); const all = ds.every(g => tnState.sel.has(g.gid)); ds.forEach(g => all ? tnState.sel.delete(g.gid) : tnState.sel.add(g.gid)); tnState.open = null; }
    else if(a === 'lineonly') tnState.lineOnly = !tnState.lineOnly;
    else if(a === 'tn-stat') tnState.stat = b.dataset.k;
    else if(a === 'tn-pos') tnState.pos = b.dataset.k;
    else if(a === 'tn-sort') tnState.sort = b.dataset.k;
    else if(a === 'open') tnState.open = tnState.open === b.dataset.key ? null : b.dataset.key;
    else if(a === 'more') tnState.limit += 40;
    tnRedraw();
  });
}

function showTab(tab){
  if(window.__liveNowTimer){ clearInterval(window.__liveNowTimer); window.__liveNowTimer = null; }
  $$('#tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  { const sel = $('#tn-more'); if(sel) sel.value = $('#tabs button[data-tab="' + tab + '"]') ? '' : tab; }
  const r = renderers[tab];
  $('#content').innerHTML = r.render();
  r.mount();
}
async function loadCSV(path){
  const res = await fetch(path, {cache: 'no-store'});
  if(!res.ok) throw new Error(`${path} -> HTTP ${res.status}`);
  const text = await res.text();
  const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
  return parsed.data;
}

// Core files (everything the ESPN pipeline generates) should still show the
// full error page if they fail -- something's genuinely wrong. But
// milestones.csv depends on an external nflverse download on top of ESPN,
// so it's more prone to an occasional failure and shouldn't be able to
// take down the whole dashboard just because it's missing or briefly broken.
const OPTIONAL_CSV_KEYS = ['milestones', 'teamMilestones', 'injuries', 'epa', 'gameTeamStats', 'gameQbStats', 'redzone', 'coaching', 'lineTeam', 'linePlayers', 'lineInjuries', 'defenseRoster', 'defenseCoverage', 'passLocation', 'backtest', 'propOdds', 'propStatus'];
async function loadCSVLenient(key, path){
  try {
    return await loadCSV(path);
  } catch(err){
    if(OPTIONAL_CSV_KEYS.includes(key)){
      console.warn(`Optional file ${path} unavailable, continuing without it:`, err);
      return [];
    }
    throw err;
  }
}


// ---- Every table: click a header to sort, and a filter bar above it ----
// buildTable() tables already sort; hand-built ones do not. This layer watches the page and gives all of them the same
// behaviour, including tables added later. Filter: type words (all must match), pick one column, or use > < >= <= = with a number
// (for example ">60" on the Pass Yards column). Tables with merged header cells or detail rows are left alone.
const TBL_MIN_ROWS_FOR_FILTER = 6;
function tblCellNum(txt){
  const m = String(txt).replace(/,/g, '').match(/^\s*([+-]?)\$?\s*(\d+\.?\d*|\.\d+)/);
  return m ? parseFloat((m[1] === '-' ? '-' : '') + m[2]) : null;
}
function tblDataRows(table){
  const tb = table.tBodies[0];
  return tb ? [...tb.rows].filter(r => !r.querySelector('td[colspan]')) : [];
}
function tblHeaderCells(table){
  const head = table.tHead && table.tHead.rows.length ? table.tHead.rows[table.tHead.rows.length - 1] : null;
  return head ? [...head.cells] : [];
}
function tblEligible(table){
  if(table.closest('.game-stats-table, .df-detail, [data-no-enhance]')) return false;
  if(table.parentElement && table.parentElement.closest('table')) return false;
  const ths = tblHeaderCells(table);
  if(ths.length < 2 || ths.some(th => th.colSpan > 1 || th.rowSpan > 1)) return false;
  const rows = tblDataRows(table);
  if(rows.length < 2) return false;
  if(rows.some(r => r.cells.length !== ths.length)) return false;
  return true;
}
function tblApplyFilter(table, bar){
  const q = bar.querySelector('input').value.trim().toLowerCase(), col = bar.querySelector('select').value;
  const ci = col === '' ? -1 : parseInt(col, 10);
  const tokens = q ? q.split(/\s+/) : [];
  const rows = tblDataRows(table);
  let shown = 0;
  rows.forEach(r => {
    const cells = [...r.cells].map(c => c.textContent.replace(/\s+/g, ' ').trim());
    const ok = tokens.every(tok => {
      const m = tok.match(/^(>=|<=|>|<|=)(-?\d+\.?\d*)$/);
      if(m){
        const v = parseFloat(m[2]), test = n => n !== null && (m[1] === '>' ? n > v : m[1] === '<' ? n < v : m[1] === '>=' ? n >= v : m[1] === '<=' ? n <= v : n === v);
        return ci >= 0 ? test(tblCellNum(cells[ci])) : cells.some(c => test(tblCellNum(c)));
      }
      return (ci >= 0 ? cells[ci] : cells.join(' ')).toLowerCase().includes(tok);
    });
    r.style.display = ok ? '' : 'none';
    if(ok) shown++;
  });
  const cnt = bar.querySelector('.tbl-count');
  if(cnt) cnt.textContent = tokens.length ? `${shown} of ${rows.length} rows` : `${rows.length} rows`;
}
function tblMakeBar(table, container){
  const rows = tblDataRows(table);
  const bar = document.createElement('div');
  bar.className = 'tbl-bar';
  bar.innerHTML = `<select title="Filter on one column, or all"></select><input type="text" placeholder="Filter rows... (or >60)" aria-label="Filter rows"><button type="button" title="Clear the filter">Clear</button><span class="tbl-count"></span>`;
  bar._table = table; bar._for = container || table;
  const fill = t => {
    const sel = bar.querySelector('select'), prev = sel.value;
    sel.innerHTML = '<option value="">All columns</option>' + tblHeaderCells(t).map((th, i) => ({i, name: th.textContent.replace(/\s+/g, ' ').trim()})).filter(o => o.name).map(o => `<option value="${o.i}">${frEsc(o.name)}</option>`).join('');
    if(prev && sel.querySelector(`option[value="${prev}"]`)) sel.value = prev;
  };
  fill(table);
  bar.refresh = t => { bar._table = t; fill(t); tblApplyFilter(t, bar); };
  bar.querySelector('input').addEventListener('input', () => tblApplyFilter(bar._table, bar));
  bar.querySelector('select').addEventListener('change', () => tblApplyFilter(bar._table, bar));
  bar.querySelector('button').addEventListener('click', () => { bar.querySelector('input').value = ''; tblApplyFilter(bar._table, bar); });
  tblApplyFilter(table, bar);
  return bar;
}
function tblMakeSortable(table){
  const ths = tblHeaderCells(table);
  ths.forEach((th, ci) => {
    th.setAttribute('data-enh-sort', '1'); th.style.cursor = 'pointer'; th.title = th.title || 'Click to sort';
    th.addEventListener('click', () => {
      const rows = tblDataRows(table);
      const vals = rows.map(r => r.cells[ci].textContent.replace(/\s+/g, ' ').trim());
      const nums = vals.map(tblCellNum), filled = vals.filter(v => v !== '' && v !== '--' && v !== '-').length;
      const numeric = filled > 0 && nums.filter(n => n !== null).length >= 0.7 * filled;
      const was = th.classList.contains('sorted') ? 'desc' : th.classList.contains('sorted-asc') ? 'asc' : '';
      const dir = was ? (was === 'desc' ? 'asc' : 'desc') : (numeric ? 'desc' : 'asc');
      ths.forEach(x => x.classList.remove('sorted', 'sorted-asc'));
      th.classList.add(dir === 'asc' ? 'sorted-asc' : 'sorted');
      const order = rows.map((r, i) => ({r, i, v: vals[i], n: nums[i]}));
      const empty = o => o.v === '' || o.v === '--' || o.v === '-';
      order.sort((a, b) => {
        if(empty(a) !== empty(b)) return empty(a) ? 1 : -1;       // blanks always last
        let c;
        if(numeric){ c = (a.n === null ? -Infinity : a.n) - (b.n === null ? -Infinity : b.n); if(!isFinite(c)) c = a.n === b.n ? 0 : (a.n === null ? -1 : 1); }
        else c = a.v.localeCompare(b.v, undefined, {numeric: true, sensitivity: 'base'});
        if(c === 0) return a.i - b.i;
        return dir === 'asc' ? c : -c;
      });
      const tb = table.tBodies[0];
      const anchor = rows.length ? rows[rows.length - 1].nextSibling : null;
      order.forEach(o => tb.insertBefore(o.r, anchor));
    });
  });
}
function enhanceTables(root){
  // Drop filter bars whose table has gone.
  (root || document).querySelectorAll('.tbl-bar').forEach(b => { if(!b._for || !b._for.isConnected) b.remove(); });
  (root || document).querySelectorAll('table').forEach(table => {
    if(table.dataset.enh) return;
    if(!tblEligible(table)) return;   // not cached: rows may arrive later, and checking again is cheap
    const ths = tblHeaderCells(table);
    const built = ths.some(th => th.hasAttribute('data-key'));          // made by buildTable: already sortable
    const scroll = table.closest('.table-scroll');
    const container = built && scroll ? scroll.parentElement : null;      // buildTable rewrites this element on every sort
    if(container && container._tblBar && container._tblBar.isConnected){
      table.dataset.enh = 'built'; container._tblBar.refresh(table); return;
    }
    table.dataset.enh = built ? 'built' : 'sort';
    if(!built) tblMakeSortable(table);
    if(tblDataRows(table).length >= TBL_MIN_ROWS_FOR_FILTER){
      const bar = tblMakeBar(table, container);
      const anchor = container || scroll || table;
      anchor.parentNode.insertBefore(bar, anchor);
      if(container) container._tblBar = bar;
    }
  });
}
let _tblTimer = null;
function tblWatch(){
  const target = document.getElementById('content');
  if(!target || target._tblObs) return;
  target._tblObs = new MutationObserver(() => { clearTimeout(_tblTimer); _tblTimer = setTimeout(() => { try { enhanceTables(target); } catch(e){ console.warn('table enhance', e); } }, 60); });
  target._tblObs.observe(target, {childList:true, subtree:true});
  enhanceTables(target);
}

async function init(){
  try {
    const entries = await Promise.all(
      Object.entries(CSV_FILES).map(async ([key, path]) => [key, await loadCSVLenient(key, path)])
    );
    DATA = Object.fromEntries(entries);
  } catch(err){
    console.error(err);
    $('#content').innerHTML = `<div class="empty" style="padding:60px 20px;">
      Couldn't load data (${err.message}).<br><br>
      This page fetches its CSVs from a <code>data/</code> folder next to it, so it needs
      to be served over http(s) -- opening the file directly (file://) won't work in most
      browsers. Run a local server (e.g. <code>python3 -m http.server</code> in this folder)
      or view it via its hosted URL, and make sure <code>data/</code> contains the required CSVs.
    </div>`;
    return;
  }

  LATEST_RESULTS_WEEK = DATA.teamWeek && DATA.teamWeek.length
    ? Math.max(...DATA.teamWeek.map(r=>num_(r.Week)))
    : (DATA.playerGame && DATA.playerGame.length ? Math.max(...DATA.playerGame.map(r=>num_(r.Week))) : null);
  PREVIEW_WEEK = DATA.week2 && DATA.week2.length ? num_(DATA.week2[0].Week) : (LATEST_RESULTS_WEEK ? LATEST_RESULTS_WEEK + 1 : null);

  CLASSIC_NAV_HTML = $('#tabs').innerHTML;
  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-tab]'); if(b){ showTab(b.dataset.tab); return; }
    const mb = e.target.closest('#nav-more-btn');
    if(mb){ const m = $('#nav-more'); m.hidden = !m.hidden; mb.setAttribute('aria-expanded', String(!m.hidden)); mb.innerHTML = m.hidden ? 'More tools &#9662;' : 'Fewer tools &#9652;'; }
  });
  $('#tabs').addEventListener('change', e => { if(e.target.id === 'tn-more' && e.target.value) showTab(e.target.value); });
  $$('#layout-pick .lp button').forEach(b => b.addEventListener('click', () => applyLayout(b.dataset.layout)));
  $('#theme-btn').addEventListener('click', () => applyTheme(document.body.dataset.theme === 'light' ? 'dark' : 'light', true));
  $('#ticker-track').addEventListener('click', (e)=>{
    const item = e.target.closest('.ticker-item');
    if(item) goToGameDetails(item.dataset.away, item.dataset.home, item.dataset.state);
  });
  renderHero();
  renderTicker();
  CLASSIC_TAB = 'overview';
  applyLayout(getLayout(), acctReadInvite() ? 'friends' : null);
}
init();
document.addEventListener('DOMContentLoaded', tblWatch);
if(document.readyState !== 'loading') tblWatch();
