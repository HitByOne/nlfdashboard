function mountMyPicks(){
  const container = $('#mypicks-table');
  const resultEl = $('#checker-result');

  // Team dropdown + cascading player dropdown (filtered by team and
  // position), instead of free-text typing -- avoids typos/ambiguity.
  const allTeams = [...new Set((DATA.playerGame || []).map(r=>r.Team))].sort();
  $('#checker-team').innerHTML = '<option value="">All teams</option>' +
    allTeams.map(t=>`<option value="${t}">${teamName(t)}</option>`).join('');

  function refreshCheckerPlayerList(){
    const team = $('#checker-team').value;
    const position = $('#checker-position').value;
    const players = [...new Set(
      (DATA.playerGame || [])
        .filter(r=> (!team || r.Team===team) && (!position || r.Position===position))
        .map(r=>r.Player)
    )].sort();
    const playerSelect = $('#checker-player');
    const previousValue = playerSelect.value;
    playerSelect.innerHTML = '<option value="">Select a player...</option>' +
      players.map(p=>`<option value="${p}">${p}</option>`).join('');
    if(players.includes(previousValue)) playerSelect.value = previousValue;
  }
  refreshCheckerPlayerList();
  $('#checker-team').addEventListener('change', refreshCheckerPlayerList);
  $('#checker-position').addEventListener('change', refreshCheckerPlayerList);

  $('#checker-btn').addEventListener('click', ()=>{
    const player = $('#checker-player').value.trim();
    const statKey = $('#checker-stat').value;
    const threshold = parseFloat($('#checker-threshold').value);

    if(!player || isNaN(threshold)){
      resultEl.innerHTML = '<div class="empty">Select a player and enter a number to check.</div>';
      return;
    }

    const posRow = (DATA.playerGame || []).find(r=>r.Player===player);
    if(!posRow){
      resultEl.innerHTML = `<div class="empty">No games logged for "${player}".</div>`;
      return;
    }
    const position = posRow.Position;
    const team = posRow.Team;

    const playerRate = getPlayerStatFloorRate(player, position, statKey, threshold);
    if(!playerRate){
      resultEl.innerHTML = `<div class="empty">No games logged for ${player} at ${position} yet.</div>`;
      return;
    }

    const wk2Row = (DATA.week2 || []).find(r=>r.Team===team);
    const opponent = wk2Row ? wk2Row.Opponent : null;
    const defenseRate = opponent ? getDefenseLeadPlayerFloorRate(opponent, position, statKey, threshold) : null;

    resultEl.innerHTML = `
      <div class="log-pos-group">
        <div class="log-pos-label" style="font-size:14px;">${player} (${position}, ${teamName(team)}) -- ${threshold}+ ${statKey}</div>
        <div class="player-preview-stats">${player} has hit ${threshold}+ ${statKey} in <b style="color:var(--mint);">${playerRate.hits} of ${playerRate.total}</b> games this season (${fmt(playerRate.rate*100,0)}%)</div>
        ${defenseRate ? `
          <div class="player-preview-stats">${teamName(opponent)} (their upcoming opponent) has allowed ${threshold}+ ${statKey} to the opposing lead ${position} in <b style="color:var(--mint);">${defenseRate.hits} of ${defenseRate.total}</b> games (${fmt(defenseRate.rate*100,0)}%)</div>
        ` : `<div class="player-preview-stats" style="color:var(--chalk-dim);">No upcoming opponent loaded for ${team} yet -- showing player's own rate only.</div>`}
        ${opponent && wk2Row.Week ? (()=>{
          const saved = isPickSaved({source:'Custom Checker', player, stat:statKey, week:wk2Row.Week, threshold});
          const summary = `${threshold}+ ${statKey} vs ${opponent} (Wk ${wk2Row.Week})`;
          return `<button class="save-pick-btn" style="margin-top:8px;" ${saved?'disabled':''}
            data-player="${player}" data-position="${position}" data-team="${team}" data-opponent="${opponent}"
            data-stat="${statKey}" data-week="${wk2Row.Week}" data-threshold="${threshold}"
            data-summary="${summary.replace(/"/g,'&quot;')}">${saved?'&#10003; Saved -- check My Picks after the game':'+ Add to My Picks'}</button>`;
        })() : `<div class="player-preview-stats" style="color:var(--chalk-dim);">No upcoming week loaded for ${team} yet, so this can't be saved for grading.</div>`}
      </div>`;

    const saveBtn = resultEl.querySelector('.save-pick-btn');
    if(saveBtn) saveBtn.addEventListener('click', ()=>{
      addToMyPicks({
        source: 'Custom Checker', player: saveBtn.dataset.player, position: saveBtn.dataset.position,
        team: saveBtn.dataset.team, opponent: saveBtn.dataset.opponent, stat: saveBtn.dataset.stat,
        week: saveBtn.dataset.week, threshold: parseFloat(saveBtn.dataset.threshold), summary: saveBtn.dataset.summary,
      });
      $('#checker-btn').click(); // redraw the result so the button flips to "Saved"
    });
  });

  $('#new-ticket-btn').addEventListener('click', ()=>{
    const name = $('#new-ticket-name').value.trim();
    if(!name){
      alert('Enter a ticket name first.');
      return;
    }
    addNewTicketName(name);
    $('#new-ticket-name').value = '';
    apply();
  });

  $('#clear-all-picks-btn').addEventListener('click', ()=>{
    if(confirm('Clear all saved picks? This cannot be undone.')){
      getMyPicks().forEach(addTomb);
      saveMyPicksList([]);
      apply();
    }
  });

  function weekNum(p){ const n = parseInt(p.week, 10); return isNaN(n) ? 0 : n; }
  function recordHtml(picks){
    const byWeek = {};
    picks.forEach(p => {
      const g = gradeMyPick(p);
      if(!g) return;
      const w = weekNum(p);
      const e = byWeek[w] = byWeek[w] || {hit:0, miss:0, open:0, tickets:{}};
      if(g.status === 'HIT' && (g.final || g.live)) e.hit++;
      else if(g.status === 'MISS') e.miss++;
      else e.open++;
      const t = e.tickets[p.ticket || 'Ticket A'] = e.tickets[p.ticket || 'Ticket A'] || {legs:0, hit:0};
      t.legs++; if(g.status === 'HIT' && g.final) t.hit++;
    });
    const weeks = Object.keys(byWeek).map(Number).sort((a, b) => b - a);
    if(!weeks.length) return '';
    let H = 0, M = 0;
    const rows = weeks.map(w => {
      const e = byWeek[w], names = Object.keys(e.tickets);
      const won = names.filter(n => e.tickets[n].hit === e.tickets[n].legs).length;
      H += e.hit; M += e.miss;
      const rate = e.hit + e.miss ? Math.round(e.hit / (e.hit + e.miss) * 100) + '%' : '--';
      return `<tr><td class="num">${w || '--'}</td><td class="num" style="color:var(--mint);">${e.hit}</td><td class="num" style="color:var(--red);">${e.miss}</td><td class="num">${e.open}</td><td class="num">${rate}</td><td class="num">${won} of ${names.length}</td></tr>`;
    }).join('');
    return `<div class="log-pos-group" style="margin-bottom:14px;"><div class="log-pos-label">Record by week${H + M ? ` -- ${H} of ${H + M} legs hit (${Math.round(H / (H + M) * 100)}%)` : ''}</div>
      <div class="table-scroll"><table><thead><tr><th class="num">Week</th><th class="num">Legs hit</th><th class="num">Legs missed</th><th class="num">Open</th><th class="num">Leg hit rate</th><th class="num">Tickets won</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="line-note">A ticket is won only when every leg hit. Open = not played yet or still live.</div></div>`;
  }
  function ticketPicks(picks, ticket){ return picks.filter(p => (p.ticket || 'Ticket A') === ticket); }
  function metaRowHtml(ticket, picks){
    const m = getTicketMeta()[ticket] || {};
    const o = ticketOutcome(ticketPicks(picks, ticket), m);
    let res = '';
    if(o.state === 'won') res = `<b style="color:var(--mint);">WON${o.net !== null && o.net !== undefined ? ' +$' + fmt(o.net, 2) : ''}</b>`;
    else if(o.state === 'lost') res = `<b style="color:var(--red);">LOST${o.bonus ? ' (bonus bet, no cost)' : (o.net !== null && o.net !== undefined ? ' -$' + fmt(-o.net, 2) : '')}</b>`;
    else if(o.state === 'open') res = `<span style="color:var(--chalk-dim);">${o.hitSoFar} of ${o.legs} legs hit so far${o.toWin !== null && o.toWin !== undefined ? ' &middot; to win $' + fmt(o.toWin, 2) : ''}</span>`;
    const inp = (k, label, w, ph) => `<label class="ctl-label">${label} <input type="text" data-k="${k}" value="${(m[k] || '').toString().replace(/"/g, '&quot;')}" placeholder="${ph || ''}" style="width:${w}px;"></label>`;
    return `<div class="controls ticket-meta" data-ticket="${encodeURIComponent(ticket)}" style="margin-top:6px;">
      ${inp('book', 'Book', 100)}${inp('odds', 'Odds', 66, '+950')}${inp('stake', 'Wager $', 62)}${inp('payout', 'Returned $', 62)} ${res}
      <label class="ctl-label"><input type="checkbox" data-k="bonus" ${m.bonus ? 'checked' : ''}> bonus bet</label>
      <label class="ctl-label"><input type="checkbox" data-k="share" ${m.share ? 'checked' : ''}> Share with friends</label>
      <label class="ctl-label"><input type="checkbox" data-k="shareStake" ${m.shareStake ? 'checked' : ''}> show my wager</label>
      ${m.share && !acctSignedIn() ? '<span style="color:var(--gold);font-size:12px;">Sign in on the Friends tab to share.</span>' : ''}</div>`;
  }
  function moneyHtml(picks){
    const meta = getTicketMeta(), tickets = [...new Set(picks.map(p => p.ticket || 'Ticket A'))];
    let staked = 0, net = 0, won = 0, lost = 0, open = 0, n = 0;
    tickets.forEach(t => {
      const m = meta[t]; if(!m) return;
      const st = parseFloat(m.stake); if(!(st > 0)) return;
      const o = ticketOutcome(ticketPicks(picks, t), m);
      n++;
      if(o.state === 'won'){ won++; staked += o.bonus ? 0 : st; net += (o.net || 0); }
      else if(o.state === 'lost'){ lost++; staked += o.bonus ? 0 : st; net += (o.net || 0); }
      else open++;
    });
    if(!n) return '';
    return `<div class="log-pos-group" style="margin-bottom:14px;"><div class="log-pos-label" style="font-size:14px;">Money -- tickets with a wager entered</div>
      <div class="player-preview-stats">${won} won &middot; ${lost} lost &middot; ${open} still open. Staked on settled tickets <b>$${fmt(staked, 2)}</b>, net <b style="color:${net >= 0 ? 'var(--mint)' : 'var(--red)'};">${net >= 0 ? '+' : '-'}$${fmt(Math.abs(net), 2)}</b>${staked ? ` (${net >= 0 ? '+' : ''}${fmt(net / staked * 100, 0)}% return)` : ''}.</div>
      <div class="line-note">Add a wager and odds to any ticket (they are filled in from the screenshot when the slip shows them). A ticket's money result uses the odds, or the returned amount if you enter it.</div></div>`;
  }
  let mpWeek = null;   // null = latest week with picks, 'all' = everything
  function apply(){
    persistSettledPicks();
    const picks = getMyPicks();
    const recEl = $('#mp-record'), pillsEl = $('#mp-week-pills');
    if(!picks.length){
      if(recEl) recEl.innerHTML = ''; if(pillsEl) pillsEl.innerHTML = '';
      container.innerHTML = '<div class="empty">No picks saved yet -- use the "+ Add" button on Best Picks, Predictions, or Team Game Log.</div>';
      return;
    }
    if(recEl) recEl.innerHTML = moneyHtml(picks) + recordHtml(picks);
    const weeks = [...new Set(picks.map(weekNum))].sort((a, b) => b - a);
    const activeWeek = mpWeek === 'all' ? 'all' : (mpWeek !== null && weeks.includes(mpWeek) ? mpWeek : weeks[0]);
    if(pillsEl){
      pillsEl.innerHTML = weeks.map((w, i) => `<span class="pill ${activeWeek === w ? 'active' : ''}" data-w="${w}">${w ? 'Week ' + w : 'No week'}${i === 0 ? ' (latest)' : ''}</span>`).join('') +
        `<span class="pill ${activeWeek === 'all' ? 'active' : ''}" data-w="all">All weeks</span>`;
      $$('#mp-week-pills .pill').forEach(pl => pl.addEventListener('click', () => { mpWeek = pl.dataset.w === 'all' ? 'all' : parseInt(pl.dataset.w, 10); apply(); }));
    }
    const shown = activeWeek === 'all' ? picks : picks.filter(p => weekNum(p) === activeWeek);

    const ticketNames = getAllTicketNames();
    const byTicket = {};
    ticketNames.forEach(t=>{ byTicket[t] = []; });
    shown.forEach(p=>{
      const t = p.ticket || 'Ticket A';
      if(!byTicket[t]) byTicket[t] = [];
      byTicket[t].push(p);
    });

    const nonEmptyTickets = Object.entries(byTicket).filter(([,list])=>list.length);

create table if not exists dashboard_sync (

);

alter table dashboard_sync enable row level security;
-- No policies on purpose: nobody can touch the table directly with the public key.

create or replace function sync_get(code text) returns jsonb
language plpgsql security definer set search_path = public as $$
begin
  if code is null or length(code) < 12 then raise exception 'sync code too short'; end if;
  return (select data from dashboard_sync where id = code);
end $$;

create or replace function sync_put(code text, payload jsonb) returns void
language plpgsql security definer set search_path = public as $$
begin
  if code is null or length(code) < 12 then raise exception 'sync code too short'; end if;
  insert into dashboard_sync (id, data, updated_at) values (code, payload, now())

end $$;

revoke all on function sync_get(text) from public;
revoke all on function sync_put(text, jsonb) from public;
grant execute on function sync_get(text) to anon, authenticated;
grant execute on function sync_put(text, jsonb) to anon, authenticated;
`;

    if(window.__mpSyncListener) window.removeEventListener('picks-synced', window.__mpSyncListener);
    window.__mpSyncListener = () => { if(document.getElementById('mypicks-table')){ show(); apply(); } };
    window.addEventListener('picks-synced', window.__mpSyncListener);

// ---------- TAB: MIKE'S TEMPLATE ----------
// Implements a specific weekly selection methodology in full: find a clear
// game-script favorite (moderate spread) facing a run defense that's below
// average, with a bell-cow RB getting real touch volume, and build
// conservative floor-based tickets around that -- explicitly avoiding
// anytime-TD props and anything beyond a 2-leg ticket.
//
// The spread/touch-volume checks below are shown as CONTEXT, not a hard
// AND-gate -- requiring all three simultaneously (moderate spread + bottom-
// half run D + 15+ touches) left almost nothing this early in a season.
// The real signal this version leans on is convergence: a player's own
// season hit rate at a yardage floor AND the opponent's own history of
// giving up that much to the opposing lead back, checked together across a
// range of thresholds, surfacing whichever floor is genuinely strong on
// both sides -- not just a defense's season-average rank.
const TEMPLATE_SPREAD_MIN = 3, TEMPLATE_SPREAD_MAX = 7.5;
const TEMPLATE_MIN_TOUCHES = 15;
const TEMPLATE_STRONG_RATE = 0.65; // "genuinely strong" hit rate threshold on both sides

// Which stat and which floor candidates to test, per position.
const TEMPLATE_STAT_BY_POS = {
  QB: {key:'Pass Yards', floors:[200, 225, 250, 275, 300, 325, 350]},
  RB: {key:'Rush Yards', floors:[40, 50, 60, 70, 80, 90, 100]},
  WR: {key:'Receiving Yards', floors:[40, 50, 60, 70, 80, 90, 100]},
  TE: {key:'Receiving Yards', floors:[30, 40, 50, 60, 70, 80]},
};

// The Spread column is a single shared string like "DAL -3.5" (team +
// number), not a separately-signed value per team row -- parse it and
// return the correct signed spread for whichever team is asked about
// (negative = favored, positive = underdog), regardless of which team the
// string itself is anchored to.
function parseSpreadForTeam(team, spreadStr){
  if(!spreadStr) return null;
  const match = String(spreadStr).trim().match(/^([A-Za-z]+)\s*([+-]?\d+\.?\d*)$/);
  if(!match) return null;
  const anchorTeam = match[1].toUpperCase();
  const value = parseFloat(match[2]);
  if(isNaN(value)) return null;
  return anchorTeam === team ? value : -value;
}

function isBottomHalfRunDefense(team){
  const rows = (DATA.defVsPos || []).filter(r=>r.Position==='RB');
  if(!rows.length) return null;
  const values = rows.map(r=>num(r['Rush Yards Allowed Per Game'])).sort((a,b)=>a-b);
  const median = values[Math.floor(values.length/2)];
  const teamRow = rows.find(r=>r.Defense===team);
  if(!teamRow) return null;
  const teamValue = num(teamRow['Rush Yards Allowed Per Game']);
  return {isBottomHalf: teamValue > median, teamValue, leagueMedian: median};
}

// The team's highest-volume player at a given position -- volume defined
// by whatever's most relevant to that position (pass attempts for QB,
// touches for RB, targets for WR/TE).
function getTeamTopVolumePlayer(team, position){
  const byPlayer = {};
  (DATA.playerGame || []).filter(r=>r.Team===team && r.Position===position).forEach(r=>{
    if(!byPlayer[r.Player]) byPlayer[r.Player] = {player:r.Player, games:[]};
    byPlayer[r.Player].games.push(r);
  });
  const withVolume = Object.values(byPlayer).map(p=>{
    let totalVolume;
    if(position === 'QB') totalVolume = p.games.reduce((s,g)=>s+num(g['Pass Attempts']),0);
    else if(position === 'RB') totalVolume = p.games.reduce((s,g)=>s+num(g['Rush Attempts'])+num(g['Receptions']),0);
    else totalVolume = p.games.reduce((s,g)=>s+num(g['Targets']),0);
    return {...p, avgVolume: totalVolume / p.games.length};
  });
  withVolume.sort((a,b)=>b.avgVolume-a.avgVolume);
  return withVolume[0] || null;
}

// Centralized so "Any TD" (a combined Rush TD + Receiving TD event, not a
// single CSV column) only needs to be special-cased once, here -- every
// grading/estimating function below reads a stat value through this
// instead of indexing playerGame rows directly.
function getStatValue(row, statKey){
  if(statKey === 'Rush + Rec Yards') return num(row['Rush Yards']) + num(row['Receiving Yards']);
  if(statKey === 'Pass + Rush Yards') return num(row['Pass Yards']) + num(row['Rush Yards']);
  return statKey === 'Any TD' ? num(row['Rush TD']) + num(row['Receiving TD']) : num(row[statKey]);
}

function getPlayerStatFloorRate(player, position, statKey, threshold){
  const games = (DATA.playerGame || []).filter(r=>r.Player===player && r.Position===position);
  if(!games.length) return null;
  const hits = games.filter(g=>getStatValue(g, statKey) >= threshold).length;
  return {hits, total: games.length, rate: hits / games.length};
}

// The defense's own history: for every game they've played, what did the
// OPPOSING team's leading player AT THIS POSITION actually gain in this
// stat? Then check how often that leading number has cleared a given
// threshold -- "has this defense given up 70+ to the opposing lead back in
// every game" (or 250+ passing to the opposing QB, or 70+ receiving to the
// opposing WR1) is a much sharper, game-by-game signal than a season-
// average allowed rank.
function getDefenseLeadPlayerFloorRate(defense, position, statKey, threshold){
  const rows = (DATA.playerGame || []).filter(r=>r.Opponent===defense && r.Position===position);
  const byWeek = {};
  rows.forEach(r=>{
    const wk = r.Week;
    const val = getStatValue(r, statKey);
    if(!(wk in byWeek) || val > byWeek[wk]) byWeek[wk] = val;
  });
  const weeklyMax = Object.values(byWeek);
  if(!weeklyMax.length) return null;
  const hits = weeklyMax.filter(v=>v >= threshold).length;
  return {hits, total: weeklyMax.length, rate: hits / weeklyMax.length};
}

// Find the highest floor where BOTH the player's own hit rate AND the
// defense's history of giving up that much to the lead player at this
// position are strong -- that's the genuine convergence pick, not just a
// low, easy number.
function findBestConvergenceFloor(player, position, statKey, floors, defense){
  let best = null;
  floors.forEach(threshold=>{
    const playerRate = getPlayerStatFloorRate(player, position, statKey, threshold);
    const defenseRate = getDefenseLeadPlayerFloorRate(defense, position, statKey, threshold);
    if(!playerRate || !defenseRate) return;
    if(playerRate.rate >= TEMPLATE_STRONG_RATE && defenseRate.rate >= TEMPLATE_STRONG_RATE){
      if(!best || threshold > best.threshold) best = {threshold, playerRate, defenseRate};
    }
  });
  return best;
}

function computeMikesTemplatePicks(){
  const games = new Map();
  (DATA.week2 || []).forEach(r=>{
    const gid = r['Game ID'];
    if(!gid) return;
    if(!games.has(gid)) games.set(gid, {sides:{}});
    const isHome = r['Home/Away'] === 'Home';
    games.get(gid).sides[isHome ? 'home' : 'away'] = r;
  });
  const gameList = [...games.values()].filter(g=>g.sides.home && g.sides.away);

  const results = [];
  gameList.forEach(g=>{
    const home = g.sides.home, away = g.sides.away;
    const spreadStr = home.Spread || away.Spread || '';

    [[home.Team, away.Team], [away.Team, home.Team]].forEach(([team, opponent])=>{
      PICKS_POSITIONS.forEach(position=>{
        const statCfg = TEMPLATE_STAT_BY_POS[position];
        const topPlayer = getTeamTopVolumePlayer(team, position);
        if(!topPlayer) return;

        const convergence = findBestConvergenceFloor(topPlayer.player, position, statCfg.key, statCfg.floors, opponent);
        if(!convergence) return; // no threshold cleared the bar on both sides -- not shown at all

        const spread = parseSpreadForTeam(team, spreadStr);
        const runDef = position === 'RB' ? isBottomHalfRunDefense(opponent) : null;

        results.push({
          team, opponent, position, statLabel: statCfg.key, week: home.Week,
          spread, spreadInRange: spread !== null && spread <= -TEMPLATE_SPREAD_MIN && spread >= -TEMPLATE_SPREAD_MAX,
          runDef,
          player: topPlayer.player, avgVolume: topPlayer.avgVolume,
          touchesMet: position === 'RB' ? topPlayer.avgVolume >= TEMPLATE_MIN_TOUCHES : null,
          convergence,
        });
      });
    });
  });

  // Strongest convergence first: higher floor, then higher combined hit rate.
  results.sort((a,b)=>
    b.convergence.threshold - a.convergence.threshold ||
    (b.convergence.playerRate.rate + b.convergence.defenseRate.rate) - (a.convergence.playerRate.rate + a.convergence.defenseRate.rate)
  );
  return results;
}

function renderMikesTemplate(){
  return `
  <div class="panel">
    <div class="panel-title">Mike's Template</div>
    <div class="panel-note">
      The core signal here is convergence, applied across every skill position: a player's own season hit
      rate at a stat floor (rush yards for RB, receiving yards for WR/TE, pass yards for QB) AND this
      specific opponent's history of giving up that much to the opposing lead player at that position in
      every game so far -- checked across a range of floors so the line shown is the highest one that's
      genuinely strong on both sides, not just an easy number. Spread (-3 to -7.5) and volume are shown as
      context, not a hard requirement -- this early in a season, demanding everything at once left almost
      nothing. <b>Line context:</b> offensive-line health and the pass-protection / run-blocking matchup
      come from the Line Play data (the official injury report cross-referenced with snap counts, so
      "starters" are the five linemen who actually play the most). It's shown as context, not a
      requirement -- it doesn't change which players qualify.
    </div>
    <div id="mikes-template-list"></div>
  </div>`;
}

function mountMikesTemplate(){
  const container = $('#mikes-template-list');
  const picks = computeMikesTemplatePicks();

  if(!picks.length){
    container.innerHTML = '<div class="empty">No player this week has a floor that\'s strong on both their own side and this specific opponent\'s history -- check back once more games/stats are logged.</div>';
    return;
  }

  container.innerHTML = picks.map(p=>{
    const injRows = (DATA.injuries || []).filter(r=>r.Team===p.team && isRelevantInjury(r));
    const injHtml = injRows.length ? injRows.map(r=>`${r.Player} (${r.Status})`).join(', ') : 'None listed';
    const c = p.convergence;

// ---------- TAB: ANYTIME TD PROPS ----------
// Built like Best Picks: each offensive starter (QB1 for rushing scores, RB1, WR1-3, TE1)
// against what the opposing defense has given up to STARTERS at that position. Floor-style
// signal kept: how often he scored in his own games, how often starters scored against this
// defense (his own team's past games vs them are left out of the defense sample). On top of
// that is a Vegas-style projection: expected TDs, turned into a chance to score at least one
// (Poisson: 1 - e^-expected) and the fair American odds that chance implies.
const TD_STARTERS_KEY = 'nfl_dashboard_anytimetd_starters';
const TD_MIN_PLAYER_GAMES = 2, TD_MIN_DEF_SAMPLES = 3;
function tdStartersOn(){ try { return localStorage.getItem(TD_STARTERS_KEY) !== '0'; } catch(e){ return true; } }
function tdSetStarters(on){ try { localStorage.setItem(TD_STARTERS_KEY, on ? '1' : '0'); } catch(e){} }
function tdOdds(p){
  p = Math.max(0.03, Math.min(0.97, p));
  const o = p >= 0.5 ? -100 * p / (1 - p) : 100 * (1 - p) / p;
  return (o > 0 ? '+' : '-') + Math.abs(Math.round(o));
}
// Expected TDs: season/last-3 blend of TDs per game, times how this defense treats starters at
// the position versus the league (capped, shrunk toward neutral until the defense has 6 games),
// times a small game-script nudge (favorites run it in, underdogs throw more).
function tdProject(tds, l3, allowed, league, defGames, position, spread){
  const avg = tds.reduce((a, v) => a + v, 0) / tds.length;
  const baseline = avg * 0.6 + l3 * 0.4;
  let raw = league > 0 ? allowed / league : 1;
  raw = Math.max(0.6, Math.min(1.6, raw));
  const matchup = 1 + (raw - 1) * Math.min(1, defGames / 6);
  const script = bpScriptFactor(position === 'RB' || position === 'QB' ? 'Rush Yards' : 'Receiving Yards', spread);
  const lambda = baseline * matchup * script;
  const prob = 1 - Math.exp(-lambda);
  return {lambda, prob, matchup, script, odds: tdOdds(prob)};
}
function tdPicksForGame(offense, defense, startersOnly, spread){
  const picks = [];
  bpTeamPlayers(offense, startersOnly).forEach(p => {
    if(p.games.length < TD_MIN_PLAYER_GAMES) return;
    const defRows = bpDefenseSamples(defense, p.Position, startersOnly, offense);
    if(defRows.length < TD_MIN_DEF_SAMPLES) return;
    const tds = p.games.map(g => getStatValue(g, 'Any TD'));
    const ph = tds.filter(v => v >= 1).length;
    const dTds = defRows.map(r => getStatValue(r, 'Any TD'));
    const dh = dTds.filter(v => v >= 1).length;
    const l3 = p.games.slice().sort((a, b) => num(a.Week) - num(b.Week)).slice(-3).map(g => getStatValue(g, 'Any TD'));
    const l3avg = l3.reduce((a, v) => a + v, 0) / l3.length;
    const allowed = dTds.reduce((a, v) => a + v, 0) / dTds.length;
    const league = bpLeagueAvg(p.Position, 'Any TD', startersOnly);
    const defGames = new Set((DATA.playerGame || []).filter(r => r.Opponent === defense).map(r => r.Week)).size;
    const pj = tdProject(tds, l3avg, allowed, league, defGames, p.Position, spread || 0);
    if(pj.lambda <= 0) return;
    picks.push({player:p.Player, position:p.Position, slot:p.slot, team:offense, opponent:defense, pj,
      ph, pt:tds.length, pr:ph / tds.length, dh, dt:defRows.length, dr:dh / defRows.length,
      combined:(ph / tds.length) * (dh / defRows.length), allowed, league,
      edge: league > 0 ? allowed / league - 1 : 0});
  });
  picks.sort((a, b) => b.pj.prob - a.pj.prob);
  return picks;
}

function renderAnytimeTD(){
  return `
  <div class="panel">
    <div class="panel-title">Anytime TD Props</div>
    <div class="panel-note">
      Each offensive starter (QB1, RB1, WR1-3, TE1) against what the opposing defense has given up to
      <b>starters</b> at that position. Two floor-style signals are kept: how often he scored (rushing or receiving)
      in his own games, and how often starters scored against this defense. Next to them is a <b>projection</b>:
      expected TDs from his season and last-3 scoring rate, scaled by how this defense treats starters compared with
      the league (capped, and shrunk toward neutral until the defense has 6 games), plus a small game-script nudge from
      the spread. That becomes a <b>chance to score</b> (1 minus e to the minus expected TDs) and the <b>fair odds</b> that
      chance implies. Compare the fair odds with the book's price: a book paying better than the fair odds is the value side.
      It is an estimate from this season's box scores, not a sportsbook line. Passing TDs do not count. Out / Doubtful players
      are skipped and the next starter moves up. TD scoring is streaky and the samples are small, so treat these as a
      starting point for research. Click a row for the player's game log.
    </div>
    <div class="controls">
      <span class="pill ${tdStartersOn() ? 'active' : ''}" id="td-starters" title="${STARTER_TIP}">Starters only</span>
      <div class="pill-group" id="td-pos-pills">
        <span class="pill active" data-pos="">ALL</span><span class="pill" data-pos="QB">QB</span><span class="pill" data-pos="RB">RB</span><span class="pill" data-pos="WR">WR</span><span class="pill" data-pos="TE">TE</span>
      </div>
    </div>
    <div id="td-top"></div>
    <div id="anytime-td-list"></div>
  </div>`;
}

function mountAnytimeTD(){
  const container = $('#anytime-td-list'), topEl = $('#td-top');
  const expanded = new Set();
  let posFilter = '';

  const games = new Map();
  (DATA.week2 || []).forEach(r => {
    const gid = r['Game ID'];
    if(!gid) return;
    if(!games.has(gid)) games.set(gid, {date: r.Date, sides: {}});
    games.get(gid).sides[r['Home/Away'] === 'Home' ? 'home' : 'away'] = r;
  });
  const gameList = [...games.values()].filter(g => g.sides.home && g.sides.away).sort((a, b) => new Date(a.date) - new Date(b.date));
  if(!gameList.length){ container.innerHTML = '<div class="empty">No upcoming matchups loaded yet.</div>'; return; }

  const pct = v => Math.round(v * 100) + '%';
  function rowHtml(p, week){
    const key = `${p.player}|${p.team}`;
    const open = expanded.has(key);
    const saved = isPickSaved({source:'Anytime TD Props', player:p.player, stat:'Any TD', week, threshold:1});
    const edge = Math.round(p.edge * 100);
    const probColor = p.pj.prob >= 0.5 ? 'var(--mint)' : 'var(--gold)';
    const summary = `Anytime TD vs ${p.opponent} (Wk ${week}) - scored in ${p.ph}/${p.pt} own games, ${p.dh}/${p.dt} starter games vs ${p.opponent}; projected ${fmt(p.pj.lambda, 2)} TD, ${pct(p.pj.prob)} chance`;
    const row = `<tr class="pick-row" data-pick-key="${key}" style="cursor:pointer;">
        <td class="num" style="color:var(--chalk-dim);">${open ? '&#9662;' : '&#9656;'}</td>
        <td><span class="player-preview-pos">${p.slot}</span> ${p.player}</td>
        <td>${teamChip(p.team)}</td><td>${teamChip(p.opponent)}</td>
        <td class="num" title="Season/last-3 blend x opponent factor ${fmt(p.pj.matchup, 2)}x x game script ${fmt(p.pj.script, 2)}x"><b>${fmt(p.pj.lambda, 2)}</b></td>
        <td class="num" style="font-weight:700;color:${probColor};">${pct(p.pj.prob)}</td>
        <td class="num">${p.pj.odds}</td>
        <td class="num">${p.ph}/${p.pt} <span style="color:var(--chalk-dim);">(${pct(p.pr)})</span></td>
        <td class="num">${p.dh}/${p.dt} <span style="color:var(--chalk-dim);">(${pct(p.dr)})</span></td>
        <td class="num">${fmt(p.allowed, 2)} <span style="color:${edge >= 0 ? 'var(--mint)' : 'var(--red)'};">${edge >= 0 ? '+' : ''}${edge}%</span></td>
        <td class="num">${pct(p.combined)}</td>
        <td><button class="save-pick-btn" ${saved ? 'disabled' : ''} data-player="${p.player}" data-position="${p.position}" data-team="${p.team}" data-opponent="${p.opponent}" data-week="${week}" data-summary="${summary.replace(/"/g, '&quot;')}">${saved ? '&#10003; Saved' : '+ Add'}</button></td>
      </tr>`;
    const detail = open ? `<tr class="def-detail-row"><td colspan="12" style="background:var(--field-deep);padding:10px 16px;">
        <div style="font-family:var(--mono);font-size:11px;color:var(--chalk-dim);margin-bottom:6px;">${p.player} -- ${p.position} game log:</div>
        ${playerGameLogHtml(p.player, p.position)}</td></tr>` : '';
    return row + detail;
  }
  const head = `<thead><tr><th></th><th>Player</th><th>Team</th><th>Opp</th><th title="Projected touchdowns (rushing + receiving)">Proj TDs</th><th>Chance to score</th><th title="American odds that match the chance to score, with no vig">Fair odds</th><th>Own games scored</th><th>Opp starter-games scored</th><th>Opp gives TD/g (vs league)</th><th>Combined</th><th></th></tr></thead>`;

  function apply(){
    const startersOnly = tdStartersOn();
    const all = [];
    const sections = gameList.map(g => {
      const away = g.sides.away.Team, home = g.sides.home.Team, week = g.sides.away.Week;
      const spreadText = g.sides.away.Spread || g.sides.home.Spread || '';
      const picks = [...tdPicksForGame(away, home, startersOnly, bpSpreadFor(away, spreadText)), ...tdPicksForGame(home, away, startersOnly, bpSpreadFor(home, spreadText))]
        .filter(p => !posFilter || p.position === posFilter).sort((x, y) => y.pj.prob - x.pj.prob);
      picks.forEach(p => all.push({...p, week}));
      return `<div class="log-pos-group" style="margin-bottom:20px;">
        <div class="log-pos-label" style="font-size:14px;">${teamName(away)} <span class="at">@</span> ${teamName(home)}${spreadText ? ` <span style="color:var(--chalk-dim);font-weight:400;">&middot; ${spreadText}</span>` : ''}</div>
        ${picks.length ? `<div class="table-scroll"><table>${head}<tbody>${picks.map(p => rowHtml(p, week)).join('')}</tbody></table></div>`
          : '<div class="empty" style="padding:8px 0;">Not enough games logged for this matchup yet.</div>'}
      </div>`;
    });
    all.sort((x, y) => y.pj.prob - x.pj.prob);
    topEl.innerHTML = all.length ? `<div class="log-pos-group" style="margin-bottom:24px;"><div class="log-pos-label" style="font-size:14px;">Most likely scorers across the slate</div>
        <div class="table-scroll"><table>${head}<tbody>${all.slice(0, 10).map(p => rowHtml(p, p.week)).join('')}</tbody></table></div></div>`
      : '<div class="empty">No anytime-TD signals yet. Wait for more games to be logged, or turn Starters only off.</div>';
    container.innerHTML = sections.join('');

    $$('.save-pick-btn', $('#content')).forEach(btn => {
      if(btn.dataset.floor !== undefined || btn.dataset.threshold !== undefined) return;
      btn.addEventListener('click', e => {
        e.stopPropagation();
        addToMyPicks({source:'Anytime TD Props', player:btn.dataset.player, position:btn.dataset.position, team:btn.dataset.team,
          opponent:btn.dataset.opponent, stat:'Any TD', week:btn.dataset.week, threshold:1, summary:btn.dataset.summary});
        apply();
      });
    });
    $$('.pick-row', $('#content')).forEach(tr => tr.addEventListener('click', () => {
      const key = tr.dataset.pickKey;
      if(expanded.has(key)) expanded.delete(key); else expanded.add(key);
      apply();
    }));
  }

  $('#td-starters').addEventListener('click', () => {
    const on = !tdStartersOn();
    tdSetStarters(on);
    $('#td-starters').classList.toggle('active', on);
    apply();
  });
  $$('#td-pos-pills .pill').forEach(pl => pl.addEventListener('click', () => {
    $$('#td-pos-pills .pill').forEach(x => x.classList.remove('active'));
    pl.classList.add('active'); posFilter = pl.dataset.pos; apply();
  }));
  apply();
}

// ---------- TAB: LIVE NOW ----------
// Real-time box scores pulled straight from ESPN in the browser -- the same
// host and mechanism the ticker already uses. The daily pipeline can't do
// this: it deliberately records a week only once EVERY game in it is
// finished (so it never grabs a half-played Monday night slate), which
// means in-progress games only exist in ESPN's live feed. Players are
// grouped by stat category exactly like a printed box score, because
// ESPN's live boxscore doesn't label positions.
const ESPN_SUMMARY_URL = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=';
const LIVE_NOW_REFRESH_MS = 45000;
const liveNowFinalCache = {};   // a final game's box score never changes again -- fetch it once

// LIVE-NOW-HELPERS-START
const LIVE_NOW_CATEGORIES = ['passing','rushing','receiving'];
const LIVE_NOW_TEAM_STATS = [
  ['totalyards','Total Yds'], ['netpassingyards','Pass Yds'], ['rushingyards','Rush Yds'],
  ['turnovers','TO'], ['thirddowneff','3rd Down'], ['possessiontime','TOP'],
];

function liveCategoryTableHtml(cat){
  const athletes = cat.athletes || [];
  if(!athletes.length) return '';
  const labels = cat.labels || [];
  return `
    <div class="log-pos-group">
      <div class="log-pos-label">${String(cat.displayName || cat.name || '').toUpperCase()}</div>
      <div class="table-scroll"><table>
        <thead><tr><th>Player</th>${labels.map(l=>`<th class="num">${l}</th>`).join('')}</tr></thead>
        <tbody>${athletes.map(a=>`<tr><td>${(a.athlete || {}).displayName || '?'}</td>${(a.stats || []).map(v=>`<td class="num">${v}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>
    </div>`;
}

// Picks a handful of headline team stats out of ESPN's team statistics list,
// matched by ESPN's own stat name. Anything not present is simply skipped.
function livePickTeamStats(statsArr){
  const byName = {};
  (statsArr || []).forEach(x=>{ byName[String(x.name || '').toLowerCase()] = x; });
  return LIVE_NOW_TEAM_STATS
    .map(([needle, label]) => byName[needle] ? `${label} ${byName[needle].displayValue}` : null)
    .filter(Boolean);
}

// Live games first, then finals, then upcoming; kickoff order within each.
function liveSortGames(games){
  const order = {in:0, post:1, pre:2};
  return [...games].sort((a,b)=>
    (order[a.state] ?? 3) - (order[b.state] ?? 3) || new Date(a.date) - new Date(b.date)
  );
}

function liveGameFromEvent(ev, summary){
  const comp = (ev.competitions || [])[0] || {};
  const competitors = comp.competitors || [];
  const home = competitors.find(c=>c.homeAway==='home') || {};
  const away = competitors.find(c=>c.homeAway==='away') || {};
  const statusType = (ev.status || {}).type || {};
  return {
    id: ev.id, date: ev.date,
    home: (home.team || {}).abbreviation || '?', away: (away.team || {}).abbreviation || '?',
    homeScore: home.score, awayScore: away.score,
    state: statusType.state || 'pre', detail: statusType.shortDetail || '',
    summary,
  };
}

function liveGameCardHtml(g){
  const statusLabel = g.state === 'in' ? (g.detail || 'LIVE') : g.state === 'post' ? 'Final' : (g.detail || 'Upcoming');
  const scoreHtml = g.state === 'pre' ? '' :
    `<div class="matchup-time" style="font-size:16px;color:var(--chalk);">${g.awayScore} &ndash; ${g.homeScore}</div>`;
  const box = (g.summary || {}).boxscore || {};

  function teamColumn(abbr){
    const playerBlock = (box.players || []).find(b => (b.team || {}).abbreviation === abbr);
    const teamBlock = (box.teams || []).find(b => (b.team || {}).abbreviation === abbr);
    const chips = livePickTeamStats((teamBlock || {}).statistics);
    const tables = playerBlock
      ? (playerBlock.statistics || [])
          .filter(c => LIVE_NOW_CATEGORIES.includes(String(c.name || '').toLowerCase()))
          .map(liveCategoryTableHtml).join('')
      : '';
    return `
      <div class="matchup-side-label"><b>${abbr}</b> ${teamName(abbr)}</div>
      ${chips.length ? `<div class="context-row"><span class="context-chip">${chips.join(' &middot; ')}</span></div>` : ''}
      ${tables || '<div class="empty" style="padding:8px 0;">No player stats yet.</div>'}`;
  }

  return `
  <div class="matchup-card" data-away="${g.away}" data-home="${g.home}" data-state="${g.state}">
    <div class="matchup-head">
      <div class="matchup-teams">${teamName(g.away)}<span class="at">@</span>${teamName(g.home)}</div>
      <div style="display:flex;align-items:center;gap:12px;">
        ${scoreHtml}
        <span class="live-chip live-${g.state}">${statusLabel}</span>
      </div>
    </div>
    ${g.state === 'pre' ? '' : `
    <div class="matchup-body">
      <div class="matchup-side">${teamColumn(g.away)}</div>
      <div class="matchup-side">${teamColumn(g.home)}</div>
    </div>`}
  </div>`;
}

function renderLiveNow(){
  return `
  <div class="panel">
    <div class="panel-title">Live Now</div>
    <div class="panel-note">
      Real-time box scores pulled straight from ESPN in your browser -- separate from the daily pipeline,
      which only records a week once every game in it is finished. Refreshes automatically every 45
      seconds while this tab is open. Players are grouped by stat category like a printed box score,
      since ESPN's live feed doesn't label positions.
    </div>
    <div class="controls">
      <div class="pill-group" id="livenow-pills">
        <span class="pill active" data-f="all">All</span>
        <span class="pill" data-f="in">Live</span>
        <span class="pill" data-f="post">Final</span>
        <span class="pill" data-f="pre">Upcoming</span>
      </div>
      <button class="save-pick-btn" id="livenow-refresh">Refresh now</button>
      <span id="livenow-updated" style="font-family:var(--mono);font-size:11px;color:var(--chalk-dim);"></span>
    </div>
    <div class="matchup-grid single-col" id="livenow-list"><div class="empty">Loading live games&hellip;</div></div>

function mountLiveNow(){
  const list = $('#livenow-list');
  let games = [];
  let filter = 'all';

  function draw(){
    const shown = liveSortGames(games).filter(g => filter === 'all' || g.state === filter);
    list.innerHTML = shown.length ? shown.map(liveGameCardHtml).join('') : '<div class="empty">No games in this view right now.</div>';

    // Arrived here from a ticker click -- scroll to and flash that game.
    if(pendingHighlightGame){
      const {away, home} = pendingHighlightGame;
      const card = document.querySelector(
        `.matchup-card[data-away="${away}"][data-home="${home}"], .matchup-card[data-away="${home}"][data-home="${away}"]`
      );
      if(card){
        card.scrollIntoView({behavior:'smooth', block:'center'});
        card.classList.remove('card-highlight');
        void card.offsetWidth;
        card.classList.add('card-highlight');
      }
      pendingHighlightGame = null;
    }
  }

  async function fetchJson(url){
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return res.json();
  }

  async function load(){
    const updated = $('#livenow-updated');
    if(!updated) return; // tab was closed while a refresh was pending
    try {
      const sb = await fetchJson(ESPN_SCOREBOARD_URL);
      const events = sb.events || [];
      const summaries = await Promise.all(events.map(async ev=>{

// Reads nfl_2026_backtest.csv from 16_backtest.py: the Best Picks method replayed on every past
// week using only the games that came before it, graded against the real box score.
function btWilson(h, n){
  if(!n) return [0, 0];
  const z = 1.96, p = h / n, d = 1 + z * z / n;
  const c = (p + z * z / (2 * n)) / d, m = z * Math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d;
  return [Math.max(0, c - m), Math.min(1, c + m)];
}
function btSummarize(rows){
  const n = rows.length, h = rows.reduce((a, r) => a + num(r.Hit), 0);
  const [lo, hi] = btWilson(h, n);
  return {n, h, rate: n ? h / n : 0, lo, hi, floor: n ? rows.reduce((a, r) => a + num(r.Floor), 0) / n : 0};
}
function btRateCell(s){
  if(!s.n) return '<td class="num">--</td><td class="num">--</td>';
  const color = s.rate >= 0.75 ? 'var(--mint)' : s.rate >= 0.6 ? 'var(--gold)' : 'var(--red)';
  return `<td class="num" style="color:${color};font-weight:700;">${Math.round(s.rate * 100)}%</td><td class="num" style="color:var(--chalk-dim);">${Math.round(s.lo * 100)}-${Math.round(s.hi * 100)}%</td>`;
}
function btGroupTable(rows, keyFn, order, label){
  const groups = {};
  rows.forEach(r => { const k = keyFn(r); (groups[k] = groups[k] || []).push(r); });
  const keys = Object.keys(groups).sort((a, b) => order ? order.indexOf(a) - order.indexOf(b) : (parseFloat(a) - parseFloat(b) || a.localeCompare(b)));
  return `<div class="table-scroll"><table><thead><tr><th>${label}</th><th class="num">Picks</th><th class="num">Cleared</th><th class="num">Hit rate</th><th class="num" title="95% range the true hit rate could plausibly be in, given how few picks there are">95% range</th></tr></thead><tbody>${keys.map(k => {
    const s = btSummarize(groups[k]);
    return `<tr><td>${k}</td><td class="num">${s.n}</td><td class="num">${s.h}</td>${btRateCell(s)}</tr>`;
  }).join('')}</tbody></table></div>`;
}

function renderBacktest(){
  return `
  <div class="panel">
    <div class="panel-title">Backtest</div>
    <div class="panel-note">
      Does the Best Picks method actually work? This replays it on every past week as if it were the Tuesday before the games,
      using only the games played before that week, then grades each pick against what the player really did. Nothing here
      uses information from the future. Two things to keep in mind: injuries are not available historically (a pick for a
      player who was ruled out is skipped, not counted as a miss), and there are no historical spreads, so the projection
      here has no game-script nudge. Hit rates come with a 95% range because a few dozen picks is a small sample: a 78% hit
      rate on 30 picks could really be anywhere from about 60% to 90%.
    </div>
    <div id="bt-body"></div>
  </div>`;
}

function mountBacktest(){
  const el = $('#bt-body');
  const all = DATA.backtest || [];
  if(!all.length){
    el.innerHTML = '<div class="empty">No backtest data yet. Upload <code>16_backtest.py</code> and the updated <code>run_daily.py</code>, run the workflow, and it appears once at least 3 weeks of games are in (the first replayed week is week 3).</div>';
    return;
  }
  const bp = all.filter(r => r.Model === 'best_picks'), ow = all.filter(r => r.Model === 'own_only');
  const S = btSummarize(bp), O = btSummarize(ow);
  const weeks = [...new Set(bp.map(r => num(r.Week)))];
  // Plain-English verdict, careful about sample size.
  let verdict;
  if(S.n < 30) verdict = `Only ${S.n} picks so far, which is too few to say anything. Check back as more weeks are played.`;
  else if(S.lo > 0.70) verdict = `Picks have cleared their floor ${Math.round(S.rate * 100)}% of the time, and even the low end of the range (${Math.round(S.lo * 100)}%) is solid. Floors are low numbers though: clearing them is the easy part, and a parlay multiplies the misses.`;
  else if(S.rate >= 0.7) verdict = `Picks have cleared their floor ${Math.round(S.rate * 100)}% of the time, but with ${S.n} picks the true rate could be as low as ${Math.round(S.lo * 100)}%. Promising, not proven.`;
  else verdict = `Picks have cleared their floor only ${Math.round(S.rate * 100)}% of the time (${Math.round(S.lo * 100)}-${Math.round(S.hi * 100)}% plausible). That is below the 75% the floors were built around, so be cautious with them.`;

  // Projection accuracy
  const mae = (rows, f) => rows.length ? rows.reduce((a, r) => a + Math.abs(num(r.Actual) - f(r)), 0) / rows.length : 0;
  const statsList = [...new Set(bp.map(r => r.Stat))];
  const projRows = statsList.map(st => {
    const rs = bp.filter(r => r.Stat === st);
    const mM = mae(rs, r => num(r.Projection)), mB = mae(rs, r => num(r.ProjNoMatchup));
    const bias = rs.reduce((a, r) => a + (num(r.Actual) - num(r.Projection)), 0) / rs.length;
    const over = rs.filter(r => num(r.Actual) > num(r.Line)).length, under = rs.filter(r => num(r.Actual) < num(r.Line)).length;
    const cov = rs.filter(r => num(r.Actual) >= num(r.Lo) && num(r.Actual) <= num(r.Hi)).length / rs.length;
    return `<tr><td>${st}</td><td class="num">${rs.length}</td><td class="num">${fmt(mM)}</td><td class="num">${fmt(mB)}</td>
      <td class="num" style="color:${mM < mB ? 'var(--mint)' : 'var(--red)'};">${mM < mB ? 'matchup helps' : 'matchup hurts'} (${fmt(Math.abs(mB - mM))})</td>
      <td class="num">${bias >= 0 ? '+' : ''}${fmt(bias)}</td><td class="num">${over} / ${under}</td><td class="num">${Math.round(cov * 100)}%</td></tr>`;
  }).join('');

  // Defense check: Best Picks vs the same players with the defense check removed.
  const cmpRows = statsList.map(st => {
    const a = btSummarize(bp.filter(r => r.Stat === st)), b = btSummarize(ow.filter(r => r.Stat === st));
    return `<tr><td>${st}</td><td class="num">${a.n}</td><td class="num">${Math.round(a.rate * 100)}%</td><td class="num">${fmt(a.floor, 0)}</td><td class="num">${b.n}</td><td class="num">${Math.round(b.rate * 100)}%</td><td class="num">${fmt(b.floor, 0)}</td></tr>`;
  }).join('');

  el.innerHTML = `
    <div class="log-pos-group" style="margin-bottom:18px;">
      <div class="log-pos-label" style="font-size:14px;">Headline</div>
      <div class="player-preview-stats"><b style="font-size:18px;color:var(--mint);">${S.h} of ${S.n}</b> Best Picks cleared their floor (<b>${Math.round(S.rate * 100)}%</b>, plausible range ${Math.round(S.lo * 100)}-${Math.round(S.hi * 100)}%), across weeks ${Math.min(...weeks)}-${Math.max(...weeks)}.</div>
      <div class="player-preview-stats">Same players with the defense check removed: ${O.h} of ${O.n} (${Math.round(O.rate * 100)}%).</div>
      <div class="player-preview-stats" style="margin-top:6px;">${verdict}</div>
    </div>
    <div class="log-pos-group" style="margin-bottom:18px;"><div class="log-pos-label" style="font-size:14px;">By stat</div>${btGroupTable(bp, r => r.Stat, ['Pass Yards', 'Pass + Rush Yards', 'Rush Yards', 'Receiving Yards', 'Receptions'], 'Stat')}</div>
    <div class="log-pos-group" style="margin-bottom:18px;"><div class="log-pos-label" style="font-size:14px;">By position</div>${btGroupTable(bp, r => r.Position, ['QB', 'RB', 'WR', 'TE'], 'Position')}</div>
    <div class="log-pos-group" style="margin-bottom:18px;"><div class="log-pos-label" style="font-size:14px;">By week</div>${btGroupTable(bp, r => String(num(r.Week)), null, 'Week')}</div>
    <div class="log-pos-group" style="margin-bottom:18px;"><div class="log-pos-label" style="font-size:14px;">By confidence score</div>
      ${btGroupTable(bp, r => num(r.Score) >= 0.9 ? '90%+' : num(r.Score) >= 0.8 ? '80-89%' : 'under 80%', ['under 80%', '80-89%', '90%+'], 'Score')}
      <div class="line-note">If the score means anything, the higher rows should hit more often.</div></div>
    <div class="log-pos-group" style="margin-bottom:18px;"><div class="log-pos-label" style="font-size:14px;">Does the defense check add anything?</div>
      <div class="table-scroll"><table><thead><tr><th>Stat</th><th class="num">Best Picks</th><th class="num">Hit rate</th><th class="num">Avg floor</th><th class="num">Own-rate only</th><th class="num">Hit rate</th><th class="num">Avg floor</th></tr></thead><tbody>${cmpRows}</tbody></table></div>
      <div class="line-note">The defense check helps if Best Picks hit more often at a similar floor. The floors differ a little because Best Picks takes the highest floor BOTH sides agree on.</div></div>
    <div class="log-pos-group" style="margin-bottom:18px;"><div class="log-pos-label" style="font-size:14px;">Projection accuracy</div>
      <div class="table-scroll"><table><thead><tr><th>Stat</th><th class="num">Picks</th><th class="num" title="Average distance between the projection and the actual number">Model miss</th><th class="num" title="Average miss if the matchup factor is left out (just his own season/last-3 blend)">No-matchup miss</th><th class="num">Matchup factor</th><th class="num" title="Actual minus projection, on average. Positive means the projection runs low.">Bias</th><th class="num" title="Actual over / under the book-style line. Near even is healthy.">Over / under line</th><th class="num" title="How often the actual landed inside the likely range. About 50% is expected.">In range</th></tr></thead><tbody>${projRows}</tbody></table></div>
      <div class="line-note">Only picks that cleared the floor test are in this table, so it describes projections for players the page likes, not all players.</div></div>
    <details><summary style="cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--chalk-dim);">Every replayed pick (${bp.length})</summary>
      <div class="table-scroll"><table><thead><tr><th>Wk</th><th>Player</th><th>Opp</th><th>Pick</th><th class="num">Proj</th><th class="num">Actual</th><th>Result</th></tr></thead><tbody>${[...bp].sort((a, b) => num(b.Week) - num(a.Week) || num(b.Score) - num(a.Score)).map(r => `<tr><td class="num">${num(r.Week)}</td><td><span class="player-preview-pos">${r.Slot}</span> ${r.Player}</td><td>${teamChip(r.Opponent)}</td><td>${r.Floor}+ ${r.Stat}</td><td class="num">${fmt(num(r.Projection))}</td><td class="num">${fmt(num(r.Actual), 0)}</td><td style="color:${num(r.Hit) ? 'var(--mint)' : 'var(--red)'};font-weight:700;">${num(r.Hit) ? 'HIT' : 'MISS'}</td></tr>`).join('')}</tbody></table></div></details>`;
}
