name: Daily NFL Dashboard Refresh

on:
  schedule:
    # 11:00 UTC daily -- adjust to whenever you want the refresh to run.
    # cron is UTC regardless of your local timezone.
    - cron: '0 11 * * *'
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed to commit the refreshed CSVs back to the repo
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pandas requests

      - name: Run pipeline
        # All pipeline scripts + site/ live at the repo root.
        run: python3 run_daily.py

      - name: Commit refreshed CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --staged --quiet || git commit -m "Daily data refresh"
          git push

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site   # contains index.html + data/*.csv

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
